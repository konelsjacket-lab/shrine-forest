  'kohaku_explain': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '天黑了。正殿的缘廊上，琥珀给你端来一碗热茶。茶汤里浮着一小朵金色的花。' },
      { char: 'kohaku', text: '杜鹃花茶。千代每次上山，第一件事就是要喝这个。喝完了还要再续一碗，说「山上的水就是甜」。' },
      { char: 'narrator', text: '你喝了一口。烫，微微发苦，咽下去以后，舌根泛起一点甜。' },
      { char: 'player', text: '琥珀……你到底是……' },
      { char: 'kohaku', text: '狐狸。活了很久很久的狐狸。' },
      { char: 'kohaku', text: '具体多久呢——这是女孩子的秘密。' },
      { char: 'narrator', text: '她眨了眨一只眼睛。尾巴在你们中间的木板上，得意地扫了一下。' },
      { char: 'kohaku', text: '这片森林叫杜鹃森，夹在人的世界和灵的世界中间。住在这里的，都是像我这样的兽灵。' },
      { char: 'kohaku', text: '森林外面有一道结界。它挡住灵界那边的浊气，也挡住误闯进来的人类。' },
      { char: 'player', text: '可是我进来了。' },
      { char: 'kohaku', text: '因为你带着那枚铃。' },
      { char: 'narrator', text: '她看着你口袋的方向，眼神变得很柔和。' },
      { char: 'kohaku', text: '那是「守铃人」的铃。千代是守铃人，她的母亲也是。所以结界认得它，也认得你的血。' },
      { char: 'player', text: '守铃人……要做什么？' },
      { char: 'kohaku', text: '……这个嘛。' },
      { char: 'narrator', text: '她的耳朵微微动了一下，往后压了压。像是在斟酌。又像是在躲。' },
      { char: 'kohaku', text: '这些事，等你在这里住几天再说吧。千代说了，要你先认识我们。' },
      { char: 'player', text: '（……她在回避。）', flag: 'q_keeper' },
      { char: 'narrator', text: '奇怪的是，这一次，她的尾巴没有炸。只是紧紧地缠在了她自己的脚踝上。' },
      { char: 'kohaku', text: '还有一件事，要先告诉你。结界只在满月的夜里向外打开。在那之前，你没办法下山。' },
      { char: 'player', text: '所以……七天。' },
      { char: 'kohaku', text: '嗯，七天。千代算得刚刚好。' },
      { char: 'player', text: '……我公司只请了七天假。' },
      { char: 'kohaku', text: '「公司」？是很凶的妖怪吗？' },
      { char: 'player', text: '……某种意义上，是的。' },
      { char: 'kohaku', text: '那你放心。杜鹃森的结界，什么妖怪都进不来。' },
      { char: 'kohaku', text: '这七天里，你就住在神社吧。千代的房间，我每个月都会打扫的。' },
      { char: 'kohaku', text: '……而且，你小时候，是来过这里的哦。' },
      { char: 'player', text: '诶？' },
      { char: 'kohaku', text: '呵呵。这个也以后再说。', flag: 'q_memory' },
    ],
    next: 'kohaku_tour',
  },

  'kohaku_tour': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀提着一盏纸灯笼，带你在神社里转了一圈。' },
      { char: 'kohaku', text: '这边是手水舍。水是从山里引下来的，冬天也不结冰。' },
      { char: 'kohaku', text: '这边是厨房——啊，这个你一定认识！' },
      { char: 'narrator', text: '她献宝似的捧出一台老式的收音机。银色的外壳上贴满了贴纸，天线用胶带缠了三圈。' },
      { char: 'kohaku', text: '千代十年前带上来的。能听到山下的歌！虽然只有一个台，而且每天晚上九点以后只有天气预报。' },
      { char: 'kohaku', text: '我最喜欢天气预报了。「山间部，晴，局部有雨」——你听，多好听，像念经一样。' },
      { char: 'kohaku', text: '还有这个——' },
      { char: 'narrator', text: '她又从柜子里拿出一个印着红色字的纸碗。' },
      { char: 'kohaku', text: '「杯面」！倒上热水，数三百下，就能吃了！人类真是太厉害了。' },
      { char: 'kohaku', text: '只剩最后两个了。我一直舍不得吃。' },
      { char: 'narrator', text: '她说得太认真了，你忍不住笑出了声。她的耳朵一下子红了。' },
      { char: 'kohaku', text: '……笑什么嘛。狐狸也是会有喜欢的东西的。' },
      { char: 'player', text: '其实，山下的便利店里，杯面有好几十种口味。' },
      { char: 'narrator', text: '琥珀手里的纸碗，「啪嗒」掉在了地上。' },
      { char: 'kohaku', text: '……几、几十种？' },
      { char: 'kohaku', text: '千代从来没说过！她每次都只带这一种！她说「这个最好吃，别的你不会喜欢的」！' },
      { char: 'kohaku', text: '……那个人，一定是怕我吃不完。' },
      { char: 'narrator', text: '她捡起纸碗，拍了拍灰，小心翼翼地放回柜子最里面。' },
      { char: 'narrator', text: '最后，她带你到了正殿。殿里供着一面旧铜镜，镜子前面，摊开着一本很厚的簿子。' },
      { char: 'narrator', text: '走过镜子前面的时候，琥珀偏过了头。她绕了一个小小的弯，让自己的影子落不进镜面里。' },
      { char: 'player', text: '（……她不照镜子？）' },
      { char: 'kohaku', text: '这是来客簿。每一个来过杜鹃森的人类，都会在这里写下名字。' },
      { char: 'narrator', text: '你往前翻。墨迹从浓到淡，字体从端正的楷书，变成你认不出的草书。' },
      { char: 'narrator', text: '翻到很前面、墨色最淡的地方，你的手停住了。' },
      { char: 'narrator', text: '有一页被撕掉了。只剩一道参差的毛边，夹在装订线里。' },
      { char: 'player', text: '这一页……' },
      { char: 'kohaku', text: '被虫蛀了。很久以前的事啦。' },
      { char: 'narrator', text: '「噗」。' },
      { char: 'narrator', text: '她没有回头。可是她身后的尾巴，又炸成了一大团。', flag: 'q_page' },
      { char: 'narrator', text: '你没有说话，继续往后翻。' },
      { char: 'narrator', text: '最后写了字的那一页，是外婆的字。日期是两个月前。' },
      { char: 'narrator', text: '「千代。今天也很好。下次给白露带星星糖，给苍羽做梅子饭团，别忘了跟银朗说伞的事。」' },
      { char: 'narrator', text: '「P.S. 那条蛇又在逞强了。琥珀，你去看看他吧。」' },
      { char: 'player', text: '……那条蛇？' },
      { char: 'narrator', text: '琥珀伸手，把簿子轻轻合上了。' },
      { char: 'kohaku', text: '……千代心太软了。对谁都是。' },
      { char: 'narrator', text: '她的语气还是很温柔。可是那一瞬间，她的尾巴绷得笔直。' },
      { char: 'narrator', text: '正殿的最里面，有一扇很窄的木门。门上贴着一张旧符，门缝里透出一丝凉气。' },
      { char: 'player', text: '那扇门后面是……' },
      { char: 'kohaku', text: '那里不能去。' },
      { char: 'kohaku', text: '……答应我，好吗？这七天，不要去那扇门后面。', flag: 'q_door' },
    ],
    choices: [
      { text: '「……好。我答应你。」', affection: { fox: 2 }, next: 'meet_ginro' },
      { text: '「为什么？」', affection: { snake: 1 }, next: 'kohaku_door_why' },
    ],
  },

  'kohaku_door_why': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '因为下面很冷。很黑。住着一个——不太好相处的家伙。' },
      { char: 'kohaku', text: '千代总是去看他。我拦不住她，只好每次在门口等她上来。' },
      { char: 'kohaku', text: '她每次上来，都笑着说「今天又输了」。' },
      { char: 'narrator', text: '琥珀的手指轻轻碰了碰门上的旧符。' },
      { char: 'kohaku', text: '你和千代长得太像了。我不想……在这扇门口，再等一次。' },
      { char: 'narrator', text: '门缝里的凉气，好像动了一下。像是有什么东西，在很深很深的下面，翻了个身。' },
    ],
    next: 'meet_ginro',
  },

  'meet_ginro': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '回到缘廊的时候，前庭里响起了脚步声。沉稳，很重，不像是人的脚步。' },
      { char: 'narrator', text: '先到的是气味。雨水，松针。——和那把伞底下的味道，一模一样。' },
      { char: 'ginro', text: '琥珀。刚才结界动了一下——' },
      { char: 'narrator', text: '一个银发的青年走进了灯光里。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '深蓝色的和服，腰间佩着一把黑鞘长刀。头顶是一对竖起的、银灰色的狼耳。' },
      { char: 'narrator', text: '他很高。站在那里，就像一棵不会被风吹弯的树。' },
      { char: 'player', text: '（银头发……眼睛是蓝的，跟冰一样。）' },
      { char: 'player', text: '（下将棋的老爷爷，没有喝多。）' },
      { char: 'narrator', text: '冰蓝色的眼睛扫过你。先停在你靠在柱边的那把油纸伞上，然后，停在了你口袋的位置。' },
      { char: 'ginro', text: '……那是千代的铃。' },
      { char: 'ginro', text: '千代呢。' },
      { char: 'narrator', text: '琥珀没有回答，只是看着他，轻轻摇了一下头。' },
      { char: 'narrator', text: '青年站在原地，一动不动。很久很久。' },
      { char: 'ginro', text: '…………是吗。' },
      { char: 'narrator', text: '他向你走过来。你下意识地往后缩了一下。' },
      { char: 'narrator', text: '他在你面前停下，微微低头——鼻翼动了动，像是在确认什么气味。' },
      { char: 'ginro', text: '……是你。' },
      { char: 'player', text: '什么？' },
      { char: 'ginro', text: '没什么。', flag: 'q_voice' },
      { char: 'player', text: '那个……这把伞，是在老杉树下面拿的。对不起，雨太大了。' },
      { char: 'narrator', text: '他看着那把伞。伞柄上的月牙，在灯光下亮了一下。' },
      { char: 'ginro', text: '……那是给千代的。' },
      { char: 'ginro', text: '你拿着。下山那天，也用得上。' },
      { char: 'ginro', text: '我叫银朗，守着这片森林的结界。七天后，满月一到，你就下山。这几天别乱跑，别给琥珀添麻烦。' },
      { char: 'kohaku', text: '银朗。' },
      { char: 'ginro', text: '……天黑以后别出门。最近林子里，不干净。' },
      { char: 'narrator', text: '说完他就转身走了。走进黑暗之前，你看到一条银色的大尾巴，低低地垂着。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '别往心里去。' },
      { char: 'kohaku', text: '五十年来，每个满月，都是他去山脚接千代上山，再把她送下去。千代右耳不好，他就一直走在她的左边。' },
      { char: 'kohaku', text: '他每隔几天，就去老杉树下换一把新伞。怕千代上山的时候淋着。' },
      { char: 'kohaku', text: '上个月千代没来。这个月……他还是去换了。' },
      { char: 'kohaku', text: '他比谁都难过。只是，他不会说。' },
    ],
    choices: [
      { text: '「他刚才说『是你』……那是什么意思？」', affection: { wolf: 2 }, flag: 'asked_isyou', next: 'day1_ginro_after' },
      { text: '「……我能理解。我也还没哭出来。」', affection: { fox: 2 }, flag: 'said_nocry', next: 'day1_ginro_after' },
      { text: '「『不干净』是什么意思？」', affection: { wolf: 1 }, flag: 'asked_dirty', next: 'day1_ginro_after' },
    ],
  },

  'day1_ginro_after': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀歪着头想了想。', if: 'asked_isyou' },
      { char: 'kohaku', text: '狼是用鼻子记事情的。一个气味，闻过一次，一辈子都不会忘。', if: 'asked_isyou' },
      { char: 'kohaku', text: '他大概……在很久以前，闻过你吧。', if: 'asked_isyou' },
      { char: 'player', text: '（很久以前。……梦里那只银色的、毛茸茸的东西？）', if: 'asked_isyou' },
      { char: 'narrator', text: '琥珀转过头来看着你。看了很久。', if: 'said_nocry' },
      { char: 'kohaku', text: '葬礼上，一滴都没有？', if: 'said_nocry' },
      { char: 'player', text: '……嗯。有人说我心硬。', if: 'said_nocry' },
      { char: 'kohaku', text: '才不是。有的眼泪走得慢，要等身体觉得安全了，才肯出来。', if: 'said_nocry' },
      { char: 'kohaku', text: '这里很安全哦。等它来就好了。', if: 'said_nocry' },
      { char: 'narrator', text: '琥珀的耳朵往后压了压。', if: 'asked_dirty' },
      { char: 'kohaku', text: '最近，北边的林子里有些树……生病了。叶子发黑，摸上去是冷的。', if: 'asked_dirty' },
      { char: 'kohaku', text: '银朗每天都去巡。你别担心，有他在，什么都进不来的。', if: 'asked_dirty' },
      { char: 'narrator', text: '她说得很快。尾巴没有炸。可是她一直没有看你的眼睛。', if: 'asked_dirty' },
      { char: 'narrator', text: '远处传来「咕」的一声。你低下头。是你的肚子。' },
      { char: 'narrator', text: '琥珀眨了眨眼，然后笑得整条尾巴都在抖。' },
      { char: 'kohaku', text: '好了好了，天大的事，也先吃饭。' },
    ],
    next: 'day1_dinner',
  },

  'day1_dinner': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '人饿着肚子的时候，脑子里只会装坏事。这是千代说的。' },
      { char: 'narrator', text: '厨房边上的小饭厅，矮桌擦得发亮。灶上的锅咕嘟咕嘟地响，窗纸上蒙着一层白汽。' },
      { char: 'narrator', text: '晚饭是琥珀做的。炖萝卜，烤溪鱼，腌梅子，还有一大碗热腾腾的白米饭。' },
      { char: 'kohaku', text: '萝卜是我种的，鱼是我抓的，梅子是我腌的。米是千代从山下背上来的。……所以，要全部吃完哦。' },
      { char: 'narrator', text: '桌上摆了三副碗筷。' },
      { char: 'player', text: '还有谁要来吗？' },
      { char: 'kohaku', text: '嗯？等着看吧。' },
      { char: 'narrator', text: '你刚拿起筷子，拉门就被拉开了一条缝。一个银色的影子，一声不吭地坐到了离你最远的角落。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '五十年来，他说了五十年「不吃」，也来了五十年。' },
      { char: 'ginro', text: '……只是路过。' },
      { char: 'kohaku', text: '路过厨房，路过饭桌，路过自己那副碗筷。好巧哦。' },
      { char: 'ginro', text: '…………' },
      { char: 'kohaku', text: '顺便一说，千万别让他做饭。他烤的鱼，外面是炭，里面是冰。千代吃了一口，说「很有层次」，然后喝了三碗茶。' },
      { char: 'ginro', text: '……那次是火太小。' },
      { char: 'kohaku', text: '那次你把整棵树都点着了。' },
      { char: 'narrator', text: '银朗面无表情地吃饭。吃得很快，很安静。可是你注意到——他把自己碟子里最大的那条鱼，推到了你面前。' },
      { char: 'narrator', text: '他的手背上，有几道很旧的白色伤疤。像是被什么很冷的东西抓过。' },
      { char: 'narrator', text: '然后，他看了一眼你放在桌角的木盒。盒盖开着，露出半袋金平糖。' },
      { char: 'narrator', text: '他的耳朵，动了一下。' },
    ],
    choices: [
      { text: '把金平糖推到他面前：「外婆买给山上的孩子的。」', affection: { wolf: 3 }, next: 'day1_dinner2' },
      { text: '悄悄问琥珀：「他……喜欢吃甜的？」', affection: { fox: 1, wolf: 1 }, next: 'day1_dinner2' },
    ],
  },

  'day1_dinner2': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'ginro', text: '……我不是孩子。' },
      { char: 'kohaku', text: '千代每次都给他留一小包。他每次都说「我不是孩子」，然后收下。' },
      { char: 'kohaku', text: '去年我在他的屋子里看到一个铁罐子，里面全是没舍得吃的星星糖。都化成一坨了。' },
      { char: 'ginro', text: '琥珀。' },
      { char: 'kohaku', text: '哎呀，说漏嘴了。' },
      { char: 'narrator', text: '银朗的耳朵红了。他站起身，把碗筷收好，走到门口。' },
      { char: 'narrator', text: '然后，停住了。背对着你们。' },
      { char: 'ginro', text: '……千代，走的时候，说什么了吗。' },
      { char: 'player', text: '护士说，她最后那几天一直在说「伞」。说「那孩子又把伞全让给我，自己淋湿了」。' },
      { char: 'player', text: '我最后一次去看她的时候，她望着窗外，说「那孩子又在外面淋雨了」。' },
      { char: 'narrator', text: '银朗站在门口，没有回头。' },
      { char: 'narrator', text: '他握着门框的手，指节一点一点地发白。' },
      { char: 'narrator', text: '很久以后，他伸手拿走了桌上的那一小包金平糖。拉门关上了。' },
      { char: 'kohaku', text: '……他去年冬天，在山脚淋了一整夜雨。千代在屋檐下面喊他进来，他就是不肯。' },
      { char: 'kohaku', text: '狼的规矩——不能进人类的屋子。' },
      { char: 'kohaku', text: '真是一群笨蛋啊。我们。' },
    ],
    next: 'day1_radio',
  },

  'day1_radio': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '碗是你和琥珀一起洗的。她洗，你擦。她洗得很快，尾巴在身后一甩一甩，把水珠甩得到处都是。' },
      { char: 'narrator', text: '洗完碗，她拉着你坐到缘廊上，把那台收音机放在你们中间，郑重地拧开了开关。' },
      { char: 'kohaku', text: '九点了。嘘——' },
      { char: 'narrator', text: '一阵沙沙的杂音。然后，一个男人的声音，远远地，从山下的世界飘了上来。' },
      { char: 'narrator', text: '「……明日，山间部，晴。夜间有雾。降水概率，百分之十……」' },
      { char: 'narrator', text: '琥珀从袖子里掏出一个小本子，一笔一画地记：「晴，雾，一成」。' },
      { char: 'narrator', text: '本子已经很旧了，写满了。你瞥了一眼，前面每一页都是这样：日期，天气，降水概率。整整齐齐。' },
      { char: 'player', text: '……你每天都记？' },
      { char: 'kohaku', text: '嗯。千代说，山下的天气要记着。' },
      { char: 'kohaku', text: '哪天要是下雨，就提醒银朗带伞。哪天要是太冷，就多烧一壶茶。' },
      { char: 'narrator', text: '她的笔停了一下。' },
      { char: 'kohaku', text: '……记了十年。今天忘了，明天也还要记。习惯了嘛。' },
      { char: 'narrator', text: '天气预报播完了，收音机里只剩下沙沙声。你们谁都没有去关它。' },
      { char: 'kohaku', text: '……她最后那段时间，还好吗？除了伞，还说过什么吗？' },
      { char: 'player', text: '……她最后，连我小时候的照片都认不出来了。' },
      { char: 'player', text: '她说「这孩子真可爱，是谁家的」。护士说，老人家到最后都会这样。' },
      { char: 'narrator', text: '琥珀手里的笔，掉在了缘廊的木板上。滚了半圈，停住了。' },
      { char: 'narrator', text: '她没有去捡。她的耳朵紧紧地贴在了脑后，一动也不动。' },
      { char: 'kohaku', text: '……是吗。' },
      { char: 'narrator', text: '只有这两个字。她的尾巴没有炸。因为她什么谎也没说。她只是，什么都没说。' },
    ],
    choices: [
      { text: '「琥珀？……你是不是知道什么？」', affection: { fox: 1 }, flag: 'pressed_kohaku', next: 'day1_radio2' },
      { text: '什么也不问，捡起笔，放回她手心里', affection: { fox: 2 }, next: 'day1_radio2' },
    ],
  },

  'day1_radio2': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀抬起头。那双琥珀色的眼睛在月光下，湿得发亮。', if: 'pressed_kohaku' },
      { char: 'kohaku', text: '我知道很多事。活得太久了嘛，知道的事情，比想知道的多。', if: 'pressed_kohaku' },
      { char: 'kohaku', text: '……可是今天不行。今天你太累了，我也是。', if: 'pressed_kohaku' },
      { char: 'narrator', text: '她握住笔，握了很久。手指是凉的。', ifnot: 'pressed_kohaku' },
      { char: 'kohaku', text: '……谢谢。', ifnot: 'pressed_kohaku' },
      { char: 'kohaku', text: '千代也是这样的。我不想说的时候，她就什么也不问。只是把茶续满。', ifnot: 'pressed_kohaku' },
      { char: 'narrator', text: '她把收音机关掉，站起来，拍了拍裙子。又变回了那个笑眯眯的巫女。' },
      { char: 'kohaku', text: '好啦！客人该睡觉了。我带你去千代的房间。' },
    ],
    next: 'day1_room',
  },

  'day1_room': {
    scene: 'room', particles: null,
    lines: [
      { char: 'narrator', text: '琥珀带你去了神社深处的一间和室。' },
      { char: 'narrator', text: '纸拉门，旧榻榻米，窗外正对着一棵老杜鹃。被褥是晒过的，有阳光的味道。' },
      { char: 'narrator', text: '墙角放着一个保温壶，一副老花镜，和一本封皮磨破了的速写本。' },
      { char: 'player', text: '（外婆的东西……她每个月都在这里住一晚。）' },
      { char: 'narrator', text: '你翻开速写本。铅笔画，线条歪歪扭扭，旁边写着小字。' },
      { char: 'narrator', text: '第一页是一只红色的狐狸。「琥珀。总是在笑。可是尾巴不会撒谎。」' },
      { char: 'player', text: '（……原来外婆也知道。）' },
      { char: 'narrator', text: '一只银色的狼，趴在石阶上。「银朗。永远走在我左边。今天又没说几句话，但把伞全让给我了。」' },
      { char: 'narrator', text: '一个头上长着小鹿角的孩子。「白露。又长高了一点。答应要带他去看海——要是他能下山就好了。」' },
      { char: 'narrator', text: '屋顶上一个模糊的剪影，旁边画着一根羽毛。「苍羽。从来不下来吃饭。我把饭团放在屋檐上，第二天总是空的。」' },
      { char: 'narrator', text: '你想起了窗台上的那根羽毛。把它拿出来，放在画旁边比了比。一模一样。' },
      { char: 'narrator', text: '一条盘在棋盘上的蛇。' },
      { char: 'narrator', text: '「玄夜。今天的棋又输了。他瘦了。——别告诉琥珀我去地下了。」' },
      { char: 'player', text: '（玄夜……来客簿上说的「那条蛇」。还有那扇门后面「不太好相处的家伙」。）' },
      { char: 'narrator', text: '你以为那是最后一页了。可是后面还有。' },
      { char: 'narrator', text: '最后几页，画的都是同一个小孩子。穿着背带裤，扎着歪歪的头发，手里攥着一颗糖。' },
      { char: 'narrator', text: '每一页的脸，都是空白的。' },
      { char: 'narrator', text: '不是没画。是画了，又擦掉。擦了，又画。纸被橡皮擦得起了毛，薄得快透光了。' },
      { char: 'narrator', text: '最后一页的角落里，有一行很小很小的字。' },
      { char: 'narrator', text: '「小不点，六岁。」' },
      { char: 'narrator', text: '「……想不起来了。」' },
      { char: 'player', text: '（……是我。）' },
      { char: 'player', text: '（外婆，你想画的，是我。）' },
      { char: 'player', text: '（可是你，想不起我小时候的样子了。）', flag: 'q_photo' },
      { char: 'player', text: '（外婆，你每个月说「去山上看朋友」，原来是真的。）' },
      { char: 'narrator', text: '你把速写本抱在胸前，躺了下来。' },
      { char: 'narrator', text: '夜很深的时候，远处传来一声狼嚎。很长，很低，一直没有停。' },
      { char: 'narrator', text: '葬礼上没有流出来的眼泪，在那一刻，一下子全涌了上来。' },
      { char: 'narrator', text: '你终于在那声狼嚎里，为外婆哭了出来。' },
    ],
    next: 'day1_eyes',
  },

  'day1_eyes': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '不知道过了多久。' },
      { char: 'narrator', text: '狼嚎停了。连虫鸣都停了。神社安静得像是沉进了水底。' },
      { char: 'narrator', text: '你是被冷醒的。' },
      { char: 'narrator', text: '不是夜里的那种凉。是一种从脚底往上爬的、湿漉漉的冷。像是有什么东西，贴着地板滑过去。' },
      { char: 'narrator', text: '枕边的铃，在轻轻地颤。没有响，只是颤。' },
      { char: 'narrator', text: '你慢慢地转过头。' },
      { char: 'narrator', text: '纸拉门上，映着月光。月光里，有一个细长的影子。' },
      { char: 'narrator', text: '门缝外面，有一双眼睛。紫色的。瞳孔是一条细细的竖线。' },
      { char: 'narrator', text: '你屏住了呼吸。' },
      { char: 'narrator', text: '那双眼睛没有看你的脸。它看的是你怀里的那本速写本。看了很久。' },
      { char: 'narrator', text: '然后，才慢慢地，移到了你的脸上。' },
      { char: 'narrator', text: '你听到一个很低、很好听的声音，像是自言自语。' },
      { char: 'narrator', text: '「……长这么大了啊。」' },
      { char: 'narrator', text: '「她要是能看见，就好了。」' },
      { char: 'narrator', text: '影子消失了。那股冷，也跟着退了下去。', flag: 'q_eyes' },
      { char: 'narrator', text: '门外的走廊上，留下了一小滩水渍。冰凉的，像是从很深的井底带上来的。' },
      { char: 'player', text: '（……那个声音。）' },
      { char: 'player', text: '（梦里说「这个不能吃，吐出来」的——就是那个声音。）' },
    ],
    next: 'day2_morning',
  },
  // =============== DAY 2 ===============
  'day2_morning': {
    scene: 'shrine', particles: 'sakura', day: 2,
    chapter: { num: '第二天', title: '鹿与白狼' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你是被鸟叫声吵醒的。眼睛有点肿。' },
      { char: 'narrator', text: '拉开门，走廊上那滩水渍已经干了。木板上只留下一道浅浅的、弯弯曲曲的印子，一直拐进了正殿的方向。' },
      { char: 'narrator', text: '庭院里的樱花正往石板路上落。空气里有味噌汤的香味。' },
      { char: 'narrator', text: '早饭摆在缘廊上：米饭，味噌汤，腌萝卜，一小碟煎蛋。煎蛋被做成了狐狸脸的形状，歪了一只耳朵。' },
      { char: 'kohaku', text: '早上好。睡得还好吗？' },
      { char: 'kohaku', text: '……眼睛有点肿呢。我去拿凉毛巾。' },
      { char: 'player', text: '没事。……昨晚，我终于哭出来了。' },
      { char: 'narrator', text: '琥珀停下脚步，回头看了你一眼。然后什么都没说，只是往你碗里多夹了一块煎蛋。' },
      { char: 'narrator', text: '她把小本子摊在膝盖上，念给你听：「昨晚的预报：今天，晴。降水概率一成。」' },
      { char: 'kohaku', text: '是个好天气哦。适合晒被子。' },
      { char: 'kohaku', text: '对了，「千代」今天早上，是最后一个灭的。比阿松还晚。', if: 'named_lantern' },
      { char: 'narrator', text: '她说的是那盏灯笼。你愣了一下，然后笑了。', if: 'named_lantern' },
      { char: 'player', text: '……昨晚，好像有人在我门外面。' },
      { char: 'narrator', text: '琥珀盛汤的手，停了半秒。' },
      { char: 'kohaku', text: '……是风吧。神社的拉门，一到半夜就咔嗒咔嗒响。' },
      { char: 'player', text: '是一双紫色的眼睛。' },
      { char: 'narrator', text: '汤勺碰在碗沿上，叮的一声。' },
      { char: 'kohaku', text: '……今晚，我在你房门口放一盏狐火。' },
      { char: 'kohaku', text: '有我的火在，什么东西都不敢靠近。' },
      { char: 'narrator', text: '她笑着说的。可是她没有回答你的问题。尾巴倒是没炸——她只是把它藏到了身后，你看不见。' },
      { char: 'narrator', text: '你们安静地吃着早饭。琥珀自己没怎么动筷子，一直在搅那碗汤。' },
      { char: 'kohaku', text: '那个……今天，可能会有个孩子来找你。' },
      { char: 'kohaku', text: '他叫白露。千代每次上山都会给他带金平糖。他……还不知道。' },
      { char: 'kohaku', text: '我本来想昨晚就去告诉他的。走到他住的地方门口，又走回来了。' },
      { char: 'kohaku', text: '活了这么久，还是学不会怎么说这种话。真没用啊，我。' },
      { char: 'narrator', text: '就在这时——石阶下面，传来一阵噼里啪啦的脚步声。光着脚，跑得很急，一步跨两级。' },
      { char: 'shiro', text: '千代婆婆——！！' },
    ],
    next: 'meet_shiro',
  },

  'meet_shiro': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '一个翠绿色头发的少年光着脚从石阶上冲了上来。头上一对骨白色的小鹿角，角上开满了粉色的花。' },
      { char: 'narrator', text: '他跑得太急，在最后一级台阶上绊了一下，整个人扑进了琥珀怀里，又弹起来。' },
      { char: 'shiro', text: '琥珀姐！我闻到了！是千代婆婆的铃的味道！她是不是来了！她是不是——' },
      { char: 'narrator', text: '他看到了你。翠绿的大眼睛眨了眨。' },
      { char: 'shiro', text: '……诶？你是谁？' },
      { char: 'narrator', text: '他凑近了，鼻子嗅了嗅，眼睛又亮了起来。角上的花「啵」地又开了一朵。' },
      { char: 'shiro', text: '你身上有千代婆婆的味道！你是她的家人吧？那她呢？她在里面吗？她说这次要给我带那种星星形状的糖——' },
      { char: 'shiro', text: '还有还有，她答应了要给我讲「电车」！就是那种很长很长、会自己跑的屋子！' },
      { char: 'shiro', text: '我还给她留了今年第一朵花！我一直没让它谢，憋得角都酸了！' },
      { char: 'narrator', text: '琥珀张了张嘴，什么也没说出来。她的尾巴紧紧地缠在了身侧。' },
      { char: 'narrator', text: '少年的笑容，一点一点地停住了。' },
      { char: 'shiro', text: '……琥珀姐？你们为什么……都不说话？' },
    ],
    choices: [
      { text: '在他面前蹲下来，自己告诉他', affection: { deer: 2 }, flag: 'told_shiro', next: 'shiro_news' },
      { text: '轻轻握住琥珀的手，陪她一起开口', affection: { fox: 1, deer: 1 }, next: 'shiro_news' },
    ],
  },

  'shiro_news': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'player', text: '白露。外婆她……前几天去世了。', if: 'told_shiro' },
      { char: 'player', text: '她让我来，是因为她自己来不了了。对不起。', if: 'told_shiro' },
      { char: 'narrator', text: '琥珀的手在你手心里抖了一下。然后，她深吸了一口气。', ifnot: 'told_shiro' },
      { char: 'kohaku', text: '白露。千代她……不会再来了。她去了很远的地方。', ifnot: 'told_shiro' },
      { char: 'narrator', text: '白露没有哭。他只是站在那里，一动不动。' },
      { char: 'narrator', text: '然后，他头上的花，开始一朵一朵地合上。' },
      { char: 'narrator', text: '花瓣变成褐色，卷起来，一片一片往下掉。落在他光着的脚边。' },
      { char: 'narrator', text: '最后一朵，是开得最大的那朵。他一直留着的那朵。它也合上了。' },
      { char: 'shiro', text: '……骗人的吧。' },
      { char: 'shiro', text: '她说好了的。她说下次一定……她说等我的角再长长一点，就带我去看海……' },
      { char: 'shiro', text: '骗人！！' },
      { char: 'narrator', text: '他转身就跑。一眨眼，一只白色的小鹿冲下了石阶，消失在树林里。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '石板上，散着一地褐色的花瓣。琥珀蹲下去，一片一片捡起来，放进袖子里。' },
      { char: 'kohaku', text: '……他会去溪边的。每次难过，他都会去那里。' },
      { char: 'kohaku', text: '我去的话，他只会更难过。因为我是那个「早就知道了」的人。' },
      { char: 'kohaku', text: '可以……拜托你吗？' },
      { char: 'kohaku', text: '从正殿后面的小石阶往下走，一直听着水声。看到一块像趴着的牛一样的大石头，他就在那里。' },
      { char: 'kohaku', text: '……带上这个。' },
      { char: 'narrator', text: '她把木盒里的那袋金平糖，塞进了你的手心。' },
    ],
    next: 'spring_find',
  },

  'spring_find': {
    scene: 'spring', particles: 'sakura',
    lines: [
      { char: 'narrator', text: '石阶又窄又陡，长满了青苔。你扶着树干，一级一级往下挪。' },
      { char: 'narrator', text: '林子里很亮。阳光从叶子的缝里漏下来，落在地上，像撒了一地碎金子。和昨晚完全是两个地方。' },
      { char: 'narrator', text: '溪水声越来越近。你拨开最后一丛灌木。' },
      { char: 'narrator', text: '溪边有一块很大的石头，真的像一头趴着的牛。' },
      { char: 'narrator', text: '白露抱着膝盖坐在石头上，脸埋在胳膊里，肩膀一抽一抽的。' },
      { char: 'narrator', text: '他身边还坐着一个人。' },
      { char: 'narrator', text: '白发，乱糟糟地支棱着。一对白色的狼耳，其中一只缺了个小口。一只胳膊搭在白露的肩膀上。' },
      { char: 'narrator', text: '那人回过头来。一双淡金色的眼睛，毫不客气地瞪着你。' },
    ],
    next: 'meet_yukimaru',
  },

  'meet_yukimaru': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '就是你？把白露弄哭的家伙？' },
      { char: 'shiro', text: '……不是的，雪丸。不是它的错……' },
      { char: 'yukimaru', text: '我知道。我就是想凶一下。' },
      { char: 'narrator', text: '白发少年上下打量着你，鼻子抽了抽。' },
      { char: 'yukimaru', text: '昨天在山道上的就是你吧？我跟了你一路。还以为是来打猎的，结果走路慢得要死，还踩空了两次。' },
      { char: 'yukimaru', text: '还捡树枝！拿树枝想干嘛？戳我吗？哈哈哈哈！', if: 'took_stick' },
      { char: 'yukimaru', text: '后来下雨了，你还撑了把伞。那把伞……哼。', ifnot: 'took_stick' },
      { char: 'player', text: '……那个白影子是你！' },
      { char: 'yukimaru', text: '雪丸。白狼。北边雪山来的。' },

      { char: 'narrator', text: '你在白露身边坐下。溪水哗哗地流。很久，谁都没有说话。' },
      { char: 'narrator', text: '你想起口袋里的糖，拿出来一颗，放在白露膝盖边上。他看了一眼，没有拿。可是也没有推开。' },
      { char: 'shiro', text: '……她，最后……疼不疼？' },
      { char: 'player', text: '不疼。护士说，她走的那天下午还在笑。' },
      { char: 'player', text: '还有——她病房的床头，有一个铁皮饼干盒。' },
      { char: 'player', text: '里面全是干掉的小花。粉的，白的，一朵一朵夹在纸里。每一朵旁边，都写着日期。' },
      { char: 'narrator', text: '白露抬起头来。满脸都是泪。' },
      { char: 'shiro', text: '……那是我给她的。每个月，一朵。我角上开的第一朵，都留给她。' },
      { char: 'shiro', text: '她全都留着？五十……五十多朵？' },
      { char: 'player', text: '她跟护士说，山上有个会开花的孩子。每次说起来，都笑得很开心。' },
      { char: 'narrator', text: '白露把脸埋回膝盖里，放声大哭。雪丸没说话，只是把他搂得更紧了一点。' },
      { char: 'narrator', text: '哭声渐渐停下来的时候，你看到——白露头上枯掉的角尖，冒出了一个小小的、嫩绿的花苞。' },
    ],
    choices: [
      { text: '「外婆信里说，答应过要带你去看海。……这个约定，我可以替她记着吗？」', affection: { deer: 3 }, flag: 'promised_sea', next: 'shiro_flowers' },
      { text: '对雪丸说：「谢谢你一直陪着他。」', affection: { whitewolf: 3 }, flag: 'thanked_yuki', next: 'shiro_flowers' },
    ],

  'shiro_flowers': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露抽了抽鼻子，盯着你看了很久。', if: 'promised_sea' },
      { char: 'shiro', text: '……可以。可是你要记牢哦。比千代婆婆记得还牢。', if: 'promised_sea' },
      { char: 'shiro', text: '海是咸的。很大。有很多会自己跑的白色的水。……这些是她说的。剩下的，你告诉我。', if: 'promised_sea' },
      { char: 'narrator', text: '雪丸整个人一僵，耳朵「唰」地竖了起来。', if: 'thanked_yuki' },
      { char: 'yukimaru', text: '谢、谢什么谢！我就是刚好路过！刚好路过一上午而已！', if: 'thanked_yuki' },
      { char: 'shiro', text: '他天没亮就来了。', if: 'thanked_yuki' },
      { char: 'yukimaru', text: '白露！！', if: 'thanked_yuki' },
      { char: 'narrator', text: '那个嫩绿的花苞，慢慢地张开了。是很淡很淡的粉色。' },

      { char: 'shiro', text: '嗯。跟着心情变的。' },
      { char: 'shiro', text: '粉色是高兴。黄色是想吃东西。白色是……平静。褐色是难过。' },
      { char: 'yukimaru', text: '还有红色。上次银朗踩了他的花田，他满头都是红的，气得追了银朗三座山。' },
      { char: 'shiro', text: '才没有三座！是两座半！' },
      { char: 'narrator', text: '他鼓起腮帮子。角上「啵」地冒出一朵小小的红花，又飞快地缩了回去。' },
      { char: 'narrator', text: '你忍不住笑出了声。白露瞪着你，瞪着瞪着，自己也笑了。然后——打了个很大的哈欠。' },
      { char: 'shiro', text: '……对不起。哭完了，好困。' },
      { char: 'narrator', text: '他靠在雪丸肩膀上，眼皮一点一点往下掉。不到一分钟，就睡着了。' },
      { char: 'narrator', text: '雪丸低头看着他，脸上的表情，一下子不像个孩子了。' },
      { char: 'yukimaru', text: '……他最近老是这样。' },
      { char: 'yukimaru', text: '以前能疯一整天，追蝴蝶追到天黑。现在说着话就睡着了。角上的花，也比去年少了一半。' },
      { char: 'yukimaru', text: '我问他，他说是春困。……春天早就过去一半了。' },
    ],
    next: 'yukimaru_race',
  },

  'yukimaru_race': {

    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸把自己的毛皮短褂脱下来，轻手轻脚地盖在白露身上，把他放平在溪边的草地上。' },
      { char: 'narrator', text: '他弯腰的时候，领口滑开了一点。你看到他脖子上挂着一根皮绳，皮绳上坠着一块白色的、像骨头一样的小牌子。' },

      { char: 'yukimaru', text: '两、两百米！哈哈哈哈！你们人类是怎么活到现在的！' },
      { char: 'yukimaru', text: '嘘、嘘——别吵醒白露——哈哈哈哈两百米——' },
      { char: 'yukimaru', text: '等着！' },

      { char: 'yukimaru', text: '给你。看你那么弱，多吃点。' },

  'yukimaru_race2': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '……你这人真奇怪。' },
      { char: 'narrator', text: '他挠了挠那只缺了口的耳朵。尾巴在身后，不太确定地摇了两下。' },
      { char: 'yukimaru', text: '北边的人……我是说，北边的狼，要是有谁送吃的给你，你得先咬一口，再还一样东西回去。不然就是看不起人家。' },
      { char: 'yukimaru', text: '这里的人都不懂这个。琥珀姐只会说「谢谢」，银朗那家伙连「谢谢」都不说。' },
      { char: 'narrator', text: '你想了想，从口袋里掏出一颗金平糖，放在他手心里。' },
      { char: 'narrator', text: '雪丸愣住了。他看看手心的糖，又看看你。' },
      { char: 'yukimaru', text: '……这、这是还礼？' },
      { char: 'player', text: '嗯。还礼。' },
      { char: 'narrator', text: '他把糖放进嘴里，嚼得咔咔响。然后别过脸去。' },
      { char: 'yukimaru', text: '……甜死了。' },
      { char: 'narrator', text: '可是他的尾巴，摇得像要飞起来了。' },
      { char: 'narrator', text: '你们并排坐在溪边，看着水。他时不时偷看你口袋，你就再给他一颗。给到第五颗的时候，他终于不好意思了。' },
      { char: 'yukimaru', text: '……最后一颗。真的最后一颗。' },
    ],
    next: 'shiro_wake',
  },

  'shiro_wake': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '太阳往西边挪了一大截的时候，白露猛地坐了起来。毛皮短褂从他身上滑下去。' },
      { char: 'shiro', text: '——现在什么时候了？！' },
      { char: 'yukimaru', text: '下午啊。你睡了快两个时辰。' },
      { char: 'shiro', text: '我得回去了！花谷不能离开太久的！' },
      { char: 'narrator', text: '他慌慌张张地爬起来，揉着角根。像是那里在痒。' },
      { char: 'player', text: '花谷？' },
      { char: 'shiro', text: '我住的地方。我种了好多好多花，它们离不开我。……我也离不开它们。' },
      { char: 'shiro', text: '离开半天以上，角就会痒，痒得睡不着。所以我从来不走远的。' },
      { char: 'yukimaru', text: '你明明一直在睡。' },
      { char: 'shiro', text: '那、那不一样！' },
      { char: 'narrator', text: '他跑出去几步，又跑回来。从角上摘下那朵很淡很淡的粉色的花，放进你手心。' },
      { char: 'shiro', text: '……今天的第一朵。本来是留给千代婆婆的。' },
      { char: 'shiro', text: '现在给你。下个月的第一朵，也给你。', flag: 'q_horn' },
      { char: 'narrator', text: '说完他就跑了。白色的小鹿钻进林子，一路踩起细碎的光。',
        chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '你低头看着手心的花。花瓣的边缘，有一点点发黄。像是开的时候，已经很累了。' },
    ],
    next: 'yukimaru_walk',
  },

  'yukimaru_walk': {
    scene: 'forest', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露走了以后，雪丸说他送你回神社。' },
      { char: 'yukimaru', text: '你认路的本事我昨天见识过了。放你一个人走，明天早上琥珀姐会在哪棵树上找到你都不知道。' },
      { char: 'narrator', text: '林间的小路上，萤火虫一点一点亮了起来。雪丸走在你前面半步，尾巴有一下没一下地甩着。' },
      { char: 'narrator', text: '西边的天，不知什么时候堆起了一层厚厚的云。空气变得又闷又湿。' },
      { char: 'yukimaru', text: '要下雨了。我鼻子从来不会错。' },
      { char: 'player', text: '琥珀的收音机说今天是晴天。' },
      { char: 'yukimaru', text: '收音机是山下的东西。山里的天，它管不着。' },
      { char: 'player', text: '你说你是从北边来的？' },
      { char: 'yukimaru', text: '嗯。半年前。一路跑过来的，脚底板都磨破了。' },
      { char: 'player', text: '为什么来这里？' },
      { char: 'yukimaru', text: '……来找人。' },
      { char: 'narrator', text: '他踢飞了一颗石子。' },
      { char: 'yukimaru', text: '我娘去年冬天死了。她走之前跟我说：「去南边的杜鹃森，找你舅舅。他会照顾你的。」' },
      { char: 'yukimaru', text: '然后我就来了。找到了。' },
      { char: 'player', text: '你舅舅是……' },
      { char: 'yukimaru', text: '银朗。' },
      { char: 'yukimaru', text: '哈，想不到吧？那张冰块脸是我舅舅。' },
      { char: 'yukimaru', text: '可是他不认我。我第一天到的时候，他就说：「我没有外甥。回北边去。」' },
      { char: 'yukimaru', text: '半年了。每天都是这句。「回去。」「回你的窝去。」连我的名字都没叫过一次。' },
      { char: 'narrator', text: '他笑着说的，可那只缺了口的耳朵，一直耷拉着。' },
      { char: 'narrator', text: '走了一段，他忽然又开口了。语气很随便，像是随口一问。' },
      { char: 'yukimaru', text: '喂。你昨天见到他了吧。他晚上……一般巡哪条路？什么时候回他那个破屋子？' },
      { char: 'player', text: '我怎么会知道？' },
      { char: 'yukimaru', text: '也是。哈哈。随便问问。' },
      { char: 'narrator', text: '他的手，又碰了一下领口。碰到那块骨牌的位置，停了一停，又放下了。' },
      { char: 'player', text: '（……他想知道这个，做什么？）', flag: 'q_bone' },
    ],
    choices: [
      { text: '「他一定有他的理由。昨晚他为外婆嚎了一整夜，不是冷血的人。」', affection: { wolf: 1 }, next: 'ginro_yukimaru_clash' },
      { text: '「……那你还留下来了。你很厉害。」', affection: { whitewolf: 2 }, next: 'ginro_yukimaru_clash' },
    ],
  },

  'ginro_yukimaru_clash': {
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '走到鸟居下的时候，天已经全黑了。第一滴雨，啪地落在石阶上。' },
      { char: 'narrator', text: '然后是第二滴，第三滴。转眼间，整座山都响起了沙沙的雨声。' },
      { char: 'narrator', text: '石阶上站着一个人。手里撑着一把深蓝色的油纸伞——和老杉树下的那把，一模一样。' },
      { char: 'ginro', text: '太阳落山前回来。这里不是城里。' },
      { char: 'narrator', text: '银朗从阴影里走出来。他的目光越过你，落在雪丸身上。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '我陪着呢，怕什么。' },
      { char: 'ginro', text: '就是因为你陪着。' },
      { char: 'yukimaru', text: '……哈？什么意思，我还能把人弄丢不成？' },
      { char: 'ginro', text: '你连自己都弄丢了。一个人从北边跑出来，半年了还不回去。' },
      { char: 'yukimaru', text: '那边已经没有我的窝了！娘死了，族里那帮老家伙——' },
      { char: 'ginro', text: '族里会收留你。只要你回去，低头，守规矩。' },
      { char: 'yukimaru', text: '像你一样？你当年守规矩了吗？！' },
      { char: 'narrator', text: '空气一下子冷了下来。银朗的耳朵往后压平了。雨水顺着伞沿，一串一串地往下掉。' },
      { char: 'yukimaru', text: '……你到底什么时候，才肯叫我一次名字？' },
      { char: 'narrator', text: '银朗没有回答。' },
      { char: 'ginro', text: '……回你的窝去。' },
      { char: 'yukimaru', text: '我的窝就在这儿！！' },
      { char: 'narrator', text: '雪丸转身冲进了雨里。一道白影，几个起落就不见了。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '银朗站在原地，看着他消失的方向。' },
      { char: 'ginro', text: '……他娘，叫雪音。是我妹妹。' },
      { char: 'ginro', text: '小时候也是这样。吵得要命，跑得比谁都快，摔了跤从来不哭。' },
      { char: 'player', text: '那你为什么——' },
      { char: 'narrator', text: '你的话没说完。雨忽然大了，劈头盖脸地砸下来。你的头发一下子全湿了。' },
      { char: 'narrator', text: '银朗走过来。一言不发，把伞举到了你头顶上。' },
      { char: 'narrator', text: '伞往你这边斜得很厉害。雨水全落在他的肩膀上、后背上。银色的头发湿成一缕一缕，贴在脸边。', cg: 'cg_ginro_umbrella' },
      { char: 'player', text: '你自己都湿透了……' },
      { char: 'ginro', text: '狼不怕雨。' },
    ],
    choices: [
      { text: '把伞柄往他那边推回去：「一起撑。」', affection: { wolf: 2 }, flag: 'shared_umbrella', next: 'day2_umbrella' },
      { text: '「……外婆说过。你总是这样，把伞全让出去。」', affection: { wolf: 2 }, flag: 'told_umbrella', next: 'day2_umbrella' },
    ],
  },

  'day2_umbrella': {
    scene: 'night-shrine', particles: 'fireflies', keepCG: true,
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '伞柄在你们两个人的手之间，停住了。', if: 'shared_umbrella' },
      { char: 'narrator', text: '他低头看着你。雨水顺着他的睫毛往下滴。', if: 'shared_umbrella' },
      { char: 'ginro', text: '……伞太小了。两个人撑，两个人都会湿。', if: 'shared_umbrella' },
      { char: 'player', text: '那就两个人都湿。', if: 'shared_umbrella' },
      { char: 'narrator', text: '他沉默了很久。然后，伞往回挪了一点点。只是一点点。刚好够遮住他的一只耳朵。', if: 'shared_umbrella' },
      { char: 'narrator', text: '银朗的脚步停了一下。', if: 'told_umbrella' },
      { char: 'ginro', text: '……她说的？', if: 'told_umbrella' },
      { char: 'player', text: '她最后那几天，一直在说。「那孩子又把伞全让给我，自己淋湿了。」', if: 'told_umbrella' },
      { char: 'narrator', text: '伞面上的雨声，忽然变得很响。', if: 'told_umbrella' },
      { char: 'ginro', text: '……她每次都把伞推回来。我每次都推过去。推了五十年。', if: 'told_umbrella' },
      { char: 'ginro', text: '最后一次，她没有推回来。', if: 'told_umbrella' },
      { char: 'narrator', text: '他就这样撑着伞，陪你一级一级走上石阶。走在你的左边。' },
      { char: 'player', text: '（外婆。原来是这样的伞啊。）' },
      { char: 'narrator', text: '走到缘廊下面，他停住了。把伞塞进你手里，又把自己的外褂脱下来，扔到你怀里。', cg: null },
      { char: 'ginro', text: '进去吧。夜里凉。' },
      { char: 'narrator', text: '他转身走进雨里，头也不回。没有伞。' },
      { char: 'narrator', text: '外褂上有雨水和松针的味道。你愣住了。' },
      { char: 'player', text: '（……这个味道。梦里那只银色的大狗……）' },
    ],
    next: 'day2_towel',
  },

  'day2_towel': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '哎呀哎呀哎呀！怎么湿成这样！' },
      { char: 'narrator', text: '琥珀抱着一条大毛巾冲过来，不由分说地罩在你头上，使劲揉。' },
      { char: 'kohaku', text: '收音机明明说是晴天的！一成！降水概率才一成！' },
      { char: 'player', text: '雪丸说……山里的天，收音机管不着。' },
      { char: 'kohaku', text: '……那孩子的鼻子，有时候比收音机准。不许告诉他我说过这句话。' },
      { char: 'narrator', text: '她看到了你怀里那件湿漉漉的外褂，和那把深蓝色的伞。揉毛巾的手，慢了下来。' },
      { char: 'kohaku', text: '……他又把伞让出去了？' },
      { char: 'player', text: '嗯。自己淋着雨走了。' },
      { char: 'kohaku', text: '五十年。一次都没改过。' },
      { char: 'kohaku', text: '六百年前我在森林外面捡到他的时候，也是这样。浑身湿透，饿得站不稳，还跟我说「不冷」。' },
      { char: 'kohaku', text: '我给他煮了一锅粥。他说「不吃」。然后吃了三碗。' },
      { char: 'kohaku', text: '……从那以后，他谁的话都不听。只听我的。偶尔。' },
      { char: 'narrator', text: '她把外褂接过去，搭在火盆边上烘。动作很仔细，把每一道褶子都抻平了。' },
      { char: 'kohaku', text: '你也是，湿透了。……你带上山的衣服呢？' },
      { char: 'player', text: '就一个小包。……一身黑的。葬礼穿的那身。' },
      { char: 'narrator', text: '琥珀「嗯」了一声，拉开里间的柜子，抱出一叠叠得整整齐齐的衣服。白色的上衣，红色的滚边，袖子宽宽的。' },
      { char: 'kohaku', text: '千代的。她一上山就换这个。扫院子、点灯笼、晒被子，穿了五十年。' },
      { char: 'player', text: '这是……巫女服？' },
      { char: 'kohaku', text: '神社的衣服。穿着它在山里走，林子里的东西远远一闻就知道——「啊，是神社的人」。不会来找你麻烦。' },
      { char: 'kohaku', text: '穿一身黑在林子里走，才吓人呢。像乌鸦。苍羽会不高兴的。' },
      { char: 'narrator', text: '你换上了。袖子长了一点点，腰身刚刚好。衣服上有樟脑和线香的味道。' },
      { char: 'kohaku', text: '……她年轻的时候，跟你一样高。' },
      { char: 'narrator', text: '琥珀看了你很久。然后转过身，去拨火盆里的炭。耳朵垂得低低的。' },
      { char: 'player', text: '琥珀。雪丸和银朗……' },
      { char: 'kohaku', text: '吵起来了？' },
      { char: 'player', text: '雪丸问他，「你当年守规矩了吗」。' },
      { char: 'narrator', text: '琥珀叹了口气。' },
      { char: 'kohaku', text: '那是银朗最疼的地方。那孩子，一口就咬上去了。不愧是狼。' },
      { char: 'kohaku', text: '狼的事，要让狼自己解决。我们插手的话，他们只会更别扭。' },
      { char: 'player', text: '还有白露。他今天睡了一下午。雪丸说，他最近老是这样。花也少了。' },
      { char: 'narrator', text: '琥珀的手停住了。耳朵，慢慢地往后压了下去。' },
      { char: 'kohaku', text: '……是吗。' },
      { char: 'kohaku', text: '春天嘛。小孩子，长身体的时候都贪睡。' },
      { char: 'narrator', text: '「噗」。' },
      { char: 'narrator', text: '她身后的尾巴炸开了。她自己好像都没发现，只是低着头，一下一下，把那件外褂抻得更平了。' },
      { char: 'narrator', text: '过了一会儿，她忽然「啊」了一声，站起来。' },
      { char: 'kohaku', text: '饭团！今天的饭团还没放！' },
      { char: 'narrator', text: '她从厨房端出一个盘子，上面是一个圆圆的梅子饭团，用竹叶包着。' },
      { char: 'kohaku', text: '苍羽的。千代每次都放在东边的屋檐上。她不在的这些天，我替她放。' },
      { char: 'kohaku', text: '可是我一放，他就不吃。……大概是闻得出来，不是千代捏的吧。' },
    ],
    choices: [
      { text: '「我去放吧。」接过盘子', affection: { hawk: 2 }, flag: 'placed_onigiri', next: 'day2_eaves' },
      { text: '「那……我们一起去放？」', affection: { fox: 1, hawk: 1 }, next: 'day2_eaves' },
    ],
  },

  'day2_eaves': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '雨小了，变成了雾一样的细丝。你踩着一张小板凳，把饭团放到东边屋檐的瓦片上。' },
      { char: 'narrator', text: '瓦片是湿的。可是放饭团的那一小块，是干的。像是有什么东西，一直替这个位置挡着雨。' },
      { char: 'narrator', text: '那里还躺着一根羽毛。蓝灰色的，很长。和你窗台上那根一模一样。' },
      { char: 'narrator', text: '你下意识地抬起头。' },
      { char: 'narrator', text: '屋脊上，什么都没有。只有雨后的天，和几颗刚刚露出来的星星。' },
      { char: 'narrator', text: '可是在你转身的时候，头顶上传来一声很轻很轻的——' },
      { char: 'narrator', text: '「……谢谢。」' },
      { char: 'narrator', text: '你再抬头的时候，屋脊上只剩下风。' },
      { char: 'narrator', text: '第二天早上琥珀告诉你，饭团不见了。连竹叶都没剩下。', if: 'placed_onigiri' },
      { char: 'narrator', text: '第二天早上琥珀告诉你，饭团不见了。她高兴得耳朵抖了一早上。', ifnot: 'placed_onigiri' },
    ],
    next: 'day2_rot',
  },

  'day2_rot': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '那天夜里，琥珀真的在你门口放了一盏狐火。青白色的，安安静静地烧着。' },
      { char: 'narrator', text: '雨停了。屋檐还在滴水，一滴，一滴。' },
      { char: 'narrator', text: '很远的地方，传来一声狼嚎。' },
      { char: 'narrator', text: '不是昨晚那种又长又低的。这一声很尖，很年轻，朝着北边，一遍又一遍。像是在跟什么人说话，又像是在问什么。' },
      { char: 'narrator', text: '然后，它停了。停得很突然，像是被谁捂住了嘴。' },
      { char: 'narrator', text: '你抱着银朗的外褂，迷迷糊糊地睡了过去。' },
      { char: 'narrator', text: '然后——' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '铃响了。不是颤，是响。一声，又一声，很急。' },
      { char: 'narrator', text: '门口的狐火，不知什么时候，灭了。' },
      { char: 'narrator', text: '你拉开拉门。铃声停了。可是从神社外面的林子里，传来了另一种声音。' },
      { char: 'narrator', text: '像是很多很多细小的东西，在枯叶底下爬。' },
    ],
    choices: [
      { text: '想起银朗的话——「天黑以后别出门」。关上门', next: 'day2_rot_stay' },
      { text: '握着铃，循着声音走出去', flag: 'went_out', next: 'day2_rot_go' },
    ],
  },

  'day2_rot_stay': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '你关上了门，背靠着门坐下，把铃紧紧攥在手心里。' },
      { char: 'narrator', text: '外面的声音越来越近。沙沙，沙沙。然后，停在了门外。' },
      { char: 'narrator', text: '有什么东西，在门板的另一边，嗅了嗅。' },
      { char: 'narrator', text: '一股味道从门缝里渗进来。像是烂掉的叶子，又像是很久没有打开过的井。' },
      { char: 'narrator', text: '你的心脏快跳出来了。' },
      { char: 'narrator', text: '就在这时，门外传来一声很轻的「嘶——」。像蛇吐信的声音。' },
      { char: 'narrator', text: '沙沙声一下子退远了，像潮水一样。' },
      { char: 'narrator', text: '门外安静了很久。然后，那个好听的、低低的声音，隔着门板响了起来。' },
      { char: 'narrator', text: '「……聪明。比你外婆听话多了。」' },
      { char: 'narrator', text: '「下次，别让那只狐狸的火灭掉。」' },
      { char: 'narrator', text: '声音停了一下。然后，又加了一句。很轻，轻得像是说给自己听的。' },
      { char: 'narrator', text: '「……外褂是那条狼的吧。抱紧点。今晚冷。」' },
      { char: 'narrator', text: '你一直没敢开门。天亮的时候你拉开门，门口的石板上，有一道很长很长的、被什么东西烧焦了一样的黑色痕迹。' },
      { char: 'narrator', text: '痕迹的尽头，一直延伸到正殿后面——那扇贴着旧符的窄门。', flag: 'q_rot' },
    ],
    next: 'day3_morning',
  },

  'day2_rot_go': {
    scene: 'moonlit', particles: 'fireflies',
    lines: [
      { char: 'narrator', text: '你披上银朗的外褂，走进了夜色里。' },
      { char: 'narrator', text: '雨后的林子湿漉漉的，每一片叶子都在往下滴水。云散了，月亮很亮。' },
      { char: 'narrator', text: '林子里的声音越来越近。你绕过一棵巨大的榉树——' },
      { char: 'narrator', text: '然后停住了。' },
      { char: 'narrator', text: '榉树的树干上，爬满了黑色的东西。像墨汁，又像烧焦的树皮，在月光下一鼓一鼓地蠕动。' },
      { char: 'narrator', text: '树下站着一个人。' },
      { char: 'narrator', text: '黑色的长发，一直拖到地上。苍白的手，按在那片黑色上。' },
      { char: 'narrator', text: '那些黑色的东西，正顺着他的手指，一点一点地——流进他的身体里。' },
      { char: 'narrator', text: '他的手背上，鳞片一片接一片地，变成了灰色。' },
      { char: 'narrator', text: '你踩断了一根树枝。', chars: [{ id: 'genya', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '他回过头来。紫色的竖瞳在黑暗里亮了一下。然后，他笑了。' },
      { char: 'genya', text: '……嘘。' },
      { char: 'genya', text: '这么晚了，小孩子不该出来乱跑。' },
      { char: 'player', text: '你……你在做什么？！' },
      { char: 'genya', text: '吃饭。' },
      { char: 'narrator', text: '他说得那么轻描淡写，你一时不知道他是在开玩笑，还是在说真的。' },
      { char: 'genya', text: '还穿着狼的衣服出来。……那条狼知道了，会把整座山咬穿的。' },
      { char: 'narrator', text: '身后，一道青白色的火光猛地亮了起来。', flag: 'q_rot' },
      { char: 'kohaku', text: '——玄夜。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '琥珀挡在你面前。她身后的尾巴，不是一条——是好几条，全都燃着狐火，像一面张开的扇子。' },
      { char: 'kohaku', text: '离这个孩子远一点。' },
      { char: 'genya', text: '好凶啊。我只是想看看，千代的外孙女长什么样。' },
      { char: 'kohaku', text: '昨晚在门外看的，还不够吗？' },
      { char: 'genya', text: '……哦，被发现了啊。' },
      { char: 'kohaku', text: '结界的节点，一个接一个地烂。每一次，你都在那里。' },
      { char: 'kohaku', text: '六十年前也是。你要我怎么相信你？' },
      { char: 'narrator', text: '玄夜看着琥珀。那一瞬间，他脸上的笑，好像淡了一点。' },
      { char: 'genya', text: '我从来没让你相信过我。' },
      { char: 'narrator', text: '他的身影融进了树影里。只剩下一句话，飘在夜风里。' },
      { char: 'genya', text: '……那只狐狸的火，是被那些黑东西吃掉的。你们的节点，烂得比你以为的快。' },
      { char: 'narrator', text: '榉树上的黑色，比刚才淡了一些。可是琥珀没有注意到。她转过身，紧紧抓住你的肩膀。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '你为什么要出来？！银朗说过的，天黑以后——' },
      { char: 'narrator', text: '她的手在抖。' },
      { char: 'kohaku', text: '……对不起。我不是在凶你。' },
      { char: 'kohaku', text: '只是……如果你也出了什么事……' },
      { char: 'player', text: '琥珀。那个人是谁？六十年前，发生了什么？' },
      { char: 'kohaku', text: '……住在这片森林最深处的蛇。六十年前，他——' },
      { char: 'narrator', text: '她说到一半，停住了。咬着嘴唇，摇了摇头。' },
      { char: 'kohaku', text: '明天吧。等我想好怎么说。' },
      { char: 'kohaku', text: '今晚，我守着你睡。' },
      { char: 'narrator', text: '回去的路上，你回头看了一眼那棵榉树。' },
      { char: 'narrator', text: '月光下，树根边上，有一小片被压平的草。形状弯弯曲曲的，像是有什么很长的东西，在那里蜷了很久很久。' },
    ],
    next: 'day3_morning',
  },
  // =============== DAY 3 ===============
  'day3_morning': {
    scene: 'shrine', particles: 'feathers', day: 3,
    chapter: { num: '第三天', title: '天空与深渊' },
    lines: [
      { char: 'narrator', text: '你醒来的时候，琥珀靠在门框上睡着了。一条尾巴盖在你的被子上，像一条暖烘烘的围巾。', if: 'went_out' },
      { char: 'narrator', text: '你一动，她就醒了。揉着眼睛说「我没睡着，我在闭目守夜」，然后红着脸跑去做早饭了。', if: 'went_out' },
      { char: 'narrator', text: '你醒来的时候，门外那道黑痕还在。琥珀蹲在旁边，拿着刷子和一桶水，刷得很用力。', ifnot: 'went_out' },
      { char: 'narrator', text: '她看到你，把刷子藏到了身后。「早、早上好。……石板脏了而已。」', ifnot: 'went_out' },
      { char: 'narrator', text: '第三天早上，窗台上又多了一根羽毛。' },
      { char: 'narrator', text: '不，不是一根。是七根。整整齐齐地排在窗台上，拼成了一个箭头。' },
      { char: 'narrator', text: '箭头，指着屋顶。' },
      { char: 'player', text: '（……这是在叫我上去？）' },
      { char: 'narrator', text: '你走出房间，抬起头。' },
      { char: 'narrator', text: '神社最高的屋脊上，坐着一个人。长长的蓝黑色头发被风吹起来，像一面旗。' },
      { char: 'narrator', text: '那人看到你抬头，就站了起来——然后从屋脊上一跃而下。' },
    ],
    next: 'meet_sou',
  },

  'meet_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '不，不是跳。是滑翔。' },
      { char: 'narrator', text: '宽大的袖子在空中展开，袖底隐约透出翅膀的轮廓。他在半空中转了一个很漂亮的弯，衣摆像水一样展开——' },
      { char: 'narrator', text: '然后，落地的时候，脚尖勾到了石板的边缘。' },
      { char: 'narrator', text: '他往前踉跄了两步，扶住了石灯笼。站直。理了理袖子。表情一点都没有变。' },
      { char: 'sou', text: '……刚才那个不算。' },
      { char: 'player', text: '……我什么都没看见。' },
      { char: 'sou', text: '嗯。' },
      { char: 'narrator', text: '他的耳尖红了。在蓝黑色的头发里，红得很明显。' },
      { char: 'sou', text: '……千代的外孙女。' },
      { char: 'sou', text: '你的眼睛像她。看东西的时候，总是先看最小的那个。' },
      { char: 'player', text: '你是……苍羽？外婆说你从来不下来吃饭。' },
      { char: 'narrator', text: '对方的嘴角几乎看不出地动了一下。' },
      { char: 'sou', text: '她把饭团放在屋檐上。五十年。每个月一个。梅子的。' },
      { char: 'sou', text: '我不喜欢梅子。……但每个都吃完了。' },
      { char: 'sou', text: '昨晚那个，是你放的。捏得太紧了，像石头。', if: 'placed_onigiri' },
      { char: 'sou', text: '……也吃完了。', if: 'placed_onigiri' },
      { char: 'sou', text: '昨晚那个，有两个人的味道。狐狸的手，和你的手。', ifnot: 'placed_onigiri' },
      { char: 'sou', text: '……吃完了。', ifnot: 'placed_onigiri' },
      { char: 'player', text: '前天晚上，外婆家窗台上的羽毛，也是你？' },
      { char: 'sou', text: '嗯。' },
      { char: 'sou', text: '我想知道，千代的外孙女会不会上山。' },
      { char: 'sou', text: '……你上来了。' },
      { char: 'narrator', text: '他说「千代」的时候，一只手按在了胸口。' },
      { char: 'narrator', text: '你这才注意到——他的衣襟里鼓鼓的，揣着一包东西。用油纸包着，边角是方的，像是一叠纸。' },
      { char: 'narrator', text: '他发现你在看，把衣襟拢紧了。' },
      { char: 'sou', text: '……这个，还不到时候。', flag: 'q_letters' },
      { char: 'narrator', text: '风吹过来。苍羽的目光越过你，落向山下小镇的方向。看了很久。' },
      { char: 'sou', text: '昨晚的事。', if: 'went_out' },
      { char: 'sou', text: '你看到的，不是你以为的那样。', if: 'went_out' },
      { char: 'sou', text: '……但也不是琥珀以为的那样。', if: 'went_out' },
      { char: 'sou', text: '昨晚，你门外的那道黑痕。', ifnot: 'went_out' },
      { char: 'sou', text: '那不是来害你的东西留下的。是赶走它的东西留下的。', ifnot: 'went_out' },
      { char: 'player', text: '你知道些什么？' },
      { char: 'sou', text: '我在天上。什么都看得见。' },
      { char: 'sou', text: '可是看得见，和能说出口，是两回事。' },
      { char: 'narrator', text: '他垂下眼睛。长长的睫毛在脸上投下一小片阴影。' },
      { char: 'sou', text: '……我有一件事，一直没有告诉琥珀。' },
      { char: 'sou', text: '等我想好怎么开口。在那之前——请你也不要问她。', flag: 'q_sou' },
    ],
    choices: [
      { text: '「好。我等你。」', affection: { hawk: 3 }, next: 'day3_kitchen' },
      { text: '「为什么要告诉我？我们才第一次见面。」', affection: { hawk: 2 }, next: 'sou_why' },
      { text: '「……你看起来很累。」', affection: { hawk: 2 }, next: 'sou_why' },
    ],
  },

  'sou_why': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽看着你。像是没想到你会这么说。' },
      { char: 'sou', text: '因为我一个人，拿不住了。' },
      { char: 'sou', text: '天很大。可是一个秘密放在天上，是没有地方落的。只能一直飞，一直飞。' },
      { char: 'sou', text: '……千代以前也这样看着我。然后说「下来吃饭吧」。' },
      { char: 'sou', text: '我一次都没有下来过。' },
      { char: 'narrator', text: '他转过身，张开袖子。风一下子大了起来。' },
      { char: 'sou', text: '今天的饭团，放在屋檐上就好。' },
      { char: 'narrator', text: '他起飞得很漂亮。一次就飞上了屋脊，连瓦片都没有踩响。' },
      { char: 'narrator', text: '——大概是在弥补刚才那一下。' },
    ],
    next: 'day3_kitchen',
  },

  'day3_kitchen': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '上午，你钻进了厨房。' },
      { char: 'kohaku', text: '你要做梅子饭团？给苍羽？' },
      { char: 'narrator', text: '琥珀的眼睛亮了。她把袖子一挽，耳朵竖得高高的。' },
      { char: 'kohaku', text: '好！我来教你千代的做法。米要趁热，手要沾盐水，捏三下——不能多，多了就硬了。' },
      { char: 'player', text: '苍羽说，昨晚那个捏得像石头。', if: 'placed_onigiri' },
      { char: 'kohaku', text: '……那你今天少捏一下。两下半。', if: 'placed_onigiri' },
      { char: 'narrator', text: '你捏的第一个，散了。第二个，歪成了一个三角形的土豆。' },
      { char: 'kohaku', text: '……嗯，很有个性。苍羽会喜欢的。大概。' },
      { char: 'narrator', text: '琥珀自己捏了一个。你凑过去一看——饭团被捏成了一个小狐狸的脑袋，两只耳朵翘着，梅子是鼻子。' },
      { char: 'player', text: '……琥珀，这个太可爱了，舍不得吃。' },
      { char: 'kohaku', text: '哼哼，五百年的手艺。' },
      { char: 'player', text: '五百年？' },
      { char: 'kohaku', text: '……刚才那句不算。女孩子的秘密。' },
      { char: 'narrator', text: '「噗」。尾巴炸了。' },
      { char: 'player', text: '……琥珀，你的尾巴说那不是五百年。' },
      { char: 'kohaku', text: '尾巴不许说话！' },
      { char: 'narrator', text: '厨房门口，探进来两个脑袋。一个翠绿的，一个雪白的。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '好香……' },
      { char: 'yukimaru', text: '我闻到饭团的味道就从北坡跑过来了！一口气！' },
      { char: 'narrator', text: '白露的眼睛还有点肿，可是他看到那个狐狸脸的饭团，头上「啵」地开了一朵小花。是黄色的。' },
      { char: 'player', text: '（黄色……是想吃东西。）' },
      { char: 'shiro', text: '我可以捏一个吗？我想捏一只小鹿！' },
      { char: 'yukimaru', text: '那我捏一只狼！最大的那种！' },
      { char: 'shiro', text: '对了对了！我昨天学了一个新的人类的词！「便利店」！' },
      { char: 'shiro', text: '就是……很方便的店？卖方便的东西？比如会自己跑的屋子？' },
      { char: 'player', text: '……卖饭团的。' },
      { char: 'shiro', text: '饭团！！那我以后要开一家便利店！' },
      { char: 'narrator', text: '他头上「啵」地开了一朵黄花。雪丸说他开的店，第一天就会被他自己吃空。' },
      { char: 'narrator', text: '半个时辰后，厨房里全是米粒。白露的小鹿只剩下一只角。雪丸的狼……看起来像一个被踩扁的馒头。' },
      { char: 'kohaku', text: '……这个是？' },
      { char: 'yukimaru', text: '狼！在嚎！你看，这是嘴！' },
      { char: 'shiro', text: '看起来像银朗哥生气的时候。' },
      { char: 'narrator', text: '雪丸「哼」了一声。两条胳膊往胸前一抱，下巴一抬，眉毛压得低低的。' },
      { char: 'yukimaru', text: '……回你的窝去。' },
      { char: 'narrator', text: '学得一模一样。连耳朵往后压的角度都一样。' },
      { char: 'shiro', text: '像！太像了！你偷偷练过吧！' },
      { char: 'yukimaru', text: '谁、谁练过！是他一天说八百遍，听都听会了！' },
      { char: 'narrator', text: '厨房里安静了一秒。然后四个人一起笑了出来。连琥珀都笑出了眼泪。' },
      { char: 'narrator', text: '那是你上山以来，第一次听到这座神社里这么热闹。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '笑声里，白露靠在灶台边上，打了一个很长的哈欠。手里的饭团捏到一半，就停住了。' },
      { char: 'narrator', text: '雪丸把那半个饭团接过去，帮他捏完了。动作很轻，什么都没说。' },
      { char: 'narrator', text: '然后，他像是随口一问，看着锅里的米饭说：' },
      { char: 'yukimaru', text: '琥珀姐。那家伙……今天巡哪边？' },
      { char: 'kohaku', text: '银朗？下午去北坡和东边的林子。怎么，想去帮忙？' },
      { char: 'yukimaru', text: '才不是。我是想……知道他在哪边，我就去另一边玩。' },
      { char: 'narrator', text: '他笑着说。手却又按了一下领口。' },
      { char: 'narrator', text: '笑完了，琥珀擦了擦眼角，轻轻说了一句。' },
      { char: 'kohaku', text: '……千代在的时候，厨房里也是这么吵的。' },
      { char: 'kohaku', text: '下午，让银朗带你去看看结界吧。有些东西，你差不多该知道了。' },
      { char: 'kohaku', text: '在那之前——那个土豆，你自己送上去。' },
    ],
    next: 'day3_sou_eaves',
  },

  'day3_sou_eaves': {
    scene: 'sky', particles: 'feathers',
    lines: [
      { char: 'narrator', text: '你端着那个歪歪扭扭的饭团，踩着梯子爬上了东边的屋檐。' },
      { char: 'narrator', text: '刚把盘子放下，头顶就压下来一阵风。' },
      { char: 'narrator', text: '苍羽落在了你旁边的瓦片上。这一次，落得很稳。他像是松了一口气。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……这个是什么形状。' },
      { char: 'player', text: '饭团。' },
      { char: 'sou', text: '……嗯。饭团。' },
      { char: 'narrator', text: '他拿起来，看了一会儿。然后，就坐在你旁边，一口一口地吃了。' },
      { char: 'narrator', text: '你忽然意识到——五十年来，大概没有谁见过他吃东西的样子。' },
      { char: 'sou', text: '……太咸了。手上的盐水沾多了。' },
      { char: 'sou', text: '千代第一次捏的，也是这样。' },
      { char: 'narrator', text: '风从山下吹上来。你们坐在屋檐上，看着下面的前庭。琥珀在晒被子，尾巴一甩一甩的。' },
    ],
    choices: [
      { text: '「外婆最后一次醒着的时候，望着病房窗外的树，笑了一下。」', affection: { hawk: 3 }, flag: 'told_sou_window', next: 'day3_sou_eaves2' },
      { text: '「明天，也下来一起吃吧。」', affection: { hawk: 2 }, next: 'day3_sou_eaves2' },
    ],
  },

  'day3_sou_eaves2': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'player', text: '她说：「那孩子，又在外面淋雨了。」可是窗外什么都没有，只有一棵光秃秃的树。', if: 'told_sou_window' },
      { char: 'player', text: '我一直以为，她说的是银朗。', if: 'told_sou_window' },
      { char: 'narrator', text: '苍羽手里剩下的半个饭团，停在了半空中。', if: 'told_sou_window' },
      { char: 'narrator', text: '他没有说话。很久很久。风把他的头发吹得乱七八糟，他也没有去理。', if: 'told_sou_window' },
      { char: 'sou', text: '……那天，在下雨。', if: 'told_sou_window' },
      { char: 'narrator', text: '他只说了这一句。然后把剩下的饭团塞进嘴里，站起来，张开袖子。', if: 'told_sou_window' },
      { char: 'narrator', text: '一阵风。屋檐上只剩下你一个人，和一根掉在瓦片上的、还带着体温的羽毛。', if: 'told_sou_window' },
      { char: 'player', text: '（……那天，在下雨？）', if: 'told_sou_window' },
      { char: 'narrator', text: '苍羽转过头来看你。像是听到了一句很陌生的话。', ifnot: 'told_sou_window' },
      { char: 'sou', text: '……下去，会很吵。', ifnot: 'told_sou_window' },
      { char: 'player', text: '嗯。会很吵。', ifnot: 'told_sou_window' },
      { char: 'sou', text: '……我考虑一下。', ifnot: 'told_sou_window' },
      { char: 'narrator', text: '他把盘子推回给你。盘子是空的，连一粒米都没剩。然后他就飞走了。这一次，起飞的时候踩响了一片瓦。', ifnot: 'told_sou_window' },
    ],
    next: 'patrol',
  },

  'patrol': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗在鸟居下面等你。他的头发还有点潮，看起来像是昨晚淋了一夜的雨，到现在都没干透。' },
      { char: 'ginro', text: '琥珀让你跟着，你就跟着。别踩到结界的根。' },
      { char: 'ginro', text: '……阿嚏。' },
      { char: 'narrator', text: '你们两个都愣住了。' },
      { char: 'ginro', text: '……刚才那是风。' },
      { char: 'player', text: '狼会感冒吗？' },
      { char: 'ginro', text: '不会。' },
      { char: 'ginro', text: '……阿嚏。' },
      { char: 'narrator', text: '他面无表情地往前走了。耳朵尖却红透了。' },
      { char: 'narrator', text: '你想起昨晚那把伞，只挪回去遮住了他一只耳朵。', if: 'shared_umbrella' },
      { char: 'narrator', text: '银朗走在前面，步子很大，却一直没把你甩开。你后来才发现，他是故意放慢的。' },
      { char: 'narrator', text: '他每走一段就停下来，把手掌贴在某棵老树的树干上，闭上眼睛。' },
      { char: 'player', text: '你在听什么？' },
      { char: 'ginro', text: '结界。它不是一堵墙，是一张网。每一棵老树都是一个结。' },
      { char: 'ginro', text: '结是好的，树皮底下就是温的。像有心跳。' },
      { char: 'narrator', text: '走过一片杉树林的时候，他忽然停住了。没有回头。' },
      { char: 'ginro', text: '……出来。' },
      { char: 'narrator', text: '头顶的树枝哗啦一响。一团白色的东西掉了下来，在落叶堆里滚了两圈，弹起来。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '我、我在抓松鼠！' },
      { char: 'ginro', text: '从神社一路抓到这里。' },
      { char: 'yukimaru', text: '……这只松鼠跑得特别远！' },
      { char: 'narrator', text: '银朗看着他。冰蓝色的眼睛里，看不出在想什么。' },
      { char: 'ginro', text: '北坡今天不用你去。离那边远点。' },
      { char: 'yukimaru', text: '凭什么——' },
      { char: 'ginro', text: '那边的结，烂了。' },
      { char: 'narrator', text: '雪丸张着嘴，愣了一下。然后哼了一声，跳上树，几下就不见了。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '可你注意到，他消失的方向，正是北边。' },
      { char: 'ginro', text: '……那小子从来不听。跟他娘一样。' },
      { char: 'narrator', text: '他走到一棵巨大的榉树前——正是你昨晚看到的那一棵。', if: 'went_out' },
      { char: 'narrator', text: '他走到一棵巨大的榉树前，手掌贴上去——然后猛地缩了回来。', ifnot: 'went_out' },
      { char: 'narrator', text: '树皮上有一片黑色的斑。像是烧焦的痕迹，却在慢慢地、一点一点地往外渗。' },
      { char: 'ginro', text: '……比我想的还快。' },
      { char: 'player', text: '这是什么？' },
      { char: 'ginro', text: '结界在烂。' },
      { char: 'ginro', text: '每个满月，千代会在神社底下摇那枚铃。铃一响，结界就会重新长好。五十年，一次都没有断过。' },
      { char: 'ginro', text: '上个月，她没有来。' },
      { char: 'narrator', text: '他转过头，看了一眼你的口袋。然后又移开了视线，像是不想让那个念头说出口。' },
      { char: 'ginro', text: '……千代以前，她娘以前，再以前，还有好几个人。' },
      { char: 'ginro', text: '你们这一家，我守了很久了。比你想的久。' },
      { char: 'player', text: '多久？' },
      { char: 'narrator', text: '他没有回答。只是低头看着自己的手掌，像是那上面还留着什么很久以前的温度。' },
      { char: 'narrator', text: '他蹲下来，看着树根边一道长长的、被碾过的痕迹。' },
      { char: 'ginro', text: '……又是那条蛇。' },
      { char: 'ginro', text: '每一个烂掉的结旁边，都有他爬过的痕迹。' },
      { char: 'player', text: '你觉得……是玄夜弄的？' },
      { char: 'ginro', text: '我不知道。' },
      { char: 'ginro', text: '我只知道，六十年前，结界破的那天晚上，他也在。' },
      { char: 'narrator', text: '回去的路上，天色暗了下来。经过一段长满蕨草的缓坡时，银朗忽然停住了。' },
      { char: 'narrator', text: '他看着缓坡中间那块长满青苔的石头。看了很久。' },
      { char: 'ginro', text: '二十年前。就是这里。' },
    ],
    next: 'patrol_memory',
  },

  'patrol_memory': {
    scene: 'forest', particles: 'fireflies', flashback: true,
    lines: [
      { char: 'narrator', text: '——那块石头上，坐着一个很小的孩子。' },
      { char: 'narrator', text: '六岁。穿着黄色的雨靴。哭得打嗝，鼻涕流到了下巴上。' },
      { char: 'narrator', text: '一匹很大的银狼，从蕨草里慢慢走出来。它怕吓着孩子，走得很慢，很慢。' },
      { char: 'narrator', text: '孩子看到它，哭声停了一下。' },
      { char: 'narrator', text: '然后，扑了过去，一把抱住了它的脖子。' },
      { char: 'narrator', text: '「大狗狗……大狗狗……外婆不见了……」' },
      { char: 'narrator', text: '银狼僵在原地。六百年来，被人类这样抱住，这是第二次。' },
      { char: 'narrator', text: '第一次，是在很远的北方。一条很深的雪沟里。' },
      { char: 'narrator', text: '孩子的鼻涕全蹭在了它的毛上。它一动也不敢动。' },
    ],
    next: 'patrol_memory2',
  },

  'patrol_memory2': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'ginro', text: '我找到它的时候，它一把抱住我的脖子，鼻涕全蹭在我毛上。一路哭着喊「大狗狗」。' },
      { char: 'ginro', text: '我是狼。' },
      { char: 'narrator', text: '他说这句话的时候，表情很严肃。可是你分明看到——他的尾巴尖动了一下。' },
      { char: 'player', text: '……所以第一天，你说「是你」。', flag: 'a_voice' },
      { char: 'ginro', text: '狼不会忘记气味。' },
      { char: 'ginro', text: '二十年了。你长高了，声音变了。可是气味没变。' },
    ],
    choices: [
      { text: '「……那只大狗，真的是你。谢谢你那天找到我。」', affection: { wolf: 2 }, next: 'patrol_end' },
      { text: '「对不起，把鼻涕蹭在你身上。」', affection: { wolf: 3 }, next: 'patrol_end' },
    ],
  },

  'patrol_end': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗愣了一下。然后，他笑了。' },
      { char: 'narrator', text: '很短，很轻，几乎看不出来。可那确实是一个笑。' },
      { char: 'ginro', text: '……那天我在溪里洗了三遍。' },
      { char: 'ginro', text: '……阿嚏。' },
      { char: 'ginro', text: '走吧。天黑了。' },
      { char: 'narrator', text: '下坡的路，他走在你左边。走得很慢。你走快一点，他也快一点；你停下来看萤火虫，他也停下来，假装在看别的地方。' },
      { char: 'narrator', text: '你忽然想，二十年前，他大概也是这样，把一个哭个不停的孩子，一步一步送下山的。' },
      { char: 'narrator', text: '走到蕨草坡的尽头，银朗的耳朵动了一下。' },
      { char: 'ginro', text: '……出来。' },
      { char: 'narrator', text: '路边的灌木丛「哗啦」响了一声。一个翠绿色的脑袋探了出来，头发上沾着叶子，怀里捧着一朵花。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '我、我不是偷听！我是在这里等你们……等着等着，你们就开始讲大狗狗了……' },
      { char: 'narrator', text: '他头上的花，一下子变成粉色，一下子又变回白色，像是拿不定主意。' },
      { char: 'ginro', text: '……等了多久。' },
      { char: 'shiro', text: '……太阳还在那棵树上面的时候。' },
      { char: 'narrator', text: '银朗没有说话。他抬起头，闻了闻风。北边吹过来的风里，有一股很淡很淡的焦味。' },
      { char: 'ginro', text: '……那小子，还没回来。' },
      { char: 'narrator', text: '他看了看白露，又看了看你。' },
      { char: 'ginro', text: '天黑透之前，把人送回神社。' },
      { char: 'ginro', text: '少一个，我吃不下饭。' },
      { char: 'narrator', text: '说完，他转身走进了林子。往北边去了。' },
      { char: 'narrator', text: '白露一直看着他的背影消失在树后面，才慢慢走到你面前。',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'shiro', text: '那个……你小时候，外婆不见了，你就一直哭，对吗？' },
      { char: 'shiro', text: '我也是。……我也有一个，不见了的人。' },
      { char: 'narrator', text: '他低头看着怀里的花。是一朵白樱，花瓣边上有一点点发黄。' },
      { char: 'shiro', text: '以前，千代婆婆每个月都陪我去看她。这个月……我一个人去了好多次。' },
      { char: 'shiro', text: '我想带你去一个地方。……我想让你见见我娘。' },
    ],
    next: 'shiro_mother',
  },

  'shiro_mother': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露拉着你的手，钻过一条只有他知道的小路。眼前忽然开阔起来——' },
      { char: 'narrator', text: '一整片山谷，开满了花。粉的，白的，淡紫的，在最后一点暮光里一层一层地翻动。' },
      { char: 'shiro', text: '都是我种的哦！一棵一棵，用角上的灵力催出来的。种了六十年。' },
      { char: 'narrator', text: '可是走近了看，你发现山谷边缘的花，有好些是蔫的。花瓣卷着边，颜色发灰。' },
      { char: 'shiro', text: '……那边的，最近不太听话。我每天都跟它们说话，可它们还是没精神。' },
      { char: 'narrator', text: '山谷正中央，有一棵很大的白樱。樱树底下，花开得最密。' },
      { char: 'shiro', text: '……这里，是我娘睡觉的地方。' },
      { char: 'narrator', text: '他蹲下来，把手掌贴在樱树露出地面的树根上。' },
      { char: 'narrator', text: '那一瞬间，他角上的花，和樱树的花，一起亮了一下。很淡的、青白色的光。像是两颗心，同时跳了一下。' },
      { char: 'player', text: '……刚才那是？' },
      { char: 'shiro', text: '娘说，我们鹿的角，是跟这片森林长在一起的。森林高兴，角就开花。森林疼，角就疼。' },
      { char: 'shiro', text: '所以我不能走远。走远了，就……听不见它了。' },
      { char: 'narrator', text: '他摸了摸树根旁边一块平平的石头，把捧着的那朵花放在上面。' },
      { char: 'shiro', text: '娘，这是千代婆婆的外孙女。人很好。会做很丑的饭团。' },
      { char: 'narrator', text: '他说得很认真。你不知道该笑还是该哭。' },
      { char: 'shiro', text: '六十年前，结界破了一次。那时候还是千代婆婆的娘在摇铃，她生病了，没来得及。' },
      { char: 'shiro', text: '有东西从裂缝里钻进来。黑色的，很大。娘让我躲在树洞里，不许出声。' },
      { char: 'shiro', text: '我听到了好多声音。后来安静了。我偷偷往外看——' },
      { char: 'narrator', text: '他的手指抠进了泥土里。' },
      { char: 'shiro', text: '我看到一条好大的黑蛇，盘在我娘身上。一圈一圈，把她缠得紧紧的。' },
      { char: 'shiro', text: '天亮的时候，蛇走了。娘没有再醒过来。' },
      { char: 'player', text: '……那条蛇是……' },
      { char: 'shiro', text: '玄夜。', flag: 'q_mother' },
      { char: 'shiro', text: '琥珀姐说，也许不是那样的。可是那天晚上，我是亲眼看到的。' },
      { char: 'shiro', text: '所以……所以你要小心他。他会假装对你很好。千代婆婆就是被他骗了，每个月都去地下陪他下棋。' },
      { char: 'narrator', text: '风吹过来。白樱的花瓣落在他的头发上，落在那块石头上。' },
      { char: 'shiro', text: '……对不起，带你来这么难过的地方。' },
      { char: 'shiro', text: '可是我想让你认识我娘。千代婆婆每次来，都会在这里坐一会儿，跟她说说话。' },
      { char: 'narrator', text: '你在石头前面坐下。白露靠在你肩膀上，小声地，跟他娘说着你的事。' },
      { char: 'narrator', text: '可是你的脑子里，一直回响着第一夜的那句话。「……长这么大了啊。」' },
      { char: 'narrator', text: '那个声音，一点都不像坏人。' },
    ],
    choices: [
      { text: '「白露。我会小心的。」', affection: { deer: 2 }, next: 'day3_evening' },
      { text: '「……如果那天晚上的事，另有隐情呢？」', affection: { deer: 1, snake: 1 }, next: 'shiro_doubt' },
    ],
  },

  'shiro_doubt': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露抬起头，看着你。那双翠绿的眼睛里，第一次出现了害怕以外的东西。' },
      { char: 'shiro', text: '……千代婆婆也这么说过。' },
      { char: 'shiro', text: '她说「白露，有些事情，眼睛看到的只有一半」。' },
      { char: 'shiro', text: '可是另外一半在哪里呢？我找了六十年，都没有找到。' },
      { char: 'narrator', text: '他又低下头去，把脸埋在膝盖里。' },
      { char: 'shiro', text: '……恨他的话，就不用想另外一半了。那样比较不累。' },
    ],
    next: 'day3_evening',
  },

  'day3_evening': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你送白露回到花谷的入口，自己沿着石阶回神社。到的时候，天已经黑透了。' },
      { char: 'narrator', text: '琥珀坐在缘廊上，膝盖上放着收音机。九点的天气预报刚刚播完，沙沙地响。' },
      { char: 'narrator', text: '她的小本子上写着：「明日，阴。夜间风大。」' },
      { char: 'kohaku', text: '回来啦。白露带你去看他娘了吧？' },
      { char: 'player', text: '……你怎么知道？' },
      { char: 'kohaku', text: '你身上有白樱的味道。只有那棵树，是那种味道。' },
      { char: 'narrator', text: '她拍了拍身边的木板。你在她旁边坐下。' },
      { char: 'kohaku', text: '昨晚我说过，今天告诉你六十年前的事。', if: 'went_out' },
      { char: 'kohaku', text: '……白露已经告诉你了。比我说得好。', if: 'went_out' },
      { char: 'kohaku', text: '那他应该跟你说了六十年前的事。', ifnot: 'went_out' },
      { char: 'kohaku', text: '我只能再告诉你一点。我看到的那一半。' },
      { char: 'kohaku', text: '那天晚上我赶到花谷的时候，天快亮了。我只看到一条黑蛇，盘在母鹿身上。' },
      { char: 'kohaku', text: '我什么都没想。我朝他放了火。所有的尾巴，所有的火。' },
      { char: 'narrator', text: '她的手指在膝盖上收紧了。' },
      { char: 'kohaku', text: '他没有躲。也没有还手。' },
      { char: 'kohaku', text: '他就那样盘着，让火烧着他的背。一直到母鹿……不动了。他才松开，回了地下。' },
      { char: 'kohaku', text: '六十年了，这件事我一直想不通。' },
      { char: 'kohaku', text: '要是他是来害人的，为什么不还手？要是他不是……那他为什么一句话都不说？' },
      { char: 'narrator', text: '收音机的沙沙声里，琥珀的声音很轻。尾巴没有炸。也没有藏起来。只是垂着，一动不动。' },
      { char: 'kohaku', text: '……想不通的事，最后都变成了怕。怕久了，就以为是恨。' },
    ],
    choices: [
      { text: '「琥珀，你恨他吗？」', affection: { fox: 1, snake: 1 }, flag: 'asked_hate', next: 'day3_evening2' },
      { text: '什么也没说，把肩膀靠过去', affection: { fox: 2 }, next: 'day3_evening2' },
    ],
  },

  'day3_evening2': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀想了很久。', if: 'asked_hate' },
      { char: 'kohaku', text: '……我不知道。', if: 'asked_hate' },
      { char: 'kohaku', text: '我只知道，千代每个月从地下上来，都笑着说「今天又输了」。如果他是坏人……千代不会那样笑。', if: 'asked_hate' },
      { char: 'kohaku', text: '可是我不敢下去问。问了，我这六十年，就全错了。', if: 'asked_hate' },
      { char: 'narrator', text: '琥珀愣了一下。然后，把头轻轻靠在了你的肩膀上。', ifnot: 'asked_hate' },
      { char: 'narrator', text: '她的耳朵蹭着你的脸颊，痒痒的。很久，谁都没有说话。', ifnot: 'asked_hate' },
      { char: 'kohaku', text: '……千代也是这样的。', ifnot: 'asked_hate' },
      { char: 'narrator', text: '她站起来，在你房门口重新点了一盏狐火。这次，她对着火吹了三口气。火苗变得又高又亮。' },
      { char: 'kohaku', text: '三层。今晚，什么都吃不掉它。' },
      { char: 'kohaku', text: '……睡吧。明天的事，明天再说。' },
    ],
    next: 'night_bell',
  },

  'night_bell': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '那天深夜，你又被铃声吵醒了。' },
      { char: 'narrator', text: '叮。叮。叮。' },
      { char: 'narrator', text: '门口的狐火还亮着，三层，又高又亮。这一次，铃声不急。一声，停一停，再一声。' },
      { char: 'narrator', text: '像是有人在很远的地方，很有耐心地，敲着一扇门。' },
      { char: 'narrator', text: '你拿着铃走出房间。铃声停了——然后，从正殿的最里面，又响了一声。' },
      { char: 'narrator', text: '那扇贴着旧符的窄门，开了一条缝。' },
      { char: 'narrator', text: '门后，是一道往地底下延伸的石阶。石壁上爬满了发着微光的苔藓。' },
      { char: 'player', text: '（琥珀让我答应过，不要去那扇门后面。）' },
      { char: 'player', text: '（白露说，要小心他。）' },
      { char: 'player', text: '（琥珀说，他没有还手。）' },
      { char: 'player', text: '（外婆的速写本上写着——「他瘦了」。）' },
    ],
    choices: [
      { text: '回房间。明天问琥珀', next: 'night_bell_back' },
      { text: '握紧铃，走下石阶', affection: { snake: 2 }, flag: 'a_door', next: 'meet_genya' },
    ],
  },

  'night_bell_back': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '你转过身，往回走。' },
      { char: 'narrator', text: '走了三步，身后又传来一声铃响。很轻，很慢。' },
      { char: 'narrator', text: '然后，石阶底下传上来一阵咳嗽。咳得很厉害，像是要把什么东西咳出来。' },
      { char: 'narrator', text: '咳嗽停了。一个很低、很哑的声音，从地底下飘上来。' },
      { char: 'narrator', text: '「……千代也是这样。每次都说『明天问琥珀』。」' },
      { char: 'narrator', text: '「然后每次，都还是下来了。」' },
      { char: 'narrator', text: '你站在原地。手心里的铃，是烫的。' },
      { char: 'player', text: '（……那个人，在生病。）' },
    ],
    choices: [
      { text: '……走下石阶', affection: { snake: 2 }, flag: 'a_door', next: 'meet_genya' },
    ],
  },

  'meet_genya': {
    scene: 'cave', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '石阶很长。长到你开始数，数到两百多级，就数乱了。' },
      { char: 'narrator', text: '越往下越冷。你的呼吸变成了白气。石壁上的苔藓，一路亮着，像是在给你引路。' },
      { char: 'narrator', text: '尽头，是一个很大的洞窟。有水声，有很远的风。' },
      { char: 'narrator', text: '洞窟正中央，立着一块半人高的巨石，身上缠着粗粗的注连绳。石头表面，流淌着淡紫色的光。' },
      { char: 'narrator', text: '光很暗。一明，一暗。像是一颗很累很累的心脏。' },
      { char: 'narrator', text: '你盯着那光看。有一瞬间，光的深处好像闪过了什么——一双皱巴巴的手，握着一支铅笔，在纸上画着什么。' },
      { char: 'narrator', text: '再看的时候，只剩下光了。', flag: 'q_stone' },
      { char: 'narrator', text: '巨石旁边摆着一张旧棋盘。棋盘前，坐着一个黑发的男人。',
        chars: [{ id: 'genya', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '他的头发又长又直，一直垂到地上。皮肤苍白得像瓷，脖颈上隐约有细密的鳞纹。' },
      { char: 'narrator', text: '紫色的眼睛。瞳孔是一条细细的竖线。' },
      { char: 'narrator', text: '——就是门缝外面的那双眼睛。', flag: 'a_eyes' },
      { char: 'genya', text: '终于来了。' },
      { char: 'genya', text: '我还以为那枚铃要把我的耳朵摇聋了，你才肯醒。千代的外孙女，睡得比她还死。' },
      { char: 'genya', text: '……别盯着那块石头看。石头里的东西，不是给活人看的。' },
      { char: 'player', text: '……你是玄夜。' },
      { char: 'genya', text: '嗯。那只狐狸跟你说了什么？「森林最深处的蛇」？「不太好相处的家伙」？' },
      { char: 'genya', text: '还是那只小鹿，哭着告诉你我杀了他娘？' },
      { char: 'narrator', text: '他说得那么轻松，像是在讲别人的事。你握着铃的手，攥紧了。' },
      { char: 'player', text: '……是真的吗？' },
      { char: 'genya', text: '我缠住了她。天亮的时候，她死了。' },
      { char: 'genya', text: '这两件事，都是真的。' },
      { char: 'narrator', text: '他看着你，嘴角挂着一点笑。不解释，也不否认。' },
    ],
    choices: [
      { text: '「那你为什么要叫我下来？」', affection: { snake: 1 }, next: 'genya_talk' },
      { text: '「……『都是真的』，不代表就是全部。」', affection: { snake: 3 }, next: 'genya_talk' },
      { text: '往后退了一步', next: 'genya_talk' },
    ],
  },

  'genya_talk': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '玄夜看着你。那双紫色的眼睛眯了起来，像是觉得很有趣。' },
      { char: 'genya', text: '……你六岁那年，也站在这里。' },
      { char: 'genya', text: '一个人从石阶上爬下来，不哭也不闹。走到这张棋盘前面，抓起三颗白子，就往嘴里塞。' },
      { char: 'player', text: '……哈？' },
      { char: 'genya', text: '「这个不能吃。喂，吐出来。」——我说了三遍。你吐出来两颗。' },
      { char: 'genya', text: '第三颗，到现在都没找到。', flag: 'mem_genya' },
      { char: 'narrator', text: '他笑了。那一瞬间，他看起来一点都不危险。' },
      { char: 'genya', text: '对了。那只狐狸，现在还是一撒谎就炸尾巴吗？' },
      { char: 'player', text: '……炸得可厉害了。' },
      { char: 'genya', text: '呵。这么多年了，一点长进都没有。' },
      { char: 'narrator', text: '可是笑到一半，他咳嗽了起来。咳得很厉害，整个人都弓了下去。' },
      { char: 'narrator', text: '你这才发现——他靠着巨石的那只手，手背上的鳞片是灰色的，裂开了好几道口子。', if: 'went_out' },
      { char: 'narrator', text: '和昨晚看到的一样，只是更多了。', if: 'went_out' },
      { char: 'narrator', text: '你这才发现——他靠着巨石的那只手，手背上的鳞片是灰色的，裂开了好几道口子。像是被什么一点一点蛀空了。', ifnot: 'went_out' },
      { char: 'player', text: '你的手……' },
      { char: 'genya', text: '别管这个。' },
      { char: 'genya', text: '这块石头叫「要石」。整片森林的结界，都系在它身上。' },
      { char: 'genya', text: '千代没来的那个满月，它开始往外漏。漏出来的东西，就是你在树上看到的那种黑。' },
      { char: 'player', text: '那你在树下……是在做什么？', if: 'went_out' },
      { char: 'player', text: '我门外那道黑痕……是你？', ifnot: 'went_out' },
      { char: 'genya', text: '我说了。吃饭。', if: 'went_out' },
      { char: 'genya', text: '那些黑东西闻着铃的味道，爬到你门口了。我把它们吃了。就这样。', ifnot: 'went_out' },
      { char: 'genya', text: '吃得越多，我就越像它。' },
      { char: 'narrator', text: '你分不清他是在开玩笑，还是在说一件很可怕的事。' },
      { char: 'player', text: '守铃人……到底要做什么？琥珀不肯说。' },
      { char: 'genya', text: '满月那天夜里，站在这块石头前面，摇响那枚铃。' },
      { char: 'genya', text: '剩下的，让那只狐狸告诉你。——如果她敢的话。' },
      { char: 'narrator', text: '他低头看着棋盘。棋盘上摆着一局下到一半的棋，黑子被白子围得死死的。' },
      { char: 'genya', text: '这一局，是千代最后一次来的时候下的。她说下个月再接着下。' },
      { char: 'genya', text: '……她最后那两年，每个月下来，都会问我同一个问题。' },
      { char: 'genya', text: '「玄夜，那孩子小时候，是什么样子的？」' },
      { char: 'genya', text: '我告诉她。黄色的雨靴，哭起来打嗝，爱吃棋子。她听得很认真，笑得很开心。' },
      { char: 'genya', text: '下个月，她又来问。一模一样的问题。像是第一次听。' },
      { char: 'narrator', text: '你想起医院里那张照片。「这孩子，真可爱啊。是谁家的呀？」' },
      { char: 'player', text: '……她老了。医生说，老人家都会这样。' },
      { char: 'narrator', text: '玄夜看了你很久。紫色的竖瞳里，有什么东西动了一下，又沉下去了。' },
      { char: 'genya', text: '……嗯。老了。' },
      { char: 'narrator', text: '他从棋盒里拿出一颗黑子，放在你手心里。石子是凉的，被摸得很光滑。' },
      { char: 'genya', text: '拿着。害怕的时候握着它。' },
      { char: 'genya', text: '还有，一句忠告。' },
      { char: 'narrator', text: '他靠回巨石上，闭上了眼睛。一只手按在石头上。紫色的光，在他手掌下一明一暗。' },
      { char: 'genya', text: '满月之前，别相信任何一个说「没事」的人。' },
      { char: 'genya', text: '……包括我。' },
      { char: 'narrator', text: '你走上石阶的时候，回头看了一眼。' },
      { char: 'narrator', text: '棋盘边上，放着一个很旧的茶碗。碗里的茶，早就凉透了。碗沿上，有外婆常用的那种口红的颜色。' },
    ],
    next: 'day4_breakfast',
  },
  // =============== DAY 4 ===============
  'day4_breakfast': {
    scene: 'shrine', particles: 'sakura', day: 4,
    chapter: { num: '第四天', title: '一张桌子' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '第四天的早饭，缘廊上第一次这么热闹。' },
      { char: 'kohaku', text: '难得大家都在。今天多做了一锅。' },
      { char: 'narrator', text: '白露坐在你旁边，眼睛还有点红，但头上已经开了两朵小花。他一直在问你城里的事。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '所以海是咸的？整个都是咸的？那鱼不会渴吗？' },
      { char: 'kohaku', text: '白露，先把饭吃了。' },
      { char: 'narrator', text: '白露乖乖扒了两口饭，然后打了个很大的哈欠。头上那两朵小花，有一朵已经开始卷边了。' },
      { char: 'narrator', text: '屋檐上倒挂下来一个白色的脑袋。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '海嘛，我知道！北边的海会结冰，可以在上面跑——' },
      { char: 'ginro', text: '下来。吃饭不许倒挂。' },
      { char: 'narrator', text: '银朗坐在缘廊最边上，端着碗，头也没抬。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '哟，你管我？你又不是我舅舅——哦，你是。可你不承认嘛。' },
      { char: 'ginro', text: '……' },
      { char: 'narrator', text: '银朗把一碟煎鱼往雪丸的方向推了推，一个字也没说。雪丸愣了一下，别扭地翻身下来，坐到了离他两个位置远的地方。' },
      { char: 'yukimaru', text: '……吃完我去溪那边。不去北坡。' },
      { char: 'yukimaru', text: '有人不让去嘛。' },
      { char: 'narrator', text: '他说这句话的时候，谁都没看。' },
      { char: 'narrator', text: '啪嗒。一条还在蹦的溪鱼从天而降，正好落在饭桌中间。' },
      { char: 'narrator', text: '屋顶上，苍羽的衣角一闪而过。屋檐边，你昨天放的那个土豆一样的饭团，不见了。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '……他在回礼。五十年了，他回礼的方式一直是这样。' },
      { char: 'narrator', text: '银朗抬起眼睛，扫了一圈缘廊。嘴唇动了动，像是在数什么。' },
      { char: 'ginro', text: '……五个。屋顶上一个。' },
      { char: 'narrator', text: '他又低下头吃饭了。' },
      { char: 'player', text: '（……他在数什么？）' },
      { char: 'kohaku', text: '人头。每顿饭都数。少一个，他就吃不下。' },
      { char: 'kohaku', text: '千代以前说他像一只牧羊犬。他听了，三天没跟千代说话。' },
      { char: 'narrator', text: '鱼旁边，还多了一根蓝灰色的羽毛。不是掉下来的——是被端端正正地，放在了你的碗边。', if: 'told_sou_window' },
      { char: 'narrator', text: '你正要笑，银朗忽然放下了碗。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '他转过头，看着你。鼻翼动了动。' },
      { char: 'ginro', text: '……你身上，有蛇的味道。' },
      { char: 'narrator', text: '缘廊上一下子安静了。白露的筷子掉在了地上。' },
      { char: 'narrator', text: '琥珀的笑容，僵在了脸上。' },
    ],
    next: 'day4_confront',
  },

    lines: [
      { char: 'narrator', text: '琥珀把你拉进了外婆的房间，关上了拉门。' },
      { char: 'narrator', text: '她没有说话。只是看着你。尾巴垂在身后，一动不动。' },
      { char: 'kohaku', text: '你下去了。' },

      { char: 'kohaku', text: '……第一天，我求过你的。' },

  'day4_confront2': {

    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀愣住了。', if: 'told_kohaku_sick' },
      { char: 'kohaku', text: '……病了？他？', if: 'told_kohaku_sick' },

      { char: 'narrator', text: '琥珀看着你，叹了口气。尾巴轻轻扫过来，碰了碰你的手背。', ifnot: 'told_kohaku_sick' },
