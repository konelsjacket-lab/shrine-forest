        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '……要帮就帮。别在那里晃。' },
      { char: 'narrator', text: '雪丸手忙脚乱地接过绷带。缠得歪歪扭扭，银朗也没说什么。' },
      { char: 'ginro', text: '雪丸。' },
      { char: 'narrator', text: '雪丸的手停住了。' },
      { char: 'ginro', text: '……昨晚，你做得很好。' },
      { char: 'ginro', text: '你娘……会骄傲的。' },
      { char: 'narrator', text: '雪丸低着头，一声不吭，把绷带缠了一圈又一圈。缠到第五圈的时候，一滴水落在了银朗的手背上。' },
      { char: 'yukimaru', text: '……嗯。舅舅。' },
      { char: 'narrator', text: '银朗从衣襟里，摸出那块裂开的骨牌。放进雪丸的手心。' },
      { char: 'ginro', text: '……哪天你想回北边，拿着它回去。族长要押，就押我。' },
      { char: 'ginro', text: '不想回，就扔了。' },
      { char: 'narrator', text: '雪丸低头看着那块骨牌。然后站起来，走到鸟居底下，用手刨了一个坑。' },
      { char: 'narrator', text: '他把骨牌放进去，埋好，用脚踩实。踩了三遍。' },
      { char: 'yukimaru', text: '……扔了。' },
      { char: 'narrator', text: '银朗看着那一小块新翻的土。很久，他的尾巴，在身后轻轻摇了一下。' },
      { char: 'narrator', text: '缘廊那边，琥珀端着一碗热茶，走到了靠着柱子的玄夜面前。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '杜鹃花茶。……千代说，你从来不喝。' },
      { char: 'genya', text: '她每次都放一碗在洞口。' },
      { char: 'kohaku', text: '六十年，我一直在怀疑你。对不起。' },
      { char: 'genya', text: '……你们狐狸，道歉都这么直接的吗。' },
      { char: 'narrator', text: '可他还是接过了那碗茶。' },
      { char: 'narrator', text: '银朗从石阶那边走过来，停在玄夜面前。两个人谁都没看谁。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '……二十六天。' },
      { char: 'genya', text: '嗯。' },
      { char: 'ginro', text: '下次，叫我。' },
      { char: 'genya', text: '叫你？狼的鼻子太灵。凑近了，你会嫌我身上那股烂叶子味。' },
      { char: 'ginro', text: '……已经闻了六十年了。' },
      { char: 'narrator', text: '玄夜愣了一下。然后低头喝茶，没有再说话。银朗走开了。走了两步，耳朵往后转了转，像是在听他有没有在笑。' },
      { char: 'narrator', text: '一个小小的身影，从琥珀身后走了出来。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }], if: 'told_truth' },
      { char: 'narrator', text: '白露攥着衣角，站在玄夜面前。他的腿在发抖，但他没有躲。', if: 'told_truth' },
      { char: 'shiro', text: '……谢谢你。那天晚上，陪着我娘。', if: 'told_truth' },
      { char: 'narrator', text: '他从头上摘下一朵紫色的花，放在玄夜手心里，然后飞快地跑回了你身后。', if: 'told_truth' },
      { char: 'narrator', text: '玄夜低头看着那朵花，很久很久，一动不动。', if: 'told_truth' },
      { char: 'narrator', text: '白露远远地看着玄夜。没有躲，也没有靠近。只是看着。', ifnot: 'told_truth' },
      { char: 'narrator', text: '屋顶上掉下来一个饭团。然后，苍羽自己也落了下来，在缘廊的最边上，坐下了。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……今天，在这里吃。' },
      { char: 'narrator', text: '那是你第一次，看到他们六个人坐在同一张桌子边上。' },
    ],
    next: 'memory_return',
  },

  // =============== DAY 6 ===============
  'day6_stone': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀先上去了。她说，要去给大家煮粥。' },
      { char: 'narrator', text: '你正要跟上，玄夜叫住了你。' },
      { char: 'genya', text: '……还有一样东西。' },
      { char: 'genya', text: '那只狐狸把那一页拿出来了。那你应该也知道了。千代交出来的六百段，都在这块石头里。' },
      { char: 'genya', text: '我还不了她。她已经不在了。' },
      { char: 'genya', text: '可是有一段……我想，她大概是想让你看的。' },
      { char: 'narrator', text: '他牵起你的手，按在要石上。石头是温的。比你想的温。' },
      { char: 'narrator', text: '紫色的光，从你的指缝里漫了上来。' },
    ],
    next: 'day6_stone_mem',
  },

  'day6_stone_mem': {
    scene: 'town', particles: null, flashback: true,
    lines: [
      { char: 'narrator', text: '——是城里。三月。风还很冷。' },
      { char: 'narrator', text: '一所高中的校门口。很多穿着制服的孩子，抱着花，在拍照。' },
      { char: 'narrator', text: '校门对面的一棵树后面，站着一个很小很小的老太太。' },
      { char: 'narrator', text: '她穿着压箱底的那件和服，头发梳得一丝不乱。手里攥着一张火车票的票根。从山脚的小镇过来，要坐四个小时。' },
      { char: 'narrator', text: '她踮着脚，往人群里看。看了很久。' },
      { char: 'narrator', text: '然后，她看见了。' },
      { char: 'narrator', text: '一个十八岁的孩子，抱着毕业证书，一个人从校门里走出来。没有人来接。那孩子低着头，看着手机。' },
      { char: 'narrator', text: '老太太往前走了一步。又停住了。' },
      { char: 'narrator', text: '「……那孩子要过普通的日子。」她小声说。「不要被山上的事牵住。」' },
      { char: 'narrator', text: '她就那样站在树后面，看着那孩子走过斑马线，走进地铁站，走不见了。' },
      { char: 'narrator', text: '「长这么高了啊。」' },
      { char: 'narrator', text: '她笑着，用袖子擦了擦眼睛。然后转身，去赶回去的火车。' },
      { char: 'narrator', text: '那天晚上，她在火车上睡着了。梦里，那孩子转过头，朝她挥了挥手。' },
    ],
    next: 'day6_stone2',
  },

  'day6_stone2': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '光暗了下去。你的手还按在石头上。脸上全是泪。' },
      { char: 'player', text: '……那天，我以为没有人来。' },
      { char: 'genya', text: '她来了。' },
      { char: 'genya', text: '下一个满月，铃就把这一段拿走了。她交出来的时候，在石头前面站了很久。', flag: 'a_stone' },
      { char: 'genya', text: '她说：「玄夜，这一段你帮我收好。那孩子哪天上山了，给他看看。」' },
      { char: 'genya', text: '「告诉他，外婆去过的。」' },
      { char: 'narrator', text: '玄夜收回手，靠回石头上。他看起来很累。可是嘴角，是弯着的。' },
      { char: 'genya', text: '……我还不了她。可是你记住了。' },
      { char: 'genya', text: '那就，算还了。' },
    ],
    choices: [
      { text: '「谢谢你。替她守了这么久。」', affection: { snake: 3 }, next: 'day6_letters' },
      { text: '把额头抵在那块温热的石头上，很久很久', affection: { snake: 2 }, next: 'day6_letters' },
    ],
  },

  'day6_letters': {
    scene: 'sky', particles: 'feathers',
    lines: [
      { char: 'narrator', text: '你从地底上来的时候，太阳已经偏西了。' },
      { char: 'narrator', text: '前庭的石板上，排着七根羽毛。拼成一个箭头。指着屋顶。' },
      { char: 'narrator', text: '你顺着梯子爬上去。苍羽坐在屋脊上，受伤的翅膀缠着绷带。膝盖上，放着那包用油纸包着的东西。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……到时候了。' },
      { char: 'narrator', text: '他解开油纸。里面是一叠信封。很厚。每一个信封上，都写着同一个名字——你的名字。' },
      { char: 'narrator', text: '信封上没有贴邮票。每一封的角落，都写着一个数字。七。八。九。……一直到二十六。' },
      { char: 'sou', text: '你七岁那年开始。每年你生日前，她都写一封。写完了，交给我。' },
      { char: 'sou', text: '她说：「先放你那里。等那孩子自己上山了，再给他。」' },
      { char: 'sou', text: '「要是那孩子一辈子都不上山……那就一辈子放你那里。也挺好。」', flag: 'a_letters' },
      { char: 'narrator', text: '风吹过屋顶。最上面的几封信被掀开了，纸页一页一页地翻动。', cg: 'cg_sou_letters' },
      { char: 'narrator', text: '「七岁。小不点，生日快乐。城里的小学大吗？外婆今天上山，跟狐狸姐姐说你会写自己的名字了。」' },
      { char: 'narrator', text: '「十二岁。苍羽说你很好。外婆不太信。苍羽从来不会说谎，可是他说「很好」的时候，看着别的地方。」' },
      { char: 'narrator', text: '「十八岁。外婆去看你毕业了。你没看见外婆吧？没看见就好。你走路的样子，跟你妈妈一模一样。」' },
      { char: 'narrator', text: '「二十二岁。最近有点想不起你小时候的样子了。没关系。外婆记得你现在的声音。电话里，你说『我挺好的』。外婆知道你在逞强。」' },
      { char: 'narrator', text: '「二十六岁。」' },
      { char: 'narrator', text: '最后一封，只写了一半。字歪得厉害，像是写的时候，手已经握不太住笔了。' },
      { char: 'narrator', text: '「小不点。外婆想不起来你小时候的样子了。一点都想不起来了。」' },
      { char: 'narrator', text: '「可是外婆记得，外婆很喜欢你。这个，铃拿不走。」' },
      { char: 'narrator', text: '「等你上山的时候——」' },
      { char: 'narrator', text: '后面，就没有了。', cg: null },
      { char: 'sou', text: '……她写到这里，就住院了。' },
      { char: 'sou', text: '我本来想，等你上山的第一天就给你。可是我飞到你窗户外面，放下一根羽毛，就飞走了。' },
      { char: 'sou', text: '我怕你读完，就下山了。' },
    ],
    choices: [
      { text: '把信抱在怀里，靠在他没受伤的那边肩膀上', affection: { hawk: 3 }, next: 'day6_letters2' },
      { text: '「……谢谢你，替她拿了二十年。」', affection: { hawk: 2 }, next: 'day6_letters2' },
    ],
  },

  'day6_letters2': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽没有说话。他把没受伤的那边翅膀，轻轻地，盖在了你的背上。' },
      { char: 'narrator', text: '羽毛是暖的。风很大，可是一点都吹不进来。' },
      { char: 'sou', text: '……我在天上看了二十年。看你一个人吃便当，一个人走过斑马线，一个人在便利店门口吃晚饭。' },
      { char: 'sou', text: '每次都想落下去。每次都没有。' },
      { char: 'sou', text: '这一次……我落下来了。' },
    ],
    next: 'day6_talk',
  },

  'day6_talk': {
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '从屋顶下来以后，琥珀把你叫到了缘廊上。你怀里抱着那叠信，还没有放下。' },
      { char: 'kohaku', text: '明天，就是满月了。' },
      { char: 'kohaku', text: '昨晚那样的事，结界撑不住第二次了。明天夜里，要石需要那枚铃。需要守铃人，念出我们的名字。' },
      { char: 'kohaku', text: '可是，我要先跟你说清楚。' },
      { char: 'kohaku', text: '一旦念了，你就是新的守铃人。以后每一个满月，你都要回到这里。不管你在哪里，在做什么。' },
      { char: 'kohaku', text: '千代把五十年，都给了这座山。结婚那天是满月，她穿着白无垢跑上来摇完铃，又跑下去。' },
      { char: 'kohaku', text: '你母亲出生那晚，她在医院，托她娘替她上的山。' },
      { char: 'kohaku', text: '还有……那一行字。以己之一忆为薪。' },
      { char: 'kohaku', text: '前天晚上，你喊白露的时候。……你丢了什么？', if: 'paid_once' },
      { char: 'player', text: '……我不知道。想不起来。', if: 'paid_once' },
      { char: 'kohaku', text: '想不起来，就是铃拿走了。', if: 'paid_once' },
      { char: 'narrator', text: '她的耳朵贴在脑后。很久，她才接着说下去。', if: 'paid_once' },
      { char: 'kohaku', text: '每个满月，一段。最暖的那一段。你会一点一点地，变成千代那样。' },
      { char: 'narrator', text: '琥珀笑了一下。然后，很认真地看着你。' },
      { char: 'kohaku', text: '我们不能替你决定。千代也不能。' },
      { char: 'kohaku', text: '如果你不愿意，明天满月，结界打开，你就下山。……我说过的，不会怪你。' },
      { char: 'narrator', text: '你想起城里的房间。便利店的晚饭。手机屏幕的光。' },
      { char: 'narrator', text: '想起这六天。花茶，狼嚎，溪水，屋檐上的饭团，地底下的棋盘。' },
      { char: 'player', text: '（外婆。你说要我先认识他们每一个。）' },
      { char: 'player', text: '（我认识了。可是，我还想……再多认识一点。）' },
      { char: 'kohaku', text: '今天，是最后一个完整的白天了。去吧，去见想见的人。' },
    ],
    choices: [
      { text: '「那就……陪我去鸟居下面坐一会儿吧，琥珀。」', affection: { fox: 3 }, next: 'day6_kohaku' },
      { text: '去找银朗，走一遍满月那晚的山路', affection: { wolf: 3 }, next: 'day6_ginro' },
      { text: '白露说，他还有一样东西要给你', affection: { deer: 3 }, next: 'day6_shiro' },
      { text: '雪丸在树上等你，说有话要讲', affection: { whitewolf: 3 }, next: 'day6_yukimaru' },
      { text: '晚上，爬上屋顶，带一个梅子饭团', affection: { hawk: 3 }, next: 'day6_sou' },
      { text: '再下一次石阶，把那盘没下完的棋下完', affection: { snake: 3 }, next: 'day6_genya' },
    ],
  },

  'day6_kohaku': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '下午，你帮琥珀把危机那夜倒掉的石灯笼，一盏一盏扶起来。' },
      { char: 'narrator', text: '有的裂了。有的灯罩碎了一半。琥珀每扶起一盏，就摸摸它的头，叫一声它的名字。' },
      { char: 'kohaku', text: '歪脖子，你又歪了一点。……没关系，这样比较好认。' },
      { char: 'kohaku', text: '二十四号——', ifnot: 'named_lantern' },
      { char: 'kohaku', text: '……「千代」。你倒得最远。是想去追谁吗？', if: 'named_lantern' },
      { char: 'narrator', text: '扶到最后一盏的时候，太阳已经挨到山顶了。她拍了拍手上的灰，拉着你在石阶上坐下。' },
      { char: 'narrator', text: '黄昏。你和琥珀并排坐在鸟居下面的石阶上。', cg: 'cg_kohaku_torii' },
      { char: 'kohaku', text: '上个满月，我就是坐在这里等千代的。从太阳落山，等到太阳出来。' },
      { char: 'kohaku', text: '天亮的时候我跟自己说，下个月吧。下个月她就来了。' },
      { char: 'narrator', text: '她的尾巴绕过来，搭在你们俩中间的石阶上。尾尖轻轻地、一下一下地拍着。' },
      { char: 'kohaku', text: '……我有点怕。' },
      { char: 'player', text: '怕什么？' },
      { char: 'kohaku', text: '怕又开始等一个人类。' },
      { char: 'kohaku', text: '等你从小不点变成大人，从大人变成老人，然后有一天，又不来了。' },
      { char: 'kohaku', text: '千代走了以后，我跟自己说，再也不要了。狐狸的心，没有那么多地方可以放。' },
      { char: 'narrator', text: '她转过头来看你。夕阳把她的眼睛染成了真正的琥珀色。' },
      { char: 'kohaku', text: '所以，答应我一件事。' },
      { char: 'kohaku', text: '不要为了千代，也不要为了我们，去当什么守铃人。' },
      { char: 'kohaku', text: '如果你来——是因为你自己想来。' },
      { char: 'player', text: '……我想来。' },
      { char: 'player', text: '二十年前我就说过了。长大了，要来找你玩。' },
      { char: 'narrator', text: '琥珀愣住了。然后，她笑了。这一次，尾巴也在笑。' },
      { char: 'kohaku', text: '……那你帮我数一数。' },
      { char: 'narrator', text: '她转过身，背对着你。八条尾巴，在夕阳里慢慢展开。' },
      { char: 'kohaku', text: '我不照镜子。可是你的话……我信。' },
      { char: 'player', text: '一，二，三，四，五，六，七，八。' },
      { char: 'kohaku', text: '……嗯。八条。' },
      { char: 'kohaku', text: '明天以后，你再帮我数一次。' },
      { char: 'kohaku', text: '……真是的。你们这一家人，都这么会说话。' },
    ],
    choices: [
      { text: '伸手，轻轻摸了一下她的尾巴', affection: { fox: 3 }, flag: 'touched_tail', next: 'day6_kohaku2' },
      { text: '「明天以后，我帮你数一辈子。」', affection: { fox: 3 }, next: 'day6_kohaku2' },
    ],
  },

  'day6_kohaku2': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '尾巴在你手心底下抖了一下。很软，很暖，带着一点点阳光晒过的味道。', if: 'touched_tail' },
      { char: 'kohaku', text: '……！', if: 'touched_tail' },
      { char: 'kohaku', text: '狐、狐狸的尾巴，是不能随便摸的！千代当年也——', if: 'touched_tail' },
      { char: 'narrator', text: '她说不下去了。尾巴却没有缩回去。反而又往你手心里，蹭了一下。', if: 'touched_tail' },
      { char: 'narrator', text: '琥珀愣了很久。然后，她把脸转开了。', ifnot: 'touched_tail' },
      { char: 'kohaku', text: '……一辈子。你们人类的一辈子，很短的。', ifnot: 'touched_tail' },
      { char: 'kohaku', text: '可是，好像也够了。', ifnot: 'touched_tail' },
      { char: 'narrator', text: '太阳落下去了一半。她抱着膝盖，看着山下。' },
      { char: 'kohaku', text: '……我活了一千零七年。' },
      { char: 'player', text: '诶？' },
      { char: 'kohaku', text: '女孩子的秘密。今天，告诉你。' },
      { char: 'kohaku', text: '一千年里，我送走过很多人。有的记得我，有的不记得。有的走的时候在哭，有的在笑。' },
      { char: 'kohaku', text: '可是第一次有人叫我「姐姐」，是千代。八岁的千代。坐在这里，哭得满脸都是鼻涕。' },
      { char: 'kohaku', text: '我给了她一颗糖。她不哭了，抬头说：「姐姐，你有耳朵。」' },
      { char: 'kohaku', text: '……后来，她叫了我三十年姐姐。然后，就变成了我叫她「千代」。最后那几年，她摸着我的头叫我「小琥珀」。' },
      { char: 'narrator', text: '她笑着说的。眼睛却一点一点地红了。' },
      { char: 'kohaku', text: '你呢？你要叫我什么？' },
      { char: 'player', text: '……琥珀。' },
      { char: 'narrator', text: '她转过头来看你。很久。然后，把头靠在了你的肩膀上。' },
      { char: 'kohaku', text: '嗯。就这个。' },
      { char: 'kohaku', text: '以后，不管你变成大人，还是变成老人——都这样叫我。' },
    ],
    next: 'day7_morning',
  },

  'day6_ginro': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗在鸟居下面等你。他的手臂还缠着绷带，是危机那夜留下的。' },
      { char: 'narrator', text: '你走过去的时候，他把一样东西塞进了你手里。是一根削好的竹杖。' },
      { char: 'ginro', text: '……下山的路，比上山难走。' },
      { char: 'player', text: '你削的？' },
      { char: 'ginro', text: '……雪丸削的。我只是磨了一下。' },
      { char: 'narrator', text: '竹杖的握柄上，刻着一个歪歪扭扭的狼头。你忍不住笑了。银朗的耳朵动了一下，假装没看见。' },
      { char: 'ginro', text: '满月那晚，结界从鸟居往下开。走这条路。' },
      { char: 'narrator', text: '他带着你，从鸟居一直走到山脚。走得很慢，每一个转弯，每一块会松动的石头，都指给你看。' },
      { char: 'ginro', text: '这块会滑。下雨天踩左边。' },
      { char: 'ginro', text: '这里有蛇。不是那条，是普通的。' },
      { char: 'narrator', text: '走到那棵裂开的老杉树下，他停住了。山脚下的小镇，灯一盏一盏亮起来。' },
      { char: 'ginro', text: '……千代每次都是在这里跟我说「下个月见」。' },
      { char: 'ginro', text: '五十年。六百次。' },
      { char: 'narrator', text: '他看着山下，不看你。' },
      { char: 'ginro', text: '如果你来。' },
      { char: 'ginro', text: '……每个满月，我在这里等你。' },
      { char: 'ginro', text: '你右耳不是不好吗——不对，那是千代。你……你想走哪边都行。' },
      { char: 'narrator', text: '你第一次看到他乱了阵脚。耳朵红到了根。' },
      { char: 'player', text: '那我走你左边。' },
      { char: 'ginro', text: '……嗯。' },
      { char: 'ginro', text: '狼不会忘记气味。二十年前没忘，以后也不会。' },
      { char: 'narrator', text: '他从老杉树的树根边，拿起一把新的油纸伞。深蓝色的。' },
      { char: 'ginro', text: '……下山那天，带上。' },
      { char: 'player', text: '我已经有两把了。你给的。' },
      { char: 'ginro', text: '……那就三把。' },
      { char: 'narrator', text: '他说得很认真。你笑出了声。他的耳朵，又红了。' },
    ],
    choices: [
      { text: '「那你也要撑伞。下雨天，伞底下有两个人的位置。」', affection: { wolf: 3 }, flag: 'wolf_promise', next: 'day6_ginro2' },
      { text: '「……为什么？为什么对我们家这么好？」', affection: { wolf: 3 }, next: 'day6_ginro2' },
    ],
  },

  'day6_ginro2': {
    scene: 'forest', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗没有回答。他低头看着手里那把伞，看了很久。', if: 'wolf_promise' },
      { char: 'ginro', text: '……千代也说过一模一样的话。五十年前，第一次。', if: 'wolf_promise' },
      { char: 'ginro', text: '我没有听。', if: 'wolf_promise' },
      { char: 'narrator', text: '银朗看着山下。小镇的灯，又亮了几盏。', ifnot: 'wolf_promise' },
      { char: 'ginro', text: '……六百年前。北边。那条雪沟。' },
      { char: 'ginro', text: '我说过，我把一个人类的孩子叼了出来。送到了山下的村子口。' },
      { char: 'ginro', text: '那孩子在雪沟里抱着我的脖子，哭了一整夜。鼻涕全蹭在我的毛上。' },
      { char: 'narrator', text: '你想起了二十年前，蕨草坡上的那块石头。' },
      { char: 'ginro', text: '后来我被赶出来，一路往南走。走了三个月，倒在这片森林外面。琥珀捡到了我。' },
      { char: 'ginro', text: '过了很多很多年。一百多年前，有一个人类的女人上山来，跟琥珀立了约，当了第一个守铃人。' },
      { char: 'ginro', text: '她身上，有那个孩子的味道。隔了五百年，淡得几乎闻不出来了。可是我认得。' },
      { char: 'narrator', text: '风停了。萤火虫一点一点地亮起来。' },
      { char: 'ginro', text: '狼不会忘记气味。' },
      { char: 'ginro', text: '那个雪沟里的孩子……是你们这一家的祖先。' },
      { char: 'ginro', text: '从那天起，我就守着这一家。她的女儿。女儿的女儿。千代。' },
      { char: 'ginro', text: '……还有你。' },
      { char: 'narrator', text: '他终于转过头来，看着你。冰蓝色的眼睛里，有一种很旧很旧的、六百年都没有变过的东西。' },
      { char: 'ginro', text: '我不是对你们家好。' },
      { char: 'ginro', text: '我只是……一直在等那个孩子，再抱一次我的脖子。' },
      { char: 'ginro', text: '二十年前，你抱了。' },
    ],
    next: 'day7_morning',
  },

  'day6_shiro': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露在缘廊底下等你。手里捧着一顶旧草帽，脚尖踮来踮去。' },
      { char: 'shiro', text: '你看！这是千代婆婆的！在她房间的柜子顶上找到的！' },
      { char: 'shiro', text: '琥珀姐说，要下山的话，得先学会把角藏起来。我要练！你帮我看着！' },
      { char: 'narrator', text: '他把草帽往头上一扣。帽子底下，「啵」「啵」「啵」，三朵小花从帽檐的缝里钻了出来。' },
      { char: 'shiro', text: '……不算不算！再来！' },
      { char: 'narrator', text: '练了一下午。草帽被花顶起来十一次。最后一次，他气得在草地上打滚，头上开了一圈红花。' },
      { char: 'narrator', text: '傍晚，他拉着你去了花谷。' },
      { char: 'narrator', text: '花谷的白樱被烧焦了一半。可是焦黑的树枝上，已经冒出了新芽。' },
      { char: 'shiro', text: '我昨天晚上，一整夜都在跟它说话。它说它还想开花。' },
      { char: 'narrator', text: '白露蹲在树下，双手合拢，像是捧着什么东西。' },
      { char: 'shiro', text: '给你。' },
      { char: 'narrator', text: '他张开手心。里面是一朵很小的花。花瓣是蓝色的，边缘有一圈淡淡的光。' },
      { char: 'shiro', text: '这是我角上开的，第一朵蓝色的花。' },
      { char: 'shiro', text: '千代婆婆的饼干盒子里，有五十多朵花。粉的、白的。一朵蓝的都没有。' },
      { char: 'shiro', text: '因为蓝色……是想念的颜色。以前，我没有想念过谁。' },
      { char: 'narrator', text: '他把花放进你手心，用两只手，把你的手合上。' },
      { char: 'shiro', text: '这朵花不会谢的。只要我还想着你，它就一直开着。' },
      { char: 'shiro', text: '所以——它会一直开着的！' },
      { char: 'shiro', text: '然后等你带我去看海的那天，你就把它扔进海里。我想知道，它在咸咸的水里，还会不会开。' },
      { char: 'narrator', text: '他笑着说。眼睛亮晶晶的。' },
      { char: 'shiro', text: '还有哦！琥珀姐说，结界要是好了，我就不用一直守在花谷里了。' },
      { char: 'shiro', text: '离开几天，也不会痒了。' },
      { char: 'shiro', text: '……那我就能，跟你去看海了吧？' },
    ],
    choices: [
      { text: '把那顶草帽重新扣在他头上：「再练一次。我陪你。」', affection: { deer: 3 }, flag: 'shiro_hat', next: 'day6_shiro2' },
      { text: '「海很远。可是我们可以先去看看山下的小溪通到哪里。」', affection: { deer: 3 }, next: 'day6_shiro2' },
    ],
  },

  'day6_shiro2': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露深吸一口气，闭上眼睛。小脸憋得通红。', if: 'shiro_hat' },
      { char: 'narrator', text: '一秒。两秒。三秒。……草帽，没有动。', if: 'shiro_hat' },
      { char: 'shiro', text: '……成、成功了？我成功了？！', if: 'shiro_hat' },
      { char: 'narrator', text: '他一高兴——「啵」。一朵蓝色的花，把帽子顶飞了。', if: 'shiro_hat' },
      { char: 'shiro', text: '啊啊啊——！', if: 'shiro_hat' },
      { char: 'narrator', text: '你们沿着花谷的溪水往下走。溪水穿过林子，穿过石缝，越流越宽。', ifnot: 'shiro_hat' },
      { char: 'shiro', text: '它会一直流到海里吗？', ifnot: 'shiro_hat' },
      { char: 'player', text: '会的。所有的溪，最后都会流到海里。', ifnot: 'shiro_hat' },
      { char: 'shiro', text: '……那千代婆婆的饼干盒子里的花，也是从这里流出去的吗？', ifnot: 'shiro_hat' },
      { char: 'narrator', text: '你们在白樱树下坐下来。他靠着你，看着那块平平的石头。' },
      { char: 'shiro', text: '娘，明天是满月。' },
      { char: 'shiro', text: '这次，我不躲在树洞里了。我会站在要石旁边，跟大家一起。' },
      { char: 'shiro', text: '……那天晚上我快消失的时候，好安静。什么都听不见。' },
      { char: 'shiro', text: '然后，我听见有人在喊我的名字。喊得好大声。好吵。' },
      { char: 'narrator', text: '他抬起头看你。翠绿的眼睛里，映着白樱的花。' },
      { char: 'shiro', text: '原来，被人叫名字，是这种感觉啊。' },
      { char: 'shiro', text: '像是有人在黑漆漆的地方，拉住了你的手。' },
      { char: 'shiro', text: '……娘那天晚上，也一直在叫我的名字。我在树洞里，听了一整夜。' },
      { char: 'shiro', text: '她是不是，也想拉住我的手？' },
      { char: 'narrator', text: '你没有回答。你只是握住了他的手。他的手很小，很暖。' },
      { char: 'narrator', text: '白樱的枝头上，一朵新的花，开了。' },
    ],
    next: 'day7_morning',
  },

  'day6_yukimaru': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸肩膀上的伤还没好全，缠着厚厚的绷带。可他一见到你，就从树上跳了下来。' },
      { char: 'yukimaru', text: '来得正好！比赛！' },
      { char: 'player', text: '……比什么？' },
      { char: 'yukimaru', text: '两百米！你说的，你一天能跑两百米！我让你一条腿！' },
      { char: 'narrator', text: '你跑了。他单脚跳着追你，还是赢了。赢了以后在草地上笑得打滚，扯到了伤口，「嗷」地叫了一声，又接着笑。' },
      { char: 'yukimaru', text: '你是我见过最慢的生物！比冬眠的熊还慢！' },
      { char: 'narrator', text: '笑够了，他拉着你，爬上了那棵最高的树。' },
      { char: 'narrator', text: '还是那棵最高的树。雪丸坐在树枝上，这次没有看北边。' },
      { char: 'yukimaru', text: '喂。我决定了。' },
      { char: 'yukimaru', text: '我不回北边了。' },
      { char: 'yukimaru', text: '舅舅说，北坡以后归我巡。他说「你跑得快，适合那边」。' },
      { char: 'narrator', text: '他说「舅舅」的时候，声音有点抖。然后自己先笑了起来。' },
      { char: 'yukimaru', text: '哈哈……叫出来了。叫出来以后，好像也没那么难。' },
      { char: 'yukimaru', text: '你是第一个听我练习的人。你知道吗，这件事，我连白露都没说。' },
      { char: 'narrator', text: '风吹过树顶。他那只缺了口的耳朵，竖得高高的。' },
      { char: 'yukimaru', text: '所以啊，你也要回来。' },
      { char: 'yukimaru', text: '每个满月，我在北坡的最高处等你。我会让你看到——杜鹃森最快的守卫，是什么样子。' },
      { char: 'yukimaru', text: '……还有。' },
      { char: 'yukimaru', text: '我以前到处跑，每离开一个地方，都不会回头。' },
      { char: 'yukimaru', text: '可是你下山那天，我可能会一直看着。一直看到你拐过那棵老杉树为止。' },
      { char: 'yukimaru', text: '你不许笑啊！' },
      { char: 'narrator', text: '你没有笑。你只是想起了那天在树顶上，他问你的话。' },
      { char: 'player', text: '雪丸。你做的那件「很坏很坏的事」……' },
      { char: 'yukimaru', text: '……没做成。' },
      { char: 'yukimaru', text: '半年，一次都没做成。我是全北方最没用的押送狼。' },
      { char: 'player', text: '嗯。最没用的。' },
      { char: 'player', text: '所以——雪丸。' },
      { char: 'narrator', text: '他愣了一下。然后，把脸埋进了膝盖里。尾巴把树枝上的雪，全拍了下去。' },
    ],
    choices: [
      { text: '「全北方最没用的押送狼，可是杜鹃森最快的守卫。」', affection: { whitewolf: 3 }, flag: 'yuki_guard', next: 'day6_yukimaru2' },
      { text: '「走。去找你舅舅。让他教你巡北坡。」', affection: { whitewolf: 2, wolf: 1 }, next: 'day6_yukimaru2' },
    ],
  },

  'day6_yukimaru2': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '他从膝盖里抬起头。眼睛红红的。', if: 'yuki_guard' },
      { char: 'yukimaru', text: '……你再说一遍。', if: 'yuki_guard' },
      { char: 'player', text: '杜鹃森，最快的守卫。', if: 'yuki_guard' },
      { char: 'yukimaru', text: '……嘿嘿。', if: 'yuki_guard' },
      { char: 'yukimaru', text: '那、那我们去找舅舅吧！最快的守卫，得有人教巡逻路线！', if: 'yuki_guard' },
      { char: 'yukimaru', text: '……他会教吗？', ifnot: 'yuki_guard' },
      { char: 'player', text: '你去问了才知道。', ifnot: 'yuki_guard' },
      { char: 'narrator', text: '银朗在北坡的林子边上。手掌贴在一棵老树上，闭着眼睛。' },
      { char: 'narrator', text: '雪丸在离他三步远的地方停住了。脚趾在地上蹭来蹭去。' },
      { char: 'yukimaru', text: '……喂。舅舅。' },
      { char: 'narrator', text: '银朗睁开了眼睛。' },
      { char: 'yukimaru', text: '北坡……你说归我巡。那你得教我。哪棵树是结，哪块石头会滑，哪边有蛇——普通的那种。' },
      { char: 'narrator', text: '银朗看着他。看了很久。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '……跟紧。' },
      { char: 'yukimaru', text: '走你左边？' },
      { char: 'ginro', text: '左边有人了。' },
      { char: 'narrator', text: '他看了你一眼。' },
      { char: 'ginro', text: '……雪丸，右边。' },
      { char: 'narrator', text: '雪丸愣了半秒。然后咧开嘴笑了，一步跨到了银朗的右边。尾巴摇得像要飞起来。' },
      { char: 'narrator', text: '你们三个人，在北坡的林子里，一直走到月亮升起来。银朗一棵树一棵树地教。雪丸一棵树一棵树地记。记错了，就被敲一下脑袋。' },
      { char: 'narrator', text: '他被敲了十七下。每一下，都在笑。' },
    ],
    next: 'day7_morning',
  },

  'day6_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽今天一整天都在地上。' },
      { char: 'narrator', text: '翅膀受了伤，飞不起来。他走路的样子很奇怪——每一步都像是在试探地面结不结实。' },
      { char: 'narrator', text: '白露拉着他去花谷，他被树根绊倒了两次。雪丸要跟他赛跑，他站在原地，看着雪丸跑远，一动不动。' },
      { char: 'sou', text: '……地上，好多东西。' },
      { char: 'sou', text: '从天上看，这些全都是平的。' },
      { char: 'narrator', text: '傍晚的时候，他一个人坐在缘廊的最边上，看着天。你经过的时候，他抬头看了你一眼，又低下了头。' },
      { char: 'narrator', text: '夜里，你抱着一个梅子饭团，顺着梯子爬上了屋顶。' },
      { char: 'narrator', text: '苍羽坐在屋脊上。受伤的肩膀缠着绷带。看到你，他往旁边让了让。' },
      { char: 'narrator', text: '你们并排坐着，分着吃了那个饭团。' },
      { char: 'sou', text: '……今天，我没有飞。' },
      { char: 'sou', text: '一整天，都在地上。跟他们一起吃饭。被白露拉去看樱树。被雪丸追着要比赛。' },
      { char: 'sou', text: '很吵。' },
      { char: 'player', text: '讨厌吗？' },
      { char: 'sou', text: '……不讨厌。' },
      { char: 'narrator', text: '他抬起头。天上的月亮，差一点点就圆了。' },
      { char: 'sou', text: '你下山以后，我会去城里看你。' },
      { char: 'sou', text: '不是像看千代那样。我不会只停在窗外的树上。' },
      { char: 'sou', text: '我会……敲窗户。' },
      { char: 'narrator', text: '他说得很认真。认真到你忍不住笑了出来。' },
      { char: 'sou', text: '……有什么好笑的。' },
      { char: 'sou', text: '以后起风的时候，看一眼天上。那是我在看你。' },
      { char: 'sou', text: '满月那天，你上山的时候——我会第一个看见你。' },
      { char: 'narrator', text: '你下梯子的时候，他也跟着落了下来。' },
      { char: 'narrator', text: '落得很稳。稳稳当当，一片瓦都没有响。' },
      { char: 'sou', text: '……练过了。' },
    ],
    choices: [
      { text: '「翅膀好了以后，再带我飞一次吧。」', affection: { hawk: 3 }, flag: 'sou_fly', next: 'day6_sou2' },
      { text: '「今天在地上，被大家吵了一整天……是什么感觉？」', affection: { hawk: 3 }, next: 'day6_sou2' },
    ],
  },

  'day6_sou2': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'sou', text: '……现在就可以。', if: 'sou_fly' },
      { char: 'player', text: '可是你的翅膀——', if: 'sou_fly' },
      { char: 'sou', text: '飞得慢一点就好。……我想让你看一样东西。', if: 'sou_fly' },
      { char: 'narrator', text: '他化成了蓝鹰。翅膀上还缠着绷带，起飞的时候晃了一下。可是他飞起来了。', if: 'sou_fly' },
      { char: 'narrator', text: '整片杜鹃森在月光下展开。北坡烧焦了一大片，可是焦土上，已经冒出了一层浅浅的绿。', if: 'sou_fly' },
      { char: 'sou', text: '……三片。今天，只剩三片了。', if: 'sou_fly' },
      { char: 'sou', text: '明天以后，就一片都没有了。', if: 'sou_fly' },
      { char: 'narrator', text: '苍羽看着月亮，想了很久。', ifnot: 'sou_fly' },
      { char: 'sou', text: '……像是从很高的地方，掉进了一锅热汤里。', ifnot: 'sou_fly' },
      { char: 'sou', text: '烫。可是不想爬出来。', ifnot: 'sou_fly' },
      { char: 'sou', text: '五十年，我每天都在数。数黑斑，数云，数千代上山的次数。', cg: null },
      { char: 'sou', text: '六百次。我数到了六百次。' },
      { char: 'sou', text: '然后，就没有了。' },
      { char: 'narrator', text: '风吹过来。他的长发，落在你的肩膀上。' },
      { char: 'sou', text: '……我想，以后数别的。' },
      { char: 'sou', text: '数你上山的次数。' },
      { char: 'sou', text: '一次，两次，三次。……数到我数不动为止。' },
    ],
    next: 'day7_morning',
  },

  'day6_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你走下石阶的时候，听见底下有人在咳嗽。' },
      { char: 'narrator', text: '还有另一个声音。很小，很轻。是在哼歌——是琥珀那首很老很老的歌。' },
      { char: 'narrator', text: '你走到洞口，看见琥珀蹲在棋盘边上，往一个碗里倒热水。看到你，她「噌」地站起来，耳朵都竖直了。' },
      { char: 'kohaku', text: '我、我只是来送茶的！马上就走！' },
      { char: 'narrator', text: '她从你身边跑过去，跑上了石阶。尾巴擦过你的手背——没有炸。' },
      { char: 'narrator', text: '要石的光比前几天弱了很多。琥珀在洞口留了一碗花茶，已经凉了。' },
      { char: 'narrator', text: '玄夜靠在石头旁边，手边摆着那盘下到一半的棋。' },
      { char: 'genya', text: '来了？坐。轮到你了。' },
      { char: 'narrator', text: '你们安静地下着棋。黑子，白子。石壁上的苔藓，一明一暗。' },
      { char: 'genya', text: '白露那孩子，今天给我送了一朵花。', if: 'told_truth' },
      { char: 'genya', text: '我把它放在棋盘边上了。你看，还开着。', if: 'told_truth' },
      { char: 'player', text: '玄夜，你怕吗？明天。' },
      { char: 'genya', text: '怕什么？怕死？' },
      { char: 'genya', text: '……蛇活得太久了。死没什么好怕的。' },
      { char: 'narrator', text: '他落下一枚黑子。' },
      { char: 'genya', text: '我怕的是被忘掉。' },
      { char: 'genya', text: '千代记得我。每个满月，她念到我的名字的时候，都会停一下，笑一下。好像在说「又输给你了」。' },
      { char: 'genya', text: '她走了以后，我躺在这块石头旁边，一遍一遍地想——这世上，还有谁会停下来，念我的名字。' },
      { char: 'narrator', text: '他抬起头，看着你。紫色的眼睛，在昏暗里亮着。' },
      { char: 'genya', text: '……你呢？' },
      { char: 'player', text: '玄夜。' },
      { char: 'narrator', text: '你念了他的名字。没有铃，没有满月。只是念了一声。' },
      { char: 'narrator', text: '他怔住了。然后，很慢很慢地，笑了。不是那种危险的、看不透的笑。' },
      { char: 'genya', text: '……这盘，算你赢。' },
      { char: 'narrator', text: '你从口袋里掏出一样东西，放在棋盘上。' },
      { char: 'narrator', text: '是一颗白色的棋子。被摸得很光滑。' },
      { char: 'player', text: '外婆房间里，老花镜的盒子里。……它用纸包着。纸上写着一行字。' },
      { char: 'player', text: '「小不点吐出来的第三颗。」' },
      { char: 'narrator', text: '玄夜盯着那颗棋子。很久，很久。' },
      { char: 'genya', text: '……二十年。我把整个洞窟都翻遍了。' },
      { char: 'genya', text: '原来，被她偷走了。' },
      { char: 'narrator', text: '他笑了。笑得肩膀都在抖。笑着笑着，他抬起手，挡住了眼睛。' },
    ],
    choices: [
      { text: '「明天以后，你也上来看看月亮吧。」', affection: { snake: 3 }, flag: 'genya_moon', next: 'day6_genya2' },
      { text: '「我会念你的名字。每个满月，第一个念。」', affection: { snake: 3 }, next: 'day6_genya2' },
    ],
  },

  'day6_genya2': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'genya', text: '……月亮。', if: 'genya_moon' },
      { char: 'genya', text: '我上不去的。至少，不能待太久。', if: 'genya_moon' },
      { char: 'player', text: '为什么？', if: 'genya_moon' },
      { char: 'genya', text: '……第一个？', ifnot: 'genya_moon' },
      { char: 'genya', text: '不行。第一个，得是那只狐狸。不然她会哭着烧了我的棋盘。', ifnot: 'genya_moon' },
      { char: 'genya', text: '……第二个吧。第二个，就够了。', ifnot: 'genya_moon' },
      { char: 'narrator', text: '他把手掌贴在要石上。紫色的光，在他的指缝间一明一暗。' },
      { char: 'genya', text: '七百年前，这片森林还没有结界。灵界那边的浊气，一年一年地漫过来。' },
      { char: 'genya', text: '我那时候还很年轻。蜕了一层皮。很大，很结实的一层。' },
      { char: 'genya', text: '我把它盘成一圈，压在这块石头上。注连绳底下那层发灰的东西——就是它。' },
      { char: 'narrator', text: '你看着那块石头。注连绳底下，确实有一层薄薄的、像鳞片一样的东西，裹着石头。' },
      { char: 'genya', text: '从那天起，我和它就长在一起了。它疼，我就疼。它饿，我就饿。' },
      { char: 'genya', text: '离开它太久……它会松。我也会。' },
      { char: 'genya', text: '所以守铃人交出来的记忆，都存在它身上——也就是，存在我身上。' },
      { char: 'genya', text: '六百个满月，千代的六百段。还有她娘的，她外婆的。一百多年。' },
      { char: 'narrator', text: '他笑了一下。' },
      { char: 'genya', text: '我是这座山上，记得千代最多的人。比她自己记得还多。' },
      { char: 'genya', text: '……所以，她走了以后，我才那么怕被忘掉。' },
      { char: 'genya', text: '我怕没有人记得我，那些记忆就一起散了。' },
      { char: 'narrator', text: '你伸出手，覆在他按着要石的那只手上。冰凉的。' },
      { char: 'player', text: '我记得。' },
      { char: 'narrator', text: '他低头看着你的手。很久，很久。' },
      { char: 'genya', text: '……嗯。' },
    ],
    next: 'day7_morning',
  },

  // =============== DAY 7 ===============
  'day7_morning': {
    scene: 'shrine', particles: 'sakura', day: 7,
    chapter: { num: '终章', title: '满月' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '第七天。满月。' },
      { char: 'narrator', text: '你醒得很早。推开拉门，前庭里已经全是人了。' },
      { char: 'narrator', text: '琥珀在扶倒掉的石灯笼。一盏一盏地扶起来，擦干净，叫一遍名字。' },
      { char: 'kohaku', text: '阿松。小豆。歪脖子。……二十四号，你倒得最惨。' },
      { char: 'kohaku', text: '……啊，不对。你现在叫「千代」了。', if: 'named_lantern' },
      { char: 'narrator', text: '银朗在修鸟居下面被撞歪的台阶。雪丸蹲在旁边递石头，递错了三次，被瞪了三次。还在笑。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '白露跑过来，往你头上扣了一个花环。湿湿的，凉凉的，滴了一滴露水在你鼻尖上。',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'shiro', text: '花之王！……二十年前，我也是这么叫你的。你还记得吗？' },
      { char: 'player', text: '……记得。' },
      { char: 'narrator', text: '苍羽坐在缘廊上，一只手端着饭团，一只手扶着绷带。他是走着过来的。没有飞。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……今天，在地上。' },
      { char: 'narrator', text: '正殿后面那扇窄门开着。门上的旧符，不知道什么时候被撕掉了。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '我撕的。今天早上。' },
      { char: 'kohaku', text: '……以后，这扇门不用关了。' },
      { char: 'narrator', text: '一整个白天，谁都没有提晚上的事。' },
      { char: 'yukimaru', text: '苍羽！你今天飞不了吧？比赛！从鸟居跑到正殿！' },
      { char: 'sou', text: '……可以。' },
      { char: 'narrator', text: '雪丸「嗖」地冲了出去。苍羽一步一步，慢慢地走过去。雪丸在正殿门口，等了很久很久。' },
      { char: 'yukimaru', text: '我赢了！我终于赢你了！第一百零三次比赛，第一次！' },
      { char: 'sou', text: '嗯。恭喜。' },
      { char: 'yukimaru', text: '……你根本没跑！这不算！重来！' },
      { char: 'sou', text: '不要。' },
      { char: 'narrator', text: '银朗站在前庭正中间，看着他们，又数了一遍。' },
      { char: 'ginro', text: '……六个。底下一个。' },
      { char: 'narrator', text: '数完，他的嘴角动了一下。很小，很快。你看见了。' },
      { char: 'narrator', text: '白露捧着一朵紫色的花，在那扇窄门前面站了很久。然后，鼓起勇气，走下了石阶。', if: 'told_truth' },
      { char: 'narrator', text: '过了一会儿，他跑上来，脸红红的。', if: 'told_truth' },
      { char: 'shiro', text: '他说花太香了，熏得他下不了棋。……可是他把花插进茶碗里了。', if: 'told_truth' },
      { char: 'narrator', text: '大家一起吃了早饭，一起吃了午饭。琥珀把最后两个杯面，拿出来泡了。一人分了一口。' },
      { char: 'kohaku', text: '……本来想留到千代下次来的。' },
      { char: 'kohaku', text: '可是，大家都在。今天就是最好的日子。' },
      { char: 'narrator', text: '下午，琥珀把你叫进了外婆的房间。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '榻榻米上铺着一件你没见过的衣服。白底，满襟的红色花纹，一条红色的腰带，旁边放着一枚红花的发簪。' },
      { char: 'kohaku', text: '守铃人的衣服。千代十六岁接铃那天，穿的就是这件。后来每个满月，她都穿着它下去念名。' },
      { char: 'kohaku', text: '今晚是你念。……当然要穿得漂漂亮亮的。' },
      { char: 'narrator', text: '她帮你系腰带，系了三次才满意。又把你的长发拢到一边，别上那枚红花。' },
      { char: 'narrator', text: '然后她拿起那面小手镜，举到你面前。镜面朝着你，背朝着她。' },
      { char: 'kohaku', text: '好看吗？……我不用看。我知道好看。' },
      { char: 'narrator', text: '镜子里，是一个白衣红花的姑娘。有那么一瞬间，你觉得外婆也在镜子里，朝你笑。' },
      { char: 'narrator', text: '太阳落山的时候，所有人都站了起来。' },
      { char: 'narrator', text: '没有人说「走吧」。大家只是一个接一个地，走向那扇开着的窄门。' },
      { char: 'narrator', text: '你走在最后。银朗走在你的左边。' },
    ],
    next: 'day7_ceremony',
  },

  'day7_ceremony': {
    scene: 'cave', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '入夜以后，所有人都来到了地底的洞窟。要石的光，微弱得像快要熄灭的炭火。' },
      { char: 'narrator', text: '玄夜靠在石头旁边，灰色的鳞片已经爬上了他的半边脸。他还在笑，还在说「没事」。' },
      { char: 'narrator', text: '你想起他说过的话。——满月之前，别相信任何一个说「没事」的人。' },
      { char: 'narrator', text: '你站在要石前面。身后，是六个人。' },
      { char: 'narrator', text: '你从怀里拿出那封用蜡封住的信。「满月之夜，在要石前打开。」' },
      { char: 'narrator', text: '你拆开了它。' },
      { char: 'narrator', text: '「小不点：外婆说过，不许偷看。你没有偷看吧？外婆会知道的。」' },
      { char: 'narrator', text: '「如果你读到这里，说明你站在了那块石头前面。那么，替外婆跟大家说几句话吧。」' },
      { char: 'narrator', text: '「琥珀：谢谢你五十年来的每一碗茶。以后不要再一个人在鸟居下面等了。你等的人，会自己走上来的。」' },
      { char: 'narrator', text: '「银朗：伞的事，谢谢。以后换你打伞吧。还有——你每次送我下山，都在念叨那只躲在树上的小白狼的名字，外婆都听见了哦。」' },
      { char: 'narrator', text: '「雪丸：你是叫雪丸吧？每次我来，你都躲在树上偷看。外婆看见你了。下次，下来吃饭吧。」' },
      { char: 'narrator', text: '「白露：海的约定，交给小不点了。你们两个，一起去。」' },
      { char: 'narrator', text: '「苍羽：外婆知道你不喜欢梅子。可你每次都吃完，外婆好开心。以后，换你请大家吃饭吧。」' },
      { char: 'narrator', text: '「玄夜：外婆其实一盘都没有输过你，是你一直在让。这个秘密，外婆知道。——还有，别再逞强了。」' },
      { char: 'narrator', text: '洞窟里，谁都没有出声。只有很轻很轻的，吸鼻子的声音。' },
      { char: 'narrator', text: '「最后。外婆还有一个名字，一直没能念出来。」' },
      { char: 'narrator', text: '「我娘走的时候说，竹林里有一只狸猫，叫阿灯。要是它还在，替我念一念。」' },
      { char: 'narrator', text: '「外婆找了五十年，没有找到。可是你六岁那年，哭着说林子里有一个叮叮当当的黑影子，好孤单。」' },
      { char: 'narrator', text: '「小不点。如果你想起来了——就替我们，念一念它吧。」' },
      { char: 'narrator', text: '「念完以后，这枚铃留不留，你自己决定。留下，外婆很高兴。下山，外婆也很高兴。」' },
      { char: 'narrator', text: '「你只要记得：你是被很多很多人喜欢着的孩子。——外婆」', flag: 'a_letter' },
      { char: 'narrator', text: '你把信折好，放回怀里。深吸一口气。摇响了铃。', cg: 'cg_main_ceremony' },
      { char: 'narrator', text: '叮——' },
      { char: 'narrator', text: '铃声在洞窟里回荡，越来越响，像是有很多很多只铃，在同时回应。' },
      { char: 'player', text: '琥珀。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '……在。' },
      { char: 'player', text: '银朗。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '在。' },
      { char: 'player', text: '白露。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '在、在这里！' },
      { char: 'player', text: '雪丸。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '……在！' },
      { char: 'narrator', text: '雪丸的声音在发抖。他一直以为，这里不会有他的名字。' },
      { char: 'player', text: '苍羽。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'sou', text: '……在。' },
      { char: 'player', text: '玄夜。',
        chars: [{ id: 'sou', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'genya', text: '……在。一直都在。' },
      { char: 'narrator', text: '要石亮了一点。可是还不够。光在石头深处挣扎，像是还在等什么。',
        chars: [] },
      { char: 'narrator', text: '你握紧了那根红绳。那个裂开的小铃铛，被你的手捂得温温的。' },
      { char: 'player', text: '……阿灯。' },
      { char: 'narrator', text: '洞窟里安静了。' },
      { char: 'player', text: '叮当。' },
      { char: 'player', text: '对不起，让你一个人找了那么久。' },
      { char: 'narrator', text: '很远很远的地方，从洞窟最深处的黑暗里，传来一声。' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '然后，一个小小的、圆滚滚的影子，从黑暗里慢慢走了出来。' },
      { char: 'narrator', text: '那是一只狸猫。毛是褐色的，肚子是圆的，眼睛是亮的。一点都不黑了。', cg: 'cg_main_adeng' },
      { char: 'narrator', text: '它走到你脚边，抬头看着你。看了很久。' },
      { char: 'narrator', text: '然后，它低下头，用脑袋蹭了蹭你手里的红绳。' },
      { char: 'narrator', text: '就在这时，手里的铃，忽然变重了。', cg: null },
      { char: 'narrator', text: '重得像是攥着一块石头。不——像是有什么东西，正顺着你的手臂，往铃里流。' },
      { char: 'narrator', text: '你知道那是什么。' },
      { char: 'narrator', text: '杜鹃花茶的味道。溪水凉得牙根发酸。雨夜里斜过来的伞。屋檐上太咸的饭团。' },
      { char: 'narrator', text: '这七天。这个月里，最暖的那一段。' },
      { char: 'narrator', text: '你抬起头，看着站在最前面的那个红头发的人。' },
      { char: 'narrator', text: '你想叫她的名字。可是那个名字，在舌尖上，忽然变得很模糊。' },
      { char: 'player', text: '（……她叫什么来着？）' },
      { char: 'player', text: '（她的尾巴……有几条来着……）' },
      { char: 'kohaku', text: '——不行！！' },
      { char: 'narrator', text: '琥珀冲了过来，握住了你拿着铃的手。' },
      { char: 'kohaku', text: '名字……名字不是只能一个人念的！' },
      { char: 'kohaku', text: '守铃人念我们的名字。那我们——我们也可以念守铃人的！' },
      { char: 'narrator', text: '她转过头，看着身后的每一个人。' },
      { char: 'kohaku', text: '我们的记忆，也可以当柴烧！' },
      { char: 'narrator', text: '没有人犹豫。' },
      { char: 'narrator', text: '银朗的手，覆了上来。然后是白露的。雪丸的。苍羽的。最后是玄夜的，冰凉的，覆在最上面。' },
      { char: 'narrator', text: '六个声音，一起念出了你的名字。' },
      { char: 'narrator', text: '叮——' },
      { char: 'narrator', text: '铃声变了。不再是往里拉，而是往外推。像是有很多很多只手，把你往回推。' },
      { char: 'narrator', text: '那些正在流走的东西，停住了。然后——一点一点地，流了回来。' },
      { char: 'narrator', text: '不止是这七天。' },
      { char: 'narrator', text: '还有别的。前天晚上，你喊白露的名字时，被拿走的那一小块。', if: 'paid_once' },
      { char: 'narrator', text: '你想起来了。' },
      { char: 'narrator', text: '六岁。车站。你趴在车窗上，哭得满脸都是鼻涕。' },
      { char: 'narrator', text: '站台上，一个很小很小的老太太，一直挥手。车开出去很远很远，她还在挥。' },
      { char: 'narrator', text: '你哭到睡着之前，听见她在站台上喊——喊的是你的名字。' },
      { char: 'narrator', text: '原来铃拿走的，是这个。', if: 'paid_once' },
      { char: 'narrator', text: '原来外婆被拿走的那么多段里，也有这一段。' },
      { char: 'player', text: '……琥珀。' },
      { char: 'narrator', text: '你叫出了她的名字。清清楚楚。' },
      { char: 'narrator', text: '琥珀的眼泪，一下子全掉了下来。' },
      { char: 'kohaku', text: '……嗯。在。' },
      { char: 'narrator', text: '后来，琥珀从袖子里拿出那张发黄的约书，咬破手指，在最后一行旁边，添了一行新的字。' },
      { char: 'narrator', text: '「守铃人每念一名，以众人之一忆为薪。」' },
      { char: 'kohaku', text: '以后每个满月，我们七个，一人交一点。' },
      { char: 'kohaku', text: '一人一点的话……就谁都不会，把最重要的那个人忘掉了。' },
      { char: 'narrator', text: '玄夜在旁边低声说：「……一百多年。你终于把这页改对了。」' },
      { char: 'narrator', text: '琥珀瞪了他一眼。尾巴没有炸。' },
      { char: 'narrator', text: '要石亮了。' },
      { char: 'narrator', text: '紫色的光从石头深处涌出来，顺着地面，顺着石壁，顺着每一条老树的根，向整片森林流去。' },
      { char: 'narrator', text: '你知道——北坡的焦土上，正在长出新草。白樱的枯枝上，正在开花。鸟居柱脚的黑斑，正在一点一点褪去。' },
      { char: 'narrator', text: '玄夜脸上的灰色鳞片，像旧皮一样一片一片剥落下来。底下，是新的、泛着紫光的黑。' },
      { char: 'narrator', text: '琥珀身后，第九条尾巴，轻轻地展开了。她自己都没发现，还在擦眼泪。' },
      { char: 'narrator', text: '狸猫阿灯打了个哈欠，一溜烟跑上了石阶。' },
      { char: 'narrator', text: '过了一会儿，上面传来琥珀的尖叫——「供台上的饭团！！」' },
      { char: 'narrator', text: '洞窟里，所有人都笑了。连玄夜都笑出了声，笑到咳嗽。' },
      { char: 'narrator', text: '铃声停下来的时候，你手里的铜铃，轻轻地、温暖地，跳了一下。' },
      { char: 'narrator', text: '像是有谁，在很远很远的地方，笑着说：「做得好，小不点。」' },
      { char: 'narrator', text: '走出洞窟时，满月已经升到了天顶。鸟居下方，结界像一道银色的帘子，向山下缓缓打开。' },
      { char: 'narrator', text: '口袋里，有什么东西震了一下。' },
      { char: 'narrator', text: '是手机。屏幕亮了。停在「17:43」的时间，跳了一下，开始走了。' },
      { char: 'narrator', text: '一条消息，是三天前发的。现在才进来。' },
      { char: 'narrator', text: '父亲：「到山上了吗。下雨了，路滑。」' },
      { char: 'narrator', text: '下面还有一条。是今天的。' },
      { char: 'narrator', text: '父亲：「你外婆那房子，先别卖了。」' },
      { char: 'narrator', text: '「……下次，我也想上去看看。」' },
      { char: 'narrator', text: '该下山了。七天的丧假，明天就结束了。' },
      { char: 'narrator', text: '你回过头。' },
    ],
    next_by_affection_ending: true,
  },

      { char: 'narrator', text: '琥珀看着那一行字，看了很久。然后把簿子合上，抱在胸前。' },
      { char: 'kohaku', text: '下个满月，我就不坐在这里等了。' },
      { char: 'player', text: '……诶？' },
      { char: 'kohaku', text: '我去山脚接你。' },
      { char: 'kohaku', text: '等了一千年，我也该学会自己走过去了。' },

      { char: 'kohaku', text: '这是狐狸的印记。有了它，不管你在城里哪个角落，我都找得到你。' },
      { char: 'kohaku', text: '……所以，不许再让我等二十年了哦。' },
      { char: 'narrator', text: '她往后退了一步。身后，九条尾巴在月光里全部展开了。' },
      { char: 'kohaku', text: '今天早上，我照了镜子。' },
      { char: 'kohaku', text: '数了三遍。九条。' },

      { char: 'narrator', text: '你走下石阶。走到拐弯的地方，回头看了一眼。' },

  },

  'ending_fox3': {

  'ending_wolf': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗送你下山。走在你的左边。' },
      { char: 'narrator', text: '你手里抱着三把深蓝色的油纸伞。他看了一眼，伸手接过去两把，扛在了自己肩上。' },
      { char: 'narrator', text: '一路上，他一句话都没说。月光把石阶照得发白，每一块会滑的石头，他都先踩一下，再让你踩。' },
      { char: 'narrator', text: '走到那棵裂开的老杉树下，他停住了。' },

      { char: 'ginro', text: '以后，不管你在哪里迷路——' },

      { char: 'ginro', text: '我都会找到你。' },

      { char: 'narrator', text: '是一个木雕的小铃铛。第六百零四个。' },
      { char: 'ginro', text: '……本来是送你下山以后，才要刻的。昨晚睡不着，先刻好了。' },
      { char: 'ginro', text: '……下个满月，走我左边。' },
      { char: 'narrator', text: '你走出结界的时候，回头看了一眼。' },
      { char: 'narrator', text: '他还站在老杉树下。肩上扛着两把伞，像一棵不会被风吹弯的树。' },
    ],
    next: 'ending_wolf2',
  },

      { char: 'ginro', text: '我一直以为，她是不想让我淋雨。' },
      { char: 'ginro', text: '现在才知道——她是想让我，也在伞底下。' },
      { char: 'narrator', text: '走到鸟居的时候，石阶上蹲着一团白色的东西，浑身湿透，冲你们龇牙咧嘴。' },
      { char: 'yukimaru', text: '你们两个！一把伞！我呢！我的伞呢！' },
      { char: 'ginro', text: '……雪丸。你的伞，你上个月弄坏了。' },
      { char: 'narrator', text: '他叫得很自然。像是这个名字，已经在嘴里叫了很多很多年。' },
    ],
    ending: { title: '月下之约', subtitle: '他的木屋里，铃铛的架子上，从第六百零四个开始，每一个都刻着两个人的伞。\n每个满月，老杉树下都有一头银狼安静地等着，然后走在你的左边。\n某一年冬天，你在城里发烧，迷迷糊糊地打开门，\n门外站着一个银发的青年，手里提着一袋橘子，耳朵冻得通红。\n「……不是满月也可以来吧。」\n\n—— 银朗线 · 完 ——' },
  },

  'ending_deer': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露一路把你送到了结界的边缘。再往前一步，就是山下了。' },
      { char: 'narrator', text: '他光着脚，站在结界里面。脚趾头蜷着，一下一下地抠着地上的草。' },
      { char: 'shiro', text: '……不许哭。我都没哭。' },
      { char: 'narrator', text: '他说着，眼泪已经掉下来了。' },
      { char: 'shiro', text: '琥珀姐说，结界好了，我就不用一直守着花谷了。离开几天也没关系。' },
      { char: 'shiro', text: '可是我还要学会把角完全藏起来。不然山下的人会吓到的。' },
      { char: 'shiro', text: '我会好好练的。每天都练。' },
      { char: 'shiro', text: '然后你要带我去看海。千代婆婆没来得及带我去的那片海。' },
      { char: 'narrator', text: '他伸出小拇指。你勾住了。' },
      { char: 'shiro', text: '约定了哦。' },
      { char: 'shiro', text: '还有，那个……' },
      { char: 'narrator', text: '他从角上摘下一朵花，塞进你手里。是蓝色的。' },
      { char: 'shiro', text: '这个月的第一朵。说好了给你的。' },
      { char: 'shiro', text: '……下个月的第一朵，也给你。' },
    ],
    next: 'ending_deer2',
  },

  'ending_deer2': {
    scene: 'sky', particles: 'feathers', day: -1, // epilogue: hides the 7-day counter
    lines: [
      { char: 'narrator', text: '——第二年，夏天。' },
      { char: 'narrator', text: '电车开出山脚小镇的时候，坐在你旁边的少年一直趴在车窗上。' },
      { char: 'narrator', text: '他戴着一顶大大的草帽，帽檐压得很低。帽子底下，偶尔会「啵」地鼓起一个小包，又飞快地瘪下去。',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'shiro', text: '这就是电车！很长很长、会自己跑的屋子！千代婆婆没骗我！' },
      { char: 'shiro', text: '它为什么不会累？它吃什么？它晚上睡在哪里？' },
      { char: 'narrator', text: '一车厢的人都在偷偷笑。他一点都没发现。' },
      { char: 'narrator', text: '下了电车，又走了一段路。风里开始有了一种他没闻过的味道。咸咸的，潮潮的。' },
      { char: 'narrator', text: '他停住了。鼻子抽了抽。' },
      { char: 'shiro', text: '……这是什么味道？' },
      { char: 'player', text: '海的味道。' },
      { char: 'narrator', text: '他摘下草帽，往前跑。跑过一片松林，跑上一道沙坡——然后，站住了。' },
      { char: 'narrator', text: '海就在那里。' },
      { char: 'narrator', text: '很蓝很蓝。一直蓝到天的尽头。白色的浪，一层一层地推上来，又退下去。' },
      { char: 'narrator', text: '白露站在沙坡上，一动不动地看了很久很久。' },
      { char: 'narrator', text: '他头上的角，不知道什么时候露了出来。角上的花，一朵接一朵地，全开了。全是蓝色的。' },
      { char: 'shiro', text: '……比一万倍，还要大。' },
    ],
    choices: [
      { text: '牵着他，一起走进浪里', flag: 'deer_waves', next: 'ending_deer3' },
      { text: '陪他在沙坡上坐下，等他看够', next: 'ending_deer3' },
    ],
  },

  'ending_deer3': {
    scene: 'sky', particles: 'feathers', day: -1, // epilogue: hides the 7-day counter
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '浪涌上来，没过了他的脚背。他尖叫了一声，跳起来，又小心翼翼地踩回去。', if: 'deer_waves' },
      { char: 'shiro', text: '会动！它在拉我的脚！它想跟我玩！', if: 'deer_waves' },
      { char: 'narrator', text: '你们在沙坡上坐了一个下午。他一句话都没说，只是看。看到太阳开始往海里沉。', ifnot: 'deer_waves' },
      { char: 'shiro', text: '……我想记住它。全部记住。', ifnot: 'deer_waves' },
      { char: 'narrator', text: '他从口袋里，拿出那朵蓝色的花。你那天在结界边上给他看过的，一直没有谢的那朵。' },
      { char: 'narrator', text: '你后来才知道，他向你借了回去，每天晚上都放在枕头边上。' },
      { char: 'shiro', text: '千代婆婆说，蓝色是想念的颜色。' },
      { char: 'narrator', text: '他蹲下来，把花轻轻放进了浪里。' },
      { char: 'narrator', text: '浪把它带走了。在很蓝很蓝的水里，那一点蓝，一直浮着。一直开着。' },
      { char: 'shiro', text: '它还开着。' },
      { char: 'shiro', text: '……千代婆婆，你看。它还开着。' },
      { char: 'narrator', text: '他回过头来看你。脸上全是泪。可是在笑。' },
      { char: 'shiro', text: '明年，我们再来好不好？带琥珀姐，带雪丸，带银朗哥。' },
      { char: 'shiro', text: '……也带蛇先生。他应该也没见过海。' },
    ],
    ending: { title: '花之约定', subtitle: '那年秋天，花谷里多了一种从来没有开过的花。蓝色的，有一点点咸咸的味道。\n白露给它起名叫「海」。\n第二年夏天，沙滩上多了七个人。一只狐狸被浪打湿了尾巴，一条蛇坐在遮阳伞下一动不动，\n一个少年把草帽扔进了浪里，追着它跑。\n「约好要带我去看海的，有两个人啊。」他说，「现在，有好多好多人了。」\n\n—— 白露线 · 完 ——' },
  },

  'ending_whitewolf': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你走下石阶的时候，北坡的最高处传来一声狼嚎。', cg: 'cg_yuki_howl' },
      { char: 'narrator', text: '长长的，响亮的，一点都不悲伤。' },
      { char: 'narrator', text: '是朝着北边的。可是这一次，不像在问什么了。像是在宣布。' },
      { char: 'narrator', text: '——这里，是我的窝。' },
      { char: 'narrator', text: '然后，一道白影从树梢上一路跳下来，落在你面前。' },
      { char: 'yukimaru', text: '我说了我会一直看着的！结果看着看着，腿自己就跑下来了！' },
      { char: 'yukimaru', text: '……再送一段。就一段。' },
      { char: 'narrator', text: '他送你到了老杉树下。又送了一段。又一段。', cg: null },
      { char: 'yukimaru', text: '啊，不行了，再往前就出结界了。舅舅会骂死我的。' },
      { char: 'yukimaru', text: '下个满月，你第一个见到的，一定要是我。说好了。比苍羽还快。' },
      { char: 'narrator', text: '他往回跑了几步，又停下，回过头来。' },
      { char: 'yukimaru', text: '喂！' },
      { char: 'yukimaru', text: '你知道吗！今天早上，舅舅叫我名字了！叫了三次！' },
      { char: 'yukimaru', text: '第三次是因为我把他的伞弄坏了！可是那也算！' },
      { char: 'narrator', text: '他笑着跑进了林子。笑声一路荡到北坡的最高处。' },
    ],
    next: 'ending_whitewolf2',
  },

  'ending_whitewolf2': {
    scene: 'forest', particles: 'fireflies', day: -1, // epilogue: hides the 7-day counter
    lines: [
      { char: 'narrator', text: '——下一个满月。' },
      { char: 'narrator', text: '你刚走过那棵裂开的老杉树，头顶的树枝就「哗啦」一响。' },
      { char: 'narrator', text: '一团白色的东西从天而降，把你整个人扑倒在了落叶堆里。',
        chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }] },
      { char: 'yukimaru', text: '第一个！我是第一个！' },
      { char: 'yukimaru', text: '苍羽那家伙还在天上转圈呢！哈！' },
      { char: 'narrator', text: '他趴在你身上，尾巴摇得落叶满天飞。然后，嘴里叼着的什么东西，「啪嗒」掉在了你脸上。' },
      { char: 'narrator', text: '是一条鱼。还在扭。' },
      { char: 'yukimaru', text: '给你！迎接礼！北边的规矩！' },
      { char: 'player', text: '……那我要还礼吗？' },
      { char: 'yukimaru', text: '当然！' },
      { char: 'narrator', text: '他伸出手。掌心朝上。眼睛亮晶晶的，盯着你的口袋。' },
    ],
    choices: [
      { text: '掏出一整袋金平糖，全放在他手心', flag: 'yuki_candy', next: 'ending_whitewolf3' },
      { text: '揉了揉他那只缺了口的耳朵：「还礼。」', next: 'ending_whitewolf3' },
    ],
  },

  'ending_whitewolf3': {
    scene: 'night-shrine', particles: 'spirits', day: -1, // epilogue: hides the 7-day counter
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '一、一整袋？！你疯了吗！这够我吃到下下个满月！', if: 'yuki_candy' },
      { char: 'yukimaru', text: '……不行。分一半给白露。他上次哭着说我从来不分他。', if: 'yuki_candy' },
      { char: 'narrator', text: '他的耳朵在你手底下抖了一下。然后整个人僵住，从耳朵尖开始，一路红到了脖子。', ifnot: 'yuki_candy' },
      { char: 'yukimaru', text: '……这、这个不算还礼！这个是……是……', ifnot: 'yuki_candy' },
      { char: 'yukimaru', text: '……再揉一下。刚才风太大，没感觉到。', ifnot: 'yuki_candy' },
      { char: 'narrator', text: '他拉着你，一路跑上山。没有走石阶——走的是他自己踩出来的小路。' },
      { char: 'narrator', text: '跑到鸟居底下，他停住了。指着地上的一小块土。' },
      { char: 'narrator', text: '是他埋骨牌的地方。上面，开着一丛小小的白花。' },
      { char: 'yukimaru', text: '白露种的。他说，坏东西埋下去，就要在上面开好东西。' },
      { char: 'yukimaru', text: '……族长上个月派人来了。在北坡外面嚎了一整夜。' },
      { char: 'yukimaru', text: '舅舅出去了。我跟着。' },
      { char: 'yukimaru', text: '舅舅站在结界边上，跟他们说——「这孩子叫雪丸。是杜鹃森的守卫。北坡归他。」' },
      { char: 'yukimaru', text: '然后就转身回来了。一句废话都没有。' },
      { char: 'narrator', text: '他蹲下来，摸了摸那丛白花。' },
      { char: 'yukimaru', text: '……他们后来就走了。' },
      { char: 'yukimaru', text: '我以前，每离开一个地方，都不会回头。现在，我哪里都不去了。' },
      { char: 'narrator', text: '他站起来，冲你咧嘴一笑。虎牙露出来，眼睛有点亮。' },
      { char: 'yukimaru', text: '走吧！琥珀姐煮了鱼！我抓的！' },
    ],
    ending: { title: '北坡之约', subtitle: '此后的每个满月，你刚走到老杉树下，\n就会有一团白色的东西从天而降，把你扑倒在落叶里。\n「第一个！我又是第一个！」\n后来他学会了在城里化成人形。第一次见到便利店的时候，兴奋得差点现出尾巴。\n他买了两百米外那家店里所有口味的杯面，扛回山上，给琥珀一个一个泡。\n他说——「原来不用一个人跑，是这种感觉啊。」\n\n—— 雪丸线 · 完 ——' },
  },

  'ending_hawk': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你抬起头。苍羽站在鸟居的横梁上，长发被夜风吹起来。' },
      { char: 'sou', text: '……我不送你了。' },
      { char: 'sou', text: '我会从天上看着。一直看到你进了家门。' },
      { char: 'narrator', text: '他从横梁上飘下来，落在你面前。落得很稳。' },
      { char: 'narrator', text: '他把一根蓝色的羽毛，放在你手心里。' },
      { char: 'sou', text: '第一次见面的时候，那根羽毛，不是自己掉的。' },
      { char: 'sou', text: '是我放在你窗台上的。' },
      { char: 'sou', text: '……因为我想知道，千代的外孙女，会不会捡起来。' },
      { char: 'player', text: '我捡了。' },
      { char: 'sou', text: '嗯。所以，这一根也要捡好。' },
      { char: 'sou', text: '……还有。那叠信，最后一封。' },
      { char: 'sou', text: '「等你上山的时候——」后面，她没写完。' },
      { char: 'sou', text: '我想了很久。我替她写完了。写在信封背面。' },
      { char: 'narrator', text: '你翻过信封。背面是一行很端正、很用力的小字。' },
      { char: 'narrator', text: '「——就有很多很多人，在等你了。」' },
      { char: 'narrator', text: '你走下石阶的时候，头顶上有一道影子，一直跟着你。不远，也不近。' },
      { char: 'narrator', text: '一直跟到了山脚。跟到了外婆老房子的屋顶上。' },
    ],
    next: 'ending_hawk2',
  },

  'ending_hawk2': {
    scene: 'room', particles: null, day: -1, // epilogue: hides the 7-day counter
    lines: [
      { char: 'narrator', text: '——两个星期后。' },
      { char: 'narrator', text: '你请了一个周末的假，回外婆的老房子收拾东西。' },
      { char: 'narrator', text: '那叠信，你一封一封地拆开，读完，按年份排好，放进了外婆的木盒里。和那枚铃挨在一起。' },
      { char: 'narrator', text: '傍晚的时候，下起了小雨。雨打在芭蕉叶上，一下一下的。' },
      { char: 'narrator', text: '然后——窗户被敲响了。' },
      { char: 'narrator', text: '咚，咚。很轻，很有礼貌。是第一天晚上，放羽毛的那扇窗。' },
      { char: 'narrator', text: '你拉开窗户。' },
      { char: 'narrator', text: '一个蓝黑长发的人蹲在窗台外面的屋檐上，头发被雨打湿了。怀里，用竹叶包着什么东西，护得好好的。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……我说过的。我会敲窗户。' },
      { char: 'narrator', text: '他把竹叶包递进来。打开，是一个梅子饭团。形状歪歪扭扭的，像一个三角形的土豆。' },
      { char: 'sou', text: '……我自己捏的。' },
      { char: 'sou', text: '琥珀教的。捏了十一个。这个是最好的。' },
      { char: 'narrator', text: '你咬了一口。太咸了。手上的盐水沾多了。' },
    ],
    choices: [
      { text: '「进来吧。外面在下雨。」', flag: 'hawk_inside', next: 'ending_hawk3' },
      { text: '爬出窗户，坐到他旁边的屋檐上', next: 'ending_hawk3' },
    ],
  },

  'ending_hawk3': {
    scene: 'room', particles: null, day: -1, // epilogue: hides the 7-day counter
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽愣住了。他看着窗户里面，像是看着一个很远很远的地方。', if: 'hawk_inside' },
      { char: 'sou', text: '……千代以前，也是这么说的。每次我在外面淋雨，她都说「进来吧」。', if: 'hawk_inside' },
      { char: 'sou', text: '我一次都没有进去过。', if: 'hawk_inside' },
      { char: 'narrator', text: '然后，他翻过窗台，落进了屋里。落得一点都不稳，膝盖磕在了榻榻米上。', if: 'hawk_inside' },
      { char: 'sou', text: '……这个也不算。', if: 'hawk_inside' },
      { char: 'narrator', text: '你爬出窗户，坐在湿漉漉的屋檐上。苍羽愣了一下，然后张开一边翅膀，挡在了你头顶。', ifnot: 'hawk_inside' },
      { char: 'sou', text: '……你这样，会淋湿的。', ifnot: 'hawk_inside' },
      { char: 'player', text: '那就一起淋湿。', ifnot: 'hawk_inside' },
      { char: 'narrator', text: '他没有再说话。可是翅膀，往你这边，又挪了一点。', ifnot: 'hawk_inside' },
      { char: 'narrator', text: '你们分着吃完了那个太咸的饭团。雨慢慢停了，云后面露出了半张月亮。' },
      { char: 'sou', text: '……以前，我在天上看着所有人。看得见，碰不到。' },
      { char: 'sou', text: '我以为那样就够了。' },
      { char: 'narrator', text: '他转过头来看你。蓝色的眼睛里，映着那半张月亮。' },
      { char: 'sou', text: '现在，我想落下来的地方……只有一个。' },
      { char: 'sou', text: '下个星期，我还来敲窗户。……可以吗？' },
    ],
    ending: { title: '青空之约', subtitle: '回到城里以后，你的窗台上常常出现蓝色的羽毛。\n有时候是一根，有时候是两根，有一次是一整条还在蹦的鱼。\n每个周末的傍晚，窗户都会被敲响。咚，咚。很轻，很有礼貌。\n他捏的饭团，一个月比一个月圆。\n只有落地，一直没有练好。\n「……这个也不算。」\n\n—— 苍羽线 · 完 ——' },
  },

  'ending_snake': {
    scene: 'forest', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
