// ============================================================
const music = { on: true, cur: null, el: null, unlocked: false };
try { music.on = localStorage.getItem('dujuansen-music') !== 'off'; } catch (e) {}

function fadeTo(el, target, ms, done) {
  const token = el._fade = {}; // a newer fade on the same element cancels this one
  const start = el.volume, t0 = performance.now();
  (function step(t) {
    if (el._fade !== token) return;
    const k = Math.min(1, Math.max(0, (t - t0) / ms));
    el.volume = Math.min(1, Math.max(0, start + (target - start) * k));
    if (k < 1) requestAnimationFrame(step); else if (done) done();
  })(t0);
}

function playBgm(track) {
  const src = BGM[track] || BGM.title;
  if (music.el && music.el.dataset.src === src) return;
  const old = music.el;
  if (old) fadeTo(old, 0, 1200, () => { old.pause(); old.src = ''; });
  music.el = null; music.cur = track;
  if (!src) return;
  const el = new Audio(src);
  el.dataset.src = src; el.loop = true; el.volume = 0;
  music.el = el;
  if (music.on) el.play().then(() => fadeTo(el, 0.55, 1500)).catch(() => {});
}

const bellSrc = 'assets/sfx-bell.wav';
new Audio(bellSrc).preload = 'auto';
function playBell() {
  if (!music.on) return;
  const el = new Audio(bellSrc);
  el.volume = 0.8;
  el.play().catch(() => {});
}

function setMusicOn(on) {
  music.on = on;
  try { localStorage.setItem('dujuansen-music', on ? 'on' : 'off'); } catch (e) {}
  $('#music-btn').classList.toggle('off', !on);
  if (!music.el) return;
  if (on) music.el.play().then(() => fadeTo(music.el, 0.55, 800)).catch(() => {});
  else fadeTo(music.el, 0, 400, () => music.el && music.el.pause());
}

$('#music-btn').addEventListener('click', e => { e.stopPropagation(); setMusicOn(!music.on); });
$('#music-btn').classList.toggle('off', !music.on);
$('#skip-btn').addEventListener('click', e => {
  e.stopPropagation();
  if (skip.active()) return setSkip(false);
  if (state.dlg && !skip.lineRead) return toast('这一句还没读过，不能跳过');
  setSkip(true);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Control' || e.repeat || overlayOpen() || !state.dlg) return;
  skip.hold = true; syncSkipUI(); skipTick();
});
document.addEventListener('keyup', e => { if (e.key === 'Control' && skip.hold) { skip.hold = false; syncSkipUI(); } });
// Browsers block audio until the first tap; start the current track then.
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  if (music.unlocked) return; music.unlocked = true;
  if (music.on && music.el && music.el.paused) music.el.play().then(() => fadeTo(music.el, 0.55, 1500)).catch(() => {});
}, { once: false }));

function openGate() {
  const g = $('#tap-gate');
  if (!g || g.classList.contains('gone')) return;
  music.unlocked = true;
  g.classList.add('gone');
  $('#title-screen').classList.remove('waiting');
  if (music.on && music.el && music.el.paused) music.el.play().then(() => fadeTo(music.el, 0.55, 1500)).catch(() => {});
  setTimeout(() => g.remove(), 900);
}

function initTitle() {
  const gate = $('#tap-gate');
  gate.addEventListener('click', openGate);
  gate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGate(); } });
  if (!music.on) gate.querySelector('.tg-sub').textContent = '声音已关闭 · 可在右上角 ♪ 打开';
  gate.focus();
  const c = $('#title-particles');
  for (let i = 0; i < 20; i++) {
    const f = document.createElement('div');
    f.className = 'title-firefly';
    f.style.left = Math.random() * 100 + '%';
    f.style.top = Math.random() * 100 + '%';
    f.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--dy', (Math.random() * 60 - 30) + 'px');
    f.style.animationDuration = (6 + Math.random() * 8) + 's';
    f.style.animationDelay = Math.random() * 6 + 's';
    c.appendChild(f);
  }
  $('#start-btn').addEventListener('click', () => {
    const go = () => {
      resetGame();
      const gen = state.gen;
      hideTitle(() => { if (gen === state.gen) playNode('start'); });
    };
    if (hasAnySave()) confirmBox('开始新的物语？\n已有的存档不会被删除。', go); else go();
  });
  $('#continue-btn').addEventListener('click', () => {
    const latest = latestSave();
    if (latest) applySave(latest);
  });
  $('#title-load-btn').addEventListener('click', () => openSlots('load'));
  $('#title-chap-btn').addEventListener('click', () => openChapters());
  refreshTitleButtons();
  playBgm('title');
}

function hideTitle(cb) {
  const t = $('#title-screen');
  t.classList.add('hidden');
  const gen = state.gen;
  setTimeout(() => { if (gen === state.gen) t.style.display = 'none'; if (cb) cb(); }, 1500);
}

function playNode(id) {
  const node = S[id];
  if (!node) return;
  const gen = ++state.gen;
  detachDialogue();
  state.currentNode = id;
  state.line = 0;
  if (node.day) { state.day = node.day; updateDay(); }
  if (node.scene) { state.scene = node.scene; setScene(node.scene); }
  if ('particles' in node) { state.particles = node.particles; setParticles(node.particles); }
  state.chars = (node.chars || []).map(c => ({ ...c }));
  if (node.chars) setChars(node.chars); else clearChars();
  if (node.transform_immediate) showTransform(node.transform_immediate.char, node.transform_immediate.text);
  if (node.chapter) state.chapter = node.chapter;
  (node.flags || []).forEach(setFlag);
  if (!(node.keepCG && state.cg)) setCG(null); // keepCG: carry the previous node's CG into this one
  playBgm(bgmFor(id));
  setFlashback(!!node.flashback);
  autoSave();

  if (node.chapter) {
    showChapter(node.chapter.num, node.chapter.title, () => { if (gen === state.gen) startLines(node, 0); });
  } else {
    startLines(node, 0);
  }
}

function startLines(node, i) {
  state.line = i;
  if (!node.lines || i >= node.lines.length) { afterLines(node); return; }
  const line = node.lines[i];
  if ((line.if && !state.flags[line.if]) || (line.ifnot && state.flags[line.ifnot])) { startLines(node, i + 1); return; }
  if (line.chars) { state.chars = line.chars.map(c => ({ ...c })); setChars(state.chars); }
  if ('cg' in line) setCG(line.cg); // a CG stays up (over any cast changes) until a line clears it or the node ends
  if (line.transform) showTransform(line.transform.char, line.transform.text);
  if (line.flag) setFlag(line.flag);
  if (line.text.startsWith('叮') && !skip.active()) playBell();
  const wasRead = isRead(state.currentNode, i);
  markRead(state.currentNode, i);
  showDialogue(line, () => startLines(node, i + 1), wasRead);
}

// ---- Read-line tracking and skip ----
// The furthest line seen in each node, kept across saves and new games (per STORY_VERSION, since line order changes).
const READ_KEY = 'dujuansen-read';
let readMap = null, readSaveTimer = null;
function reads() {
  if (!readMap) {
    try { const d = JSON.parse(localStorage.getItem(READ_KEY) || 'null'); readMap = d && d.v === STORY_VERSION ? d.m : {}; } catch (e) { readMap = {}; }
  }
  return readMap;
}
function isRead(id, i) { const m = reads(); return id in m && m[id] >= i; }
function markRead(id, i) {
  if (isRead(id, i)) return;
  reads()[id] = i;
  clearTimeout(readSaveTimer);
  readSaveTimer = setTimeout(() => { try { localStorage.setItem(READ_KEY, JSON.stringify({ v: STORY_VERSION, m: readMap })); } catch (e) {} }, 400);
}

const skip = {
  on: false, hold: false, lineRead: false,
  active() { return this.on || this.hold; },
};
function setSkip(on, why) {
  const was = skip.active();
  skip.on = on; if (!on) skip.hold = false;
  syncSkipUI();
  if (was && !skip.active() && why) toast(why);
  if (skip.active()) skipTick();
}
function syncSkipUI() {
  $('#skip-btn').classList.toggle('on', skip.active());
  $('#skip-btn').setAttribute('aria-pressed', skip.active());
  $('#game').classList.toggle('skipping', skip.active());
}
const FAKE_EVT = { preventDefault() {}, stopPropagation() {} };
// Called whenever a line is on screen and skipping may be on: finish it and move on, or stop at unread text.
function skipTick() {
  const dlg = state.dlg;
  if (!dlg || !skip.active()) return;
  if (!skip.lineRead) { skip.on = false; skip.hold = false; syncSkipUI(); toast('未读的剧情 · 已停止跳过'); return; }
  setTimeout(() => {
    if (state.dlg !== dlg || !skip.active()) return;
    if (overlayOpen()) { skipTick(); return; }
    if (!state.textComplete) dlg.advance(FAKE_EVT);
    dlg.advance(FAKE_EVT);
  }, 50);
}

function setCG(id) {
  const layer = $('#cg-layer');
  state.cg = id || null;
  if (!id) { layer.classList.remove('in'); setTimeout(() => { if (!state.cg) layer.classList.remove('show'); }, 800); return; }
  const src = CG_IMAGES[id], info = CG_INFO[id] || [id, ''];
  layer.classList.toggle('has-img', !!src);
  if (src) $('#cg-img').src = src;
  layer.querySelector('.cg-ph-name').textContent = info[0];
  layer.querySelector('.cg-ph-desc').textContent = info[1];
  layer.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('in')));
  markCgSeen(id);
}

const GALLERY_EXTRAS = {
  x_sketch: ['速写本最后一页', 'assets/protagonist-child.webp', '#efe6d2'],
  x_keeper: ['守铃人', 'assets/protagonist-adult.webp', 'radial-gradient(circle at 50% 30%, #3a3352, #0d0c1c)'],
};

function openGallery() {
  const seen = cgSeen();
  const items = Object.keys(CG_INFO).map(id => {
    const ok = seen[id], src = CG_IMAGES[id];
    return `<div class="gal-item${ok ? '' : ' locked'}" data-cg="${ok ? id : ''}">${ok && src ? `<img src="${src}" alt="">` : ''}<span>${ok ? CG_INFO[id][0] : '？？？'}</span></div>`;
  }).join('');
  const n = Object.keys(CG_INFO).filter(id => seen[id]).length, total = Object.keys(CG_INFO).length;
  // Every CG seen: the sketchbook's last page (the face Chiyo kept erasing) and the bell keeper unlock.
  const done = n === total;
  const banner = done ? `<div class="gal-done">✿ 全部收集 ✿<small>外婆速写本的最后一页，那张画了又擦的脸——现在，有人替她画完了。</small></div>` : '';
  const extras = !done ? '' :
    Object.entries(GALLERY_EXTRAS).map(([id, [name, src, bg]]) => `<div class="gal-item gal-extra" data-cg="${id}" style="background:${bg}"><img src="${src}" alt=""><span>${name}</span></div>`).join('');
  const card = $('#sys-card');
  card.innerHTML = `
    <div class="sys-head"><button class="sys-close" data-act="back" aria-label="返回">‹</button><div class="sys-title">回 忆</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    <div class="slot-note" style="padding:8px 4px 0;text-align:center">已收集 ${n} / ${total}</div>${banner}
    <div class="gallery">${extras}${items}</div>`;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') return closeSys();
    if (act === 'back') return openMenu();
    const id = e.target.closest('[data-cg]')?.dataset.cg;
    if (!id) return;
    const v = $('#cg-viewer'), extra = GALLERY_EXTRAS[id], src = extra ? extra[1] : CG_IMAGES[id];
    v.style.background = extra ? extra[2] : '';
    v.querySelector('img').style.display = src ? '' : 'none';
    if (src) v.querySelector('img').src = src;
    v.querySelector('.cg-ph-name').textContent = src ? '' : CG_INFO[id][0] + '（图还没画好）';
    v.classList.add('show');
  };
  $('#sys-layer').classList.add('active');
}

function setFlashback(on) { $('#game').classList.toggle('flashback', on); }

function setFlag(f) {
  if (state.flags[f]) return;
  state.flags[f] = true;
  const m = MYSTERIES.find(x => x.q === f || x.a === f);
  if (m) toast(m.a === f ? '记事本：谜团解开了' : '记事本：新的谜团');
}

function markSpeaker(id) {
  const sprites = [...$$('.character-sprite')];
  const me = sprites.find(s => s.dataset.id === id);
  if (!me) return;
  sprites.forEach(s => {
    const role = s === me ? 'speaking' : 'listening';
    s.classList.toggle('speaking', s === me);
    s.classList.toggle('listening', s !== me);
    const img = s.querySelector('img');
    if (img && sprites.length > 1) img.style.cssText = portraitStyle(CHARS[s.dataset.id][s.dataset.form], s.dataset.pos, role);
  });
}

function afterLines(node) {
  if (node.choices) showChoices(node.choices);
  else if (node.next_by_affection) routeByAff();
  else if (node.next_by_affection_ending) routeToEnding();
  else if (node.ending) showEnding(node.ending);
  else if (node.next) playNode(node.next);
}

function showDialogue(line, cb, wasRead) {
  skip.lineRead = !!wasRead;
  const ch = CHARS[line.char];
  const nameEl = $('#speaker-name');
  const textEl = $('#dialogue-text');
  const ind = $('#text-indicator');

  nameEl.textContent = ch.name;
  nameEl.style.color = ch.color;
  if (ch.affKey) state.flags['met_' + line.char] = true;
  markSpeaker(line.char);
  textEl.innerHTML = '';
  ind.classList.remove('show');
  state.textComplete = false;
  state.charTimers.forEach(t => clearTimeout(t));
  state.charTimers = [];

  const chars = line.text.split('');
  const spans = chars.map(c => {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = c;
    textEl.appendChild(s);
    return s;
  });

  let r = 0;
  const speed = 38;
  function reveal() {
    if (r < spans.length) { spans[r].classList.add('visible'); r++; state.charTimers.push(setTimeout(reveal, speed)); }
    else { state.textComplete = true; ind.classList.add('show'); }
  }
  reveal();

  detachDialogue();
  function advance(e) {
    e.preventDefault(); e.stopPropagation();
    if (!state.textComplete) {
      state.charTimers.forEach(t => clearTimeout(t)); state.charTimers = [];
      spans.forEach(s => s.classList.add('visible'));
      state.textComplete = true; ind.classList.add('show');
    } else {
      detachDialogue();
      cb();
    }
  }
  function keyAdv(e) { if (overlayOpen()) return; if (e.key === ' ' || e.key === 'Enter') advance(e); }
  state.dlg = { advance, keyAdv };
  $('#dialogue-box').addEventListener('click', advance);
  document.addEventListener('keydown', keyAdv);
  if (skip.active()) skipTick();
}

function detachDialogue() {
  if (!state.dlg) return;
  $('#dialogue-box').removeEventListener('click', state.dlg.advance);
  document.removeEventListener('keydown', state.dlg.keyAdv);
  state.dlg = null;
}

function showChoices(choices) {
  if (skip.active()) setSkip(false, '到了选项 · 已停止跳过');
  const layer = $('#choice-layer');
  const c = $('#choice-container');
  c.innerHTML = '';
  choices.filter(ch => !(ch.if && !state.flags[ch.if]) && !(ch.ifnot && state.flags[ch.ifnot])).forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice-btn'; b.textContent = ch.text;
    b.addEventListener('click', () => {
      layer.classList.remove('active');
      recordPick(state.currentNode, ch.text);
      if (ch.affection) for (const [k, v] of Object.entries(ch.affection)) addAff(k, v);
      if (ch.flag) state.flags[ch.flag] = true;
      playNode(ch.next);
    });
    c.appendChild(b);
  });
  layer.classList.add('active');
}

// Most points each character can earn on one playthrough; scales every route so a devoted run ends near 95.
const AFF_MAX = { fox: 39, wolf: 32, deer: 25, whitewolf: 31, hawk: 28, snake: 26 };

function addAff(who, amt) {
  state.affection[who] = Math.min(100, state.affection[who] + amt * 95 / AFF_MAX[who]);
  showAffChange(who, amt);
}

function showAffChange(who, amt) {
  const colors = { fox:'#ff6b4a', wolf:'#7eb8da', deer:'#8fd4a0', whitewolf:'#e8e0d0', hawk:'#4a7eb8', snake:'#9a5abf' };
  const names = { fox:'琥珀', wolf:'银朗', deer:'白露', whitewolf:'雪丸', hawk:'苍羽', snake:'玄夜' };
  const el = document.createElement('div');
  el.className = 'aff-change';
  el.textContent = `${names[who]} +${amt}`;
  el.style.color = colors[who];
  el.style.top = '50%'; el.style.left = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function getMaxAff() {
  const a = state.affection;
  const entries = Object.entries(a);
  entries.sort((x, y) => y[1] - x[1]);
  return entries[0][0];
}

function routeByAff() {
  const map = { fox:'rescue_fox', wolf:'rescue_wolf', deer:'rescue_deer', whitewolf:'rescue_whitewolf', hawk:'rescue_hawk', snake:'rescue_snake' };
  playNode(map[getMaxAff()]);
}

// Hidden ending: every bond at least this high (on the 0-100 scale). A random player gets there
// well under 1% of the time; one who deliberately keeps everyone close does about 1 run in 5.
const ALL_ENDING_MIN = 33;

function routeToEnding() {
  if (Object.values(state.affection).every(v => v >= ALL_ENDING_MIN)) return playNode('ending_all');
  const map = { fox:'ending_fox', wolf:'ending_wolf', deer:'ending_deer', whitewolf:'ending_whitewolf', hawk:'ending_hawk', snake:'ending_snake' };
  playNode(map[getMaxAff()]);
}

function setScene(name) {
  const bg = $('#scene-bg');
  const l = document.createElement('div');
  const img = BACKGROUNDS[name];
  l.className = img ? 'scene-layer scene-img' : `scene-layer bg-${name}`;
  if (img) l.style.backgroundImage = `url("${img}")`;
  l.style.opacity = '0';
  bg.appendChild(l);
  requestAnimationFrame(() => requestAnimationFrame(() => { l.style.opacity = '1'; }));
  const old = [...bg.children].filter(c => c !== l);
  setTimeout(() => old.forEach(c => c.remove()), 900);
}

function setParticles(type) {
  const c = $('#particles'); c.innerHTML = '';
  if (state.particleInterval) clearInterval(state.particleInterval);
  const cfg = { fireflies:{cls:'firefly',n:12,iv:3000}, sakura:{cls:'sakura-petal',n:10,iv:2000}, spirits:{cls:'spirit-orb',n:8,iv:4000}, snowflakes:{cls:'snowflake',n:15,iv:1500}, feathers:{cls:'feather',n:6,iv:4000} };
  const cf = cfg[type]; if (!cf) return;
  function spawn() {
    const p = document.createElement('div');
    p.className = `particle ${cf.cls}`;
    p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*80+'%';
    p.style.animationDuration = (5+Math.random()*8)+'s';
    p.style.animationDelay = Math.random()*2+'s';
    c.appendChild(p);
    setTimeout(() => p.remove(), 15000);
  }
  for (let i=0;i<cf.n;i++) setTimeout(spawn, Math.random()*3000);
  state.particleInterval = setInterval(spawn, cf.iv);
}

// Keeps characters already on screen in place (sliding them if their slot changes)
// so a line-level cast change doesn't make everyone flash back in.
function setChars(chars) {
  const l = $('#character-layer');
  const want = new Map(chars.map(c => [c.id, c]));
  [...l.children].forEach(el => {
    const c = want.get(el.dataset.id);
    if (!c || el.dataset.form !== c.form) { el.remove(); return; }
    if (el.dataset.pos !== c.pos) {
      el.dataset.pos = c.pos;
      const img = el.querySelector('img');
      if (img) img.style.cssText = portraitStyle(CHARS[c.id][c.form], c.pos);
    }
  });
  chars.forEach(c => {
    if (l.querySelector(`[data-id="${c.id}"]`)) return;
    const w = document.createElement('div');
    w.className = 'character-sprite entering';
    w.id = `char-${c.id}`;
    Object.assign(w.dataset, { id: c.id, pos: c.pos, form: c.form });
    w.innerHTML = getPortrait(c.id, CHARS[c.id][c.form], c.pos);
    l.appendChild(w);
    requestAnimationFrame(() => requestAnimationFrame(() => { w.classList.remove('entering'); w.classList.add('visible'); }));
  });
  if (chars.length < 2) l.querySelectorAll('.character-sprite').forEach(s => s.classList.remove('listening'));
}

function clearChars() { $('#character-layer').innerHTML = ''; }

function showTransform(charId, text) {
  const o = $('#transform-overlay');
  $('#transform-text').textContent = text;
  o.classList.add('active');
  const sc = state.chars.find(c => c.id === charId);
  if (sc) sc.form = 'beast';
  const charEl = $(`#char-${charId}`);
  if (charEl) {
    charEl.classList.add('beast-transform');
    charEl.dataset.form = 'beast';
    setTimeout(() => {
      charEl.innerHTML = getPortrait(charId, CHARS[charId].beast, charEl.dataset.pos);
      charEl.classList.remove('beast-transform');
    }, 1200);
  }
  setTimeout(() => o.classList.remove('active'), 2600);
}

function showChapter(num, title, cb) {
  const o = $('#chapter-overlay');
  $('#chapter-num').textContent = num;
  $('#chapter-title').textContent = title;
  o.classList.add('active');
  setTimeout(() => { o.classList.remove('active'); if (cb) cb(); }, skip.active() ? 600 : 3000);
}

// Endings reached, kept across playthroughs (fox ... snake, all). Drives the title-screen marks.
const ENDINGS_KEY = 'dujuansen-endings';
const ENDING_MARKS = [['fox', '#ff6b4a'], ['wolf', '#7eb8da'], ['deer', '#8fd4a0'], ['whitewolf', '#e8e0d0'], ['hawk', '#4a7eb8'], ['snake', '#9a5abf'], ['all', '#f3cf7a']];
let endingsMem = {};
function endingsSeen() { try { return JSON.parse(localStorage.getItem(ENDINGS_KEY) || '{}') || {}; } catch (e) { return endingsMem; } }
function markEnding(k) { const s = endingsSeen(); s[k] = 1; endingsMem = s; try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(s)); } catch (e) {} }

function showEnding(e) {
  if (skip.active()) setSkip(false);
  const route = /^ending_([a-z]+?)\d*$/.exec(state.currentNode || '');
  if (route) markEnding(route[1]);
  const es = $('#ending-screen'), gen = state.gen;
  es.classList.add('active', 'intro');
  requestAnimationFrame(() => requestAnimationFrame(() => { if (gen === state.gen && es.classList.contains('intro')) es.classList.add('fig-on'); }));
  const endIntro = () => { es.classList.remove('intro', 'fig-on'); es.onclick = null; };
  es.onclick = endIntro; // tap to go straight to the card
  setTimeout(() => { if (gen === state.gen) es.classList.remove('fig-on'); }, 3000);
  setTimeout(() => { if (gen === state.gen) endIntro(); }, 3700);
  $('#ending-title').textContent = e.title;
  $('#ending-subtitle').textContent = e.subtitle;
  $('#dialogue-layer').style.display = 'none';
}

function updateDay() {
  const d = $('#day-indicator');
  d.textContent = state.day > 0 ? `第 ${state.day} 天 / 7` : '';
  d.classList.toggle('show', state.day > 0);
}

// ============================================================
//  SAVE / LOAD
// ============================================================
const SAVE_KEY = 'dujuansen-saves-v1';
const STORY_VERSION = 14; // bump when node ids or line order change, so old saves can't resume mid-scene in the wrong place
const MANUAL_SLOTS = ['1','2','3','4','5','6','7','8'];
const storageOK = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
})();
let memSaves = {};

function readSaves() {
  if (!storageOK) return memSaves;
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function writeSaves(all) {
  memSaves = all;
  if (!storageOK) return true;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(all)); return true; } catch (e) { return false; }
}
function hasAnySave() { return !!latestSave(); }
function latestSave() {
  return Object.values(readSaves()).filter(d => d.sv === STORY_VERSION).sort((a, b) => b.time - a.time)[0] || null;
}

function snapshot() {
  const node = S[state.currentNode];
  const lines = node.lines || [];
  const atChoice = state.line >= lines.length && !!node.choices;
  const ln = lines[Math.min(state.line, lines.length - 1)];
  return {
    v: 1, sv: STORY_VERSION, time: Date.now(),
    node: state.currentNode, line: state.line,
    aff: { ...state.affection }, flags: { ...state.flags }, day: state.day,
    scene: state.scene, particles: state.particles,
    chars: state.chars.map(c => ({ ...c })), chapter: state.chapter, cg: state.cg || null,
    preview: ln ? { char: ln.char, text: ln.text, atChoice } : null,
  };
}

function autoSave() {
  const node = S[state.currentNode];
  if (!node || node.ending) return;
  const all = readSaves();
  all.auto = snapshot();
  writeSaves(all);
}

function saveToSlot(slot) {
  const all = readSaves();
  all[slot] = snapshot();
  if (writeSaves(all)) toast(`已保存到 存档 ${slot}`);
  else toast('保存失败：浏览器存储空间不可用');
  renderSlots('save');
}

function deleteSlot(slot, mode) {
  const all = readSaves();
  delete all[slot];
  writeSaves(all);
  renderSlots(mode);
  refreshTitleButtons();
}

function inGame() {
  return state.currentNode && $('#title-screen').style.display === 'none';
}

function applySave(d) {
  if (!d || d.sv !== STORY_VERSION || !S[d.node]) { toast('这是旧版剧情的存档，无法读取'); return; }
  closeSys();
  resetGame();
  const t = $('#title-screen');
  if (t.style.display !== 'none') { t.classList.add('hidden'); t.style.display = 'none'; }

  state.affection = { fox: 0, wolf: 0, deer: 0, whitewolf: 0, hawk: 0, snake: 0, ...d.aff };
  state.flags = { ...d.flags };
  state.day = d.day || 0;
  state.scene = d.scene; state.particles = d.particles;
  state.chars = (d.chars || []).map(c => ({ ...c }));
  state.chapter = d.chapter || null;
  state.currentNode = d.node;

  updateDay();
  if (state.scene) setScene(state.scene);
  setParticles(state.particles);
  setChars(state.chars);
  setFlashback(!!S[d.node].flashback);
  setCG(d.cg || null);
  playBgm(bgmFor(d.node));

  const node = S[d.node], lines = node.lines || [], i = d.line || 0;
  if (i >= lines.length && lines.length) {
    const last = lines[lines.length - 1], ch = CHARS[last.char];
    $('#speaker-name').textContent = ch.name; $('#speaker-name').style.color = ch.color;
    $('#dialogue-text').innerHTML = '';
    last.text.split('').forEach(c => { const s = document.createElement('span'); s.className = 'char visible'; s.textContent = c; $('#dialogue-text').appendChild(s); });
  }
  startLines(node, i);
}

function resetGame() {
  state.gen++;
  skip.on = false; skip.hold = false; syncSkipUI();
  detachDialogue();
  state.charTimers.forEach(t => clearTimeout(t)); state.charTimers = [];
  state.affection = { fox: 0, wolf: 0, deer: 0, whitewolf: 0, hawk: 0, snake: 0 };
  state.flags = {}; state.currentNode = null; state.day = 0; state.line = 0;
  state.scene = null; state.particles = null; state.chars = []; state.chapter = null;
  updateDay();
  setParticles(null); clearChars();
  $('#scene-bg').innerHTML = '';
  $('#speaker-name').textContent = ''; $('#dialogue-text').innerHTML = '';
  $('#text-indicator').classList.remove('show');
  ['#chapter-overlay', '#choice-layer', '#ending-screen', '#transform-overlay'].forEach(s => $(s).classList.remove('active'));
  $('#ending-screen').classList.remove('intro', 'fig-on');
  $('#dialogue-layer').style.display = '';
  setFlashback(false);
  setCG(null);
}

function backToTitle() {
  closeSys();
  resetGame();
  const t = $('#title-screen');
  t.style.display = '';
  t.classList.remove('hidden');
  refreshTitleButtons();
  playBgm('title');
}

// Fit the figure into the gap between the ending marks and the top button; skip it if the gap is too small.
function layoutTitleFigure() {
  const fig = $('#title-figure'), marks = $('#title-endings'), btn = [...$$('#title-buttons .title-btn')].find(b => !b.hidden);
  if (!marks.innerHTML || !btn) return fig.classList.remove('fits');
  const top = marks.getBoundingClientRect().bottom + 14, bottom = btn.getBoundingClientRect().top + 6; // feet tuck just behind the top button
  const h = Math.min(bottom - top, window.innerHeight * 0.4);
  fig.classList.toggle('fits', h >= 150);
  fig.style.height = h + 'px'; fig.style.top = (bottom - h) + 'px';
}
window.addEventListener('resize', () => { if ($('#title-screen').classList.contains('cleared')) layoutTitleFigure(); });

function refreshTitleButtons() {
  const any = hasAnySave();
  $('#continue-btn').hidden = !any;

// ============================================================
//  CHAPTER SELECT
//  Every choice the player makes is remembered by node id (across story versions). Starting
//  from a chapter replays the story up to that chapter's first node with those choices, the
//  same way the engine would (node flags, line flags with if/ifnot, met_* from speakers, choice affection/flags,
//  the affection-routed rescue), then plays the chapter for real. The flowchart lets the
//  player check or change the choices first.
// ============================================================
const PICKS_KEY = 'dujuansen-picks';
let picksMem = {};
function picksSeen() { try { return JSON.parse(localStorage.getItem(PICKS_KEY) || '{}') || {}; } catch (e) { return picksMem; } }
function recordPick(nodeId, text) {
  const p = picksSeen(), r = p[nodeId] || { last: '', seen: [] };
  r.last = text; if (!r.seen.includes(text)) r.seen.push(text);
  p[nodeId] = r; picksMem = p;
  try { localStorage.setItem(PICKS_KEY, JSON.stringify(p)); } catch (e) {}
}
const CHAPTERS = Object.keys(S).filter(id => S[id].chapter);
const AFF_KEYS = ['fox', 'wolf', 'deer', 'whitewolf', 'hawk', 'snake'];
const AFF_CHAR = { fox: 'kohaku', wolf: 'ginro', deer: 'shiro', whitewolf: 'yukimaru', hawk: 'sou', snake: 'genya' };
const visibleTo = (x, f) => !(x.if && !f[x.if]) && !(x.ifnot && f[x.ifnot]);
const FLAGS_USED = new Set();
Object.values(S).forEach(n => (n.lines || []).concat(n.choices || []).forEach(x => { if (x.if) FLAGS_USED.add(x.if); if (x.ifnot) FLAGS_USED.add(x.ifnot); }));

// picks: { nodeId: choiceText }. Unknown or hidden choices fall back to the first visible one.
function simulateStory(picks, stopAt) {
  const flags = {}, aff = Object.fromEntries(AFF_KEYS.map(k => [k, 0])), steps = [];
  let id = 'start', chap = -1;
  for (let guard = 0; guard < 2000; guard++) {
    if (id === stopAt) return { reached: true, flags, aff, steps };
    const n = S[id];
    if (!n) break;
    if (n.chapter) chap = CHAPTERS.indexOf(id);
    (n.flags || []).forEach(f => flags[f] = true);
    let ctx = '';
    for (const l of n.lines || []) if (visibleTo(l, flags)) {
      if (CHARS[l.char]?.affKey) flags['met_' + l.char] = true; // showDialogue: speaking marks them as met
      if (l.flag) flags[l.flag] = true;
      if (l.text.length > 6) ctx = l.text; // context for the flowchart: the last real line before the choice (not 「叮。」)
    }
    if (n.choices) {
      const vis = n.choices.filter(c => visibleTo(c, flags));
      const c = vis.find(c => c.text === picks[id]) || vis[0];
      const key = new Set(vis.map(c => c.next)).size > 1 || vis.some(c => c.flag && FLAGS_USED.has(c.flag));
      steps.push({ id, chap, ctx, vis, c, key });
      for (const [k, v] of Object.entries(c.affection || {})) aff[k] = Math.min(100, aff[k] + v * 95 / AFF_MAX[k]);
      if (c.flag) flags[c.flag] = true;
      id = c.next;
    } else if (n.next) id = n.next;
    else if (n.next_by_affection) {
      const k = Object.entries(aff).sort((x, y) => y[1] - x[1])[0][0]; // same tie-break as getMaxAff
      steps.push({ id, chap, auto: k });
      id = 'rescue_' + k;
    } else break;
  }
  return { reached: false, flags, aff, steps };
}

function chapterLabel(i) { const c = S[CHAPTERS[i]].chapter; return `${c.num} · ${c.title}`; }

function openChapters() {
  const rows = CHAPTERS.map((id, i) => {
    const c = S[id].chapter;
    return `<button class="menu-item chap-item" data-chap="${i}"><span class="chap-num">${c.num}</span>${c.title}</button>`;
  }).join('');
  const card = $('#sys-card');
  card.innerHTML = `
    <div class="sys-head"><span></span><div class="sys-title">章 节</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    <div class="slot-note" style="padding:10px 16px 0;text-align:center">从任意一章开始。之前的选择会按你玩过的记录自动填好，也可以改。</div>
    <div class="menu-list">${rows}</div>`;
  card.onclick = e => {
    if (e.target.closest('[data-act]')?.dataset.act === 'close') return closeSys();
    const i = e.target.closest('[data-chap]')?.dataset.chap;
    if (i == null) return;
    if (+i === 0) confirmBox('从序章开始？', () => startFromChapter(0, {}));
    else openChapterFlow(+i);
  };
  $('#sys-layer').classList.add('active');
}

let flowPicks = {}, flowAll = false;
function openChapterFlow(target) {
  const hist = picksSeen();
  flowPicks = Object.fromEntries(Object.entries(hist).map(([k, v]) => [k, v.last]));
  flowAll = false;
  renderChapterFlow(target);
  $('#sys-layer').classList.add('active');
}

function renderChapterFlow(target) {
  const card = $('#sys-card');
  const keep = card.querySelector('.flow')?.scrollTop || 0;
  const hist = picksSeen(), sim = simulateStory(flowPicks, CHAPTERS[target]);
  let html = '', lastChap = -1, hidden = 0, n = 0;
  for (const s of sim.steps) {
    if (s.chap !== lastChap) { html += `<div class="flow-chap">${chapterLabel(s.chap)}</div>`; lastChap = s.chap; }
    if (s.auto) {
      const ch = CHARS[AFF_CHAR[s.auto]];
      html += `<div class="flow-node auto"><div class="flow-q">危机之夜 · 好感最高的人会赶来</div><div class="flow-opt on" style="--c:${ch.color}">→ ${ch.name}</div></div>`;
      continue;
    }
    if (!s.key && !flowAll) { hidden++; continue; }
    const seen = hist[s.id]?.seen || [];
    const opts = s.vis.map(c => {
      const who = Object.keys(c.affection || {}).map(k => CHARS[AFF_CHAR[k]]);
      const dot = who.map(ch => `<i style="background:${ch.color}"></i>`).join('');
      return `<button class="flow-opt${c === s.c ? ' on' : ''}${seen.includes(c.text) ? ' seen' : ''}" data-node="${s.id}" data-text="${c.text.replace(/"/g, '&quot;')}">${dot}<span>${c.text}</span></button>`;
    }).join('');
    const ctx = s.ctx.length > 30 ? s.ctx.slice(0, 30) + '…' : s.ctx;
    html += `<div class="flow-node${s.key ? ' key' : ''}"><div class="flow-q">${ctx}</div>${opts}</div>`;
    n++;
  }
  html += `<div class="flow-chap target">${chapterLabel(target)}</div>`;
  const bars = AFF_KEYS.map(k => { const ch = CHARS[AFF_CHAR[k]]; return `<div class="flow-bar" title="${ch.name}"><div><b style="height:${Math.round(sim.aff[k])}%;background:${ch.color}"></b></div><span style="color:${ch.color}">${ch.name.slice(0, 1)}</span></div>`; }).join('');
  card.innerHTML = `
    <div class="sys-head"><button class="sys-close" data-act="back" aria-label="返回">‹</button><div class="sys-title">前 情</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    <div class="slot-note" style="padding:10px 14px 4px;text-align:center">从「${chapterLabel(target)}」开始。<br>亮着的是这次会用的选择，带 ✓ 的是你以前选过的。点一下就能换。</div>
    <div class="flow-tabs"><button data-act="key" class="${flowAll ? '' : 'on'}">关键选择</button><button data-act="all" class="${flowAll ? 'on' : ''}">全部选择</button></div>
    <div class="flow">${html}${hidden ? `<div class="slot-note" style="text-align:center;padding:6px 0 0">另有 ${hidden} 个小选择按记录自动填好</div>` : ''}</div>
    <div class="flow-foot"><div class="flow-bars">${bars}</div><button class="flow-go" data-act="go">从这里开始 ›</button></div>`;
  card.querySelector('.flow').scrollTop = keep;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') return closeSys();
    if (act === 'back') return openChapters();
    if (act === 'key' || act === 'all') { flowAll = act === 'all'; return renderChapterFlow(target); }
    if (act === 'go') return startFromChapter(target, flowPicks);
    const o = e.target.closest('.flow-opt[data-node]');
    if (o) { flowPicks[o.dataset.node] = o.dataset.text; renderChapterFlow(target); }
  };
}

function startFromChapter(target, picks) {
  const id = CHAPTERS[target], sim = simulateStory(picks, id);
  if (!sim.reached) { toast('这条路走不到这一章'); return; }
  sim.steps.forEach(s => { if (s.c) recordPick(s.id, s.c.text); }); // the choices used become the new defaults
  closeSys();
  resetGame();
  state.flags = { ...sim.flags };
  state.affection = { ...sim.aff };
  const gen = state.gen, t = $('#title-screen');
  const go = () => { if (gen === state.gen) { playBgm(bgmFor(id)); playNode(id); } };
  if (t.style.display !== 'none' && !t.classList.contains('hidden')) hideTitle(go); else { t.style.display = 'none'; go(); }
}

function fmtTime(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function slotThumb(d) {
  const c = (d.chars || [])[0];
  if (c && CHARS[c.id]) {
    const key = CHARS[c.id][c.form] || CHARS[c.id].human;
    const { ex = 50, ey = 12, h = 100, th = h } = PORTRAIT_POS[key] || {};
    const H = th * 2.6; // as if the thumbnail were a crop of a 260px-tall screen around the eyes
    if (PORTRAITS[key]) return `<img src="${PORTRAITS[key]}" alt="" style="position:absolute;width:auto;height:${H}px;top:${28 - ey / 100 * H}px;left:50%;transform:translateX(-${ex}%)">`;
    return CHARS[c.id].icon;
  }
  return '⛩️';
}

function slotHTML(slot, d, mode) {
  const label = slot === 'auto' ? '自动存档' : `存档 ${slot}`;
  if (!d) {
    return `<button class="slot${mode === 'load' ? ' disabled' : ''}" data-slot="${slot}">
      <div class="slot-thumb" style="opacity:.35">＋</div>
      <div class="slot-body"><div class="slot-name">${label}</div><div class="slot-empty">— 空 —</div></div></button>`;
  }
  if (d.sv !== STORY_VERSION) {
    return `<button class="slot disabled" data-slot="${slot}" data-old="1">
      <div class="slot-thumb" style="opacity:.35">⛩️</div>
      <div class="slot-body"><div class="slot-top"><span class="slot-name">${label}</span><span class="slot-time">${fmtTime(d.time)}</span></div>
      <div class="slot-line">旧版剧情的存档，已无法读取</div></div>${slot !== 'auto' ? `<span class="slot-del" data-del="${slot}" role="button" aria-label="删除">×</span>` : ''}</button>`;
  }
  const chap = d.chapter ? `${d.chapter.num} · ${d.chapter.title}` : '';
  const who = d.preview ? (CHARS[d.preview.char]?.name || '') : '';
  const line = d.preview ? (d.preview.atChoice ? '（正在做出选择）' : `${who ? who + '：' : ''}${d.preview.text}`) : '';
  const del = slot !== 'auto' ? `<span class="slot-del" data-del="${slot}" role="button" aria-label="删除">×</span>` : '';
  return `<button class="slot" data-slot="${slot}">
    <div class="slot-thumb">${slotThumb(d)}</div>
    <div class="slot-body">
      <div class="slot-top"><span class="slot-name">${label}</span><span class="slot-time">${fmtTime(d.time)}</span></div>
      <div class="slot-chap">${escapeHTML(chap)}</div>
      <div class="slot-line">${escapeHTML(line)}</div>
    </div>${del}</button>`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function renderSlots(mode) {
  const all = readSaves();
  const card = $('#sys-card');
  const slots = mode === 'load' ? ['auto', ...MANUAL_SLOTS] : MANUAL_SLOTS;
  const back = inGame() ? `<button class="sys-close" data-act="back" aria-label="返回">‹</button>` : '<span></span>';
  const note = storageOK ? '' : '<div class="slot-note">当前浏览器不允许保存数据，存档只在这次打开期间有效，关掉页面就会消失。</div>';
  card.innerHTML = `
    <div class="sys-head">${back}<div class="sys-title">${mode === 'save' ? '保存进度' : '读取进度'}</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    ${note}
    <div class="slot-list">${slots.map(s => slotHTML(s, all[s], mode)).join('')}</div>`;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') return closeSys();
    if (act === 'back') return openMenu();
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      e.stopPropagation();
      const s = delBtn.dataset.del;
      return confirmBox(`删除 存档 ${s}？\n删除后无法恢复。`, () => deleteSlot(s, mode));
    }
    const slotEl = e.target.closest('[data-slot]');
    if (!slotEl) return;
    const s = slotEl.dataset.slot, d = readSaves()[s];
    if (mode === 'save') {
      if (d) confirmBox(`覆盖 存档 ${s}？\n原来的进度会被替换。`, () => saveToSlot(s));
      else saveToSlot(s);
    } else if (d && d.sv === STORY_VERSION) {
      if (inGame()) confirmBox('读取这份存档？\n当前没有手动保存的进度会丢失。', () => applySave(d));
      else applySave(d);
    }
  };
}

$('#menu-btn').addEventListener('click', e => { e.stopPropagation(); openMenu(); });
$('#cg-viewer').addEventListener('click', () => $('#cg-viewer').classList.remove('show'));
$('#sys-layer').addEventListener('click', e => { if (e.target.id === 'sys-layer') closeSys(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#confirm-layer').classList.contains('active')) $('#confirm-no').click();
  else if ($('#sys-layer').classList.contains('active')) closeSys();
  else if (inGame()) openMenu();
});

$('#ending-restart').addEventListener('click', backToTitle);

initTitle();
</script>
</body>
</html>
