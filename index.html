      { char: 'narrator', text: '她伸手去拿桌上的速写本，想把它放回原处。一张纸从封底的夹层里滑了出来，飘到了榻榻米上。' },
      { char: 'narrator', text: '那是一张铅笔画。' },
      { char: 'narrator', text: '画上，一个很小的孩子，穿着黄色雨靴，蜷成一团，睡在一条巨大的蛇身上。蛇盘成一圈，把孩子护在正中间。' },
      { char: 'narrator', text: '画的角落，是外婆的字。' },
      { char: 'narrator', text: '「小不点和蛇先生。那天晚上，是他先找到的。——别告诉琥珀。」' },
      { char: 'narrator', text: '琥珀拿着那张画，很久没有动。' },
      { char: 'kohaku', text: '……二十年前那天晚上，我以为是银朗先找到你的。' },
      { char: 'kohaku', text: '我封住你的记忆的时候……明明看过的。我怎么会……' },
      { char: 'narrator', text: '她突然停住了。像是说漏了什么。' },
      { char: 'player', text: '……封住我的记忆？' },
      { char: 'narrator', text: '琥珀闭上了眼睛。' },
      { char: 'kohaku', text: '……今天，你想去哪里，就去哪里吧。' },
      { char: 'kohaku', text: '这件事，我需要一点时间。' },
    ],
    next: 'day4_free',
  },

  'day4_free': {
    scene: 'shrine', particles: 'sakura',
    lines: [
      { char: 'narrator', text: '你走出房间的时候，阳光很好。好得不像是在这样一个早上。' },
      { char: 'narrator', text: '白露坐在石阶上发呆。雪丸在樱树上晃腿。银朗站在鸟居下面，背对着神社。' },
      { char: 'narrator', text: '屋顶上的苍羽，比平时低一些。正殿后面那扇窄门，关得紧紧的。' },
      { char: 'narrator', text: '今天——你想和谁一起度过？' },
    ],
    choices: [
      { text: '回到外婆的房间，陪着琥珀', affection: { fox: 3 }, next: 'day4_kohaku' },
      { text: '走到鸟居下面，站在银朗旁边', affection: { wolf: 3 }, next: 'day4_ginro' },
      { text: '在白露身边坐下', affection: { deer: 3 }, next: 'day4_shiro' },
      { text: '爬上樱树，找雪丸', affection: { whitewolf: 3 }, next: 'day4_yukimaru' },
      { text: '对屋顶上的苍羽挥了挥手', affection: { hawk: 3 }, next: 'day4_sou' },
      { text: '趁没人注意，再下一次石阶', affection: { snake: 3 }, flag: 'genya_truth', next: 'day4_genya' },
    ],
  },

  'day4_kohaku': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀还坐在那里。那张画放在她膝盖上。' },
      { char: 'narrator', text: '她没有赶你走。你在她旁边坐下，陪她一起，把外婆的旧东西一件件拿出来，晒一晒，再叠好放回去。' },
      { char: 'kohaku', text: '这件羽织，是她四十岁那年我给她缝的。袖口破了三次，她都舍不得扔。' },
      { char: 'narrator', text: '你低头看看自己的袖口。那里也有一道细细的补丁，针脚和羽织上的一模一样。' },
      { char: 'kohaku', text: '你身上那件也是我缝的。千代穿旧一件，我就再缝一件。……一共六件。' },
      { char: 'kohaku', text: '你穿的是第六件。最新的。她只穿了一个冬天。' },
      { char: 'narrator', text: '羽织底下压着一面小小的手镜。琥珀拿起来，看都没看，就把镜面朝下，扣在了榻榻米上。' },
      { char: 'player', text: '琥珀……你不照镜子吗？' },
      { char: 'kohaku', text: '不照。' },
      { char: 'kohaku', text: '镜子会数数。数得很准。……我不想知道。' },
      { char: 'narrator', text: '她说完就笑了，像是在说一个玩笑。可是尾巴没有炸。' },
      { char: 'player', text: '琥珀。外婆八岁的时候，也是迷路进来的吗？' },
      { char: 'kohaku', text: '嗯。跟着她娘上山，自己跑丢了。坐在鸟居下面哭，哭得比你还大声。' },
      { char: 'kohaku', text: '我给了她一颗糖。她不哭了，抬头看着我说：「姐姐，你有耳朵。」' },
      { char: 'kohaku', text: '后来她叫了我三十年「琥珀姐姐」。再后来，她长得比我老了，就改口叫「琥珀」了。' },
      { char: 'kohaku', text: '最后那几年，她有时候会摸着我的头说：「小琥珀，要好好吃饭。」' },
      { char: 'narrator', text: '她笑出了声。笑着笑着，停住了。' },
      { char: 'kohaku', text: '……活得太久，就是这样。一个人从小不点，变成朋友，变成长辈，然后变成一张照片。' },
      { char: 'kohaku', text: '我送走过很多人。千代是最后一个我以为，会一直在的。' },
      { char: 'narrator', text: '她从柜子最深处，拿出一个小纸包。里面是几颗星星形状的糖。' },
      { char: 'kohaku', text: '二十年前你迷路那天。是我抹掉了你的记忆。' },
      { char: 'kohaku', text: '千代求我的。她说你是城里的孩子，要过普通的日子，不要被山里的事牵住。' },
      { char: 'kohaku', text: '对不起。那是你的东西，我不该替你拿走。' },
      { char: 'kohaku', text: '我能还给你的，只有我自己的那一段。……你想要吗？' },
      { char: 'player', text: '想。' },
      { char: 'narrator', text: '琥珀伸出手，指尖轻轻点在你的额头上。温热的，带着一点点花香。' },
    ],
    next: 'day4_kohaku_mem',
  },

  'day4_kohaku_mem': {
    scene: 'shrine', particles: 'spirits', flashback: true,
    lines: [
      { char: 'narrator', text: '——一颗金平糖在嘴里化开的甜味。' },
      { char: 'narrator', text: '红头发的姐姐蹲在你面前，尾巴扫过你的膝盖。痒痒的。' },
      { char: 'narrator', text: '你抓住那条尾巴，把脸埋进去。好暖和。' },
      { char: 'narrator', text: '「姐姐，你的尾巴好多。一、二、三……」' },
      { char: 'narrator', text: '「嘘——这是秘密哦。」' },
      { char: 'narrator', text: '「姐姐，我长大了还可以来找你玩吗？」' },
      { char: 'narrator', text: '「……可以哦。我等你。」' },
      { char: 'narrator', text: '她说这句话的时候，眼睛是红的。可是你那时候太小了，以为是灯笼的光。', flag: 'mem_kohaku' },
    ],
    next: 'day4_kohaku2',
  },

  'day4_kohaku2': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'player', text: '……我说过，长大了要来找你。' },
      { char: 'kohaku', text: '嗯。' },
      { char: 'kohaku', text: '你来了。晚了二十年。' },
      { char: 'narrator', text: '她把一颗金平糖放进你手心，和二十年前一模一样。' },
      { char: 'narrator', text: '你把糖放进嘴里。很甜。甜得你鼻子发酸。' },
      { char: 'kohaku', text: '那天晚上，你抱着我的尾巴睡着了。口水流了我一尾巴。' },
      { char: 'player', text: '……对不起。' },
      { char: 'kohaku', text: '我洗了三天。……可是没舍得洗干净。' },
      { char: 'player', text: '那剩下的呢？那天晚上，我在地底下……' },
      { char: 'kohaku', text: '……那一段，封在很深的地方。和别的记忆缠在一起，我一个人解不开。' },
      { char: 'narrator', text: '她低头看着膝盖上的那张画。蛇盘成一圈，把孩子护在正中间。' },
      { char: 'kohaku', text: '而且，我好像……也不知道那一段里，到底有什么。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_ginro': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗没有赶你走。你们并排站在鸟居下面，很久都没说话。' },
      { char: 'ginro', text: '……蛇的味道，还在你身上。' },
      { char: 'player', text: '你要骂我吗？' },
      { char: 'ginro', text: '不。' },
      { char: 'ginro', text: '千代也总有蛇的味道。每个满月，从地底上来，都有。' },
      { char: 'ginro', text: '我从来没问过她。' },
      { char: 'narrator', text: '他转身往林子里走，走了两步，停下来等你。' },
      { char: 'ginro', text: '来。今天教你听结界。' },
      { char: 'narrator', text: '你照他说的，把手贴在一棵老杉树上。' },
      { char: 'ginro', text: '别想别的。想你外婆的铃。' },
      { char: 'narrator', text: '过了很久——掌心底下，有什么东西轻轻跳了一下。温的。像是隔着很厚的毯子，摸到了一只小动物的心跳。' },
      { char: 'player', text: '……我听到了。' },
      { char: 'ginro', text: '嗯。千代学了三个月。你一个上午。' },
      { char: 'narrator', text: '他说得很淡，可是你觉得那是夸奖。' },
      { char: 'narrator', text: '巡逻的路走到一半，经过一间很小的木屋。屋檐很低，门口堆着劈好的柴。' },
      { char: 'ginro', text: '……我住的地方。' },
      { char: 'narrator', text: '屋里什么都没有。一张草席，一把刀架，一个铁罐子。还有一整面墙的架子。' },
      { char: 'narrator', text: '架子上，密密麻麻地摆着小小的木雕。每一个都只有拇指那么大。' },
      { char: 'narrator', text: '全都是铃铛。' },
      { char: 'ginro', text: '每次送千代下山，回来以后，我就刻一个。' },
      { char: 'ginro', text: '六百零三个。' },
      { char: 'narrator', text: '最后一个，放在架子的最边上。只刻了一半，刀痕还是新的。' },
      { char: 'ginro', text: '……上个满月，没有送她下山。所以不知道该不该刻完。' },
      { char: 'narrator', text: '他把那个只刻了一半的铃，和一把小刀，一起放在你手心里。' },
      { char: 'ginro', text: '……你刻一刀。' },
      { char: 'narrator', text: '你小心翼翼地刻了一下。刀滑了，刻歪了。' },
      { char: 'ginro', text: '歪了。' },
      { char: 'ginro', text: '……千代第一次刻的时候，也歪了。' },
    ],
    choices: [
      { text: '「刻完吧。……她走的那天，你也在送她。」', affection: { wolf: 3 }, next: 'day4_ginro2' },
      { text: '「下个满月，我走的时候，你送我下山。然后刻第六百零四个。」', affection: { wolf: 4 }, next: 'day4_ginro2' },
    ],
  },

  'day4_ginro2': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '银朗看着你。冰蓝色的眼睛里，有什么东西晃了一下。' },
      { char: 'ginro', text: '……六百年前，北边的狼群有一条规矩：人类进了领地，就要咬死。' },
      { char: 'ginro', text: '有一年冬天，一个人类的孩子掉进了雪沟。族长让我去。' },
      { char: 'ginro', text: '我把那个孩子叼了出来，送到了山下的村子口。' },
      { char: 'ginro', text: '回去以后，我就被赶出来了。「银色的叛徒」。走了三个月，倒在这片森林外面。琥珀捡到了我。' },
      { char: 'player', text: '……那雪丸呢？你为什么一直赶他走？' },
      { char: 'ginro', text: '北边还有一条规矩。收留叛徒的狼，也是叛徒。' },
      { char: 'ginro', text: '他留在我身边一天，就一天回不去。他娘拼了命才让他在族里长大，我不能让他跟我一样。' },
      { char: 'ginro', text: '而且——我什么都给不了他。一片不是我的森林，一把刀，一条巡逻的路。' },
      { char: 'player', text: '他不想回去。他想要的，是有人叫他的名字。' },
      { char: 'narrator', text: '银朗的手按在门框上，指节慢慢收紧了。' },
      { char: 'ginro', text: '……那小子。今天早上，鱼吃完了吗。' },
      { char: 'player', text: '吃完了。连骨头都啃了。' },
      { char: 'ginro', text: '……是吗。' },
      { char: 'narrator', text: '回去的路上，他一直走在你的左边。你想起外婆的速写本，偷偷笑了。' },
      { char: 'narrator', text: '走到半路，他忽然停下来，朝北边看了很久。鼻翼动了动。' },
      { char: 'ginro', text: '……那小子，又往北去了。' },
      { char: 'ginro', text: '跟他说了，不许去。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_shiro': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露没说话。他拉着你的衣角，把你带到了花谷里，白樱树下。' },
      { char: 'narrator', text: '他从树洞里，抱出来一个铁皮盒子。盒子上印着一个褪了色的卡通熊。' },
      { char: 'shiro', text: '……我的宝物。给你看。' },
      { char: 'narrator', text: '盒子里装满了东西。汽水瓶盖，一枚停了的手表，一只断了腿的塑料恐龙，几张糖纸，整整齐齐地叠着。' },
      { char: 'shiro', text: '都是千代婆婆带上来的。这是「手表」，会告诉你现在几点。不过它死掉了，一直是三点十五分。' },
      { char: 'shiro', text: '这是「恐龙」。以前的人类会骑它吗？' },
      { char: 'player', text: '……不会。它们比人类早很多很多年。' },
      { char: 'shiro', text: '哇……' },
      { char: 'narrator', text: '盒子最底下，压着一张明信片。一片蓝色的海，白色的浪，远处有一座小小的灯塔。' },
      { char: 'shiro', text: '这个，是「海」。' },
      { char: 'shiro', text: '千代婆婆说，真的海比这个大一万倍。可是我想象不出来。一万倍，是比整座山还大吗？' },
      { char: 'narrator', text: '他把明信片捧在手心里，看了又看。然后，小声说——' },
      { char: 'shiro', text: '……我不想恨了。' },
      { char: 'shiro', text: '昨天晚上，我一直在想你说的话。可是如果不恨他……我就不知道娘为什么会死了。' },
      { char: 'shiro', text: '我好怕。' },
    ],
    choices: [
      { text: '在明信片背面，画下你记得的海', affection: { deer: 3 }, next: 'day4_shiro2' },
      { text: '握住他的手：「不知道的事，我陪你一起去找。」', affection: { deer: 3 }, next: 'day4_shiro2' },
    ],
  },

  'day4_shiro2': {
    scene: 'garden', particles: 'sakura', flashback: true,
    lines: [
      { char: 'narrator', text: '白露靠在你肩膀上。白樱的花瓣一片一片地落下来。' },
      { char: 'narrator', text: '你闭上眼睛。忽然——' },
      { char: 'narrator', text: '——同样的樱树下。同样的花瓣。' },
      { char: 'narrator', text: '一个翠绿头发的小男孩，笨手笨脚地编着一个花环。编散了，再编。' },
      { char: 'narrator', text: '他把花环戴在一个穿黄色雨靴的小孩头上。', cg: 'cg_shiro_garland' },
      { char: 'narrator', text: '「好啦！你是花之王！」' },
      { char: 'narrator', text: '小孩摸着头上的花环，认真地说：「小鹿哥哥，等我长大了，带你去看海。」' },
      { char: 'narrator', text: '「……真的？」' },
      { char: 'narrator', text: '「拉钩！」', flag: 'mem_shiro' },
    ],
    next: 'day4_shiro3',
  },

  'day4_shiro3': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'player', text: '……白露。我们以前，是不是在这里拉过钩？' },
      { char: 'narrator', text: '白露猛地坐直了。眼睛瞪得圆圆的。' },
      { char: 'shiro', text: '你、你想起来了？！' },
      { char: 'shiro', text: '二十年前！你戴着我编的花环，说要带我去看海！我一直记得！可是你走了以后就再也没来过，千代婆婆说你把这里忘了……' },
      { char: 'shiro', text: '所以千代婆婆才说「我替那孩子带你去」……' },
      { char: 'narrator', text: '他的眼泪一下子涌了出来。可是这一次，他在笑。' },
      { char: 'shiro', text: '原来……约好要带我去看海的，有两个人啊。' },
      { char: 'narrator', text: '他头上的角，一口气开出了五六朵花。粉的，白的。还有一朵，是很淡很淡的蓝色。' },
      { char: 'shiro', text: '你给我讲讲海吧！就现在！我想听你讲的海！' },
      { char: 'narrator', text: '你讲了。讲浪是怎么一层一层推上来的，讲退潮以后沙子里的小螃蟹，讲风里咸咸的味道。' },
      { char: 'narrator', text: '白露听得很认真。听到一半，他的头一点一点地，靠到了你的肩膀上。' },
      { char: 'narrator', text: '他睡着了。睡得很沉，怎么叫都叫不醒。' },
      { char: 'narrator', text: '你摸了摸他的角根。是凉的。花瓣边缘，又黄了一圈。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_yukimaru': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '哟。被琥珀姐骂了？' },
      { char: 'yukimaru', text: '别在意别在意。我被银朗骂了半年，现在耳朵都长茧了。抓紧了啊——一、二——' },
      { char: 'narrator', text: '你还没来得及说「等一下」，就被他扛上了肩膀。风在耳边呼啸，几个纵跳之后，你们站在了森林最高的那棵树上。' },
      { char: 'yukimaru', text: '看，北边。那一排白的。' },
      { char: 'narrator', text: '很远很远的地方，天边有一线雪白的山脊，像是用刀切出来的。', cg: 'cg_yuki_treetop' },
      { char: 'yukimaru', text: '那就是我家。……以前是。' },
      { char: 'player', text: '你想回去吗？' },
      { char: 'yukimaru', text: '不想。那边规矩太多。不准化人形，不准靠近人类，不准离开领地，不准这不准那。' },
      { char: 'yukimaru', text: '我娘在那里憋了一辈子。她小时候可野了，据说天天跟在一只银色的哥哥屁股后面跑。' },
      { char: 'yukimaru', text: '后来那个哥哥被赶走了。她就再也没跑过。' },
      { char: 'narrator', text: '他晃着腿，尾巴垂在树枝下面，一动不动。' },
      { char: 'yukimaru', text: '族里的老家伙们都叫他「银色的叛徒」。说他为了一个人类小鬼背叛了族群。' },
      { char: 'yukimaru', text: '可我娘不是这么说的。她说，那是整个族里最温柔的一只狼。' },
      { char: 'yukimaru', text: '她临走的时候拉着我的手说：「雪丸，去找你舅舅。他会叫你的名字的。」' },
      { char: 'narrator', text: '他咧嘴一笑。虎牙露出来，眼睛却有点亮。' },
      { char: 'yukimaru', text: '结果呢。半年了。「你」「小子」「回去」。' },
      { char: 'yukimaru', text: '……喂。人类是怎么让别人叫自己名字的？' },
    ],
    choices: [
      { text: '「大概……先叫对方的名字吧。」', affection: { whitewolf: 3 }, next: 'day4_yukimaru2' },
      { text: '「我叫你。——雪丸。」', affection: { whitewolf: 4 }, flag: 'called_yuki', next: 'day4_yukimaru2' },
    ],
  },

  'day4_yukimaru2': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸整个人僵住了。然后，从耳朵尖开始，一路红到了脖子。', if: 'called_yuki' },
      { char: 'yukimaru', text: '你、你你你干嘛突然叫——！', if: 'called_yuki' },
      { char: 'yukimaru', text: '……再、再叫一次。刚才风太大，没听清。', if: 'called_yuki' },
      { char: 'player', text: '雪丸。', if: 'called_yuki' },
      { char: 'narrator', text: '他把脸埋进膝盖里，尾巴疯了一样地拍打着树枝，震下来一大片雪。', if: 'called_yuki' },
      { char: 'yukimaru', text: '……那也太丢脸了。', ifnot: 'called_yuki' },
      { char: 'narrator', text: '过了好一会儿，他才抬起头，对着北边的风，很小声地，练习了一下——' },
      { char: 'yukimaru', text: '……舅舅。' },
      { char: 'yukimaru', text: '啊啊啊不行不行！你刚才什么都没听到！' },
      { char: 'narrator', text: '他跳起来，差点从树上摔下去。你一把抓住他的尾巴。' },
      { char: 'yukimaru', text: '嗷！尾巴不行！尾巴是狼的尊严！' },
      { char: 'narrator', text: '笑闹过后，他坐下来，眯着眼睛看北边。' },
      { char: 'yukimaru', text: '……喂，你昨天晚上下去了吧。银朗闻出来的时候，我也闻到了。' },
      { char: 'yukimaru', text: '那条蛇的味道，我在北坡也闻到过。每一个烂掉的地方，都有。' },
      { char: 'yukimaru', text: '可是还有另一种味道。很淡，很怪。不是我们任何一个人的。' },
      { char: 'yukimaru', text: '像是……很久很久以前，被人忘在哪里的东西。' },
      { char: 'narrator', text: '他沉默了一会儿。风把树枝上的雪吹下来，落在你们的头发上。' },
      { char: 'yukimaru', text: '……喂。' },
      { char: 'yukimaru', text: '如果有一天，我做了一件很坏很坏的事。' },
      { char: 'yukimaru', text: '你……还会叫我的名字吗？' },
      { char: 'narrator', text: '他没有看你。一只手按在领口上，按得很紧。指节都白了。' },
      { char: 'player', text: '什么坏事？' },
      { char: 'yukimaru', text: '哈哈！开玩笑的！看你那张脸！' },
      { char: 'narrator', text: '他从树枝上一跃而下，在雪地上打了个滚，爬起来冲你挥手。' },
      { char: 'yukimaru', text: '我去北坡转一圈！那个怪味道，我得去闻清楚！晚饭前回来！' },
      { char: 'narrator', text: '白影一闪，就不见了。' },
      { char: 'narrator', text: '你后来才知道，那是那天，他最后一次笑得那么响。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽从屋顶上落下来，站在你面前，看了你很久。' },
      { char: 'sou', text: '……你想看看天上吗？' },
      { char: 'player', text: '可以吗？' },
      { char: 'sou', text: '千代年轻的时候，我带她飞过一次。她尖叫了一路，落地以后说「再来一次」。' },
      { char: 'narrator', text: '他退后一步。风忽然大了起来，蓝色的羽毛在空中散开——', transform: { char: 'sou', text: '蓝鹰 · 展翼' } },
      { char: 'narrator', text: '一只巨大的蓝鹰低下头，示意你爬上它的背。' },
      { char: 'narrator', text: '然后，地面一下子远了。' },
      { char: 'narrator', text: '整片杜鹃森在脚下展开。绿色的海洋，神社是其中一粒小小的红点，溪流像银线一样穿过去。', cg: 'cg_sou_flight' },
      { char: 'narrator', text: '可是在森林的北边，你看到了一片一片的黑色。像墨水滴在宣纸上，正在慢慢晕开。' },
      { char: 'sou', text: '三天前，只有一片。今天，是十一片。' },
      { char: 'sou', text: '我每天都在数。' },
      { char: 'narrator', text: '他在云层边缘盘旋。风很大，他的声音却很清楚。' },
      { char: 'sou', text: '……你十二岁那年，千代让我去城里看过你一次。' },
      { char: 'player', text: '……诶？' },
      { char: 'sou', text: '你在学校的操场边上，一个人吃便当。其他孩子在跑，在笑。你一直看着他们，没有过去。' },
      { char: 'sou', text: '回来以后，千代问我：「那孩子好吗？」' },
      { char: 'sou', text: '我说：「很好。」' },
      { char: 'sou', text: '……那是我这辈子，唯一一次对她撒谎。', flag: 'mem_sou' },
      { char: 'narrator', text: '风很大。你把脸贴在他背上的羽毛里。羽毛是暖的。' },
    ],
    choices: [
      { text: '「……谢谢你替我撒谎。」', affection: { hawk: 3 }, next: 'day4_sou2' },
      { text: '「那你呢？一个人在天上，也很好吗？」', affection: { hawk: 4 }, next: 'day4_sou2' },
    ],
  },

  'day4_sou2': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '落地的时候，他变回了人形。风把他的长发吹到你的肩膀上。' },
      { char: 'sou', text: '在天上，什么都看得见。谁在哭，谁在笑，谁一个人坐在溪边，谁一个人按着石头。' },
      { char: 'sou', text: '看得见所有人，就碰不到任何人。' },
      { char: 'sou', text: '千代的饭团，是我唯一愿意落到屋檐上的理由。' },
      { char: 'narrator', text: '他抬起头，看着天上。很久很久。' },
      { char: 'sou', text: '……我决定了。' },
      { char: 'sou', text: '今天，我去跟琥珀说。' },
      { char: 'player', text: '说完了，会下来吃午饭吗？' },
      { char: 'sou', text: '……先说完。再吃。' },
      { char: 'narrator', text: '他转身走向神社。走了两步，被一根树根绊了一下。' },
      { char: 'sou', text: '……这个也不算。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'genya', text: '白天也敢下来？千代至少还知道挑晚上。' },
      { char: 'narrator', text: '玄夜靠在要石旁边，脸色比前一晚更白了。可他看到你，还是扬了扬下巴，指了指棋盘。' },
      { char: 'genya', text: '被那只狐狸骂了吧。脸上写着呢。' },
      { char: 'genya', text: '会下棋吗？' },
      { char: 'player', text: '……只知道五子连成一线就赢。' },
      { char: 'genya', text: '那是五子棋。算了，教你。反正你外婆当年也是从这个水平开始的。' },
      { char: 'narrator', text: '黑子，白子。他下得很慢，每一步都要按着要石缓一口气。你输了三盘，第四盘，他故意让你赢了。', cg: 'cg_genya_go' },
      { char: 'genya', text: '跟你外婆一样。赢了就笑得像个傻子。' },
      { char: 'narrator', text: '要石的光，又闪了一下。这一次你看清了——是一个小孩子，穿着黄色的雨靴，在石阶上摇摇晃晃地跑。' },
      { char: 'narrator', text: '那是……你？' },
      { char: 'narrator', text: '玄夜伸手按住了石头。光一下子暗了下去。', flag: 'q_stone' },
      { char: 'genya', text: '……说了，别看。' },
      { char: 'player', text: '玄夜。六十年前，白露的娘……到底发生了什么？' },
      { char: 'narrator', text: '他捏着一枚白子，停在了半空中。' },
      { char: 'genya', text: '……你还真是，一点都不怕问。' },
      { char: 'genya', text: '结界破了。一只堕兽钻了进来，扑向那棵白樱底下。树洞里，藏着一只小鹿。' },
      { char: 'genya', text: '她挡在树洞前面。我赶到的时候，她已经站不住了。' },
      { char: 'genya', text: '我把堕兽绞碎了。然后，把她缠了起来。' },
      { char: 'player', text: '缠起来……' },
      { char: 'genya', text: '蛇的身体是冷的。可是缠紧了，也能挡住风。' },
      { char: 'genya', text: '她血流得太多了，冷得一直发抖。我能做的，只有这个。缠着她，等天亮。' },
      { char: 'genya', text: '她走之前，一直在说一个名字。白露，白露。', flag: 'a_mother' },
      { char: 'narrator', text: '棋子落在棋盘上。很轻的一声。' },
      { char: 'player', text: '为什么不告诉他？他恨了你六十年！' },
      { char: 'genya', text: '因为那孩子需要一个可以恨的东西。' },
      { char: 'genya', text: '恨一条蛇，比恨他娘为什么丢下他一个人，要容易得多。' },
      { char: 'genya', text: '千代知道。她劝了我很多年。我没听。' },
      { char: 'narrator', text: '他抬起眼睛看你。那双紫色的竖瞳里，第一次没有笑意。' },
      { char: 'genya', text: '现在你也知道了。要不要告诉他——那是你的事。' },
      { char: 'genya', text: '……我只是，不想让他再怕我了。怕了六十年，也该累了。' },
      { char: 'narrator', text: '他咳了起来。你伸手去扶他，碰到了他的手臂——冰得吓人。灰色的鳞片，已经爬到了手肘。' },
      { char: 'player', text: '玄夜，你的身体……' },
      { char: 'genya', text: '我说过了。吃得越多，就越像它。' },
      { char: 'genya', text: '……还有三天。撑得住的。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_sou_confess': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '午后。琥珀在前庭里给杜鹃浇水。' },
      { char: 'narrator', text: '一阵风压了下来。苍羽落在了她面前的石板上。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '水壶停在了半空中。' },
      { char: 'kohaku', text: '……苍羽？你下来了？' },
      { char: 'kohaku', text: '上一次你落到地上，是多少年前来着？' },
      { char: 'sou', text: '琥珀。我有话要说。' },
      { char: 'sou', text: '上个满月之前，我看到一辆白色的车，把千代从镇上带走了。' },
      { char: 'sou', text: '我跟着那辆车，一直飞到城里的医院。从那天起，我每天都去。停在她病房窗外的那棵树上。' },
      { char: 'sou', text: '她瘦了很多。有一天，她好像看到我了，对着窗户笑了一下。' },
      { char: 'sou', text: '那天在下雨。我没有地方躲，就那样淋着。' },
      { char: 'sou', text: '她对着窗户，说了一句话。隔着玻璃，我听不见。', if: 'told_sou_window' },
      { char: 'narrator', text: '可是你知道她说了什么。', if: 'told_sou_window' },
      { char: 'player', text: '……「那孩子，又在外面淋雨了。」', if: 'told_sou_window' },
      { char: 'narrator', text: '苍羽闭上了眼睛。琥珀手里的水壶，晃了一下。', if: 'told_sou_window' },
      { char: 'sou', text: '……她说的，是我啊。', if: 'told_sou_window' },
      { char: 'sou', text: '她好像，在跟谁说话。', ifnot: 'told_sou_window' },
      { char: 'sou', text: '那天晚上，窗帘拉上了。后来的葬礼，黑色的伞——我从很高的地方看着，看了一整个下午。' },
      { char: 'sou', text: '每天傍晚我飞回来，落在屋顶上。你在下面扫地，哼着歌，在算千代下次来要做什么点心。' },
      { char: 'sou', text: '我没有下去。二十多天，一个字都没有说。让你在鸟居下面，白白等了整整一夜。' },
      { char: 'sou', text: '……对不起。', flag: 'a_sou' },
      { char: 'narrator', text: '水壶从琥珀手里放了下来。她走到苍羽面前，抬头看着这个比她高出一头的人。' },
      { char: 'kohaku', text: '傻孩子。' },
      { char: 'kohaku', text: '你一个人在那扇窗户外面……守了多久？' },
      { char: 'sou', text: '……二十五天。' },
      { char: 'narrator', text: '琥珀伸出手，理了理苍羽被风吹乱的头发。苍羽没有躲。' },
      { char: 'kohaku', text: '下次，就下来吧。一个人在上面，太冷了。' },
      { char: 'narrator', text: '苍羽垂下眼睛。那一瞬间，他看起来不像是守望天空的鹰，只是一个很累的、终于落了地的孩子。' },
      { char: 'narrator', text: '然后，他又开口了。' },
      { char: 'sou', text: '……还有一件事。' },
      { char: 'sou', text: '千代住院的那天，我飞回来之后，第一个去告诉的——是地底下那条蛇。' },
      { char: 'narrator', text: '琥珀的手，停在了苍羽的头发上。' },
      { char: 'kohaku', text: '……为什么是他？' },
      { char: 'sou', text: '因为他问了。' },
      { char: 'sou', text: '他每天都在洞口等我。问「今天千代怎么样」。一天都没有漏过。' },
      { char: 'narrator', text: '琥珀什么都没说。可是她转过头，看向了正殿后面那扇窄门。看了很久。' },
    ],
    next: 'day4_afternoon',
  },

  'day4_afternoon': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '傍晚之前，天阴了下来。你帮琥珀把晒了一天的被子收进屋。' },
      { char: 'narrator', text: '收到最后一床的时候，琥珀不见了。' },
      { char: 'narrator', text: '你在正殿最里面找到了她。她站在那扇贴着旧符的窄门前面，一只手按在符上。' },
      { char: 'narrator', text: '没有推。也没有走。就那样站着。' },
      { char: 'kohaku', text: '……二十六天。他每天都在洞口等苍羽，问千代怎么样。' },
      { char: 'kohaku', text: '我每天都在上面扫地。离他，只隔着这一扇门。' },
      { char: 'narrator', text: '她的指尖在旧符上划了一下。符纸已经很旧了，边角卷着，是很多很多年前贴上去的。' },
      { char: 'kohaku', text: '这张符，是我贴的。六十年前，那天晚上以后。' },
      { char: 'kohaku', text: '我跟自己说，是为了把他关在下面。……其实是为了让我自己，不用下去。' },
    ],
    choices: [
      { text: '「要我陪你下去吗？」', affection: { fox: 2 }, flag: 'offered_door', next: 'day4_afternoon2' },
      { text: '什么也没说，站到她旁边，一起看着那扇门', affection: { fox: 1, snake: 1 }, next: 'day4_afternoon2' },
    ],
  },

  'day4_afternoon2': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀转过头来，看着你。像是没想到你会这么说。', if: 'offered_door' },
      { char: 'kohaku', text: '……还不行。', if: 'offered_door' },
      { char: 'kohaku', text: '现在下去，我只会跟他吵架。六十年的架，一次吵不完的。', if: 'offered_door' },
      { char: 'kohaku', text: '等满月以后。等结界好了，大家都没事了。……那时候，你陪我。', if: 'offered_door' },
      { char: 'narrator', text: '你们就那样并排站着。门缝里的凉气，一阵一阵地吹出来。', ifnot: 'offered_door' },
      { char: 'narrator', text: '过了很久，门的那一边，传来一声很轻很轻的咳嗽。', ifnot: 'offered_door' },
      { char: 'narrator', text: '琥珀的耳朵抖了一下。她的手，从符上滑了下来。', ifnot: 'offered_door' },
      { char: 'narrator', text: '屋顶上传来苍羽的声音。很急，是你从来没听过的那种急。' },
      { char: 'sou', text: '北坡。黑的，十四片了。' },
      { char: 'sou', text: '……刚才有一道白影，往那边去了。' },
      { char: 'narrator', text: '琥珀猛地抬起头。' },
    ],
    next: 'day4_search',
  },

  'day4_search': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '傍晚。晚饭摆好了，雪丸没有来。' },
      { char: 'narrator', text: '平时他总是第一个到，第一个抢鱼。今天，他的碗一直空着。' },
      { char: 'narrator', text: '白露从石阶下面跑上来，上气不接下气。',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'shiro', text: '雪、雪丸！中午他说在北坡闻到一个奇怪的味道，要去看看！说天黑前一定回来！' },
      { char: 'shiro', text: '他说……那个味道，像是很久很久以前，被人忘在哪里的东西。' },
      { char: 'shiro', text: '可是……可是天已经黑了！' },
      { char: 'narrator', text: '银朗放下了碗。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '……我跟他说了。别去北坡。' },
      { char: 'ginro', text: '所以他才去的。' },
      { char: 'narrator', text: '他起身，拿刀，走下石阶。脚步很快，快到你几乎追不上。' },
      { char: 'ginro', text: '你留下。' },
      { char: 'player', text: '我跟你去。我能听结界——你教过我的。' },
      { char: 'narrator', text: '银朗看了你一眼。只有一眼。' },
      { char: 'ginro', text: '……跟紧。走我左边。' },
    ],
    next: 'day4_search2',
  },

  'day4_search2': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '北坡的林子，静得可怕。' },
      { char: 'narrator', text: '连虫鸣都没有。月光照在树干上，一棵，两棵，三棵……每一棵上面，都爬着黑色的斑。' },
      { char: 'narrator', text: '银朗的鼻子一直贴着地面。他走得越来越快，最后几乎是在跑。' },
      { char: 'narrator', text: '然后，你听到了。' },
      { char: 'narrator', text: '前面的坡下，传来一声嘶哑的狼嚎。很短，然后断了。' },
      { char: 'ginro', text: '——！' },
      { char: 'narrator', text: '银朗冲了下去。你跟在后面，滑了一跤，滚下坡，爬起来——' },
      { char: 'narrator', text: '看到了。' },
      { char: 'narrator', text: '一只白狼倒在树根下，雪白的毛上全是血。它还在拼命地想站起来，挡在一棵被黑色缠满的老树前面。' },
      { char: 'narrator', text: '它对面，站着一个东西。' },
      { char: 'narrator', text: '黑色的，像一团会动的烟。它曾经大概是一只狸猫。现在只剩下一个佝偻的、饿的形状。' },
      { char: 'narrator', text: '它的脖子上，挂着一根褪色的红绳。红绳上，系着一个很小很小的、裂开的铜铃。' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '是你口袋里的铃。它自己响了。' },
      { char: 'narrator', text: '黑烟猛地停住了。那团没有形状的东西，朝你的方向，转过了……大概是头的地方。' },
      { char: 'narrator', text: '它往前挪了一步。不是扑。是挪。像一个很小的孩子，在暗处认出了什么。' },
      { char: 'narrator', text: '银朗拔出了刀。', transform: { char: 'ginro', text: '苍银狼' } },
      { char: 'narrator', text: '然后，他就不是银朗了。一头巨大的银狼从月光里扑了出去，把那团黑烟整个撕开。' },
      { char: 'narrator', text: '黑烟发出一声不像任何动物的尖叫。散掉之前，它好像——回过头，看了你一眼。' },
      { char: 'narrator', text: '那双眼睛里，没有恨。只有一种很深很深的、迷路一样的茫然。' },
      { char: 'narrator', text: '黑烟散了。地上，只剩下那根红绳，和那个裂开的小铃铛。', flag: 'q_cord' },
    ],
    next: 'day4_search3',
  },

  'day4_search3': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸变回了人形，靠在树根上，喘着粗气。胳膊上的绷带全被血浸透了。' },
      { char: 'yukimaru', text: '……嘿嘿。晚饭，是不是……已经开始了……' },
      { char: 'narrator', text: '银朗跪在他面前，手在发抖。' },
      { char: 'ginro', text: '你——' },
      { char: 'narrator', text: '他张了张嘴。那两个字就在嘴边。你看得出来。' },
      { char: 'ginro', text: '……笨蛋。' },
      { char: 'narrator', text: '他把雪丸背了起来。雪丸比他矮一个头，趴在他背上，像一只受伤的小狗。', cg: 'cg_ginro_back' },
      { char: 'narrator', text: '背起来的时候，雪丸的领口散开了。那块白色的骨牌，从皮绳上滑出来，晃在银朗的肩膀上。' },
      { char: 'narrator', text: '银朗的脚步，停了一拍。' },
      { char: 'narrator', text: '他侧过头，看着那块骨牌。上面刻着一个像爪印一样的记号。你不认识。可是他的眼神，一下子变得很冷，又很远。' },
      { char: 'narrator', text: '然后，他什么都没说，继续往前走。' },
      { char: 'yukimaru', text: '……那棵树，是北坡最大的结。我闻到那个怪味道……在往它那边爬……' },
      { char: 'yukimaru', text: '如果那棵树烂了……北坡就全完了……所以我……' },
      { char: 'ginro', text: '别说话。' },
      { char: 'narrator', text: '走了很久。快到神社的时候，雪丸迷迷糊糊地，在银朗背上小声说了一句。' },
      { char: 'yukimaru', text: '……喂。你刚才……是不是，差点叫我名字了。' },
      { char: 'narrator', text: '银朗没有回答。' },
      { char: 'narrator', text: '可是他背着雪丸的手，收紧了一点。' },
    ],
    next: 'day4_heal',
  },

  'day4_heal': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '鸟居下面，琥珀和白露提着灯笼，一直在等。看到银朗背上那团染红的白色，白露手里的灯笼掉在了地上。' },
      { char: 'shiro', text: '雪丸！！' },
      { char: 'kohaku', text: '快，抬进去！热水，干净的布——' },
      { char: 'narrator', text: '雪丸被放在琥珀房间的被褥上。胳膊上的伤口很深，边缘是黑的，像被什么东西烧过。血一直止不住。' },
      { char: 'narrator', text: '白露跪在他旁边，二话不说，低下头，把额头上的角，贴在了伤口上。' },
      { char: 'kohaku', text: '白露，不行——你最近已经——' },
      { char: 'shiro', text: '我可以的！' },
      { char: 'narrator', text: '他角上的花，一朵接一朵地亮了起来。青白色的光，顺着角，流进雪丸的伤口里。' },
      { char: 'narrator', text: '伤口边缘的黑色，一点一点地褪了。血慢慢止住了。' },
      { char: 'narrator', text: '可是白露的花，也一朵接一朵地谢了。粉的，黄的，最后那朵淡蓝色的。花瓣落在被褥上，变成了褐色。' },
      { char: 'narrator', text: '雪丸迷迷糊糊地睁开眼，看到了他。' },
      { char: 'yukimaru', text: '……别……白露……你会累的……' },
      { char: 'shiro', text: '你闭嘴。你上次也说你不累，结果在树上睡了一整天。' },
    ],
    choices: [
      { text: '在白露身边跪下，握住他发抖的手', affection: { deer: 2 }, next: 'day4_heal2' },
      { text: '替雪丸按住另一边还在渗血的伤口', affection: { whitewolf: 2 }, next: 'day4_heal2' },
    ],
  },

  'day4_heal2': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '不知道过了多久，光熄了。' },
      { char: 'narrator', text: '雪丸的呼吸变得又深又稳。白露趴在被褥边上，睡着了。他的角上，一朵花都不剩。' },
      { char: 'narrator', text: '琥珀拿来一条毯子，盖在两个孩子身上。她的手在白露光秃秃的角上停了一下。' },
      { char: 'kohaku', text: '……傻孩子。' },
      { char: 'narrator', text: '你回头看了一眼拉门外面。银朗站在走廊上，没有进来。他看着屋里，看着被褥上那两个缩成一团的孩子。' },
      { char: 'narrator', text: '然后，他背过身，靠着门框坐了下去。' },
    ],
    next: 'day4_night',
  },

  'day4_night': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '深夜。雪丸的伤包扎好了，睡在琥珀的房间里。白露守在他旁边，也睡着了。' },
      { char: 'narrator', text: '你走到缘廊上。琥珀一个人坐在那里，手心里捧着那根红绳。' },
      { char: 'narrator', text: '她的脸色，白得吓人。' },
      { char: 'kohaku', text: '……这是阿灯的。' },
      { char: 'player', text: '阿灯？' },
      { char: 'kohaku', text: '一只狸猫。八十年前，住在神社后面的竹林里。最喜欢偷供品，被抓到了就装睡。' },
      { char: 'kohaku', text: '千代的娘，那时候还是个小姑娘。她给阿灯系了这根红绳，挂了这个铃，说「这样你偷东西的时候，我就能听见了」。' },
      { char: 'kohaku', text: '阿灯很喜欢。走到哪里都叮叮当当的。' },
      { char: 'kohaku', text: '六十年前，结界破的那一夜以后……阿灯就不见了。我以为，它是走了。' },
      { char: 'narrator', text: '她把红绳攥在手心里。攥得很紧。' },
      { char: 'player', text: '琥珀。那个黑色的东西……到底是什么？' },
      { char: 'narrator', text: '琥珀看着你。很久很久。' },
      { char: 'narrator', text: '然后，她像是终于下了什么决心，轻轻吸了一口气。' },
      { char: 'kohaku', text: '……明天早上。' },
      { char: 'kohaku', text: '明天早上，我全都告诉你。守铃人的事，堕兽的事，还有……我一直不敢说的事。' },
      { char: 'kohaku', text: '今晚，让我再想一想。想想千代如果在，会怎么说。' },
      { char: 'narrator', text: '你在她旁边坐下。你们谁都没再说话。' },
      { char: 'narrator', text: '屋顶上，苍羽在很轻地数着什么。十五。十六。' },
      { char: 'narrator', text: '雪丸睡着的那间屋子外面，银朗靠着拉门坐在走廊上。他没有进去。也没有走。手心里，攥着一样白色的东西。' },
      { char: 'narrator', text: '月亮已经快圆了。北边的天上，有一小块星星，不见了。像是被什么东西，一口一口地吃掉了。' },
      { char: 'narrator', text: '你起身回房的时候，回头看了一眼。' },
      { char: 'narrator', text: '月光下，琥珀身后的尾巴，有一条……很淡。淡得边缘都快要透明了，能看见后面的木板。' },
      { char: 'narrator', text: '她自己，好像还没有发现。' },
    ],
    next: 'day5_kohaku_truth',
  },
  // =============== DAY 5 ===============
  'day5_kohaku_truth': {
    scene: 'shrine', particles: 'spirits', day: 5,
    chapter: { num: '第五天', title: '被遗忘的' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '第五天，天阴着。' },
      { char: 'narrator', text: '雪丸的伤，一夜之间好了大半。白露守着他，用角上的花敷了一整夜。天亮的时候，白露自己累得趴在被子边上睡着了，头上一朵花都不剩。' },
      { char: 'narrator', text: '琥珀在缘廊上等你。她换了一身正式的巫女服，头发一丝不乱，像是要去参加什么仪式。' },
      { char: 'kohaku', text: '坐吧。我说过，今天全都告诉你。' },
      { char: 'kohaku', text: '先从最简单的说起。守铃人要做什么。' },
      { char: 'kohaku', text: '满月的夜里，站在要石前面，摇响那枚铃。然后，把我们每一个的名字，念出来。' },
      { char: 'player', text: '……念名字？就这样？' },
      { char: 'kohaku', text: '就这样。' },
      { char: 'kohaku', text: '我们这种东西，本来是没有形状的。山里的一阵风，林子里的一团雾。' },
      { char: 'kohaku', text: '是人类叫了我们的名字，我们才有了耳朵，有了尾巴，有了「琥珀」和「银朗」。' },
      { char: 'kohaku', text: '被记住，我们才能留在这一边。', flag: 'a_keeper' },
      { char: 'kohaku', text: '然后——是我一直不敢说的那一半。' },
      { char: 'narrator', text: '她把那根红绳放在你们中间的木板上。小小的铜铃，裂成了两半。' },
      { char: 'kohaku', text: '被所有人忘掉的兽灵，会慢慢失去形状。先忘掉自己的名字，再忘掉自己是谁。' },
      { char: 'kohaku', text: '最后，只剩下饿。饿着想被谁记住，却连自己想被记住什么，都忘了。' },
      { char: 'kohaku', text: '那就是堕兽。' },
      { char: 'kohaku', text: '堕兽是杀不死的。散掉以后，过一阵又会聚起来。因为饿还在。' },
      { char: 'kohaku', text: '昨晚那个……是阿灯。', flag: 'a_cord' },
      { char: 'narrator', text: '你想起它最后回头看你的那一眼。那种迷路一样的茫然。' },
      { char: 'kohaku', text: '六十年前，千代的娘病倒了，错过了一个满月。结界破了。' },
      { char: 'kohaku', text: '第二个月，千代接过了铃，把她认识的每一个名字都念了。可是阿灯那时候，已经不见了。千代不认识它。' },
      { char: 'kohaku', text: '没有人念它的名字。所以它……就变成了那样。' },
      { char: 'narrator', text: '琥珀转过身，背对着你。' },
      { char: 'kohaku', text: '你数过我的尾巴吗？' },
      { char: 'narrator', text: '她身后，赤红色的尾巴一条一条地展开。在阴天的光里，像一把慢慢打开的扇子。' },
      { char: 'narrator', text: '一，二，三，四，五，六，七，八。' },
      { char: 'kohaku', text: '我本来有九条。' },
      { char: 'kohaku', text: '今天早上醒来，只剩八条了。' },
      { char: 'narrator', text: '你说不出话来。' },
      { char: 'kohaku', text: '千代没来的那个满月以后，我们就开始被忘掉了。银朗最近总是想不起昨天巡了哪条路。白露的花开得越来越少。苍羽……飞得越来越高，越来越不想下来。' },
      { char: 'kohaku', text: '结界的烂，不是谁弄坏的。是我们自己，在一点一点地变淡。' },
      { char: 'kohaku', text: '如果这个满月，还是没有人念我们的名字——' },
      { char: 'narrator', text: '她没有说完。她不需要说完。' },
      { char: 'player', text: '……为什么不早告诉我？' },
      { char: 'narrator', text: '琥珀转回来。她在笑。眼睛是红的。' },
      { char: 'kohaku', text: '因为你会留下来。' },
      { char: 'kohaku', text: '你是千代的孩子。你一定会说「我来念」。然后，把一辈子绑在这座山上。' },
      { char: 'kohaku', text: '可怜我们，心疼我们，觉得不念就是害死我们——我不想要这样的守铃人。' },
      { char: 'kohaku', text: '千代当年，是因为喜欢我们，才留下来的。' },
      { char: 'kohaku', text: '如果你要念，我希望你也是因为这个。……如果不是，就下山吧。我们会想别的办法。' },
      { char: 'player', text: '有别的办法吗？' },
      { char: 'narrator', text: '琥珀没有回答。' },
      { char: 'narrator', text: '她只是伸出手，把那根红绳，放进了你的手心里。' },
      { char: 'narrator', text: '你握着那根红绳，正要站起来。琥珀拉住了你的袖子。' },
    ],
    next: 'day5_cost',
  },

  'day5_cost': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '……等一下。' },
      { char: 'kohaku', text: '还有一件事。最难说的那件。' },
      { char: 'kohaku', text: '如果现在不说，我大概……就再也说不出口了。' },
      { char: 'narrator', text: '她从袖子最深处，拿出一张折得很小很小的纸。纸已经黄透了，边缘是参差的毛边。' },
      { char: 'player', text: '（来客簿上……被撕掉的那一页。）' },
      { char: 'narrator', text: '她把纸展开。上面是两种字迹。一种是琥珀的字。另一种很旧很旧，墨色几乎褪没了。' },
      { char: 'kohaku', text: '这是「守铃人之约」。一百多年前，千代的曾祖母和我，一起写的。' },
      { char: 'kohaku', text: '那时候结界第一次开始烂。我们一个接一个地变淡。我去山下求她。……是我去求的。' },
      { char: 'narrator', text: '她的手指，按在最后一行字上。' },
      { char: 'narrator', text: '「守铃人每念一名，以己之一忆为薪。」' },
      { char: 'player', text: '……以己之一忆，为薪？' },
      { char: 'kohaku', text: '名字是要有东西撑着的。光是念，太轻了，撑不住我们。' },
      { char: 'kohaku', text: '所以每个满月，铃响的时候，守铃人要交出一段自己的记忆。交给要石。由它，把我们一个一个地，留在这一边。' },
      { char: 'kohaku', text: '交出去的是哪一段，守铃人自己选不了。铃会拿走那个月里……最暖的那一段。' },
      { char: 'narrator', text: '你忽然想起了很多东西。' },
      { char: 'narrator', text: '医院里那张照片。「这孩子，真可爱啊。是谁家的呀？」' },
      { char: 'narrator', text: '速写本最后几页。画了又擦的脸。「……想不起来了。」' },
      { char: 'narrator', text: '玄夜说的。她每个月都下去问：「那孩子小时候，是什么样子的？」' },
      { char: 'player', text: '……外婆不是老了。' },
      { char: 'kohaku', text: '五十年。六百个满月。' },
      { char: 'kohaku', text: '她最暖的那些记忆……最后那十几年，几乎全是你。' },
      { char: 'kohaku', text: '你第一次叫她外婆。你骑在她肩膀上。你六岁那年，在车站趴在车窗上哭。' },
      { char: 'kohaku', text: '铃一个月拿走一段。拿到最后，她认得长大的你，却想不起小时候的你了。', flag: 'a_photo' },
      { char: 'narrator', text: '琥珀说得很平，很慢，像是这些话在心里排练过很多很多遍。她的尾巴没有炸。一根毛都没有动。' },
      { char: 'kohaku', text: '撕掉这一页的，是我。千代十六岁那年，接过铃之前，我把它撕下来，藏起来了。', flag: 'a_page' },
      { char: 'kohaku', text: '我怕她看到以后，就不肯念了。' },
      { char: 'kohaku', text: '后来我才知道，她早就知道了。她娘告诉她的。她什么都没说，就那样念了五十年。' },
    ],
    choices: [
      { text: '「……外婆知道。是她自己选的。」', affection: { fox: 2 }, flag: 'cost_accept', next: 'day5_cost2' },
      { text: '「你为什么不早点告诉我？！」', affection: { fox: 1 }, flag: 'cost_angry', next: 'day5_cost2' },
      { text: '一句话也说不出来，只是攥紧了那张纸', affection: { fox: 1, snake: 1 }, next: 'day5_cost2' },
    ],
  },

  'day5_cost2': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀愣了一下。然后，很轻地点了点头。', if: 'cost_accept' },
      { char: 'kohaku', text: '嗯。那个人，从来都是自己选。选了，就笑着走下去。', if: 'cost_accept' },
      { char: 'narrator', text: '你的声音在发抖。琥珀没有躲。', if: 'cost_angry' },
      { char: 'kohaku', text: '因为你会恨。……恨我也好。', if: 'cost_angry' },
      { char: 'kohaku', text: '可是我怕你恨的不是我。是那枚铃。是千代。', if: 'cost_angry' },
      { char: 'narrator', text: '纸在你手心里，被攥出了皱褶。琥珀伸出手，轻轻覆在你的手背上。', ifnot: 'cost_accept' },
      { char: 'kohaku', text: '所以，我才不想让你当守铃人。' },
      { char: 'kohaku', text: '你还年轻。你还有好多好多暖的东西，没来得及攒起来。' },
      { char: 'kohaku', text: '我不想看着你……一个月，一个月，把它们交出去。' },
      { char: 'narrator', text: '就在这时，神社里头传来「砰」的一声。是有什么东西，狠狠砸在木板上的声音。' },
      { char: 'narrator', text: '然后，是雪丸的喊声。' },
      { char: 'kohaku', text: '……还有两天。不急着回答。' },
      { char: 'kohaku', text: '去吧。那边……好像也出事了。' },
    ],
    next: 'day5_bone',
  },

  'day5_bone': {
    scene: 'room', particles: null,
    chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你跑到琥珀房间门口的时候，拉门已经被撞开了一半。' },
      { char: 'narrator', text: '雪丸坐在被褥上，绷带还缠在胳膊上。银朗站在门外，没有进来。' },
      { char: 'narrator', text: '被褥中间，躺着那块白色的骨牌。' },
      { char: 'ginro', text: '北方族的召令牌。族长的爪印。' },
      { char: 'ginro', text: '……谁给你的。' },
      { char: 'narrator', text: '雪丸盯着那块骨牌。很久，他笑了一下。笑得很难看。' },
      { char: 'yukimaru', text: '族长给的。' },
      { char: 'yukimaru', text: '娘死了以后，族里不要我。我在雪地里睡了一个冬天。然后族长来了，把这个挂在我脖子上。' },
      { char: 'yukimaru', text: '他说：「去南边，把银色的叛徒押回来受审。押回来了，就准你回族。」' },
      { char: 'narrator', text: '走廊里很安静。连风都停了。' },
      { char: 'yukimaru', text: '……半年。我每天都想，今天就动手。今天就把他拖回去。' },
      { char: 'yukimaru', text: '可是他每天都说「回去」。每天都把鱼推给我。每天巡逻，都绕开我睡的那棵树。' },
      { char: 'yukimaru', text: '我……一次都没有下得了手。', flag: 'a_bone' },
      { char: 'narrator', text: '银朗沉默了很久。' },
      { char: 'ginro', text: '……那就押吧。' },
      { char: 'ginro', text: '满月以后，结界好了，我跟你走。' },
      { char: 'yukimaru', text: '……什么？' },
      { char: 'ginro', text: '你回族里去。你娘拼了命，才让你在那里长大。那里有你的窝。' },
      { char: 'narrator', text: '雪丸猛地站起来。绷带散开了，他也不管。' },
      { char: 'yukimaru', text: '你到现在……还是这句话？！' },
      { char: 'yukimaru', text: '我说了一百遍了！我的窝在这里！在这里！！' },
      { char: 'yukimaru', text: '你宁可跟我回去挨咬，也不肯……也不肯叫我一次名字吗？！' },
      { char: 'narrator', text: '他抓起骨牌，狠狠砸在银朗脚边。骨牌在木板上弹了一下，裂开了一道缝。' },
      { char: 'narrator', text: '然后他从窗户跳了出去。一道白影，消失在树林里。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '银朗弯下腰，把那块裂开的骨牌捡了起来。他的手，在发抖。' },
    ],
    choices: [
      { text: '「去追他。现在。」', affection: { wolf: 1, whitewolf: 1 }, flag: 'urged_ginro', next: 'day5_bone2' },
      { text: '什么都没说，站到他的左边', affection: { wolf: 2 }, next: 'day5_bone2' },
    ],
  },

  'day5_bone2': {
    scene: 'room', particles: null,
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'ginro', text: '……追到了，说什么。', if: 'urged_ginro' },
      { char: 'player', text: '叫他的名字。就这么简单。', if: 'urged_ginro' },
      { char: 'narrator', text: '银朗看着手里的骨牌。他张了张嘴。那两个字，又一次停在了嘴边。', if: 'urged_ginro' },
      { char: 'ginro', text: '……今晚。巡完北坡。', if: 'urged_ginro' },
      { char: 'narrator', text: '你们就那样站着。很久，他才开口。', ifnot: 'urged_ginro' },
      { char: 'ginro', text: '六百年前我被赶出来，是因为我救了一个人类的孩子。' },
      { char: 'ginro', text: '他要是不把我押回去……他就会跟我一样。一辈子回不了北边。' },
      { char: 'player', text: '他已经选了。跟你当年一样。' },
      { char: 'narrator', text: '银朗没有回答。可是他把那块裂开的骨牌，放进了自己的衣襟里。贴着心口的地方。' },
    ],
    next: 'day5_lunch',
  },

  'day5_lunch': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '中午，琥珀把所有人都叫到了饭桌前。不容商量。' },
      { char: 'kohaku', text: '人饿着肚子的时候，脑子里只会装坏事。——这是千代说的。所以，吃饭。' },
      { char: 'narrator', text: '白露红着眼睛坐下了。苍羽从屋顶上下来，坐在门槛上——离饭桌一步远，算是进来了。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '银朗最后一个走进来。他扫了一圈饭桌。嘴唇动了动。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'ginro', text: '……四个。' },
      { char: 'narrator', text: '他停了一下。然后，在雪丸平时坐的那个位置上，摆了一副碗筷。盛了饭。放了一条最大的鱼。' },
      { char: 'narrator', text: '谁都没有说话。' },
      { char: 'shiro', text: '那、那个！我又学了一个人类的词！',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '白露突然站起来，声音很大，像是要把桌上的安静一口气推开。' },
      { char: 'shiro', text: '「加班」！苍羽哥说，你在城里每天都「加班」！' },
      { char: 'shiro', text: '是在班上……多加一个人吗？那不是很好吗？人多热闹！' },
      { char: 'player', text: '……不是那个意思。是工作做不完，晚上留下来接着做。' },
      { char: 'shiro', text: '晚上还要做？！那睡觉呢？！' },
      { char: 'kohaku', text: '我就说吧。「公司」是很凶的妖怪。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'sou', text: '……那个妖怪，我在城里见过。很高。全是玻璃。晚上一直亮着。' },
      { char: 'sou', text: '你在第十七层。靠窗那张桌子。……那时候，没敲窗户。' },
      { char: 'narrator', text: '你差点被汤呛到。' },
      { char: 'shiro', text: '那你不要回去了！留在这里！琥珀姐的饭，比妖怪的好吃一万倍！',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '琥珀的耳朵，悄悄地竖了起来。银朗夹鱼的筷子，停在了半空。苍羽在看天花板，看得很认真。' },
      { char: 'narrator', text: '你没有回答。可是那顿饭，你吃了两碗。' },
      { char: 'narrator', text: '吃完的时候，雪丸位置上的那碗饭，还冒着一点热气。银朗走过去，把盖子盖上了。' },
    ],
    next: 'day5_day',
  },

  'day5_day': {
    scene: 'shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '早上去井边打水的时候，你看到鸟居的柱脚上，多了一小块黑斑。' },
      { char: 'narrator', text: '它已经爬到神社门口了。' },
      { char: 'narrator', text: '银朗天没亮就出去巡逻，到中午都没回来。屋顶上，苍羽一圈一圈地盘旋，比平时低得多。' },
      { char: 'narrator', text: '只有溪边偶尔传来雪丸和白露打闹的声音。雪丸的胳膊还缠着绷带，笑声却比平时还大。像是想用吵闹，把什么东西推开。' },
      { char: 'player', text: '（后天就是满月了。）' },
      { char: 'player', text: '（念出名字……就这么简单的事。可是念完以后，我就是新的守铃人了。每个满月，都要回来。一辈子。）' },
      { char: 'player', text: '（还要一个月，一个月，交出最暖的那段记忆。）' },
      { char: 'player', text: '（就像外婆那样。最后，连我小时候的样子都想不起来。）' },
      { char: 'player', text: '（外婆，你当年决定的时候，在想什么呢？）' },
    ],
    choices: [
      { text: '去溪边找白露，把六十年前那晚的真相告诉他', if: 'genya_truth', affection: { deer: 1, snake: 2 }, flag: 'told_truth', next: 'day5_truth' },
      { text: '爬上屋顶，问苍羽：六十年前那晚，你在天上看到了什么？', ifnot: 'genya_truth', affection: { hawk: 2 }, next: 'day5_ask_sou' },
      { text: '端一碗热茶，下石阶去看玄夜', affection: { snake: 2 }, next: 'day5_genya_tea' },
      { text: '去溪边看看雪丸的伤', affection: { whitewolf: 2 }, next: 'day5_yuki' },
      { text: '去鸟居下面，等银朗巡逻回来', affection: { wolf: 2 }, next: 'day5_ginro' },
      { text: '陪琥珀一起，给外婆的房间换上新的花', affection: { fox: 2 }, next: 'day5_kohaku' },
    ],
  },

  'day5_ask_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你顺着梯子爬上屋顶。苍羽坐在屋脊上，看着北边那片越来越大的黑。' },
      { char: 'sou', text: '……你想问六十年前。' },
      { char: 'player', text: '你怎么知道？' },
      { char: 'sou', text: '因为你的眼睛，一直在看白露。' },
      { char: 'narrator', text: '他说话的时候，一只手按在胸口那包东西上。' },
      { char: 'narrator', text: '他沉默了很久。风把他的长发吹得乱七八糟。' },
      { char: 'sou', text: '那天晚上，我也在天上。' },
      { char: 'sou', text: '我看到那只母鹿挡在树洞前面，被堕兽撕开了肚子。我看到那条黑蛇从地底下冲出来，把堕兽绞成了灰。' },
      { char: 'sou', text: '然后，我看到他把母鹿缠了起来。一圈，一圈。' },
      { char: 'sou', text: '那天夜里很冷，风很大。他把自己盘成了一堵墙，挡在风来的那一边。' },
      { char: 'sou', text: '我在天上，听到母鹿一直在叫一个名字。白露，白露。' },
      { char: 'sou', text: '天亮的时候，她不叫了。黑蛇松开她，在她旁边待了很久，才回到地底下。' },
      { char: 'narrator', text: '你的手在发抖。', flag: 'genya_truth' },
      { char: 'player', text: '……你为什么，六十年都没有说？' },
      { char: 'sou', text: '因为没有人问。' },
      { char: 'sou', text: '白露没有问。琥珀没有问。那条蛇自己，也从来没有说过。' },
      { char: 'sou', text: '我以为，看见了就够了。' },
      { char: 'narrator', text: '他低下头，看着自己的手。', flag: 'a_mother' },
      { char: 'sou', text: '……我好像，一直都是这样。看见了，然后什么都不做。' },
    ],
    choices: [
      { text: '「现在去告诉白露。我们一起去。」', affection: { hawk: 2, deer: 1 }, flag: 'told_truth', next: 'day5_truth' },
      { text: '「谢谢你告诉我。这件事……让我想想怎么跟他说。」', affection: { hawk: 1 }, next: 'day5_evening' },
    ],
  },

  'day5_genya_tea': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你端着一碗杜鹃花茶，一级一级走下石阶。茶洒了一半。' },
      { char: 'narrator', text: '玄夜靠在要石旁边，没有睁眼。灰色的鳞片，已经爬到了他的脖子。' },
      { char: 'genya', text: '……闻到了。狐狸的茶。' },
      { char: 'genya', text: '她让你送来的？' },
      { char: 'player', text: '我自己要送的。' },
      { char: 'narrator', text: '他睁开眼睛看了你一眼。然后伸手接过茶碗，喝了一口。' },
      { char: 'genya', text: '……太甜了。千代泡的也总是太甜。' },
      { char: 'narrator', text: '可是他一口一口，全喝完了。' },
      { char: 'player', text: '琥珀……把那一页拿出来了。记忆的事。' },
      { char: 'genya', text: '……哦。她终于敢了。' },
      { char: 'genya', text: '千代交出来的东西，都在这块石头里。六百段。一段都没丢。' },
      { char: 'genya', text: '我守着。' },
      { char: 'narrator', text: '要石的光一明一暗。你忽然明白了，那天在光里看到的那双握着铅笔的手，是谁的。' },
      { char: 'genya', text: '……别问我能不能还给她。她已经不在了。' },
      { char: 'genya', text: '也别问我能不能还给你。……现在还不能。' },
      { char: 'player', text: '琥珀都告诉我了。阿灯的事，名字的事。' },
      { char: 'genya', text: '哦。她终于敢说了。' },
      { char: 'player', text: '你在吃那些黑色……是在替大家拖时间，对不对？' },
      { char: 'narrator', text: '玄夜没有回答。他拿起一颗白子，在指间转了转。' },
      { char: 'genya', text: '蛇是会蜕皮的。旧的皮烂了，里面还有新的。' },
      { char: 'genya', text: '我比他们多几层皮。就这样而已。' },
      { char: 'player', text: '那你的皮……还剩几层？' },
      { char: 'narrator', text: '他把白子放回棋盒里。' },
      { char: 'genya', text: '……够用到满月。' },
      { char: 'genya', text: '回去吧。今晚，会很吵。' },
    ],
    next: 'day5_evening',
  },

  'day5_yuki': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸坐在溪边的石头上，把缠着绷带的胳膊泡在水里。' },
      { char: 'yukimaru', text: '哟！来看我这个英雄吗？' },
      { char: 'player', text: '……伤口泡水不会发炎吗？' },
      { char: 'yukimaru', text: '狼的伤口舔一舔就好了！泡水是为了……凉快！' },
      { char: 'narrator', text: '他说得理直气壮。可是他的眼睛一直看着北坡的方向。' },
      { char: 'yukimaru', text: '……昨天晚上，他背我回来。' },
      { char: 'yukimaru', text: '我小时候，我娘也这样背过我。她说，你舅舅以前也这样背过她。' },
      { char: 'yukimaru', text: '他的背很宽。跟我娘说的一模一样。' },
      { char: 'yukimaru', text: '……然后今天早上，他说满月以后，要跟我回北边。去挨族长的咬。' },
      { char: 'yukimaru', text: '那个笨蛋。宁可去挨咬，也不肯……' },
      { char: 'narrator', text: '他把脸埋进膝盖里。' },
      { char: 'yukimaru', text: '……我不想他变成那种黑乎乎的东西。' },
      { char: 'yukimaru', text: '琥珀姐今天早上说的话，我在房门外面都听到了。' },
      { char: 'yukimaru', text: '我也会变成那样吗？我才来半年。每次千代婆婆上山，我都躲在树上，不敢下去。她从来没念过我的名字。' },
      { char: 'narrator', text: '你愣住了。你从来没想过这件事。' },
      { char: 'narrator', text: '雪丸咧嘴一笑。可是那个笑，一点都不像他。' },
      { char: 'yukimaru', text: '哈哈，开玩笑的。我是从北边来的，名字是我娘取的，才不会忘呢。' },
    ],
    choices: [
      { text: '「满月那天，我第一个念你的名字。」', affection: { whitewolf: 3 }, next: 'day5_evening' },
      { text: '揉了揉他那只缺了口的耳朵：「雪丸。雪丸。雪丸。——记住了。」', affection: { whitewolf: 4 }, next: 'day5_evening' },
    ],
  },

  'day5_ginro': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '太阳偏西的时候，银朗回来了。' },
      { char: 'narrator', text: '他走得很慢。走到鸟居下面，看到你，停住了。' },
      { char: 'ginro', text: '……你在等谁。' },
      { char: 'player', text: '等你。' },

  'memory_return2': {

      { char: 'narrator', text: '——二十年前。满月。' },
      { char: 'narrator', text: '外婆牵着你的手，第一次带你上山。「下个月你就要去城里了。去之前，带你见见外婆的朋友们。」' },
      { char: 'narrator', text: '神社里好热闹。红头发的姐姐给你糖。一只银色的大狗蹲在鸟居下面，不肯过来，只是一直看着你。' },
      { char: 'narrator', text: '屋顶上坐着一只好大的鸟。一个长着小鹿角的哥哥，躲在柱子后面偷看你。' },

  'memory_return3': {

    lines: [

      { char: 'narrator', text: '你爬到棋盘前面，抓起三颗白色的，往嘴里塞。「是糖吗？」' },
      { char: 'narrator', text: '「……这个不能吃。喂，吐出来。」' },
      { char: 'narrator', text: '叔叔的眼睛是紫色的，竖着的。你盯着看了一会儿，说：「你是蛇先生吗？」' },

      { char: 'narrator', text: '「……嗯。我是蛇先生。」' },

      { char: 'narrator', text: '后来你困了，想出去。你没有走来时的楼梯，而是顺着有水声的那条小路，走了出去。' },

    next: 'memory_return4',
  },

  'memory_return4': {

    lines: [
      { char: 'narrator', text: '林子里好黑。你找不到外婆了。' },

      { char: 'narrator', text: '它一直跟着你。你走，它也走。你停，它也停。叮当，叮当。' },
      { char: 'narrator', text: '你不害怕。你觉得它好孤单。' },
      { char: 'narrator', text: '「你叫什么名字呀？」' },

      { char: 'narrator', text: '「那我叫你叮当好不好？」' },
      { char: 'narrator', text: '黑色的烟，轻轻地抖了一下。' },
      { char: 'narrator', text: '然后，它忽然变得好大好大，朝你扑了过来。不是要咬你。是像一个饿了很久的孩子，想扑进谁的怀里。' },
      { char: 'narrator', text: '可是它太冷了，太重了。你喘不过气来。' },
      { char: 'narrator', text: '地面裂开了。一条黑色的大蛇冲出来，把你卷进怀里，一圈一圈，护在正中间。', cg: 'cg_genya_coil' },
      { char: 'narrator', text: '「……别碰这个孩子。」' },
      { char: 'narrator', text: '蛇先生没有杀它。他只是一直挡着，挡着，挡到天上的大鸟尖叫起来，挡到银色的大狗冲过来。' },
      { char: 'narrator', text: '黑色的烟逃走了。叮当，叮当。越来越远。' },
      { char: 'narrator', text: '你在蛇先生的怀里睡着了。醒来的时候，他已经不在了。只有大狗狗，和哭红了眼睛的狐狸姐姐。' },

      { char: 'yukimaru', text: '北坡是我的窝。我自己守。' },
      { char: 'narrator', text: '他第一个冲下了石阶。银朗看着他的背影，握刀的手，紧了一下。' },
      { char: 'narrator', text: '玄夜被琥珀扶着往回走。经过你身边时，他压低了声音。',
        chars: [{ id: 'genya', pos: 'center', form: 'human' }] },
      { char: 'genya', text: '把铃藏好。它们是闻着铃的味道来的。' },

    next: 'crisis_battle',
  },

  'crisis_battle': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '所有人都散开了。' },
      { char: 'narrator', text: '远处传来狼嚎，鹰啸，还有某种说不清的、湿漉漉的嘶吼声。北边的天空一闪一闪，像是有人在云里打雷。' },
      { char: 'narrator', text: '你和白露守在正殿门前。他张开双臂挡在你前面，腿在发抖。' },
      { char: 'shiro', text: '没、没事的。我也是森林的一员。我会保护你的。' },
      { char: 'narrator', text: '石灯笼里的青火，一盏一盏地灭了。' },
      { char: 'narrator', text: '黑雾从石阶底下涌上来。雾里有眼睛。很多很多双，饿得发红的眼睛。' },
      { char: 'narrator', text: '其中最大的一只，从雾里慢慢站了起来。它曾经大概是一只熊，或者一头野猪。现在只剩下一个黑色的、饿的形状。' },
      { char: 'narrator', text: '它嗅了嗅。然后，笔直地朝你冲了过来。' },
      { char: 'shiro', text: '——不许过来！！' },
      { char: 'narrator', text: '白露化作白鹿冲了上去，被一爪子掀飞，重重撞在石灯笼上。', transform: { char: 'shiro', text: '白玉鹿' } },
      { char: 'narrator', text: '黑色的巨影压了下来。你把铃死死攥在胸口，闭上了眼睛。',
        chars: [] },
      { char: 'narrator', text: '——然后，一道光挡在了你面前。' },
    ],
    next_by_affection: true,
  },

  'rescue_fox': {
    flags: ['rescued_fox'],
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'kohaku', pos: 'center', form: 'beast' }],
    transform_immediate: { char: 'kohaku', text: '九尾灵狐 · 觉醒' },
    lines: [
      { char: 'narrator', text: '八条火焰一样的尾巴在你周围展开，像一堵温暖的墙。' },
      { char: 'narrator', text: '一只巨大的赤狐挡在你身前。八条尾巴同时燃起青白色的狐火，把黑雾一口气烧穿了。', cg: 'cg_kohaku_ninetails' },
      { char: 'kohaku', text: '不准碰这个孩子。' },
      { char: 'kohaku', text: '二十年前不准。现在，也不准。' },
      { char: 'narrator', text: '堕兽在狐火里发出最后一声嘶吼，化作黑烟散了。' },
      { char: 'narrator', text: '赤狐回过头来，用额头轻轻碰了碰你的额头。然后，巨大的身形一晃，化回了人形，跪倒在石板上。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'player', text: '琥珀！要石那边……' },
      { char: 'kohaku', text: '玄夜把我赶上来了。他说「你的铃在上面尖叫，吵死了，快去」。' },
      { char: 'kohaku', text: '……那条蛇。原来一直是那样说话的啊。我怎么花了六十年，才听懂。' },
      { char: 'kohaku', text: '让我……靠一会儿。就一会儿。' },
      { char: 'narrator', text: '她把头靠在你肩膀上。尾巴轻轻地、把你整个人圈了起来。' },
    ],
    next: 'crisis_low',
  },

  'rescue_wolf': {

    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'beast' }],
    transform_immediate: { char: 'ginro', text: '苍银狼 · 觉醒' },
    lines: [

      { char: 'narrator', text: '月光凝成刀刃，从它的獠牙间迸出来。黑雾被一口撕开。' },
      { char: 'ginro', text: '滚。' },
      { char: 'narrator', text: '可是雾里又站起了两只。一左一右，扑向银狼的侧腹。' },
      { char: 'ginro', text: '——雪丸！左边！' },
      { char: 'narrator', text: '一道白色的闪电应声而至，一口咬住了左边那只的喉咙。',
        chars: [{ id: 'ginro', pos: 'right', form: 'beast' }, { id: 'yukimaru', pos: 'left', form: 'beast' }] },
      { char: 'narrator', text: '银狼和白狼背靠着背。一个转身，一个扑咬，像是一起练过几百年。' },
      { char: 'narrator', text: '最后一只堕兽散成黑烟的时候，白狼还保持着扑咬的姿势，愣在原地。' },
      { char: 'yukimaru', text: '……你刚才，叫我什么？' },
      { char: 'ginro', text: '……右边还有一只。' },
      { char: 'yukimaru', text: '右边什么都没有！你刚才叫我什么！！' },
      { char: 'narrator', text: '银狼没有回答。他走到你面前，低下头，用温热的鼻尖碰了碰你的手心。' },
      { char: 'ginro', text: '……受伤了吗。' },
      { char: 'narrator', text: '二十年前，也是这样的鼻尖。雨水和松针的味道。' },
    ],
    next: 'crisis_low',
  },

  'rescue_deer': {

      { char: 'narrator', text: '藤蔓收紧。花瓣落下的时候，那里只剩下一棵小小的、刚刚长出来的白樱。' },
      { char: 'narrator', text: '白鹿腿一软，倒在你怀里，变回了那个翠发的少年。', cg: null,

  'rescue_whitewolf': {

    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'beast' }],

      { char: 'narrator', text: '纯白的狼挡在你身前，背上的毛全竖了起来，冰霜从它的脚底向四周炸开。' },
      { char: 'yukimaru', text: '在我的窝里撒野？！' },

      { char: 'narrator', text: '雪丸张着嘴，半天没合上。然后他把脸扭到一边，尾巴疯了一样地摇。' },

    next: 'crisis_low',

  'rescue_hawk': {
    flags: ['rescued_hawk'],
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'beast' }],
    transform_immediate: { char: 'sou', text: '蓝鹰 · 觉醒' },
    lines: [
      { char: 'narrator', text: '一声鹰啸，从极高的地方刺下来。' },
      { char: 'narrator', text: '一只巨大的蓝鹰收拢双翼，像一支箭一样俯冲而下。钢铁般的利爪，一击贯穿了堕兽的脊背。' },

      { char: 'narrator', text: '可是落地的时候，蓝鹰的一边翅膀，拖在了石板上。上面有一道很深的伤口。' },

  'rescue_snake': {
    flags: ['rescued_snake'],
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'beast' }],
    transform_immediate: { char: 'genya', text: '黑蛇 · 觉醒' },

      { char: 'narrator', text: '黑暗里，有什么东西无声地滑了出来。' },
      { char: 'narrator', text: '一条巨大的黑蛇，鳞片像宝石一样泛着紫光。它一圈一圈缠上了堕兽，越收越紧。' },

  'crisis_low': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '第一波退下去了。可是夜还没有过完。' },
      { char: 'narrator', text: '北边的天上，那道黑色的口子没有合上。它在一点一点地，变宽。' },
      { char: 'narrator', text: '苍羽从天上跌了下来，摔在前庭的石板上。一边的翅膀，全是血。', ifnot: 'rescued_hawk' },
      { char: 'narrator', text: '苍羽靠在石灯笼上，按着翅膀上的伤口，一直盯着北边的天。', if: 'rescued_hawk' },
      { char: 'sou', text: '北坡……雪丸一个人守住了最大的那个结。被咬穿了肩膀。银朗背着他，在往回走。', ifnot: 'rescued_whitewolf' },
      { char: 'sou', text: '北坡最大的那个结……雪丸跑回来之前，是一个人守住的。他肩膀上的伤，现在才开始往外渗血。', if: 'rescued_whitewolf' },
      { char: 'narrator', text: '琥珀刚靠着你喘了几口气，就猛地抬起头。「要石——」她跌跌撞撞地冲下了石阶。很快，又冲了上来。', if: 'rescued_fox' },
      { char: 'narrator', text: '正殿后面，那扇窄门被撞开了。琥珀扶着门框冲上来，脸上全是灰。', ifnot: 'rescued_fox' },
      { char: 'kohaku', text: '玄夜……倒下了。他一个人按着要石，按到最后，整个人都变成了灰色。叫不醒。', ifnot: 'rescued_snake' },
      { char: 'narrator', text: '玄夜说完那句话，身子一歪，倒在了柱子边上。灰色的鳞片，一直爬到了他的眼角。', if: 'rescued_snake' },
      { char: 'kohaku', text: '你这条蛇……把要石扔下，就为了上来……', if: 'rescued_snake' },
      { char: 'narrator', text: '琥珀身后的八条尾巴，一条一条地闪了一下。像是风里的灯。她晃了晃，扶住了你的肩膀。' },
      { char: 'narrator', text: '然后，你听到身后，有人很轻很轻地叫了你一声。' },
      { char: 'narrator', text: '是白露。他站在那里——你几乎看不见他了。',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '他的手，他的脸，他光秃秃的角，全都变得很淡很淡。淡得能透过他的身体，看见后面倒掉的石灯笼。' },
      { char: 'shiro', text: '……我好像，听不见森林了。' },
      { char: 'shiro', text: '好安静啊。' },
      { char: 'kohaku', text: '白露——！',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '他的角……是扎在结界上的。他和他娘一样，是活的结。结界裂开一道，他就淡一分。', flag: 'a_horn' },
      { char: 'kohaku', text: '我一直……一直没敢告诉他。也没敢告诉你。' },
      { char: 'narrator', text: '白露低头看着自己透明的手。然后，他抬起头，朝你笑了一下。' },
      { char: 'shiro', text: '没关系的。……娘也是这样走的。不疼。' },
    ],
    choices: [
      { text: '掏出铃，用尽全身力气摇响它，喊他的名字', affection: { deer: 2 }, flag: 'rang_for_shiro', next: 'crisis_low2' },
      { text: '冲过去抱住他，一遍一遍地叫他的名字', affection: { deer: 2 }, next: 'crisis_low2' },
    ],
  },

  'crisis_low2': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你把铃高高举起来。', if: 'rang_for_shiro' },
      { char: 'narrator', text: '你抱住他。他轻得像一团雾。口袋里的铃掉了出来，在石板上滚了一圈——', ifnot: 'rang_for_shiro' },

      { char: 'player', text: '白露！' },

      { char: 'narrator', text: '铃声在夜里荡开。荡过倒掉的石灯笼，荡过鸟居，荡进黑漆漆的林子里。' },
      { char: 'narrator', text: '白露的手指，动了一下。' },
      { char: 'narrator', text: '然后，一点一点地，有了颜色。先是指尖，然后是手腕，然后是脸。像是滴进清水里的墨，又被一点一点收了回来。' },
      { char: 'narrator', text: '他光秃秃的角尖上，冒出了一个小小的、蓝色的花苞。' },
      { char: 'shiro', text: '……听见了。' },
      { char: 'shiro', text: '你的声音。……好吵。' },
      { char: 'narrator', text: '他哭着笑了。' },
      { char: 'narrator', text: '铃声荡到的地方，黑雾往后退了一步。北边天上的那道口子，好像……窄了一点点。' },
      { char: 'kohaku', text: '只是念一个名字……没有满月，没有要石……',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '琥珀看着你。像是看着一件她等了很久、又怕了很久的东西。' },
      { char: 'narrator', text: '你低头看着手里的铃。它是烫的。' },
      { char: 'narrator', text: '你忽然觉得，心里有一个地方，空了一小块。像是一颗牙，刚刚被拔掉。' },
      { char: 'narrator', text: '可是你想不起来，那里原来是什么。', flag: 'paid_once' },
      { char: 'narrator', text: '琥珀的耳朵，一点一点地，贴到了脑后。她什么都没有说。只是握住了你拿着铃的那只手，握得很紧。' },
      { char: 'narrator', text: '天边，开始发白了。' },
    ],
    next: 'crisis_aftermath',
  },
