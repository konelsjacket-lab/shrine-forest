<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杜鹃森 — 神社与森林的恋爱物语</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap');
/* LXGW WenKai (SIL OFL), subset to the characters this game uses. Re-subset if new text adds characters. */
@font-face { font-family: 'Dujuan WenKai'; src: url('assets/font-wenkai.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Ma Shan Zheng'; src: url('assets/font-brush.woff2') format('woff2'); font-display: swap; } /* self-hosted subset: Google Fonts is unreachable in some regions */

:root {
  --bg: #1a1a2e;
  --bg-overlay: rgba(10, 10, 20, 0.7);
  --text: #e8e0d4;
  --text-dim: #9a8e7e;
  --text-name: #f0c674;
  --accent-fox: #ff6b4a;
  --accent-fox-glow: rgba(255, 107, 74, 0.3);
  --accent-wolf: #7eb8da;
  --accent-wolf-glow: rgba(126, 184, 218, 0.3);
  --accent-deer: #8fd4a0;
  --accent-deer-glow: rgba(143, 212, 160, 0.3);
  --accent-whitewolf: #e8e0d0;
  --accent-whitewolf-glow: rgba(232, 224, 208, 0.3);
  --accent-hawk: #4a7eb8;
  --accent-hawk-glow: rgba(74, 126, 184, 0.3);
  --accent-snake: #9a5abf;
  --accent-snake-glow: rgba(154, 90, 191, 0.3);
  --accent-gold: #d4a854;
  --accent-sakura: #e8a0b4;
  --ui-bg: rgba(20, 16, 30, 0.92);
  --ui-border: rgba(212, 168, 84, 0.3);
  --font: 'Dujuan WenKai', 'Noto Serif SC', 'Kaiti SC', 'STKaiti', serif;
  --font-ui: -apple-system, 'PingFang SC', sans-serif;
  --font-deco: 'Noto Serif SC', 'Songti SC', serif;
  --font-brush: 'Ma Shan Zheng', 'Noto Serif SC', serif;
  --ink: #3b2216;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

/* === Background Scenes === */
#scene-bg {
  position: absolute; inset: 0;
  transition: opacity 1.2s ease;
}

.scene-layer {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.8s ease;
}
.scene-img { background-color: #0a0a14; background-repeat: no-repeat; }
.scene-img::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 25%, transparent 60%, rgba(0,0,0,0.35) 100%);
}

.bg-forest {
  background: linear-gradient(180deg, #0a1628 0%, #0f2418 15%, #0a3012 30%, #1a4a20 50%, #2a5a30 70%, #1a3a18 100%);
}
.bg-forest::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 3px 80px at 15% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 90px at 25% 55%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 85px at 40% 58%, #1a4020 0%, transparent 100%),
    radial-gradient(ellipse 5px 95px at 55% 52%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 80px at 70% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 88px at 85% 56%, #1a4020 0%, transparent 100%);
}
.bg-forest::after {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(80,180,100,0.08) 0%, transparent 40%),
    radial-gradient(circle at 70% 20%, rgba(60,160,80,0.06) 0%, transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(40,80,40,0.15) 0%, transparent 50%);
}

.bg-shrine {
  background: linear-gradient(180deg, #1a0a2e 0%, #2a1040 20%, #3a1848 35%, #2a1838 50%, #1a1028 70%, #0a0818 100%);
}
.bg-shrine::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 120px 8px at 50% 72%, rgba(180,80,60,0.15) 0%, transparent 100%),
    radial-gradient(circle at 50% 40%, rgba(255,160,80,0.06) 0%, transparent 50%);
}

.bg-night-shrine {
  background: linear-gradient(180deg, #050510 0%, #0a0a20 20%, #101030 40%, #0a0a20 60%, #050510 100%);
}
.bg-night-shrine::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 15%, rgba(200,220,255,0.8) 0%, rgba(200,220,255,0.1) 2%, transparent 4%),
    radial-gradient(circle at 30% 10%, rgba(255,255,200,0.3) 0%, transparent 1%),
    radial-gradient(circle at 60% 8%, rgba(255,255,200,0.2) 0%, transparent 0.5%),
    radial-gradient(circle at 45% 12%, rgba(255,255,200,0.25) 0%, transparent 0.8%);
}
.bg-night-shrine::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 70%, rgba(255,140,60,0.08) 0%, transparent 30%);
}

.bg-spring {
  background: linear-gradient(180deg, #f0d0d8 0%, #e8c0c8 15%, #d4a0b0 30%, #98c088 50%, #78a868 70%, #5a8a48 100%);
}
.bg-spring::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,180,200,0.4) 0%, transparent 30%),
    radial-gradient(circle at 80% 15%, rgba(255,200,210,0.3) 0%, transparent 25%);
}

.bg-moonlit {
  background: linear-gradient(180deg, #0a0e1e 0%, #101830 20%, #182040 35%, #1a3030 55%, #0a2018 80%, #081810 100%);
}
.bg-moonlit::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 200px 200px at 65% 20%, rgba(200,220,255,0.15) 0%, transparent 70%),
    radial-gradient(circle at 65% 20%, rgba(220,240,255,0.3) 0%, rgba(200,220,255,0.05) 15%, transparent 30%);
}

.bg-sky {
  background: linear-gradient(180deg, #0a1840 0%, #1a3060 15%, #2a5090 35%, #4a80c0 55%, #3a6090 75%, #1a3040 100%);
}
.bg-sky::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 40% 25%, rgba(255,255,255,0.05) 0%, transparent 30%),
    radial-gradient(circle at 70% 40%, rgba(200,220,255,0.08) 0%, transparent 25%);
}

.bg-cave {
  background: linear-gradient(180deg, #0a0510 0%, #100818 20%, #180a20 40%, #100818 60%, #0a0510 100%);
}
.bg-cave::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 50%, rgba(120,60,180,0.06) 0%, transparent 40%),
    radial-gradient(circle at 30% 70%, rgba(100,40,150,0.04) 0%, transparent 30%);
}

.bg-snowfield {
  background: linear-gradient(180deg, #c8d8e8 0%, #d8e4f0 20%, #e0e8f0 40%, #e8f0f4 60%, #d0dce8 80%, #b8c8d8 100%);
}
.bg-snowfield::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 60% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
    radial-gradient(circle at 30% 50%, rgba(200,220,240,0.2) 0%, transparent 30%);
}

.bg-town {
  background: linear-gradient(180deg, #2a1a3a 0%, #5a2a48 18%, #b8584a 38%, #e8a060 52%, #4a3040 62%, #20182a 80%, #120c18 100%);
}
.bg-town::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 18% at 30% 62%, #1a1222 0%, transparent 70%),
    radial-gradient(ellipse 70% 22% at 75% 60%, #221830 0%, transparent 70%),
    radial-gradient(circle at 20% 72%, rgba(255,190,110,0.35) 0%, transparent 1.2%),
    radial-gradient(circle at 42% 75%, rgba(255,190,110,0.3) 0%, transparent 1%),
    radial-gradient(circle at 68% 73%, rgba(255,190,110,0.3) 0%, transparent 1.1%);
}

.bg-room {
  background: linear-gradient(180deg, #1a120c 0%, #2a1c12 30%, #3a2818 55%, #2a1c10 75%, #18100a 100%);
}
.bg-room::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,190,120,0.22) 0%, transparent 38%),
    repeating-linear-gradient(90deg, transparent 0 18%, rgba(0,0,0,0.18) 18% 18.6%);
}

/* === Particles === */
#particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.particle { position: absolute; border-radius: 50%; pointer-events: none; animation-timing-function: linear; animation-iteration-count: infinite; }

.firefly { width: 4px; height: 4px; background: rgba(255, 220, 100, 0.8); box-shadow: 0 0 6px rgba(255, 220, 100, 0.6), 0 0 12px rgba(255, 200, 60, 0.3); animation: firefly-float 8s ease-in-out infinite; }
@keyframes firefly-float { 0%, 100% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.9; } 50% { opacity: 0.4; transform: translate(30px, -40px); } 80% { opacity: 0.8; } }

.sakura-petal { width: 8px; height: 6px; background: rgba(255, 180, 200, 0.7); border-radius: 50% 0 50% 0; animation: sakura-fall linear infinite; }
@keyframes sakura-fall { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translate(-80px, calc(100vh + 20px)) rotate(720deg); opacity: 0; } }

.spirit-orb { width: 6px; height: 6px; background: rgba(100, 200, 255, 0.6); box-shadow: 0 0 8px rgba(100, 200, 255, 0.4); animation: spirit-drift 10s ease-in-out infinite; }
@keyframes spirit-drift { 0%, 100% { opacity: 0; transform: translate(0, 0) scale(1); } 30% { opacity: 0.7; transform: translate(20px, -30px) scale(1.3); } 70% { opacity: 0.5; transform: translate(-10px, -60px) scale(0.8); } }

.snowflake { width: 5px; height: 5px; background: rgba(255, 255, 255, 0.8); animation: snow-fall linear infinite; }
@keyframes snow-fall { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.5; } 100% { transform: translate(-30px, calc(100vh + 10px)) rotate(360deg); opacity: 0; } }

.feather { width: 10px; height: 4px; background: rgba(100, 150, 220, 0.5); border-radius: 50% 0; animation: feather-drift linear infinite; }
@keyframes feather-drift { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 15% { opacity: 0.6; } 85% { opacity: 0.4; } 100% { transform: translate(-60px, calc(100vh + 10px)) rotate(540deg); opacity: 0; } }

/* === Character Layer === */
#character-layer {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}

.character-sprite {
  position: absolute; inset: 0; z-index: 1;
  transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
}
.character-sprite.speaking { z-index: 2; }
.character-sprite img { transition: filter 0.4s ease, left 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
.character-sprite.listening img { filter: brightness(0.55) saturate(0.75); }

.character-sprite.entering { opacity: 0; transform: translateY(20px); }
.character-sprite.visible { opacity: 1; }

.character-sprite.beast-transform { animation: beast-glow 2s ease-in-out; }
@keyframes beast-glow {
  0% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
  30% { filter: drop-shadow(0 0 40px rgba(255,180,80,0.8)) brightness(1.5); }
  60% { filter: drop-shadow(0 0 60px rgba(255,200,100,0.9)) brightness(2); }
  80% { filter: drop-shadow(0 0 30px rgba(255,180,80,0.5)) brightness(1.2); }
  100% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
}

/* Placeholder portrait when no image */
.char-placeholder {
  width: 100%; height: 100%;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; font-family: var(--font);
  overflow: hidden; position: relative;
}
.char-placeholder::before {
  content: ''; position: absolute; inset: 0;
  opacity: 0.5; border-radius: 12px;
}
.char-placeholder .placeholder-icon { font-size: 64px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); z-index: 1; }
.char-placeholder .placeholder-name {
  font-size: 14px; color: rgba(255,255,255,0.9); z-index: 1;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5); letter-spacing: 2px;
}

.char-portrait-img {
  position: absolute; width: auto; max-width: none;
}

/* === CG === */
#cg-layer { position: absolute; inset: 0; z-index: 0; display: none; opacity: 0; transition: opacity 0.8s ease; background: #0a0a16; }
#cg-layer.show { display: block; }
#cg-layer.in { opacity: 1; }
#cg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
#cg-layer.has-img #cg-img { display: block; }
#cg-ph { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(80vw, 380px); padding: 28px 24px; text-align: center; isolation: isolate; }
#cg-ph::before { content: ''; position: absolute; inset: 0; z-index: -1; border-style: solid; border-width: 50px 58px 48px 58px; border-image: url('assets/ui-dialogue.webp') 175 205 165 205 fill stretch; opacity: 0.9; }
#cg-layer.has-img #cg-ph { display: none; }
.cg-ph-tag { font-family: var(--font); font-size: 12px; letter-spacing: 6px; color: rgba(243,207,122,0.7); margin-bottom: 6px; }
.cg-ph-name { font-family: var(--font-brush); font-size: 28px; color: #fff0c8; letter-spacing: 4px; text-shadow: 0 0 16px rgba(255,190,90,0.4); }
.cg-ph-desc { font-family: var(--font); font-size: 13px; color: #d9ccb4; line-height: 1.7; margin-top: 10px; }
#cg-viewer { position: absolute; inset: 0; z-index: 66; display: none; background: #05050c; cursor: pointer; }
#cg-viewer.show { display: flex; align-items: center; justify-content: center; flex-direction: column; }
#cg-viewer img { width: 100%; height: 100%; object-fit: contain; }
#cg-viewer .cg-ph-name { position: absolute; bottom: 8%; }
.gallery { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 132px; align-content: start; gap: 8px; }
.gal-item { position: relative; height: 100%; border: 1px solid var(--ui-border); border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.03); cursor: pointer; display: flex; align-items: flex-end; justify-content: center; }
.gal-item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.gal-item span { position: relative; width: 100%; padding: 4px 2px; font-family: var(--font); font-size: 11px; color: #f1e8d8; background: linear-gradient(transparent, rgba(0,0,0,0.75)); text-align: center; }
.gal-item.locked { cursor: default; }
.gal-done { flex: 0 0 auto; text-align: center; padding: 8px 8px 0; font-family: var(--font-brush); font-size: 20px; letter-spacing: 4px; color: #f3cf7a; text-shadow: 0 0 12px rgba(243,207,122,0.4); }
.gal-done small { display: block; margin-top: 6px; font-family: var(--font); font-size: 12px; letter-spacing: 1px; line-height: 1.7; color: var(--text-dim); text-shadow: none; }
.gal-extra img { object-fit: cover; object-position: 55% 6%; }
.gal-item.locked span { color: var(--text-dim); }
.gal-item.locked::before { content: '？'; position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-size: 22px; color: rgba(243,207,122,0.35); }

/* === Dialogue === */
#dialogue-layer { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px env(safe-area-inset-bottom, 16px); }

#dialogue-box {
  position: relative; max-width: 800px; margin: 34px auto 14px; isolation: isolate;
  padding: 26px 34px 26px; cursor: pointer; min-height: 132px;
  filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45));
}
/* Painted frames sit on their own layer so the corner art can scale without touching text layout. */
#dialogue-box::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  border-style: solid; border-width: 50px 58px 48px 58px;
  border-image: url('assets/ui-dialogue.webp') 175 205 165 205 fill stretch;
}
#speaker-name {
  position: absolute; left: 14px; top: -30px; width: 156px; height: 42px;
  background: url('assets/ui-nameplate.webp') center / contain no-repeat;
  display: flex; align-items: center; justify-content: center; padding: 10px 14px 0 30px;
  font-family: var(--font-brush); font-size: 21px; letter-spacing: 3px; color: var(--ink) !important;
  text-shadow: 0 1px 0 rgba(255,240,210,0.6);
}
#speaker-name:empty { display: none; }
#dialogue-text { font-size: 17px; line-height: 1.85; letter-spacing: 0.05em; font-weight: 400; color: #f4ecdc; font-family: var(--font); min-height: 60px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
#dialogue-text .char { opacity: 0; display: inline; transition: opacity 0.05s; }
#dialogue-text .char.visible { opacity: 1; }

#text-indicator { position: absolute; bottom: 20px; right: 40px; color: var(--accent-gold); width: 12px; height: 12px; opacity: 0; transition: opacity 0.3s; }
#text-indicator.show { opacity: 0.6; animation: indicator-bounce 1s ease-in-out infinite; }
@keyframes indicator-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* === Choices === */
#choice-layer {
  position: absolute; inset: 0; display: none;
  justify-content: center; align-items: center;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 20;
}
#choice-layer.active { display: flex; }

.choice-btn, .title-btn {
  position: relative; background: none; border: none; min-height: 60px; isolation: isolate;
  padding: 9px 34px 24px 58px; color: var(--ink); /* the paper is the top ~70% of the art; the rest is ribbon */
  font-family: var(--font); font-size: 15px; cursor: pointer; text-align: left; line-height: 1.5;
  transition: transform 0.25s ease, filter 0.25s ease;
  filter: drop-shadow(0 3px 8px rgba(0,0,0,0.45));
}
.choice-btn::before, .title-btn::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  border-style: solid; border-width: 0 34px 0 52px;
  border-image: url('assets/ui-choice.webp') 0 214 0 310 fill stretch;
}
#choice-container { display: flex; flex-direction: column; gap: 14px; max-width: 500px; width: 92%; }
.choice-btn:hover { transform: translateX(4px); filter: drop-shadow(0 0 10px rgba(255,200,110,0.65)) brightness(1.06); }
.choice-btn:active { transform: translateX(2px) scale(0.99); }

/* === Affection === */
.aff-change {
  position: fixed; font-size: 18px; font-weight: 700; pointer-events: none;
  animation: aff-popup 1.5s ease-out forwards; z-index: 100;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
@keyframes aff-popup { 0% { opacity: 1; transform: translateY(0) scale(1); } 50% { opacity: 1; transform: translateY(-30px) scale(1.2); } 100% { opacity: 0; transform: translateY(-60px) scale(0.8); } }

/* === Title Screen === */
/* Browsers block sound until the first tap, so the game opens on a tap-to-start gate; the title waits behind it. */
#tap-gate { position: absolute; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: #06060f url('assets/ui-title.webp') center / cover no-repeat; cursor: pointer; transition: opacity 0.8s ease; }
#tap-gate::before { content: ''; position: absolute; inset: 0; background: rgba(4,4,12,0.74); }
#tap-gate.gone { opacity: 0; pointer-events: none; }
.tg-inner { position: relative; text-align: center; padding: 0 16px; }
.tg-title { font-family: var(--font-brush); font-size: clamp(48px, 14vw, 80px); color: #fff4dc; letter-spacing: 6px; text-shadow: 0 0 24px rgba(255,190,90,0.5), 0 3px 0 rgba(120,20,10,0.7); }
.tg-hint { margin-top: 28px; font-family: var(--font); font-size: 15px; color: #f3cf7a; letter-spacing: 6px; animation: tg-pulse 2.2s ease-in-out infinite; }
.tg-sub { margin-top: 10px; font-family: var(--font); font-size: 12px; color: var(--text-dim); letter-spacing: 2px; }
@keyframes tg-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
#title-screen.waiting, #title-screen.waiting * { animation-play-state: paused !important; }
#title-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  background: #0a0a18 url('assets/ui-title.webp') center / cover no-repeat;
  z-index: 50; transition: opacity 1.5s ease;
}
#title-screen.hidden { opacity: 0; pointer-events: none; }

#title-particles { position: absolute; inset: 0; overflow: hidden; }
.title-firefly {
  position: absolute; width: 3px; height: 3px; background: rgba(255, 220, 100, 0.7);
  border-radius: 50%; box-shadow: 0 0 6px rgba(255, 220, 100, 0.5);
  animation: title-fly linear infinite;
}
@keyframes title-fly { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.8; } 80% { opacity: 0.6; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

#title-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 1; padding-top: 13vh; }
#title-content::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 48%; z-index: -1; background: radial-gradient(ellipse 70% 60% at 50% 38%, rgba(8,8,24,0.55) 0%, transparent 70%); }
#title-jp { font-size: 14px; color: #f3cf7a; text-shadow: 0 1px 6px rgba(0,0,0,0.8); letter-spacing: 8px; margin-bottom: 12px; opacity: 0; animation: title-fade 2s ease 0.5s forwards; font-family: var(--font); }
#title-main { font-size: clamp(52px, 15vw, 88px); font-weight: 400; color: #fff4dc; letter-spacing: 6px; text-shadow: 0 0 24px rgba(255,190,90,0.55), 0 3px 0 rgba(120,20,10,0.7), 0 0 60px rgba(0,0,0,0.6); margin-bottom: 8px; opacity: 0; animation: title-fade 2s ease 1s forwards; font-family: var(--font-brush); }
#title-figure { position: absolute; left: 59%; /* the torii gateway in ui-title.webp, phone and desktop crops alike */ width: auto; translate: -60% 0; /* translate, not transform: the title-fade keyframes own transform */ opacity: 0; display: none; pointer-events: none; filter: drop-shadow(0 0 18px rgba(255,200,120,0.35)); -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%); mask-image: linear-gradient(to bottom, #000 72%, transparent 100%); }

#title-endings { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 14px; opacity: 0; animation: title-fade 2s ease 1.8s forwards; }

#title-endings i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--c); opacity: 0.55; }
#title-endings i.on { background: var(--c); opacity: 1; box-shadow: 0 0 8px var(--c); }
#title-endings i.secret { transform: rotate(45deg); border-radius: 2px; }
#title-endings span { margin-left: 6px; font-family: var(--font); font-size: 12px; color: #f0e2c4; letter-spacing: 2px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
#title-sub { font-family: var(--font) !important; font-size: 14px; color: #f0e2c4; text-shadow: 0 1px 6px rgba(0,0,0,0.9); letter-spacing: 4px; margin-bottom: 0; opacity: 0; animation: title-fade 2s ease 1.5s forwards; font-family: var(--font); }
@keyframes title-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

#title-buttons { position: absolute; left: 0; right: 0; bottom: 9vh; display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; animation: title-fade 2s ease 2s forwards; }
.title-btn { width: 230px; text-align: center; padding: 10px 34px 20px 56px; font-family: var(--font-brush); font-size: 21px; letter-spacing: 6px; }
.title-btn:hover { filter: drop-shadow(0 0 12px rgba(255,200,110,0.7)) brightness(1.06); transform: scale(1.03); }
.title-btn[hidden] { display: none; }

/* === Transform Overlay === */
#transform-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; z-index: 30; pointer-events: none; }
#transform-overlay.active { display: flex; animation: transform-flash 2.5s ease-in-out forwards; }
@keyframes transform-flash { 0% { background: transparent; } 20% { background: rgba(255, 220, 140, 0.6); } 40% { background: rgba(255, 200, 100, 0.3); } 60% { background: rgba(255, 180, 80, 0.1); } 100% { background: transparent; } }
#transform-text { font-size: clamp(30px, 8vw, 48px); font-weight: 400; letter-spacing: 4px; color: #fff0c8; text-shadow: 0 0 30px rgba(255,190,90,0.9), 0 2px 0 rgba(120,20,10,0.8); font-family: var(--font-brush); opacity: 0; animation: transform-text-show 2.5s ease-in-out forwards; }
@keyframes transform-text-show { 0% { opacity: 0; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }

/* === Chapter overlay === */
#chapter-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; flex-direction: column; background: #0a0c1c url('assets/ui-chapter.webp') center / cover no-repeat; z-index: 25; pointer-events: none; }
#chapter-overlay.active { animation: chap-bg 3s ease forwards; }
@keyframes chap-bg { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
#chapter-overlay.active { display: flex; }
#chapter-num { font-family: var(--font); font-weight: 500; font-size: 15px; color: #f3cf7a; letter-spacing: 10px; margin-bottom: 14px; padding: 0 0 10px; border-bottom: 1px solid rgba(243,207,122,0.5); text-shadow: 0 1px 6px rgba(0,0,0,0.9); opacity: 0; animation: chap-in 1.5s ease 0.3s forwards; }
#chapter-title { font-size: clamp(38px, 11vw, 60px); font-weight: 400; letter-spacing: 6px; color: #fff4dc; text-shadow: 0 0 20px rgba(255,190,90,0.45), 0 2px 0 rgba(120,20,10,0.7), 0 0 40px rgba(0,0,0,0.8); font-family: var(--font-brush); opacity: 0; animation: chap-in 1.5s ease 0.6s forwards; }
@keyframes chap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === Ending === */
#ending-screen { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40; padding: 0 20px; background: linear-gradient(rgba(6,8,20,0.35), rgba(6,8,20,0.55)), #0a0c1c url('assets/ui-ending.webp') center / cover no-repeat; animation: title-fade 2s ease; }
#ending-screen.active { display: flex; }
#ending-screen > * { position: relative; z-index: 1; transition: opacity 1.4s ease; }
/* Two beats: first you, alone in the ceremony robes; then she fades and the ending card comes in. */
#ending-screen > #ending-figure { position: absolute; z-index: 0; bottom: 0; left: 50%; height: 86%; width: auto; transform: translateX(-60%); /* her body sits right of the image centre */ opacity: 0; pointer-events: none; transition: opacity 1.2s ease, transform 1.6s ease; filter: drop-shadow(0 0 28px rgba(255,200,120,0.35)); -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 99%); mask-image: linear-gradient(to bottom, #000 70%, transparent 99%); }
#ending-screen.fig-on > #ending-figure { opacity: 1; transform: translateX(-60%) translateY(-8px); }
#ending-screen.intro > :not(#ending-figure) { opacity: 0; pointer-events: none; }
#ending-screen.intro { cursor: pointer; }
#ending-title { font-size: clamp(44px, 12vw, 68px); font-weight: 400; letter-spacing: 6px; color: #fff4dc; font-family: var(--font-brush); margin-bottom: 18px; text-shadow: 0 0 24px rgba(255,190,90,0.55), 0 3px 0 rgba(120,20,10,0.7); }
#ending-subtitle { position: relative; isolation: isolate; max-width: 460px; font-size: 15px; color: #f1e8d8; font-family: var(--font); margin-bottom: 28px; text-align: center; line-height: 1.95; padding: 30px 34px; white-space: pre-line; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
#ending-subtitle::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0.94; border-style: solid; border-width: 50px 58px 48px 58px; border-image: url('assets/ui-dialogue.webp') 175 205 165 205 fill stretch; }

/* === Menu === */
#menu-btn { position: absolute; top: 16px; left: 16px; z-index: 22; width: 36px; height: 36px; background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); font-size: 14px; backdrop-filter: blur(8px); transition: all 0.3s; }
#music-btn { position: absolute; top: 16px; right: 16px; z-index: 55; width: 36px; height: 36px; background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.3); border-radius: 50%; color: var(--accent-gold); font-size: 16px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s; padding: 0; }
#skip-btn { position: absolute; top: 16px; right: 60px; z-index: 22; height: 36px; padding: 0 12px; background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.2); border-radius: 18px; color: var(--text-dim); font-family: var(--font); font-size: 13px; letter-spacing: 2px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s; }
#skip-btn.on { color: #1a1206; background: var(--accent-gold); border-color: var(--accent-gold); box-shadow: 0 0 12px rgba(212,168,84,0.6); }
#game.skipping #dialogue-box { filter: drop-shadow(0 0 10px rgba(212,168,84,0.5)); }
#music-btn.off { color: var(--text-dim); border-color: rgba(212,168,84,0.15); text-decoration: line-through; opacity: 0.7; }
#menu-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

.save-toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(10,10,20,0.9); border: 1px solid var(--accent-gold); border-radius: 6px; padding: 8px 20px; font-family: var(--font-ui); font-size: 13px; color: var(--accent-gold); z-index: 100; opacity: 0; animation: toast-show 2s ease forwards; }
@keyframes toast-show { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; } }

/* === System menu / save & load === */
#sys-layer, #confirm-layer {
  position: absolute; inset: 0; display: none; z-index: 60;
  background: rgba(4,4,10,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);

}

#confirm-layer { z-index: 70; }

.sys-card {
  position: relative; isolation: isolate;
  width: min(92vw, 420px); max-height: 86vh; display: flex; flex-direction: column;
  padding: 34px 26px 36px 34px; filter: drop-shadow(0 12px 30px rgba(0,0,0,0.6));
}
.sys-card::before {
  content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  border-style: solid; border-width: 150px 36px 80px 96px;
  border-image: url('assets/ui-panel.webp') 560 130 290 360 fill stretch;
}
#confirm-layer .sys-card { padding: 26px 34px; width: min(90vw, 380px); }
#confirm-layer .sys-card::before { border-width: 50px 58px 48px 58px; border-image: url('assets/ui-dialogue.webp') 175 205 165 205 fill stretch; }
.slot-list, .bond-list { scrollbar-width: thin; scrollbar-color: rgba(212,168,84,0.4) transparent; }
.sys-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 12px; border-bottom: 1px solid rgba(212,168,84,0.3); }
.sys-title { flex: 1; text-align: center; font-family: var(--font-brush); font-size: 26px; color: #f3cf7a; letter-spacing: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.sys-head > span:first-child, .sys-head > .sys-close { width: 30px; flex: 0 0 30px; }
.sys-close { background: none; border: none; color: var(--text-dim); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.sys-close:hover { color: var(--accent-gold); }

.menu-list { display: flex; flex-direction: column; gap: 10px; padding: 14px 4px 6px; }
.menu-item {
  background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px;
  color: var(--text); font-family: var(--font-deco); font-weight: 700; font-size: 15px; letter-spacing: 3px;
  padding: 13px 16px; cursor: pointer; text-align: left; transition: all 0.2s;
}
.menu-item:hover, .menu-item:active { border-color: var(--accent-gold); background: rgba(212,168,84,0.12); }
.menu-item small { display: block; margin-top: 3px; font-family: var(--font-ui); font-size: 11px; color: var(--text-dim); letter-spacing: 0; }

.slot-list { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.slot-note { padding: 0 16px 12px; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.slot {
  position: relative; display: flex; gap: 12px; align-items: stretch;
  background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px;
  padding: 8px; cursor: pointer; text-align: left; color: var(--text); transition: all 0.2s;
  font-family: var(--font-ui); width: 100%;
}
.slot:hover, .slot:active { border-color: var(--accent-gold); background: rgba(212,168,84,0.10); }
.slot.disabled { cursor: default; opacity: 0.45; }
.slot.disabled:hover { border-color: var(--ui-border); background: rgba(255,255,255,0.03); }
.slot-thumb { position: relative; flex: 0 0 52px; height: 68px; border-radius: 6px; overflow: hidden; background: #1a1428; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.slot-thumb img { max-width: none; }
.slot-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-right: 22px; }
.slot-top { display: flex; gap: 8px; align-items: baseline; }
.slot-name { font-size: 13px; color: var(--accent-gold); font-weight: 600; white-space: nowrap; }
.slot-time { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.slot-chap { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font); }
.slot-line { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-empty { font-size: 13px; color: var(--text-dim); align-self: center; letter-spacing: 2px; }
.slot-del { position: absolute; top: 4px; right: 4px; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; line-height: 1; }
.slot-del:hover { color: #ff6b6b; }

.note { background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px; padding: 10px 12px; }
.note-q { font-family: var(--font); font-size: 14px; color: var(--accent-gold); margin-bottom: 4px; }
.note-a { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
.note.solved { opacity: 0.75; }
.note.solved .note-q { color: var(--text); }
#game.flashback #scene-bg, #game.flashback #character-layer { filter: sepia(0.75) saturate(0.7) brightness(0.9) contrast(0.95); transition: filter 1s ease; }
#game.flashback::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(40,25,10,0.55) 100%); }
#scene-bg, #character-layer { transition: filter 1s ease; }
.chap-item { display: flex; align-items: baseline; gap: 12px; }
.chap-num { flex: 0 0 64px; font-family: var(--font-brush); font-size: 17px; color: #f3cf7a; letter-spacing: 2px; }
.flow-tabs { display: flex; justify-content: center; gap: 6px; padding: 4px 0 8px; }
.flow-tabs button { font-family: var(--font); font-size: 12px; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--ui-border); background: transparent; color: var(--text-dim); cursor: pointer; }
.flow-tabs button.on { color: #f3cf7a; border-color: #f3cf7a; background: rgba(243,207,122,0.08); }
.flow { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 12px 12px 26px; position: relative; scrollbar-width: thin; scrollbar-color: rgba(212,168,84,0.4) transparent; }
.flow-chap { position: relative; margin: 10px 0 8px -14px; font-family: var(--font-brush); font-size: 16px; letter-spacing: 3px; color: #f3cf7a; }
.flow-chap::before { content: ''; display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #f3cf7a; box-shadow: 0 0 8px #f3cf7a; vertical-align: 1px; }
.flow-chap.target { margin-top: 14px; }
.flow-chap.target::after { content: '  ← 从这里开始'; font-family: var(--font); font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
.flow-node { position: relative; margin: 0 0 14px; padding: 8px 10px; border: 1px solid rgba(212,168,84,0.25); border-radius: 8px; background: rgba(255,255,255,0.03); }
.flow-node.key { border-color: rgba(243,207,122,0.55); }
.flow-node::before { content: ''; position: absolute; left: -18px; top: -14px; bottom: -14px; width: 2px; background: rgba(212,168,84,0.35); }
.flow-node::after { content: ''; position: absolute; left: -21px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: #1a1428; border: 2px solid rgba(212,168,84,0.7); }
.flow-node + .flow-node > .flow-q::before { content: '↓'; position: absolute; left: -22px; top: -16px; font-size: 11px; color: rgba(212,168,84,0.7); }
.flow-node.auto { border-style: dashed; }
.flow-q { position: relative; font-size: 11px; line-height: 1.5; color: var(--text-dim); margin-bottom: 6px; }
.flow-opt { display: flex; align-items: center; gap: 6px; width: 100%; margin: 4px 0 0; padding: 6px 8px; text-align: left; font-family: var(--font); font-size: 13px; line-height: 1.4; color: rgba(241,232,216,0.5); background: transparent; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; cursor: pointer; }
.flow-opt i { flex: 0 0 7px; height: 7px; border-radius: 50%; opacity: 0.6; }
.flow-opt.on { color: #fff4dc; border-color: #f3cf7a; background: rgba(243,207,122,0.12); box-shadow: 0 0 10px rgba(243,207,122,0.25); }
.flow-opt.on i { opacity: 1; }
.flow-node.auto .flow-opt.on { color: var(--c); border-color: var(--c); cursor: default; }
.flow-opt.seen::after { content: '✓'; margin-left: auto; padding-left: 6px; font-size: 11px; color: #f3cf7a; }
.flow-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; border-top: 1px solid rgba(212,168,84,0.3); }
.flow-bars { flex: 1 1 auto; display: flex; gap: 6px; }
.flow-bar { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.flow-bar > div { width: 100%; height: 44px; display: flex; align-items: flex-end; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
.flow-bar b { width: 100%; min-height: 2px; transition: height 0.3s ease; }
.flow-bar span { font-family: var(--font); font-size: 11px; line-height: 1; }
.flow-go { flex: 0 0 auto; font-family: var(--font-brush); font-size: 17px; letter-spacing: 3px; padding: 8px 14px; border-radius: 8px; border: 1px solid #f3cf7a; background: rgba(243,207,122,0.15); color: #fff4dc; cursor: pointer; }
.bond-list { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bond { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px; padding: 8px; }
.bond.unknown { opacity: 0.5; }
.bond.you { border-color: rgba(243,207,122,0.45); background: rgba(243,207,122,0.06); }
.bond.you .slot-thumb { background: #2a2236; }
.bond.you .bond-desc { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.6; }
.bond-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.bond-top { display: flex; align-items: baseline; gap: 8px; }
.bond-name { font-family: var(--font-brush); font-size: 21px; letter-spacing: 2px; }
.bond-desc { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bond-stage { margin-left: auto; font-size: 12px; font-family: var(--font); color: var(--accent-gold); white-space: nowrap; }
.bond-meter { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.bond-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.23, 1, 0.32, 1); }

.confirm-text { padding: 20px 18px 8px; font-size: 14px; color: var(--text); line-height: 1.7; white-space: pre-line; font-family: var(--font); }
.confirm-actions { display: flex; gap: 10px; padding: 14px 16px 16px; justify-content: flex-end; }
.confirm-actions button { font-family: var(--font); font-size: 14px; padding: 9px 22px; border-radius: 6px; cursor: pointer; letter-spacing: 2px; }
.btn-ghost { background: transparent; border: 1px solid var(--ui-border); color: var(--text-dim); }
.btn-gold { background: rgba(212,168,84,0.18); border: 1px solid var(--accent-gold); color: var(--accent-gold); }

/* === Day indicator === */
#day-indicator {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.2);
  border-radius: 20px; padding: 4px 16px;
  font-family: var(--font); font-size: 12px; color: var(--accent-gold);
  letter-spacing: 2px; z-index: 10; opacity: 0; transition: opacity 0.5s;
  backdrop-filter: blur(8px);
}

  #dialogue-layer { padding: 0 6px env(safe-area-inset-bottom, 8px); }

  #dialogue-text { font-size: 16.5px; line-height: 1.8; }
  .choice-btn { font-size: 14px; }
  #choice-container { width: 97%; }
}
</style>

        <button id="start-btn" class="title-btn">开始物语</button>
        <button id="title-load-btn" class="title-btn secondary" hidden>读取存档</button>
        <button id="title-chap-btn" class="title-btn secondary" hidden>选择章节</button>
      </div>

  <div id="scene-bg"></div>

// In a two-shot the speaker steps toward the middle and the listener gives way.
function slotX(pos, role) {
  const base = SLOT_X[pos];
  if (pos === 'center' || !role) return base;
  const inward = role === 'speaking' ? 5 : -10;
  return pos === 'left' ? base + inward : base - inward;
}

function portraitStyle(key, pos, role) {
  const { ex = 50, bx = ex, ey = 12, h = 100, dx = 0, sx = 0, ss = sx } = PORTRAIT_POS[key] || {};
  const out = role === 'speaking' ? ss : sx, side = pos === 'left' ? -out : pos === 'right' ? out : 0; // wide sprites sit further out when sharing the stage
  return `height:${h}%;top:${EYE_Y - ey * h / 100}%;left:${slotX(pos, role) + dx + side}%;transform:translateX(-${bx}%)`;
}

function getPortrait(charId, formKey, pos = 'center') {

    return `<img class="char-portrait-img" src="${imgPath}" alt="${CHARS[charId].name}" style="${portraitStyle(key, pos)}">`;

  const c = CHARS[charId];
  return `<div class="char-placeholder" style="background:${c.placeholderBg}">

      { char: 'narrator', text: '你低头看着那个木盒。盒子很轻。可是不知道为什么，拿在手里，是温的。' },
    ],
    next: 'pro_house',
  },

  'pro_house': {
    scene: 'room', particles: null,
    lines: [
      { char: 'narrator', text: '外婆的老房子在镇子最北边，紧挨着山脚。你撑着伞走了二十分钟，裤脚全湿了。' },
      { char: 'narrator', text: '推开拉门，屋里还留着她的味道。晒过的榻榻米，线香，还有一点点金平糖的甜味。' },
      { char: 'narrator', text: '玄关的鞋柜上，整整齐齐地摆着一双登山鞋。鞋底的泥是干的，鞋带系成了蝴蝶结。' },
      { char: 'narrator', text: '像是她随时会回来，穿上它，再出一次门。' },
      { char: 'narrator', text: '柱子上还留着一道一道的铅笔印。最矮的一道旁边写着「三岁」，最高的一道写着「六岁」。' },
      { char: 'narrator', text: '「六岁」上面，再也没有了。' },
      { char: 'narrator', text: '厨房的墙上挂着一本日历。每个月，都有一天被红笔圈了起来。' },
      { char: 'narrator', text: '你往前翻。每一个红圈，都是满月。红圈旁边写着小字：「带糖」「梅子饭团」「伞」「跟那条蛇下棋，这次不许让我」。' },
      { char: 'narrator', text: '上个月的满月，也圈着。旁边的字写了一半，就断了。' },
      { char: 'narrator', text: '这个月的满月——七天以后——也被圈着。红圈画得很用力，旁边只有三个字。' },
      { char: 'narrator', text: '「小不点。」' },
      { char: 'player', text: '（……什么时候写的？）' },
      { char: 'player', text: '（外婆，你那时候就知道，自己去不了了吗。）' },
      { char: 'narrator', text: '你在矮桌前坐下，打开了那个木盒。' },
      { char: 'narrator', text: '里面有三样东西。一枚系着褪色红绳的小铜铃。一封拆开的信。还有一封用蜡封住的信。', cg: 'cg_main_letter' },
      { char: 'narrator', text: '封蜡的那一封，信封上只写着一行字：「满月之夜，在要石前打开。」', flag: 'q_letter' },
      { char: 'player', text: '（要石……？）' },
      { char: 'narrator', text: '你先拿起了拆开的那一封。信封上是外婆歪歪扭扭的字——「给我的小不点」。' },
      { char: 'player', text: '（……都多大了，还叫我小不点。）' },
      { char: 'narrator', text: '「小不点：你读到这封信的时候，外婆大概已经去很远的地方了。别哭，外婆活够了，也笑够了。」' },
      { char: 'narrator', text: '「只有一件事，外婆放心不下。后山上，有一座神社。神社里，住着外婆最好的朋友们。」' },
      { char: 'narrator', text: '「五十年来，每个满月，外婆都会上山去看他们。可是这一次，外婆去不了了。」' },
      { char: 'narrator', text: '「请你在满月前七天上山，把这枚铃，交给一位红头发的狐狸姑娘。她叫琥珀。」' },
      { char: 'narrator', text: '「七天，刚好够你认识他们每一个。到了满月那天，你再决定要不要留下这枚铃。」' },
      { char: 'narrator', text: '「他们都是好孩子。就是有点笨，不太会说话。你多担待。」' },
      { char: 'narrator', text: '「另一封信，满月以前不许偷看。外婆会知道的。」' },
      { char: 'narrator', text: '「——对了。你小时候，他们其实见过你的。只是你忘了。」' },
      { char: 'player', text: '（狐狸姑娘？神社里的……朋友们？）' },
      { char: 'player', text: '（护士说过，外婆最后那段时间常常说胡话。说什么「山上的孩子们要饿肚子了」「那条蛇又在逞强」……）' },
      { char: 'narrator', text: '你拿起那枚铜铃。它很轻，冰凉。' },
      { char: 'narrator', text: '然后，在你的掌心里——它自己轻轻地响了一声。' },
      { char: 'narrator', text: '叮。' },
    ],
    choices: [
      { text: '吓得差点把铃扔出去', next: 'pro_night' },
      { text: '想起老板娘的话——「那是有人在叫你」，握紧了它', flag: 'held_bell', next: 'pro_night' },
    ],
  },

  'pro_night': {
    scene: 'room', particles: null,
    lines: [
      { char: 'narrator', text: '铃在榻榻米上滚了两圈，停在矮桌腿边上。你盯着它看了足足一分钟。它没有再响。', ifnot: 'held_bell' },
      { char: 'player', text: '（……一定是风。一定是。）', ifnot: 'held_bell' },
      { char: 'narrator', text: '你把它捡起来，又放下，又捡起来。最后还是用手帕包好，放在了枕头旁边。', ifnot: 'held_bell' },
      { char: 'narrator', text: '铃在你的手心里安静下来。那一点点凉，慢慢被你的体温焐热了。', if: 'held_bell' },
      { char: 'player', text: '（有人在叫我。……是谁呢。）', if: 'held_bell' },
      { char: 'narrator', text: '那天晚上，你睡在外婆的房间里。' },
      { char: 'narrator', text: '被褥有樟脑丸的味道。窗外下着小雨，雨打在芭蕉叶上，一下一下的。' },
      { char: 'narrator', text: '手机亮了一下。是公司的前辈：「节哀。另外丧假回来记得把季度报表交一下哈。」' },
      { char: 'narrator', text: '你看了很久，打了一个「好」，又删掉了。把手机扣在榻榻米上。' },
      { char: 'narrator', text: '你睡不着。把铃放在枕边，盯着天花板上的木纹。' },
      { char: 'narrator', text: '半夜的时候，雨停了。' },
      { char: 'narrator', text: '院子里传来一点声音。很轻。像是什么东西，在湿漉漉的石板上走。' },
      { char: 'narrator', text: '你爬起来，拉开窗户的一条缝。' },
      { char: 'narrator', text: '院子里什么都没有。只有月亮，从云后面露出来半张脸。' },
      { char: 'narrator', text: '屋顶上「嗒」地响了一下。像是有什么很重的东西，刚刚离开。' },
      { char: 'narrator', text: '然后你看到——窗台上，放着一根羽毛。' },
      { char: 'narrator', text: '蓝灰色的，很长，边缘在月光下泛着一层银。羽尖笔直地，指向后山的方向。' },
      { char: 'player', text: '（……刚才，有谁来过？）' },
      { char: 'narrator', text: '你拿着那根羽毛，在窗边站了很久。' },
      { char: 'narrator', text: '后来，你还是睡着了。然后，做了一个梦。' },
    ],
    next: 'pro_memory',
  },

  'pro_memory': {
    scene: 'forest', particles: 'fireflies', flashback: true,
    lines: [
      { char: 'narrator', text: '梦里，你很小很小。' },
      { char: 'narrator', text: '天黑了。四周全是很高很高的树，你怎么也找不到外婆。' },
      { char: 'narrator', text: '身后有什么在跟着你。叮当，叮当。很小的铃铛声。你回头，什么也没有。' },
      { char: 'narrator', text: '你坐在一块石头上哭。哭得打嗝。' },
      { char: 'narrator', text: '然后有什么东西从树后面走了出来。银色的，比你还高，毛茸茸的。' },
      { char: 'narrator', text: '你记得你抱住了它的脖子，哭得一塌糊涂。它身上有雨水和松针的味道。' },
      { char: 'narrator', text: '还有一个红头发的姐姐，蹲下来，往你手心里放了一颗糖。星星形状的。' },
      { char: 'narrator', text: '「不哭了。你外婆就在下面等你呢。」' },
      { char: 'narrator', text: '有人往你头上放了一个花环。花是湿的，凉凉的，滴了一滴露水在你鼻尖上。' },
      { char: 'narrator', text: '——还有别的。' },
      { char: 'narrator', text: '很黑很黑的地方。有人在下棋。石子碰在一起的声音，啪，啪。' },
      { char: 'narrator', text: '一个很好听的声音说：「这个不能吃。……喂，吐出来。」' },
      { char: 'narrator', text: '梦到这里，就碎了。' },
    ],
    next: 'pro_wake',
  },

  'pro_wake': {
    scene: 'room', particles: null,
    lines: [
      { char: 'narrator', text: '醒来的时候，天已经亮了。阳光从拉门的缝里斜斜地切进来，照在那根羽毛上。' },
      { char: 'player', text: '（……那是梦吧。小时候做过的梦。）' },
      { char: 'player', text: '（可是为什么，连糖的味道都记得这么清楚。）' },
      { char: 'narrator', text: '你看了看厨房里那本日历。离那个用力画下的红圈，正好还有七天。' },
      { char: 'narrator', text: '手机响了。是父亲。' },
      { char: 'narrator', text: '「葬礼的事，辛苦你了。那房子你看着处理吧，要卖就卖，中介我可以帮你找。」' },
      { char: 'player', text: '……爸。外婆说，后山上有她的朋友。她让我上山去一趟。' },
      { char: 'narrator', text: '电话那头安静了一会儿。' },
      { char: 'narrator', text: '「山上？别去了。你外婆那些神神叨叨的话，你妈小时候就听了一辈子。」' },
      { char: 'narrator', text: '「……不过，她也一个人在那里住了二十年。」' },
      { char: 'narrator', text: '父亲叹了口气。你很少听到他叹气。' },
      { char: 'narrator', text: '「山路滑。路上小心。」' },
      { char: 'narrator', text: '电话挂了。你把外婆的信折好，贴身放着，把铃和羽毛装进了木盒。' },
      { char: 'player', text: '（上山之前，先去镇上买点吃的。……山上应该没有便利店吧。）' },
    ],
    next: 'pro_morning',
  },

  'pro_morning': {
    scene: 'town', particles: null,
    lines: [
      { char: 'narrator', text: '雨后的小镇被洗得发亮。屋檐还在滴水，一只三花猫蹲在邮筒上舔爪子。' },
      { char: 'narrator', text: '杂货店的门帘一掀，老板娘就「哎呀」了一声。' },
      { char: 'narrator', text: '「来得正好！我正想给你送过去呢。」' },
      { char: 'narrator', text: '她从柜台下面拿出一个纸袋。半袋金平糖，袋口用橡皮筋扎着。' },
      { char: 'narrator', text: '「婆婆那天买的那袋糖，分了一半寄在我这儿。说一次拿不动，出院了再来取。」' },
      { char: 'narrator', text: '「……她没来取。你带上山吧。本来就是给山上的孩子的。」' },
      { char: 'narrator', text: '你把糖放进木盒里，和铃挨在一起。' },
      { char: 'narrator', text: '店门口的长凳上，坐着一个下将棋的老爷爷，一个人跟自己下。他抬起头，眯着眼睛看你。' },
      { char: 'narrator', text: '「后山？你要上后山？」' },
      { char: 'narrator', text: '「我跟你讲。千代婆婆每回满月上山，山脚那棵大杉树下，都有个银头发的年轻人在等她。」' },
      { char: 'narrator', text: '「个子老高，不说话，站得笔直。我七岁的时候就看见他在那儿——我今年七十三了，他还是那个样子。一根皱纹都没长。」' },
      { char: 'narrator', text: '「你又喝多了吧。」老板娘头也不抬地说。' },
      { char: 'narrator', text: '「早上八点喝什么酒！」老爷爷吹胡子瞪眼，「我说真的！那小伙子的眼睛是蓝的，跟冰一样！」' },
      { char: 'player', text: '（……银头发，蓝眼睛。）' },
      { char: 'player', text: '（外婆的「相好的」？……不会吧。）' },
      { char: 'narrator', text: '你买了两瓶水，三个饭团，一包纸巾。想了想，又多买了一把折叠伞。' },
      { char: 'narrator', text: '「那把伞质量不好，一吹就翻。」老板娘说。' },
      { char: 'narrator', text: '「不买的话，今天下午山里就会下雨。」老爷爷说。「千代婆婆告诉我的。山里的雨，专挑不带伞的人下。」' },
      { char: 'narrator', text: '你最后还是买了。' },
    ],
    next: 'pro_climb',
  },

  'pro_climb': {
    scene: 'forest', particles: 'fireflies',
    lines: [
      { char: 'narrator', text: '中午过后，你背着一个小包，走上了后山。' },
      { char: 'narrator', text: '外婆的信纸背面，画着一张简陋的地图：沿着溪走，过了那棵被雷劈开的老杉树，往左。旁边写着「半小时」。' },
      { char: 'player', text: '（半小时……这是按外婆的脚程算的吧。她八十多岁了还爬山吗？）' },
      { char: 'narrator', text: '一个半小时以后，你终于明白了：外婆的「半小时」，是认真的。你的体力，才是需要反省的。' },
      { char: 'narrator', text: '溪水在石头之间哗哗地响。你蹲下来洗了把脸，水凉得牙根发酸。' },
      { char: 'narrator', text: '手机早就没信号了。山路越走越窄。头顶的天，不知道什么时候阴了下来。' },
      { char: 'narrator', text: '第一滴雨，落在了你的后颈上。' },
      { char: 'narrator', text: '你撑开那把折叠伞。一阵山风从坡上卷下来——伞「啪」地翻了过去，变成了一朵倒扣的喇叭花。' },
      { char: 'player', text: '（……老板娘说得对。）' },
      { char: 'narrator', text: '你抱着脑袋往前跑。雨越下越大，鞋子里咕叽咕叽地进了水。' },
      { char: 'narrator', text: '然后，你看到了它。一棵从中间裂开的老杉树，焦黑的裂口朝着天，像一只张开的手。' },
      { char: 'narrator', text: '老杉树上缠着一圈旧注连绳，纸垂在风里轻轻晃。' },
      { char: 'narrator', text: '树根旁边，靠着一把油纸伞。' },
      { char: 'narrator', text: '竹骨是新削的，还带着一点青色。伞面是深蓝的，干干爽爽，一滴雨也没沾。像是有人刚刚才放在这里。' },
      { char: 'narrator', text: '伞柄上刻着一道小小的月牙。刻痕很深，不像是刀刻的，更像是……爪子。' },
      { char: 'player', text: '（……这是谁的伞？）' },
      { char: 'narrator', text: '雨打在你的脸上。你犹豫了一下，还是撑开了它。' },
      { char: 'narrator', text: '伞底下很安静。有一股淡淡的、雨水和松针的味道。' },
      { char: 'player', text: '（这个味道……在哪里闻到过。）' },
      { char: 'narrator', text: '你撑着它走了没几步，雨就停了。停得干干净净，像是专门下给你看的。' },
      { char: 'narrator', text: '太阳从云后面钻出来，已经快落下去了。树的左边，本该是一片灌木。' },
      { char: 'narrator', text: '可是你走近的时候，口袋里的铃又响了一声。' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '灌木像是被风吹开一样，向两边让开了。后面露出一条铺满青苔的石阶。' },
      { char: 'player', text: '（……刚才明明没有这条路的。）' },
      { char: 'narrator', text: '你踏上石阶。就在这时，一道白色的影子从你眼角掠了过去。' },
      { char: 'player', text: '——谁？！' },
      { char: 'narrator', text: '只有树影在晃。' },
      { char: 'narrator', text: '可你分明听见了——某种轻快的、爪子踩过落叶的声音。它没有走远，就在你左边的林子里，跟着你。' },
      { char: 'narrator', text: '你走，它也走。你停，它也停。' },
    ],
    choices: [
      { text: '「……外婆的朋友？」对着林子小声问', affection: { whitewolf: 1 }, next: 'pro_torii' },
      { text: '假装没发现，加快脚步', next: 'pro_torii' },
      { text: '捡起一根树枝，握在手里', affection: { whitewolf: 1 }, flag: 'took_stick', next: 'pro_torii' },
    ],
  },

  'pro_torii': {
    scene: 'forest', particles: 'fireflies',
    lines: [
      { char: 'narrator', text: '林子里的脚步声顿了一下。', },
      { char: 'narrator', text: '然后，你好像听到了一声很轻的——笑？像是谁憋不住，从鼻子里哼了一声。' },
      { char: 'narrator', text: '再听的时候，脚步声已经远了。只有几片被踩碎的落叶，还在石阶边上打着转。' },
      { char: 'narrator', text: '你又往上爬了很久。石阶两边开始出现小小的石像，戴着褪色的红围兜。每一尊的脚边，都放着一颗星星形状的糖。' },
      { char: 'narrator', text: '糖已经被雨泡软了。是上个月放的，还是更早以前？' },
      { char: 'narrator', text: '石阶的尽头，一座朱红色的鸟居静静地立在暮色里。' },
      { char: 'narrator', text: '漆色鲜亮得不像是深山里的东西。匾额上写着三个字：杜鹃森。' },
    ],
    choices: [
      { text: '握紧口袋里的铃，穿过鸟居', next: 'enter_shrine' },
      { text: '想起外婆的信——「他们都是好孩子」，走了进去', next: 'enter_shrine' },
    ],
  },

  'enter_shrine': {
    scene: 'shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '穿过鸟居的那一瞬间，空气变了。' },
      { char: 'narrator', text: '更凉，更清，像是一脚踏进了另一个季节。连虫鸣都换了调子。' },
      { char: 'narrator', text: '石阶两侧的石灯笼里，跳动着青蓝色的火苗。没有电线，也没有油。' },
      { char: 'narrator', text: '你一级一级往上走。每走一步，身后山下的世界就远一点。手机屏幕上的时间，停在了「17:43」，再也不动了。' },
      { char: 'narrator', text: '最后一级石阶。一座古朴端正的神社出现在眼前，正殿里透出暖黄色的光。' },
      { char: 'narrator', text: '前庭里的杜鹃开得正好，红的、白的，一丛挨着一丛。空气里有线香和青草的味道。' },
      { char: 'narrator', text: '前庭里，有一个人正背对着你，拿着竹帚扫地。一边扫，一边哼着一首很老很老的歌。' },
      { char: 'player', text: '（这首歌……外婆哄我睡觉的时候，也哼过。）' },
    ],
    next: 'meet_kohaku',
  },

  // =============== DAY 1 ===============
  'meet_kohaku': {
    scene: 'shrine', particles: 'spirits', day: 1,
    chapter: { num: '第一天', title: '狐与铃' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '那是一个穿着白衣红裙巫女服的女子。赤红色的长发一直垂到腰下。' },
      { char: 'narrator', text: '她的头顶，有一对毛茸茸的、三角形的耳朵。耳朵随着歌声，一下一下地打着拍子。' },
      { char: 'narrator', text: '你还没来得及揉眼睛——口袋里的铃，第三次响了。' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '歌声停了。竹帚掉在了石板上。' },
      { char: 'kohaku', text: '……千代？' },
      { char: 'narrator', text: '她猛地转过身来。琥珀色的眼睛睁得很大，瞳孔是细长的竖线。' },
      { char: 'narrator', text: '她身后，一条蓬松的赤红色尾巴「呼」地一下竖了起来，尾尖都在发抖。' },
      { char: 'kohaku', text: '千代！你终于——你这个人，上个月怎么没来！我年糕都烤好了，等了你一整夜，年糕都烤成炭了！' },
      { char: 'narrator', text: '她提着裙摆朝你跑过来。跑到一半，脚步慢了下来。' },
      { char: 'narrator', text: '她看着你，看了很久。那双眼睛里的光，一点一点暗了下去。尾巴也慢慢地，垂了下来。' },
      { char: 'kohaku', text: '不是千代啊。' },
      { char: 'kohaku', text: '……可是，那是千代的铃。我不会听错的。五十年了，我不会听错的。' },
      { char: 'narrator', text: '她的目光落在你手里的油纸伞上，停了一下。' },
      { char: 'kohaku', text: '还有那把伞……你是从老杉树下面上来的。' },
      { char: 'kohaku', text: '你是谁？千代她……怎么了？' },
    ],
    choices: [
      { text: '「我是她的外孙女。……外婆让我来找一位叫琥珀的人。」', affection: { fox: 2 }, next: 'kohaku_news' },
      { text: '默默地把铃和信递了过去', affection: { fox: 2 }, next: 'kohaku_news' },
      { text: '「你……真的有耳朵。」话一出口，你就后悔了', affection: { fox: 1 }, next: 'kohaku_ears' },
    ],
  },

  'kohaku_ears': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '她愣了一下。然后，很轻很轻地笑了。笑得有点勉强。' },
      { char: 'kohaku', text: '千代第一次见到我的时候，也是这么说的。那年她才八岁。' },
      { char: 'kohaku', text: '「姐姐，你有耳朵。」……一模一样。你们家的人，是不是都这样？' },
      { char: 'kohaku', text: '然后她还伸手捏了一下。捏完了说「是热的」。……你不许捏。' },
      { char: 'narrator', text: '她的耳朵垂了下来。' },
      { char: 'kohaku', text: '所以——她是真的不来了，对不对？' },
    ],
    next: 'kohaku_news',
  },

  'kohaku_news': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'player', text: '外婆前几天……在医院走了。上个满月之前，她就住院了。走的时候很安静，没有受苦。' },
      { char: 'narrator', text: '琥珀没有说话。' },
      { char: 'narrator', text: '风吹过前庭，石灯笼里的青火一齐摇晃了一下。' },
      { char: 'narrator', text: '你把信递给她。她接过去，读得很慢很慢。读到某一行时，手指停住了。' },
      { char: 'kohaku', text: '「请你在满月前七天上山」……' },
      { char: 'kohaku', text: '这个人啊。连走了以后的事，都替我们安排好了。' },
      { char: 'narrator', text: '她的声音在发抖。可她还是笑着的。' },
      { char: 'kohaku', text: '上个满月，她没有来。我在鸟居下面等了一整夜。' },
      { char: 'kohaku', text: '我跟自己说，大概是感冒了，大概是腿又疼了。下个月就会来的。' },
      { char: 'kohaku', text: '……我其实知道的。人类的五十年，已经很长很长了。' },
      { char: 'narrator', text: '一滴眼泪落在信纸上，晕开了外婆的字。' },
      { char: 'narrator', text: '琥珀飞快地擦掉，把信仔细折好，还给你。' },
      { char: 'kohaku', text: '对不起，让客人看到这副样子。狐狸在人前哭，是要被笑话的。' },
      { char: 'kohaku', text: '我叫琥珀。是这座神社的巫女，也是——千代的朋友。' },
      { char: 'kohaku', text: '欢迎回来。……我是说，欢迎来到杜鹃森。' },
    ],
    choices: [
      { text: '「……『欢迎回来』？」', affection: { fox: 1 }, flag: 'asked_welcome', next: 'kohaku_lanterns' },
      { text: '「谢谢你。外婆一定很高兴，有你这样的朋友。」', affection: { fox: 2 }, next: 'kohaku_lanterns' },
    ],
  },

  'kohaku_lanterns': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '啊，那个，口误。是口误。人老了……狐狸老了，嘴就不听话。', if: 'asked_welcome' },
      { char: 'narrator', text: '她说这话的时候，身后的尾巴「噗」地一声炸开了，蓬成了原来的两倍大。', if: 'asked_welcome' },
      { char: 'narrator', text: '她低头看了一眼，飞快地伸手去按。按下去一边，另一边又翘起来。', if: 'asked_welcome' },
      { char: 'kohaku', text: '……不许看。', if: 'asked_welcome' },
      { char: 'narrator', text: '太阳已经沉到山后面去了。天边只剩一条橘红色的线。' },
      { char: 'kohaku', text: '哎呀，天要黑了。等我一下——点灯的时间到了。' },
      { char: 'narrator', text: '她捡起竹帚靠在树边，走到鸟居下面的第一盏石灯笼前，弯下腰，对着它轻声说了一句话。' },
      { char: 'kohaku', text: '晚上好，阿松。' },
      { char: 'narrator', text: '灯笼里「噗」地亮起一团青火。' },
      { char: 'kohaku', text: '晚上好，小豆。晚上好，歪脖子。晚上好，二十四号——啊，你还没有名字，对不起，明天一定想。' },
      { char: 'narrator', text: '她沿着石阶一盏一盏地叫下去。每叫一个名字，就亮起一盏。' },
      { char: 'player', text: '……你给每一盏灯笼都起了名字？' },
      { char: 'kohaku', text: '嗯。三十二盏，现在有名字的是三十一盏。' },
      { char: 'kohaku', text: '有几盏是千代起的。那盏最胖的叫「金平」，那盏总是灭的叫「银朗」。……别告诉他。' },
      { char: 'player', text: '为什么要起名字？' },
      { char: 'narrator', text: '琥珀停在一盏灯笼前面。青火映在她的眼睛里，一跳一跳的。' },
      { char: 'kohaku', text: '因为有名字的东西，被叫到的时候，就会亮。' },
      { char: 'kohaku', text: '没有名字的东西……就算灭了，也没有人会发现。' },
      { char: 'narrator', text: '她说完，又笑起来，像是觉得自己说了什么太重的话。' },
      { char: 'player', text: '琥珀。你……还好吗？' },
      { char: 'kohaku', text: '我？我没事呀。' },
      { char: 'narrator', text: '「噗」。' },
      { char: 'narrator', text: '她的尾巴又炸了。比刚才还大。' },
    ],
    choices: [
      { text: '「……你的尾巴。」', affection: { fox: 1 }, flag: 'saw_tail', next: 'kohaku_lanterns2' },
      { text: '假装没看见，指着最后一盏：「那二十四号，叫什么好呢？」', affection: { fox: 2 }, flag: 'named_lantern', next: 'kohaku_lanterns2' },
    ],
  },

  'kohaku_lanterns2': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀两只手抱住尾巴，整张脸都红了。', if: 'saw_tail' },
      { char: 'kohaku', text: '……它不听我的。从小就不听。一说谎就炸，一炸就被千代笑。', if: 'saw_tail' },
      { char: 'kohaku', text: '好吧。我不太好。……可是今天，只许说这一次。', if: 'saw_tail' },
      { char: 'narrator', text: '琥珀愣了一下。然后「扑哧」一声笑了出来，尾巴慢慢地瘪了回去。', if: 'named_lantern' },
      { char: 'kohaku', text: '二十四号啊……它总是第一个亮，最后一个灭。有点笨，但是很努力。', if: 'named_lantern' },
      { char: 'kohaku', text: '你来起吧。你是今天的客人。', if: 'named_lantern' },
      { char: 'narrator', text: '你想了想，说了一个名字：「千代」。', if: 'named_lantern' },
      { char: 'narrator', text: '最后那盏灯笼，「噗」地亮了。比别的都亮一点。', if: 'named_lantern' },
      { char: 'kohaku', text: '……嗯。就叫这个。', if: 'named_lantern' },
      { char: 'narrator', text: '三十二盏灯笼全亮了。青蓝色的火光从鸟居一直铺到正殿，像一条落在地上的银河。' },
      { char: 'kohaku', text: '好啦。外面冷，我们进去说。我给你泡茶。' },
    ],
    next: 'kohaku_explain',
