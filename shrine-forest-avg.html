<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杜鹃森 — 神社与森林的恋爱物语</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

:root {
  --bg: #1a1a2e;
  --bg-overlay: rgba(10, 10, 20, 0.7);
  --text: #e8e0d4;
  --text-dim: #9a8e7e;
  --text-name: #f0c674;
  --accent-fox: #ff6b4a;
  --accent-fox-glow: rgba(255, 107, 74, 0.3);
  --accent-wolf: #7eb8da;
  --accent-wolf-glow: rgba(126, 184, 218, 0.3);
  --accent-deer: #8fd4a0;
  --accent-deer-glow: rgba(143, 212, 160, 0.3);
  --accent-whitewolf: #e8e0d0;
  --accent-whitewolf-glow: rgba(232, 224, 208, 0.3);
  --accent-hawk: #4a7eb8;
  --accent-hawk-glow: rgba(74, 126, 184, 0.3);
  --accent-snake: #9a5abf;
  --accent-snake-glow: rgba(154, 90, 191, 0.3);
  --accent-gold: #d4a854;
  --accent-sakura: #e8a0b4;
  --ui-bg: rgba(20, 16, 30, 0.92);
  --ui-border: rgba(212, 168, 84, 0.3);
  --font: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-ui: -apple-system, 'PingFang SC', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

/* === Background Scenes === */
#scene-bg {
  position: absolute; inset: 0;
  transition: opacity 1.2s ease;
}

.scene-layer {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.8s ease;
}
.scene-img { background-color: #0a0a14; background-repeat: no-repeat; }
.scene-img::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 25%, transparent 60%, rgba(0,0,0,0.35) 100%);
}

.bg-forest {
  background: linear-gradient(180deg, #0a1628 0%, #0f2418 15%, #0a3012 30%, #1a4a20 50%, #2a5a30 70%, #1a3a18 100%);
}
.bg-forest::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 3px 80px at 15% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 90px at 25% 55%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 85px at 40% 58%, #1a4020 0%, transparent 100%),
    radial-gradient(ellipse 5px 95px at 55% 52%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 80px at 70% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 88px at 85% 56%, #1a4020 0%, transparent 100%);
}
.bg-forest::after {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(80,180,100,0.08) 0%, transparent 40%),
    radial-gradient(circle at 70% 20%, rgba(60,160,80,0.06) 0%, transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(40,80,40,0.15) 0%, transparent 50%);
}

.bg-shrine {
  background: linear-gradient(180deg, #1a0a2e 0%, #2a1040 20%, #3a1848 35%, #2a1838 50%, #1a1028 70%, #0a0818 100%);
}
.bg-shrine::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 120px 8px at 50% 72%, rgba(180,80,60,0.15) 0%, transparent 100%),
    radial-gradient(circle at 50% 40%, rgba(255,160,80,0.06) 0%, transparent 50%);
}

.bg-night-shrine {
  background: linear-gradient(180deg, #050510 0%, #0a0a20 20%, #101030 40%, #0a0a20 60%, #050510 100%);
}
.bg-night-shrine::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 15%, rgba(200,220,255,0.8) 0%, rgba(200,220,255,0.1) 2%, transparent 4%),
    radial-gradient(circle at 30% 10%, rgba(255,255,200,0.3) 0%, transparent 1%),
    radial-gradient(circle at 60% 8%, rgba(255,255,200,0.2) 0%, transparent 0.5%),
    radial-gradient(circle at 45% 12%, rgba(255,255,200,0.25) 0%, transparent 0.8%);
}
.bg-night-shrine::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 70%, rgba(255,140,60,0.08) 0%, transparent 30%);
}

.bg-spring {
  background: linear-gradient(180deg, #f0d0d8 0%, #e8c0c8 15%, #d4a0b0 30%, #98c088 50%, #78a868 70%, #5a8a48 100%);
}
.bg-spring::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,180,200,0.4) 0%, transparent 30%),
    radial-gradient(circle at 80% 15%, rgba(255,200,210,0.3) 0%, transparent 25%);
}

.bg-moonlit {
  background: linear-gradient(180deg, #0a0e1e 0%, #101830 20%, #182040 35%, #1a3030 55%, #0a2018 80%, #081810 100%);
}
.bg-moonlit::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 200px 200px at 65% 20%, rgba(200,220,255,0.15) 0%, transparent 70%),
    radial-gradient(circle at 65% 20%, rgba(220,240,255,0.3) 0%, rgba(200,220,255,0.05) 15%, transparent 30%);
}

.bg-sky {
  background: linear-gradient(180deg, #0a1840 0%, #1a3060 15%, #2a5090 35%, #4a80c0 55%, #3a6090 75%, #1a3040 100%);
}
.bg-sky::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 40% 25%, rgba(255,255,255,0.05) 0%, transparent 30%),
    radial-gradient(circle at 70% 40%, rgba(200,220,255,0.08) 0%, transparent 25%);
}

.bg-cave {
  background: linear-gradient(180deg, #0a0510 0%, #100818 20%, #180a20 40%, #100818 60%, #0a0510 100%);
}
.bg-cave::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 50%, rgba(120,60,180,0.06) 0%, transparent 40%),
    radial-gradient(circle at 30% 70%, rgba(100,40,150,0.04) 0%, transparent 30%);
}

.bg-snowfield {
  background: linear-gradient(180deg, #c8d8e8 0%, #d8e4f0 20%, #e0e8f0 40%, #e8f0f4 60%, #d0dce8 80%, #b8c8d8 100%);
}
.bg-snowfield::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 60% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
    radial-gradient(circle at 30% 50%, rgba(200,220,240,0.2) 0%, transparent 30%);
}

.bg-town {
  background: linear-gradient(180deg, #2a1a3a 0%, #5a2a48 18%, #b8584a 38%, #e8a060 52%, #4a3040 62%, #20182a 80%, #120c18 100%);
}
.bg-town::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 18% at 30% 62%, #1a1222 0%, transparent 70%),
    radial-gradient(ellipse 70% 22% at 75% 60%, #221830 0%, transparent 70%),
    radial-gradient(circle at 20% 72%, rgba(255,190,110,0.35) 0%, transparent 1.2%),
    radial-gradient(circle at 42% 75%, rgba(255,190,110,0.3) 0%, transparent 1%),
    radial-gradient(circle at 68% 73%, rgba(255,190,110,0.3) 0%, transparent 1.1%);
}

.bg-room {
  background: linear-gradient(180deg, #1a120c 0%, #2a1c12 30%, #3a2818 55%, #2a1c10 75%, #18100a 100%);
}
.bg-room::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,190,120,0.22) 0%, transparent 38%),
    repeating-linear-gradient(90deg, transparent 0 18%, rgba(0,0,0,0.18) 18% 18.6%);
}

/* === Particles === */
#particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.particle { position: absolute; border-radius: 50%; pointer-events: none; animation-timing-function: linear; animation-iteration-count: infinite; }

.firefly { width: 4px; height: 4px; background: rgba(255, 220, 100, 0.8); box-shadow: 0 0 6px rgba(255, 220, 100, 0.6), 0 0 12px rgba(255, 200, 60, 0.3); animation: firefly-float 8s ease-in-out infinite; }
@keyframes firefly-float { 0%, 100% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.9; } 50% { opacity: 0.4; transform: translate(30px, -40px); } 80% { opacity: 0.8; } }

.sakura-petal { width: 8px; height: 6px; background: rgba(255, 180, 200, 0.7); border-radius: 50% 0 50% 0; animation: sakura-fall linear infinite; }
@keyframes sakura-fall { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translate(-80px, calc(100vh + 20px)) rotate(720deg); opacity: 0; } }

.spirit-orb { width: 6px; height: 6px; background: rgba(100, 200, 255, 0.6); box-shadow: 0 0 8px rgba(100, 200, 255, 0.4); animation: spirit-drift 10s ease-in-out infinite; }
@keyframes spirit-drift { 0%, 100% { opacity: 0; transform: translate(0, 0) scale(1); } 30% { opacity: 0.7; transform: translate(20px, -30px) scale(1.3); } 70% { opacity: 0.5; transform: translate(-10px, -60px) scale(0.8); } }

.snowflake { width: 5px; height: 5px; background: rgba(255, 255, 255, 0.8); animation: snow-fall linear infinite; }
@keyframes snow-fall { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.5; } 100% { transform: translate(-30px, calc(100vh + 10px)) rotate(360deg); opacity: 0; } }

.feather { width: 10px; height: 4px; background: rgba(100, 150, 220, 0.5); border-radius: 50% 0; animation: feather-drift linear infinite; }
@keyframes feather-drift { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 15% { opacity: 0.6; } 85% { opacity: 0.4; } 100% { transform: translate(-60px, calc(100vh + 10px)) rotate(540deg); opacity: 0; } }

/* === Character Layer === */
#character-layer {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}

.character-sprite {
  position: absolute; inset: 0; z-index: 1;
  transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
}
.character-sprite.speaking { z-index: 2; }
.character-sprite img { transition: filter 0.4s ease, left 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
.character-sprite.listening img { filter: brightness(0.55) saturate(0.75); }

.character-sprite.entering { opacity: 0; transform: translateY(20px); }
.character-sprite.visible { opacity: 1; }

.character-sprite.beast-transform { animation: beast-glow 2s ease-in-out; }
@keyframes beast-glow {
  0% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
  30% { filter: drop-shadow(0 0 40px rgba(255,180,80,0.8)) brightness(1.5); }
  60% { filter: drop-shadow(0 0 60px rgba(255,200,100,0.9)) brightness(2); }
  80% { filter: drop-shadow(0 0 30px rgba(255,180,80,0.5)) brightness(1.2); }
  100% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
}

/* Placeholder portrait when no image */
.char-placeholder {
  width: 100%; height: 100%;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; font-family: var(--font);
  overflow: hidden; position: relative;
}
.char-placeholder::before {
  content: ''; position: absolute; inset: 0;
  opacity: 0.5; border-radius: 12px;
}
.char-placeholder .placeholder-icon { font-size: 64px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); z-index: 1; }
.char-placeholder .placeholder-name {
  font-size: 14px; color: rgba(255,255,255,0.9); z-index: 1;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5); letter-spacing: 2px;
}

.char-portrait-img {
  position: absolute; width: auto; max-width: none;
}

/* === Dialogue === */
#dialogue-layer { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px env(safe-area-inset-bottom, 16px); }

#dialogue-box {
  position: relative; max-width: 800px; margin: 0 auto 16px;
  background: var(--ui-bg); border: 1px solid var(--ui-border);
  border-radius: 12px; padding: 16px 20px 20px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 30px rgba(0,0,0,0.3); cursor: pointer; min-height: 120px;
}

#speaker-name { font-size: 14px; font-weight: 600; color: var(--text-name); margin-bottom: 8px; letter-spacing: 1px; font-family: var(--font); }
#dialogue-text { font-size: 16px; line-height: 1.8; color: var(--text); font-family: var(--font); min-height: 60px; }
#dialogue-text .char { opacity: 0; display: inline; transition: opacity 0.05s; }
#dialogue-text .char.visible { opacity: 1; }

#text-indicator { position: absolute; bottom: 12px; right: 16px; width: 12px; height: 12px; opacity: 0; transition: opacity 0.3s; }
#text-indicator.show { opacity: 0.6; animation: indicator-bounce 1s ease-in-out infinite; }
@keyframes indicator-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* === Choices === */
#choice-layer {
  position: absolute; inset: 0; display: none;
  justify-content: center; align-items: center;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 20;
}
#choice-layer.active { display: flex; }

#choice-container { display: flex; flex-direction: column; gap: 12px; max-width: 500px; width: 90%; }

.choice-btn {
  background: var(--ui-bg); border: 1px solid var(--ui-border);
  border-radius: 8px; padding: 14px 20px; color: var(--text);
  font-family: var(--font); font-size: 15px; cursor: pointer;
  transition: all 0.3s ease; text-align: left; line-height: 1.5;
}
.choice-btn:hover { background: rgba(212, 168, 84, 0.15); border-color: var(--accent-gold); transform: translateX(4px); }
.choice-btn:active { transform: translateX(2px); background: rgba(212, 168, 84, 0.25); }

/* === Affection === */
.aff-change {
  position: fixed; font-size: 18px; font-weight: 700; pointer-events: none;
  animation: aff-popup 1.5s ease-out forwards; z-index: 100;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
@keyframes aff-popup { 0% { opacity: 1; transform: translateY(0) scale(1); } 50% { opacity: 1; transform: translateY(-30px) scale(1.2); } 100% { opacity: 0; transform: translateY(-60px) scale(0.8); } }

/* === Title Screen === */
#title-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  background: linear-gradient(180deg, #0a0e1e 0%, #101828 20%, #0a2018 40%, #1a3020 60%, #0a1810 80%, #050a08 100%);
  z-index: 50; transition: opacity 1.5s ease;
}
#title-screen.hidden { opacity: 0; pointer-events: none; }

#title-particles { position: absolute; inset: 0; overflow: hidden; }
.title-firefly {
  position: absolute; width: 3px; height: 3px; background: rgba(255, 220, 100, 0.7);
  border-radius: 50%; box-shadow: 0 0 6px rgba(255, 220, 100, 0.5);
  animation: title-fly linear infinite;
}
@keyframes title-fly { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.8; } 80% { opacity: 0.6; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

#title-content { position: relative; text-align: center; z-index: 1; }
#title-jp { font-size: 14px; color: var(--accent-gold); letter-spacing: 8px; margin-bottom: 12px; opacity: 0; animation: title-fade 2s ease 0.5s forwards; font-family: var(--font); }
#title-main { font-size: clamp(36px, 8vw, 64px); font-weight: 700; color: var(--text); text-shadow: 0 0 40px rgba(212, 168, 84, 0.3); margin-bottom: 8px; opacity: 0; animation: title-fade 2s ease 1s forwards; font-family: var(--font); }
#title-sub { font-size: 14px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 48px; opacity: 0; animation: title-fade 2s ease 1.5s forwards; font-family: var(--font); }
@keyframes title-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

#title-buttons { display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; animation: title-fade 2s ease 2s forwards; }
.title-btn {
  background: transparent; border: 1px solid var(--accent-gold);
  color: var(--accent-gold); font-family: var(--font); font-size: 16px;
  width: 200px; padding: 12px 0; border-radius: 4px; cursor: pointer; letter-spacing: 4px;
  transition: all 0.4s ease;
}
.title-btn.secondary { border-color: rgba(212,168,84,0.4); color: var(--text-dim); font-size: 14px; padding: 10px 0; }
.title-btn:hover { background: rgba(212, 168, 84, 0.15); box-shadow: 0 0 20px rgba(212, 168, 84, 0.2); color: var(--accent-gold); }
.title-btn[hidden] { display: none; }

/* === Transform Overlay === */
#transform-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; z-index: 30; pointer-events: none; }
#transform-overlay.active { display: flex; animation: transform-flash 2.5s ease-in-out forwards; }
@keyframes transform-flash { 0% { background: transparent; } 20% { background: rgba(255, 220, 140, 0.6); } 40% { background: rgba(255, 200, 100, 0.3); } 60% { background: rgba(255, 180, 80, 0.1); } 100% { background: transparent; } }
#transform-text { font-size: clamp(24px, 5vw, 40px); font-weight: 700; color: var(--accent-gold); text-shadow: 0 0 30px rgba(212, 168, 84, 0.8); font-family: var(--font); opacity: 0; animation: transform-text-show 2.5s ease-in-out forwards; }
@keyframes transform-text-show { 0% { opacity: 0; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }

/* === Chapter overlay === */
#chapter-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; flex-direction: column; background: rgba(0,0,0,0.85); z-index: 25; pointer-events: none; }
#chapter-overlay.active { display: flex; }
#chapter-num { font-size: 13px; color: var(--accent-gold); letter-spacing: 6px; margin-bottom: 12px; opacity: 0; animation: chap-in 1.5s ease 0.3s forwards; }
#chapter-title { font-size: clamp(24px, 5vw, 36px); font-weight: 700; color: var(--text); font-family: var(--font); opacity: 0; animation: chap-in 1.5s ease 0.6s forwards; }
@keyframes chap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === Ending === */
#ending-screen { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40; background: rgba(0,0,0,0.95); }
#ending-screen.active { display: flex; }
#ending-title { font-size: clamp(28px, 6vw, 48px); font-weight: 700; color: var(--accent-gold); font-family: var(--font); margin-bottom: 16px; text-shadow: 0 0 30px rgba(212,168,84,0.4); }
#ending-subtitle { font-size: 16px; color: var(--text-dim); font-family: var(--font); margin-bottom: 40px; text-align: center; line-height: 1.8; padding: 0 20px; white-space: pre-line; }
#ending-restart { background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-family: var(--font); font-size: 15px; padding: 10px 32px; border-radius: 4px; cursor: pointer; letter-spacing: 2px; transition: all 0.3s; }
#ending-restart:hover { background: rgba(212,168,84,0.15); }

/* === Menu === */
#menu-btn { position: absolute; top: 16px; left: 16px; z-index: 22; width: 36px; height: 36px; background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); font-size: 14px; backdrop-filter: blur(8px); transition: all 0.3s; }
#music-btn { position: absolute; top: 16px; right: 16px; z-index: 55; width: 36px; height: 36px; background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.3); border-radius: 50%; color: var(--accent-gold); font-size: 16px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.3s; padding: 0; }
#music-btn.off { color: var(--text-dim); border-color: rgba(212,168,84,0.15); text-decoration: line-through; opacity: 0.7; }
#menu-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

.save-toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(10,10,20,0.9); border: 1px solid var(--accent-gold); border-radius: 6px; padding: 8px 20px; font-family: var(--font-ui); font-size: 13px; color: var(--accent-gold); z-index: 100; opacity: 0; animation: toast-show 2s ease forwards; }
@keyframes toast-show { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; } }

/* === System menu / save & load === */
#sys-layer, #confirm-layer {
  position: absolute; inset: 0; display: none; z-index: 60;
  background: rgba(4,4,10,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  justify-content: center; align-items: center; font-family: var(--font-ui);
}
#sys-layer.active, #confirm-layer.active { display: flex; }
#confirm-layer { z-index: 70; }

.sys-card {
  width: min(92vw, 420px); max-height: 88vh; display: flex; flex-direction: column;
  background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden;
}
.sys-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(212,168,84,0.15); }
.sys-title { font-family: var(--font); font-size: 16px; color: var(--accent-gold); letter-spacing: 3px; }
.sys-close { background: none; border: none; color: var(--text-dim); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.sys-close:hover { color: var(--accent-gold); }

.menu-list { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.menu-item {
  background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px;
  color: var(--text); font-family: var(--font); font-size: 15px; letter-spacing: 2px;
  padding: 13px 16px; cursor: pointer; text-align: left; transition: all 0.2s;
}
.menu-item:hover, .menu-item:active { border-color: var(--accent-gold); background: rgba(212,168,84,0.12); }
.menu-item small { display: block; margin-top: 3px; font-family: var(--font-ui); font-size: 11px; color: var(--text-dim); letter-spacing: 0; }

.slot-list { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.slot-note { padding: 0 16px 12px; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.slot {
  position: relative; display: flex; gap: 12px; align-items: stretch;
  background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px;
  padding: 8px; cursor: pointer; text-align: left; color: var(--text); transition: all 0.2s;
  font-family: var(--font-ui); width: 100%;
}
.slot:hover, .slot:active { border-color: var(--accent-gold); background: rgba(212,168,84,0.10); }
.slot.disabled { cursor: default; opacity: 0.45; }
.slot.disabled:hover { border-color: var(--ui-border); background: rgba(255,255,255,0.03); }
.slot-thumb { position: relative; flex: 0 0 52px; height: 68px; border-radius: 6px; overflow: hidden; background: #1a1428; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.slot-thumb img { max-width: none; }
.slot-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-right: 22px; }
.slot-top { display: flex; gap: 8px; align-items: baseline; }
.slot-name { font-size: 13px; color: var(--accent-gold); font-weight: 600; white-space: nowrap; }
.slot-time { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.slot-chap { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font); }
.slot-line { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-empty { font-size: 13px; color: var(--text-dim); align-self: center; letter-spacing: 2px; }
.slot-del { position: absolute; top: 4px; right: 4px; background: none; border: none; color: var(--text-dim); font-size: 16px; cursor: pointer; padding: 4px 8px; line-height: 1; }
.slot-del:hover { color: #ff6b6b; }

.note { background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px; padding: 10px 12px; }
.note-q { font-family: var(--font); font-size: 14px; color: var(--accent-gold); margin-bottom: 4px; }
.note-a { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
.note.solved { opacity: 0.75; }
.note.solved .note-q { color: var(--text); }
#game.flashback #scene-bg, #game.flashback #character-layer { filter: sepia(0.75) saturate(0.7) brightness(0.9) contrast(0.95); transition: filter 1s ease; }
#game.flashback::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(40,25,10,0.55) 100%); }
#scene-bg, #character-layer { transition: filter 1s ease; }
.bond-list { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bond { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px; padding: 8px; }
.bond.unknown { opacity: 0.5; }
.bond-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.bond-top { display: flex; align-items: baseline; gap: 8px; }
.bond-name { font-family: var(--font); font-size: 15px; font-weight: 600; }
.bond-desc { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bond-stage { margin-left: auto; font-size: 12px; font-family: var(--font); color: var(--accent-gold); white-space: nowrap; }
.bond-meter { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.bond-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.23, 1, 0.32, 1); }

.confirm-text { padding: 20px 18px 8px; font-size: 14px; color: var(--text); line-height: 1.7; white-space: pre-line; font-family: var(--font); }
.confirm-actions { display: flex; gap: 10px; padding: 14px 16px 16px; justify-content: flex-end; }
.confirm-actions button { font-family: var(--font); font-size: 14px; padding: 9px 22px; border-radius: 6px; cursor: pointer; letter-spacing: 2px; }
.btn-ghost { background: transparent; border: 1px solid var(--ui-border); color: var(--text-dim); }
.btn-gold { background: rgba(212,168,84,0.18); border: 1px solid var(--accent-gold); color: var(--accent-gold); }

/* === Day indicator === */
#day-indicator {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.2);
  border-radius: 20px; padding: 4px 16px;
  font-family: var(--font); font-size: 12px; color: var(--accent-gold);
  letter-spacing: 2px; z-index: 10; opacity: 0; transition: opacity 0.5s;
  backdrop-filter: blur(8px);
}
#day-indicator.show { opacity: 1; }

@media (max-width: 600px) {
  #dialogue-box { margin: 0 8px 8px; padding: 12px 16px 16px; min-height: 100px; }
  #dialogue-text { font-size: 14px; line-height: 1.7; }
  .choice-btn { font-size: 14px; padding: 12px 16px; }
}
</style>
</head>
<body>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// ============================================================
//  IMAGE CONFIG — 把GPT生成的图放到 assets/ 后修改这里的路径
//  设为 null 则使用 emoji 占位符
// ============================================================
const PORTRAITS = {
  'kohaku-human':   'assets/kohaku-human.webp',
  'kohaku-beast':   'assets/kohaku-beast.webp',
  'ginro-human':    'assets/ginro-human.webp',
  'ginro-beast':    'assets/ginro-beast.webp',
  'shiro-human':    'assets/shiro-human.webp',
  'shiro-beast':    'assets/shiro-beast.webp',
  'yukimaru-human': 'assets/yukimaru-human.webp',
  'yukimaru-beast': 'assets/yukimaru-beast.webp',
  'sou-human':      'assets/sou-human.webp',
  'sou-beast':      'assets/sou-beast.webp',
  'genya-human':    'assets/genya-human.webp',
  'genya-beast':    'assets/genya-beast.webp',
};

// Scene backgrounds; a scene without an image falls back to its CSS gradient.
const BACKGROUNDS = {
  'town':         'assets/bg-town.webp',
  'room':         'assets/bg-room.webp',
  'forest':       'assets/bg-forest.webp',
  'shrine':       'assets/bg-shrine.webp',
  'night-shrine': 'assets/bg-night-shrine.webp',
  'spring':       'assets/bg-spring.webp',
  'garden':       'assets/bg-garden.webp',
  'moonlit':      'assets/bg-moonlit.webp',
  'sky':          'assets/bg-sky.webp',
  'cave':         'assets/bg-cave.webp',
  'snowfield':    'assets/bg-snowfield.webp',
};
Object.values(BACKGROUNDS).forEach(src => { new Image().src = src; });

// Music. A track set to null falls back to the title theme until its file exists.
const BGM = {
  title:  'assets/bgm-title.mp3',
  grief:  'assets/bgm-grief.mp3',
  daily:  'assets/bgm-daily.mp3',
  night:  'assets/bgm-night.mp3',
  wind:   'assets/bgm-wind.mp3',
  depths: 'assets/bgm-depths.mp3',
  crisis: 'assets/bgm-crisis.mp3',
  moon:   null,
};
const SCENE_BGM = { town: 'grief', room: 'grief', shrine: 'daily', spring: 'daily', garden: 'daily',
  'night-shrine': 'night', moonlit: 'night', forest: 'night', sky: 'wind', snowfield: 'wind', cave: 'depths' };
const NODE_BGM = { crisis_gather: 'crisis', crisis_battle: 'crisis', day5_evening: 'crisis', day7_ceremony: 'moon' };
function bgmFor(id) {
  if (!id) return 'title';
  if (NODE_BGM[id]) return NODE_BGM[id];
  if (/^(rescue|ending)_/.test(id)) return id.startsWith('rescue') ? 'crisis' : 'moon';
  return SCENE_BGM[S[id].scene || state.scene] || 'daily';
}

// ex/ey: where the eyes are in the source image (% of its width/height); bx: body centre x (defaults to ex).
// h: displayed image height as % of screen height (the character's on-screen scale).
// The eyes are pinned to EYE_Y on screen; the body centre goes to the slot anchor (+dx).
const EYE_Y = 26;
const SLOT_X = { center: 50, left: 32, right: 68 };
const PORTRAIT_POS = {
  'kohaku-human':   { ex: 53.5, bx: 50, ey: 13,   h: 100 },
  'ginro-human':    { ex: 62.5, bx: 57, ey: 9.9,  h: 118 },
  'shiro-human':    { ex: 56.8, bx: 49, ey: 12.8, h: 100 },
  'yukimaru-human': { ex: 66,   bx: 56, ey: 10,   h: 108 },
  'sou-human':      { ex: 55.6, bx: 52, ey: 6.7,  h: 112 },
  'genya-human':    { ex: 70,   bx: 53, ey: 11.5, h: 104, dx: 7 },
  'kohaku-beast':   { ex: 61,   ey: 35,   h: 100 },
  'ginro-beast':    { ex: 81.6, ey: 19.7, h: 100, dx: 10 },
  'shiro-beast':    { ex: 76,   ey: 32.7, h: 100, dx: 8 },
  'yukimaru-beast': { ex: 75,   ey: 62.7, h: 145, dx: 8 },
  'sou-beast':      { ex: 84,   ey: 40,   h: 140, dx: 10 },
  'genya-beast':    { ex: 42,   ey: 16,   h: 100 },
};

// ============================================================
//  CHARACTER DEFINITIONS
// ============================================================
const CHARS = {
  narrator: { name: '', color: '#9a8e7e' },
  player: { name: '你', color: '#e8e0d4' },
  kohaku: {
    name: '琥珀', color: '#ff6b4a', affKey: 'fox',
    icon: '🦊', desc: '神社巫女 · 九尾灵狐',
    human: 'kohaku-human', beast: 'kohaku-beast',
    placeholderBg: 'linear-gradient(135deg, #8b2500 0%, #ff6b4a 50%, #ffa07a 100%)',
  },
  ginro: {
    name: '银朗', color: '#7eb8da', affKey: 'wolf',
    icon: '🐺', desc: '森之守护 · 苍银狼',
    human: 'ginro-human', beast: 'ginro-beast',
    placeholderBg: 'linear-gradient(135deg, #2a3a5a 0%, #7eb8da 50%, #b0d4e8 100%)',
  },
  shiro: {
    name: '白露', color: '#8fd4a0', affKey: 'deer',
    icon: '🦌', desc: '林间精灵 · 白玉鹿',
    human: 'shiro-human', beast: 'shiro-beast',
    placeholderBg: 'linear-gradient(135deg, #2a5a3a 0%, #8fd4a0 50%, #c0f0d0 100%)',
  },
  yukimaru: {
    name: '雪丸', color: '#e8e0d0', affKey: 'whitewolf',
    icon: '🐾', desc: '北方流浪者 · 白狼',
    human: 'yukimaru-human', beast: 'yukimaru-beast',
    placeholderBg: 'linear-gradient(135deg, #8a8a8a 0%, #e8e0d0 50%, #f8f4f0 100%)',

    icon: '🦅', desc: '天空守望 · 蓝鹰',
    human: 'sou-human', beast: 'sou-beast',
    placeholderBg: 'linear-gradient(135deg, #1a2a5a 0%, #4a7eb8 50%, #8ab0e0 100%)',
  },
  genya: {
    name: '玄夜', color: '#9a5abf', affKey: 'snake',
    icon: '🐍', desc: '幽暗低语 · 黑蛇',
    human: 'genya-human', beast: 'genya-beast',
    placeholderBg: 'linear-gradient(135deg, #1a0a30 0%, #9a5abf 50%, #c090e0 100%)',
  },
};

const state = {
  affection: { fox: 0, wolf: 0, deer: 0, whitewolf: 0, hawk: 0, snake: 0 },
  flags: {},
  currentNode: null,
  textComplete: false,
  charTimers: [],
  particleInterval: null,
  day: 0,
  line: 0,
  scene: null,
  particles: null,
  chars: [],
  chapter: null,
  gen: 0,       // bumped on load/reset so stale timers from the old run do nothing
  dlg: null,
};

// In a two-shot the speaker steps toward the middle and the listener gives way.
function slotX(pos, role) {
  const base = SLOT_X[pos];
  if (pos === 'center' || !role) return base;
  const inward = role === 'speaking' ? 5 : -10;
  return pos === 'left' ? base + inward : base - inward;
}

function portraitStyle(key, pos, role) {
  const { ex = 50, bx = ex, ey = 12, h = 100, dx = 0 } = PORTRAIT_POS[key] || {};
  return `height:${h}%;top:${EYE_Y - ey * h / 100}%;left:${slotX(pos, role) + dx}%;transform:translateX(-${bx}%)`;
}

function getPortrait(charId, formKey, pos = 'center') {
  const key = formKey;
  const imgPath = PORTRAITS[key];
  if (imgPath) {
    return `<img class="char-portrait-img" src="${imgPath}" alt="${CHARS[charId].name}" style="${portraitStyle(key, pos)}">`;
  }
  const c = CHARS[charId];
  return `<div class="char-placeholder" style="background:${c.placeholderBg}">
    <div class="placeholder-icon">${c.icon}</div>
    <div class="placeholder-name">${c.name}</div>
  </div>`;
}

// ============================================================
//  STORY SCRIPT
// ============================================================
const S = {
  // =============== PROLOGUE ===============
  'start': {
    scene: 'town', particles: null,
    chapter: { num: '序章', title: '铃声' },
    lines: [
      { char: 'narrator', text: '外婆的葬礼，是在一个下着小雨的星期二办完的。' },
      { char: 'narrator', text: '来的人不多。镇上的几位老邻居，医院的两个护士，寺里的和尚，还有你。' },
      { char: 'narrator', text: '六岁以前，你是在这个镇子上长大的。' },
      { char: 'narrator', text: '母亲走得早。父亲在城里工作，每个月寄钱回来，一年见两次面。把你养大的，是外婆。' },

      { char: 'player', text: '（每次打电话，外婆都说：「忙就别回来了，我好着呢。山上的朋友们陪着我。」）' },
      { char: 'player', text: '（山上的朋友们。……我一直以为，是老人家的一种说法。）' },
      { char: 'narrator', text: '你在城里做着一份说不上喜欢、也说不上讨厌的工作。' },

      { char: 'narrator', text: '直到医院打来电话的那天，你才发现——你已经很久，没有好好听谁说过话了。' },
      { char: 'player', text: '（公司给了七天丧假。七天……能做什么呢。）' },

  'pro_shop': {
    scene: 'town', particles: null,
    lines: [
      { char: 'narrator', text: '葬礼结束后，你一个人站在寺门口，不知道该往哪里走。' },
      { char: 'narrator', text: '有人拍了拍你的肩膀。是镇口那家杂货店的老板娘，头发全白了，笑起来还是跟你小时候记得的一样。' },

      { char: 'narrator', text: '「婆婆住院前一天，来我店里买了一整袋金平糖。星星形状的那种。我问她买这么多干什么，她说是给山上的孩子带的。」' },
      { char: 'narrator', text: '老板娘压低了声音，像是在说什么好笑的秘密。' },
      { char: 'narrator', text: '「镇上的老人都说啊，千代婆婆每个满月都要上后山，一待就是一整夜。有人说她在山上有个相好的，呵呵呵。」' },

  'pro_house': {

      { char: 'narrator', text: '外婆的老房子在镇子最北边，紧挨着山脚。' },

      { char: 'narrator', text: '柱子上还留着一道一道的铅笔印。最矮的一道旁边写着「三岁」，最高的一道写着「六岁」。' },

      { char: 'narrator', text: '封蜡的那一封，信封上只写着一行字：「满月之夜，在要石前打开。」', flag: 'q_letter' },
      { char: 'player', text: '（要石……？）' },
      { char: 'narrator', text: '你先拿起了拆开的那一封。信封上是外婆歪歪扭扭的字——「给我的小不点」。' },
      { char: 'player', text: '（……都多大了，还叫我小不点。）' },
      { char: 'narrator', text: '「小不点：你读到这封信的时候，外婆大概已经去很远的地方了。别哭，外婆活够了，也笑够了。」' },
      { char: 'narrator', text: '「只有一件事，外婆放心不下。后山上，有一座神社。神社里，住着外婆最好的朋友们。」' },

      { char: 'narrator', text: '「七天，刚好够你认识他们每一个。到了满月那天，你再决定要不要留下这枚铃。」' },
      { char: 'narrator', text: '「另一封信，满月以前不许偷看。外婆会知道的。」' },
      { char: 'narrator', text: '「——对了。你小时候，他们其实见过你的。只是你忘了。」' },
      { char: 'player', text: '（狐狸姑娘？神社里的……朋友们？）' },
      { char: 'player', text: '（护士说过，外婆最后那段时间常常说胡话。说什么「山上的孩子们要饿肚子了」「那条蛇又在逞强」……）' },
      { char: 'narrator', text: '你拿起那枚铜铃。它很轻，冰凉。' },
      { char: 'narrator', text: '然后，在你的掌心里——它自己轻轻地响了一声。' },
      { char: 'narrator', text: '叮。' },
    ],
    choices: [
      { text: '吓得差点把铃扔出去', next: 'pro_night' },
      { text: '想起老板娘的话——「那是有人在叫你」，握紧了它', next: 'pro_night' },

  'pro_climb': {

      { char: 'narrator', text: '你看了看日历。离下一个满月，正好还有七天。' },
      { char: 'narrator', text: '第二天下午，你背着一个小包，走上了后山。' },
      { char: 'narrator', text: '外婆的信纸背面，画着一张简陋的地图：沿着溪走，过了那棵被雷劈开的老杉树，往左。旁边写着「半小时」。' },
      { char: 'player', text: '（半小时……这是按外婆的脚程算的吧。她八十多岁了还爬山吗？）' },
      { char: 'narrator', text: '一个半小时以后，你终于明白了：外婆的「半小时」，是认真的。你的体力，才是需要反省的。' },
      { char: 'narrator', text: '手机早就没信号了。山路越走越窄。等你找到那棵裂开的老杉树时，太阳已经快落下去了。' },
      { char: 'narrator', text: '老杉树上缠着一圈旧注连绳，纸垂在风里轻轻晃。树的左边，本该是一片灌木。' },
      { char: 'narrator', text: '可是你走近的时候，口袋里的铃又响了一声。' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '灌木像是被风吹开一样，向两边让开了。后面露出一条铺满青苔的石阶。' },
      { char: 'player', text: '（……刚才明明没有这条路的。）' },
      { char: 'narrator', text: '你踏上石阶。就在这时，一道白色的影子从你眼角掠了过去。' },
      { char: 'player', text: '——谁？！' },
      { char: 'narrator', text: '只有树影在晃。' },
      { char: 'narrator', text: '可你分明听见了——某种轻快的、爪子踩过落叶的声音。它没有走远，就在你左边的林子里，跟着你。' },
      { char: 'narrator', text: '你走，它也走。你停，它也停。' },
    ],
    choices: [
      { text: '「……外婆的朋友？」对着林子小声问', affection: { whitewolf: 1 }, next: 'pro_torii' },
      { text: '假装没发现，加快脚步', next: 'pro_torii' },
      { text: '捡起一根树枝，握在手里', affection: { whitewolf: 1 }, flag: 'took_stick', next: 'pro_torii' },

    lines: [
      { char: 'narrator', text: '天黑了。正殿的缘廊上，琥珀给你端来一碗热茶。茶汤里浮着一小朵金色的花。' },
      { char: 'kohaku', text: '杜鹃花茶。千代每次上山，第一件事就是要喝这个。喝完了还要再续一碗，说「山上的水就是甜」。' },
      { char: 'player', text: '琥珀……你到底是……' },

      { char: 'kohaku', text: '具体多久呢——这是女孩子的秘密。' },
      { char: 'narrator', text: '她眨了眨一只眼睛。尾巴在你们中间的木板上，得意地扫了一下。' },
      { char: 'kohaku', text: '这片森林叫杜鹃森，夹在人的世界和灵的世界中间。住在这里的，都是像我这样的兽灵。' },
      { char: 'kohaku', text: '森林外面有一道结界。它挡住灵界那边的浊气，也挡住误闯进来的人类。' },
      { char: 'player', text: '可是我进来了。' },
      { char: 'kohaku', text: '因为你带着那枚铃。' },
      { char: 'narrator', text: '她看着你口袋的方向，眼神变得很柔和。' },
      { char: 'kohaku', text: '那是「守铃人」的铃。千代是守铃人，她的母亲也是。所以结界认得它，也认得你的血。' },
      { char: 'player', text: '守铃人……要做什么？' },
      { char: 'kohaku', text: '……这个嘛。' },
      { char: 'narrator', text: '她的耳朵微微动了一下，往后压了压。像是在斟酌。又像是在躲。' },
      { char: 'kohaku', text: '这些事，等你在这里住几天再说吧。千代说了，要你先认识我们。' },
      { char: 'player', text: '（……她在回避。）', flag: 'q_keeper' },
      { char: 'kohaku', text: '还有一件事，要先告诉你。结界只在满月的夜里向外打开。在那之前，你没办法下山。' },
      { char: 'player', text: '所以……七天。' },
      { char: 'kohaku', text: '嗯，七天。千代算得刚刚好。' },
      { char: 'kohaku', text: '这七天里，你就住在神社吧。千代的房间，我每个月都会打扫的。' },
      { char: 'kohaku', text: '……而且，你小时候，是来过这里的哦。' },

  'kohaku_tour': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '琥珀提着一盏纸灯笼，带你在神社里转了一圈。' },
      { char: 'kohaku', text: '这边是手水舍。水是从山里引下来的，冬天也不结冰。' },
      { char: 'kohaku', text: '这边是厨房——啊，这个你一定认识！' },
      { char: 'narrator', text: '她献宝似的捧出一台老式的收音机。银色的外壳上贴满了贴纸，天线用胶带缠了三圈。' },
      { char: 'kohaku', text: '千代十年前带上来的。能听到山下的歌！虽然只有一个台，而且每天晚上九点以后只有天气预报。' },
      { char: 'kohaku', text: '还有这个——' },
      { char: 'narrator', text: '她又从柜子里拿出一个印着红色字的纸碗。' },
      { char: 'kohaku', text: '「杯面」！倒上热水，数三百下，就能吃了！人类真是太厉害了。' },
      { char: 'kohaku', text: '只剩最后两个了。我一直舍不得吃。' },

      { char: 'kohaku', text: '……笑什么嘛。狐狸也是会有喜欢的东西的。' },
      { char: 'narrator', text: '最后，她带你到了正殿。殿里供着一面旧铜镜，镜子前面，摊开着一本很厚的簿子。' },
      { char: 'kohaku', text: '这是来客簿。每一个来过杜鹃森的人类，都会在这里写下名字。' },

      { char: 'narrator', text: '最后写了字的那一页，是外婆的字。日期是两个月前。' },
      { char: 'narrator', text: '「千代。今天也很好。下次给白露带星星糖，给苍羽做梅子饭团，别忘了跟银朗说伞的事。」' },
      { char: 'narrator', text: '「P.S. 那条蛇又在逞强了。琥珀，你去看看他吧。」' },
      { char: 'player', text: '……那条蛇？' },
      { char: 'narrator', text: '琥珀伸手，把簿子轻轻合上了。' },
      { char: 'kohaku', text: '……千代心太软了。对谁都是。' },
      { char: 'narrator', text: '她的语气还是很温柔。可是那一瞬间，她的尾巴绷得笔直。' },
      { char: 'narrator', text: '正殿的最里面，有一扇很窄的木门。门上贴着一张旧符，门缝里透出一丝凉气。' },
      { char: 'player', text: '那扇门后面是……' },
      { char: 'kohaku', text: '那里不能去。' },
      { char: 'kohaku', text: '……答应我，好吗？这七天，不要去那扇门后面。', flag: 'q_door' },
    ],
    choices: [
      { text: '「……好。我答应你。」', affection: { fox: 2 }, next: 'meet_ginro' },
      { text: '「为什么？」', affection: { snake: 1 }, next: 'kohaku_door_why' },

  'kohaku_door_why': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '因为下面很冷。很黑。住着一个——不太好相处的家伙。' },
      { char: 'kohaku', text: '千代总是去看他。我拦不住她，只好每次在门口等她上来。' },
      { char: 'kohaku', text: '她每次上来，都笑着说「今天又输了」。' },
      { char: 'narrator', text: '琥珀的手指轻轻碰了碰门上的旧符。' },
      { char: 'kohaku', text: '你和千代长得太像了。我不想……在这扇门口，再等一次。' },
    ],
    next: 'meet_ginro',
  },

  'meet_ginro': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '回到缘廊的时候，前庭里响起了脚步声。沉稳，很重，不像是人的脚步。' },
      { char: 'ginro', text: '琥珀。刚才结界动了一下——' },
      { char: 'narrator', text: '一个银发的青年走进了灯光里。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '深蓝色的和服，腰间佩着一把黑鞘长刀。头顶是一对竖起的、银灰色的狼耳。' },
      { char: 'narrator', text: '他很高。站在那里，就像一棵不会被风吹弯的树。' },
      { char: 'narrator', text: '冰蓝色的眼睛扫过你，在你口袋的位置停住了。' },
      { char: 'ginro', text: '……那是千代的铃。' },
      { char: 'ginro', text: '千代呢。' },
      { char: 'narrator', text: '琥珀没有回答，只是看着他，轻轻摇了一下头。' },
      { char: 'narrator', text: '青年站在原地，一动不动。很久很久。' },
      { char: 'ginro', text: '…………是吗。' },
      { char: 'narrator', text: '他向你走过来。你下意识地往后缩了一下。' },
      { char: 'narrator', text: '他在你面前停下，微微低头——鼻翼动了动，像是在确认什么气味。' },
      { char: 'ginro', text: '……是你。' },
      { char: 'player', text: '什么？' },
      { char: 'ginro', text: '没什么。', flag: 'q_voice' },
      { char: 'ginro', text: '我叫银朗，守着这片森林的结界。七天后，满月一到，你就下山。这几天别乱跑，别给琥珀添麻烦。' },
      { char: 'kohaku', text: '银朗。' },
      { char: 'ginro', text: '……天黑以后别出门。最近林子里，不干净。' },
      { char: 'narrator', text: '说完他就转身走了。走进黑暗之前，你看到一条银色的大尾巴，低低地垂着。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '别往心里去。' },
      { char: 'kohaku', text: '五十年来，每个满月，都是他去山脚接千代上山，再把她送下去。千代右耳不好，他就一直走在她的左边。' },
      { char: 'kohaku', text: '他比谁都难过。只是，他不会说。' },
    ],
    choices: [
      { text: '「他刚才说『是你』……那是什么意思？」', affection: { wolf: 2 }, next: 'day1_dinner' },
      { text: '「……我能理解。我也还没哭出来。」', affection: { fox: 2 }, next: 'day1_dinner' },
      { text: '「『不干净』是什么意思？」', affection: { wolf: 1 }, next: 'day1_dinner' },
    ],
  },

  'day1_dinner': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '这些事，吃完饭再想。人饿着肚子的时候，脑子里只会装坏事。' },
      { char: 'narrator', text: '晚饭是琥珀做的。炖萝卜，烤溪鱼，腌梅子，还有一大碗热腾腾的白米饭。' },
      { char: 'narrator', text: '桌上摆了三副碗筷。' },
      { char: 'player', text: '还有谁要来吗？' },
      { char: 'kohaku', text: '嗯？等着看吧。' },
      { char: 'narrator', text: '你刚拿起筷子，拉门就被拉开了一条缝。一个银色的影子，一声不吭地坐到了离你最远的角落。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '五十年来，他说了五十年「不吃」，也来了五十年。' },
      { char: 'ginro', text: '……只是路过。' },
      { char: 'kohaku', text: '路过厨房，路过饭桌，路过自己那副碗筷。好巧哦。' },
      { char: 'ginro', text: '…………' },
      { char: 'narrator', text: '银朗面无表情地吃饭。吃得很快，很安静。可是你注意到——他把自己碟子里最大的那条鱼，推到了你面前。' },
      { char: 'narrator', text: '然后，他看了一眼你放在桌角的木盒。盒盖开着，露出半袋金平糖。' },
      { char: 'narrator', text: '他的耳朵，动了一下。' },
    ],
    choices: [
      { text: '把金平糖推到他面前：「外婆买给山上的孩子的。」', affection: { wolf: 3 }, next: 'day1_dinner2' },
      { text: '悄悄问琥珀：「他……喜欢吃甜的？」', affection: { fox: 1, wolf: 1 }, next: 'day1_dinner2' },
    ],
  },

  'day1_dinner2': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'ginro', text: '……我不是孩子。' },
      { char: 'kohaku', text: '千代每次都给他留一小包。他每次都说「我不是孩子」，然后收下。' },
      { char: 'kohaku', text: '去年我在他的屋子里看到一个铁罐子，里面全是没舍得吃的星星糖。都化成一坨了。' },
      { char: 'ginro', text: '琥珀。' },
      { char: 'kohaku', text: '哎呀，说漏嘴了。' },
      { char: 'narrator', text: '银朗的耳朵红了。他站起身，把碗筷收好，走到门口。' },
      { char: 'narrator', text: '然后，停住了。背对着你们。' },
      { char: 'ginro', text: '……千代，走的时候，说什么了吗。' },
      { char: 'player', text: '护士说，她最后那几天一直在说「伞」。说「那孩子又把伞全让给我，自己淋湿了」。' },
      { char: 'narrator', text: '银朗站在门口，没有回头。' },
      { char: 'narrator', text: '很久以后，他伸手拿走了桌上的那一小包金平糖。拉门关上了。' },
      { char: 'kohaku', text: '……他去年冬天，在山脚淋了一整夜雨。千代在屋檐下面喊他进来，他就是不肯。' },
      { char: 'kohaku', text: '狼的规矩——不能进人类的屋子。' },
      { char: 'kohaku', text: '真是一群笨蛋啊。我们。' },
    ],
    next: 'day1_room',
  },

  'day1_room': {
    scene: 'room', particles: null,
    lines: [
      { char: 'narrator', text: '琥珀带你去了神社深处的一间和室。' },
      { char: 'narrator', text: '纸拉门，旧榻榻米，窗外正对着一棵老杜鹃。被褥是晒过的，有阳光的味道。' },
      { char: 'narrator', text: '墙角放着一个保温壶，一副老花镜，和一本封皮磨破了的速写本。' },
      { char: 'player', text: '（外婆的东西……她每个月都在这里住一晚。）' },
      { char: 'narrator', text: '你翻开速写本。铅笔画，线条歪歪扭扭，旁边写着小字。' },
      { char: 'narrator', text: '第一页是一只红色的狐狸。「琥珀。总是在笑。可是尾巴不会撒谎。」' },
      { char: 'narrator', text: '一只银色的狼，趴在石阶上。「银朗。永远走在我左边。今天又没说几句话，但把伞全让给我了。」' },
      { char: 'narrator', text: '一个头上长着小鹿角的孩子。「白露。又长高了一点。答应要带他去看海——要是他能下山就好了。」' },
      { char: 'narrator', text: '屋顶上一个模糊的剪影，旁边画着一根羽毛。「苍羽。从来不下来吃饭。我把饭团放在屋檐上，第二天总是空的。」' },
      { char: 'narrator', text: '你想起了窗台上的那根羽毛。把它拿出来，放在画旁边比了比。一模一样。' },
      { char: 'narrator', text: '最后一页，是一条盘在棋盘上的蛇。' },
      { char: 'narrator', text: '「玄夜。今天的棋又输了。他瘦了。——别告诉琥珀我去地下了。」' },
      { char: 'player', text: '（玄夜……来客簿上说的「那条蛇」。还有那扇门后面「不太好相处的家伙」。）' },
      { char: 'player', text: '（外婆，你每个月说「去山上看朋友」，原来是真的。）' },
      { char: 'narrator', text: '你把速写本抱在胸前，躺了下来。' },
      { char: 'narrator', text: '夜很深的时候，远处传来一声狼嚎。很长，很低，一直没有停。' },
      { char: 'narrator', text: '你终于在那声狼嚎里，为外婆哭了出来。' },
    ],
    next: 'day1_eyes',
  },

  'day1_eyes': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '不知道过了多久。' },
      { char: 'narrator', text: '你是被冷醒的。' },
      { char: 'narrator', text: '不是夜里的那种凉。是一种从脚底往上爬的、湿漉漉的冷。像是有什么东西，贴着地板滑过去。' },
      { char: 'narrator', text: '枕边的铃，在轻轻地颤。没有响，只是颤。' },
      { char: 'narrator', text: '你慢慢地转过头。' },
      { char: 'narrator', text: '纸拉门上，映着月光。月光里，有一个细长的影子。' },
      { char: 'narrator', text: '门缝外面，有一双眼睛。紫色的。瞳孔是一条细细的竖线。' },
      { char: 'narrator', text: '你屏住了呼吸。' },
      { char: 'narrator', text: '那双眼睛看了你很久。然后，你听到一个很低、很好听的声音，像是自言自语。' },
      { char: 'narrator', text: '「……长这么大了啊。」' },
      { char: 'narrator', text: '影子消失了。那股冷，也跟着退了下去。', flag: 'q_eyes' },
      { char: 'player', text: '（……那个声音。）' },
      { char: 'player', text: '（梦里说「这个不能吃，吐出来」的——就是那个声音。）' },
    ],
    next: 'day2_morning',
  },
  // =============== DAY 2 ===============
  'day2_morning': {
    scene: 'shrine', particles: 'sakura', day: 2,
    chapter: { num: '第二天', title: '鹿与白狼' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你是被鸟叫声吵醒的。眼睛有点肿。' },
      { char: 'narrator', text: '推开拉门，庭院里的樱花正往石板路上落。空气里有味噌汤的香味。' },
      { char: 'narrator', text: '早饭摆在缘廊上：米饭，味噌汤，腌萝卜，一小碟煎蛋。煎蛋被做成了狐狸脸的形状，歪了一只耳朵。' },
      { char: 'kohaku', text: '早上好。睡得还好吗？' },
      { char: 'player', text: '……昨晚，好像有人在我门外面。' },
      { char: 'narrator', text: '琥珀盛汤的手，停了半秒。' },
      { char: 'kohaku', text: '……是风吧。神社的拉门，一到半夜就咔嗒咔嗒响。' },
      { char: 'player', text: '是一双紫色的眼睛。' },
      { char: 'narrator', text: '汤勺碰在碗沿上，叮的一声。' },
      { char: 'kohaku', text: '……今晚，我在你房门口放一盏狐火。' },
      { char: 'kohaku', text: '有我的火在，什么东西都不敢靠近。' },
      { char: 'narrator', text: '她笑着说的。可是她没有回答你的问题。' },
      { char: 'narrator', text: '你们安静地吃着早饭。琥珀自己没怎么动筷子，一直在搅那碗汤。' },
      { char: 'kohaku', text: '那个……今天，可能会有个孩子来找你。' },
      { char: 'kohaku', text: '他叫白露。千代每次上山都会给他带金平糖。他……还不知道。' },
      { char: 'kohaku', text: '我本来想昨晚就去告诉他的。走到他住的地方门口，又走回来了。' },
      { char: 'kohaku', text: '活了这么久，还是学不会怎么说这种话。真没用啊，我。' },
      { char: 'narrator', text: '就在这时——' },
      { char: 'shiro', text: '千代婆婆——！！' },
    ],
    next: 'meet_shiro',
  },

  'meet_shiro': {

    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '一个翠绿色头发的少年光着脚从石阶上冲了上来。头上一对骨白色的小鹿角，角上开满了粉色的花。' },
      { char: 'narrator', text: '他跑得太急，在最后一级台阶上绊了一下，整个人扑进了琥珀怀里，又弹起来。' },
      { char: 'shiro', text: '琥珀姐！我闻到了！是千代婆婆的铃的味道！她是不是来了！她是不是——' },

      { char: 'shiro', text: '……诶？你是谁？' },

      { char: 'shiro', text: '你身上有千代婆婆的味道！你是她的家人吧？那她呢？她在里面吗？她说这次要给我带那种星星形状的糖——' },
      { char: 'shiro', text: '还有还有，她答应了要给我讲「电车」！就是那种很长很长、会自己跑的屋子！' },

      { char: 'narrator', text: '少年的笑容，一点一点地停住了。' },
      { char: 'shiro', text: '……琥珀姐？你们为什么……都不说话？' },
    ],
    choices: [
      { text: '在他面前蹲下来，自己告诉他', affection: { deer: 2 }, flag: 'told_shiro', next: 'shiro_news' },
      { text: '轻轻握住琥珀的手，陪她一起开口', affection: { fox: 1, deer: 1 }, next: 'shiro_news' },
    ],
  },

  'shiro_news': {

      { char: 'player', text: '不疼。护士说，她走的那天下午还在笑。' },
      { char: 'player', text: '还有——她病房的床头，有一个铁皮饼干盒。' },
      { char: 'player', text: '里面全是干掉的小花。粉的，白的，一朵一朵夹在纸里。每一朵旁边，都写着日期。' },
      { char: 'narrator', text: '白露抬起头来。满脸都是泪。' },
      { char: 'shiro', text: '……那是我给她的。每个月，一朵。我角上开的第一朵，都留给她。' },
      { char: 'shiro', text: '她全都留着？五十……五十多朵？' },
      { char: 'player', text: '她跟护士说，山上有个会开花的孩子。每次说起来，都笑得很开心。' },
      { char: 'narrator', text: '白露把脸埋回膝盖里，放声大哭。雪丸没说话，只是把他搂得更紧了一点。' },
      { char: 'narrator', text: '哭声渐渐停下来的时候，你看到——白露头上枯掉的角尖，冒出了一个小小的、嫩绿的花苞。' },
    ],
    choices: [
      { text: '「外婆信里说，答应过要带你去看海。……这个约定，我可以替她记着吗？」', affection: { deer: 3 }, next: 'yukimaru_race' },
      { text: '对雪丸说：「谢谢你一直陪着他。」', affection: { whitewolf: 3 }, next: 'yukimaru_race' },
    ],
  },

  'yukimaru_race': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露哭累了，蜷在溪边的草地上睡着了。雪丸把自己的毛皮短褂脱下来，盖在他身上。' },
      { char: 'narrator', text: '然后他蹲在你面前，歪着头，像在研究一种从没见过的动物。' },
      { char: 'yukimaru', text: '喂。人类。你们城里人，一天能跑多远？' },
      { char: 'player', text: '……坐电车的话，能跑很远。' },
      { char: 'yukimaru', text: '不许坐电车！用腿！' },
      { char: 'player', text: '……大概，从家门口跑到便利店？' },
      { char: 'yukimaru', text: '哈？！那是多远？' },
      { char: 'player', text: '两百米。' },
      { char: 'narrator', text: '雪丸盯着你看了三秒。然后笑得从石头上滚了下去，差点掉进溪里。' },
      { char: 'yukimaru', text: '两、两百米！哈哈哈哈！你们人类是怎么活到现在的！' },
      { char: 'yukimaru', text: '等着！' },
      { char: 'narrator', text: '他「嗖」地一下不见了。溪对岸的灌木丛哗啦啦响了一阵，又安静了。' },
      { char: 'narrator', text: '一分钟后，他回来了。嘴里叼着一条还在拼命扭动的大鱼，得意洋洋地放在你脚边。' },
      { char: 'yukimaru', text: '给你。看你那么弱，多吃点。' },
      { char: 'narrator', text: '鱼在你脚边啪嗒啪嗒地跳。你和鱼对视了一眼。' },
    ],
    choices: [
      { text: '「……谢谢。可是我不会杀鱼。」', affection: { whitewolf: 2 }, next: 'yukimaru_race2' },
      { text: '把鱼捧起来，放回了溪里', affection: { deer: 1 }, next: 'yukimaru_race2' },
      { text: '「好厉害！怎么抓到的？」', affection: { whitewolf: 3 }, next: 'yukimaru_race2' },
    ],
  },

  'yukimaru_race2': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '……你这人真奇怪。' },
      { char: 'narrator', text: '他挠了挠那只缺了口的耳朵。尾巴在身后，不太确定地摇了两下。' },
      { char: 'yukimaru', text: '北边的人……我是说，北边的狼，要是有谁送吃的给你，你得先咬一口，再还一样东西回去。不然就是看不起人家。' },
      { char: 'yukimaru', text: '这里的人都不懂这个。琥珀姐只会说「谢谢」，银朗那家伙连「谢谢」都不说。' },
      { char: 'narrator', text: '你想了想，从口袋里掏出一颗金平糖，放在他手心里。' },
      { char: 'narrator', text: '雪丸愣住了。他看看手心的糖，又看看你。' },
      { char: 'yukimaru', text: '……这、这是还礼？' },
      { char: 'player', text: '嗯。还礼。' },
      { char: 'narrator', text: '他把糖放进嘴里，嚼得咔咔响。然后别过脸去。' },
      { char: 'yukimaru', text: '……甜死了。' },
      { char: 'narrator', text: '可是他的尾巴，摇得像要飞起来了。' },
    ],
    next: 'yukimaru_walk',
  },

  'yukimaru_walk': {
    scene: 'forest', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '傍晚，白露醒了，揉着眼睛说要回自己的窝。雪丸说他送你回神社。' },
      { char: 'yukimaru', text: '你认路的本事我昨天见识过了。放你一个人走，明天早上琥珀姐会在哪棵树上找到你都不知道。' },
      { char: 'narrator', text: '林间的小路上，萤火虫一点一点亮了起来。雪丸走在你前面半步，尾巴有一下没一下地甩着。' },
      { char: 'player', text: '你说你是从北边来的？' },
      { char: 'yukimaru', text: '嗯。半年前。一路跑过来的，脚底板都磨破了。' },
      { char: 'player', text: '为什么来这里？' },
      { char: 'yukimaru', text: '……来找人。' },
      { char: 'narrator', text: '他踢飞了一颗石子。' },
      { char: 'yukimaru', text: '我娘去年冬天死了。她走之前跟我说：「去南边的杜鹃森，找你舅舅。他会照顾你的。」' },
      { char: 'yukimaru', text: '然后我就来了。找到了。' },
      { char: 'player', text: '你舅舅是……' },
      { char: 'yukimaru', text: '银朗。' },
      { char: 'yukimaru', text: '哈，想不到吧？那张冰块脸是我舅舅。' },
      { char: 'yukimaru', text: '可是他不认我。我第一天到的时候，他就说：「我没有外甥。回北边去。」' },
      { char: 'yukimaru', text: '半年了。每天都是这句。「回去。」「回你的窝去。」连我的名字都没叫过一次。' },
      { char: 'narrator', text: '他笑着说的，可那只缺了口的耳朵，一直耷拉着。' },
    ],
    choices: [
      { text: '「他一定有他的理由。昨晚他为外婆嚎了一整夜，不是冷血的人。」', affection: { wolf: 1 }, next: 'ginro_yukimaru_clash' },
      { text: '「……那你还留下来了。你很厉害。」', affection: { whitewolf: 2 }, next: 'ginro_yukimaru_clash' },
    ],
  },

  'ginro_yukimaru_clash': {
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '走到鸟居下的时候，天已经全黑了。石阶上站着一个人。' },
      { char: 'ginro', text: '太阳落山前回来。这里不是城里。' },
      { char: 'narrator', text: '银朗从阴影里走出来。他的目光越过你，落在雪丸身上。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '我陪着呢，怕什么。' },
      { char: 'ginro', text: '就是因为你陪着。' },
      { char: 'yukimaru', text: '……哈？什么意思，我还能把人弄丢不成？' },
      { char: 'ginro', text: '你连自己都弄丢了。一个人从北边跑出来，半年了还不回去。' },
      { char: 'yukimaru', text: '那边已经没有我的窝了！娘死了，族里那帮老家伙——' },
      { char: 'ginro', text: '族里会收留你。只要你回去，低头，守规矩。' },
      { char: 'yukimaru', text: '像你一样？你当年守规矩了吗？！' },
      { char: 'narrator', text: '空气一下子冷了下来。银朗的耳朵往后压平了。' },
      { char: 'yukimaru', text: '……你到底什么时候，才肯叫我一次名字？' },
      { char: 'narrator', text: '银朗没有回答。' },
      { char: 'ginro', text: '……回你的窝去。' },
      { char: 'yukimaru', text: '我的窝就在这儿！！' },
      { char: 'narrator', text: '雪丸转身冲进了树林。一道白影，几个起落就不见了。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '银朗站在原地，看着他消失的方向。' },
      { char: 'ginro', text: '……他娘，叫雪音。是我妹妹。' },
      { char: 'ginro', text: '小时候也是这样。吵得要命，跑得比谁都快，摔了跤从来不哭。' },
      { char: 'player', text: '那你为什么——' },
      { char: 'ginro', text: '进去吧。夜里凉。' },
      { char: 'narrator', text: '他把自己的外褂脱下来，扔到你怀里，头也不回地走了。' },
      { char: 'narrator', text: '外褂上有雨水和松针的味道。你愣住了。' },
      { char: 'player', text: '（……这个味道。梦里那只银色的大狗……）' },
    ],
    next: 'day2_rot',
  },

  'day2_rot': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '那天夜里，琥珀真的在你门口放了一盏狐火。青白色的，安安静静地烧着。' },
      { char: 'narrator', text: '你抱着银朗的外褂，迷迷糊糊地睡了过去。' },
      { char: 'narrator', text: '然后——' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '铃响了。不是颤，是响。一声，又一声，很急。' },
      { char: 'narrator', text: '门口的狐火，不知什么时候，灭了。' },
      { char: 'narrator', text: '你拉开拉门。铃声停了。可是从神社外面的林子里，传来了另一种声音。' },
      { char: 'narrator', text: '像是很多很多细小的东西，在枯叶底下爬。' },
    ],
    choices: [
      { text: '想起银朗的话——「天黑以后别出门」。关上门', next: 'day2_rot_stay' },
      { text: '握着铃，循着声音走出去', flag: 'went_out', next: 'day2_rot_go' },
    ],
  },

  'day2_rot_stay': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '你关上了门，背靠着门坐下，把铃紧紧攥在手心里。' },
      { char: 'narrator', text: '外面的声音越来越近。沙沙，沙沙。然后，停在了门外。' },
      { char: 'narrator', text: '有什么东西，在门板的另一边，嗅了嗅。' },
      { char: 'narrator', text: '你的心脏快跳出来了。' },
      { char: 'narrator', text: '就在这时，门外传来一声很轻的「嘶——」。像蛇吐信的声音。' },
      { char: 'narrator', text: '沙沙声一下子退远了，像潮水一样。' },
      { char: 'narrator', text: '门外安静了很久。然后，那个好听的、低低的声音，隔着门板响了起来。' },
      { char: 'narrator', text: '「……聪明。比你外婆听话多了。」' },
      { char: 'narrator', text: '「下次，别让那只狐狸的火灭掉。」' },
      { char: 'narrator', text: '你一直没敢开门。天亮的时候你拉开门，门口的石板上，有一道很长很长的、被什么东西烧焦了一样的黑色痕迹。' },
      { char: 'narrator', text: '痕迹的尽头，一直延伸到正殿后面——那扇贴着旧符的窄门。', flag: 'q_rot' },
    ],
    next: 'day3_morning',
  },

  'day2_rot_go': {
    scene: 'moonlit', particles: 'fireflies',
    lines: [
      { char: 'narrator', text: '你披上银朗的外褂，走进了夜色里。' },
      { char: 'narrator', text: '月亮很亮。林子里的声音越来越近。你绕过一棵巨大的榉树——' },
      { char: 'narrator', text: '然后停住了。' },
      { char: 'narrator', text: '榉树的树干上，爬满了黑色的东西。像墨汁，又像烧焦的树皮，在月光下一鼓一鼓地蠕动。' },
      { char: 'narrator', text: '树下站着一个人。' },
      { char: 'narrator', text: '黑色的长发，一直拖到地上。苍白的手，按在那片黑色上。' },
      { char: 'narrator', text: '那些黑色的东西，正顺着他的手指，一点一点地——流进他的身体里。' },
      { char: 'narrator', text: '他的手背上，鳞片一片接一片地，变成了灰色。' },
      { char: 'narrator', text: '你踩断了一根树枝。', chars: [{ id: 'genya', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '他回过头来。紫色的竖瞳在黑暗里亮了一下。然后，他笑了。' },
      { char: 'genya', text: '……嘘。' },
      { char: 'genya', text: '这么晚了，小孩子不该出来乱跑。' },
      { char: 'player', text: '你……你在做什么？！' },
      { char: 'genya', text: '吃饭。' },
      { char: 'narrator', text: '他说得那么轻描淡写，你一时不知道他是在开玩笑，还是在说真的。' },
      { char: 'narrator', text: '身后，一道青白色的火光猛地亮了起来。', flag: 'q_rot' },
      { char: 'kohaku', text: '——玄夜。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '琥珀挡在你面前。她身后的尾巴，不是一条——是好几条，全都燃着狐火，像一面张开的扇子。' },
      { char: 'kohaku', text: '离这个孩子远一点。' },
      { char: 'genya', text: '好凶啊。我只是想看看，千代的外孙长什么样。' },
      { char: 'kohaku', text: '昨晚在门外看的，还不够吗？' },
      { char: 'genya', text: '……哦，被发现了啊。' },
      { char: 'kohaku', text: '结界的节点，一个接一个地烂。每一次，你都在那里。' },
      { char: 'kohaku', text: '六十年前也是。你要我怎么相信你？' },
      { char: 'narrator', text: '玄夜看着琥珀。那一瞬间，他脸上的笑，好像淡了一点。' },
      { char: 'genya', text: '我从来没让你相信过我。' },
      { char: 'narrator', text: '他的身影融进了树影里。只剩下一句话，飘在夜风里。' },
      { char: 'genya', text: '……那只狐狸的火，是被那些黑东西吃掉的。你们的节点，烂得比你以为的快。' },
      { char: 'narrator', text: '榉树上的黑色，比刚才淡了一些。可是琥珀没有注意到。她转过身，紧紧抓住你的肩膀。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '你为什么要出来？！银朗说过的，天黑以后——' },
      { char: 'narrator', text: '她的手在抖。' },
      { char: 'kohaku', text: '……对不起。我不是在凶你。' },
      { char: 'kohaku', text: '只是……如果你也出了什么事……' },
      { char: 'player', text: '琥珀。那个人是谁？六十年前，发生了什么？' },
      { char: 'kohaku', text: '……住在这片森林最深处的蛇。六十年前，他——' },
      { char: 'narrator', text: '她说到一半，停住了。咬着嘴唇，摇了摇头。' },
      { char: 'kohaku', text: '明天吧。等我想好怎么说。' },
      { char: 'kohaku', text: '今晚，我守着你睡。' },
    ],
    next: 'day3_morning',
  },
  // =============== DAY 3 ===============
  'day3_morning': {
    scene: 'shrine', particles: 'feathers', day: 3,
    chapter: { num: '第三天', title: '天空与深渊' },
    lines: [
      { char: 'narrator', text: '第三天早上，窗台上又多了一根羽毛。' },
      { char: 'narrator', text: '不，不是一根。是七根。整整齐齐地排在窗台上，拼成了一个箭头。' },

      { char: 'narrator', text: '神社最高的屋脊上，坐着一个人。长长的蓝黑色头发被风吹起来，像一面旗。' },
      { char: 'narrator', text: '那人看到你抬头，就站了起来——然后从屋脊上一跃而下。' },

  'meet_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '不，不是跳。是滑翔。' },
      { char: 'narrator', text: '宽大的袖子在空中展开，袖底隐约透出翅膀的轮廓。落地的时候，连一片落叶都没有惊动。' },
      { char: 'sou', text: '……千代的外孙。' },
      { char: 'sou', text: '你的眼睛像她。看东西的时候，总是先看最小的那个。' },
      { char: 'player', text: '你是……苍羽？外婆说你从来不下来吃饭。' },
      { char: 'narrator', text: '对方的嘴角几乎看不出地动了一下。' },
      { char: 'sou', text: '她把饭团放在屋檐上。五十年。每个月一个。梅子的。' },
      { char: 'sou', text: '我不喜欢梅子。……但每个都吃完了。' },
      { char: 'player', text: '前天晚上，外婆家窗台上的羽毛，也是你？' },
      { char: 'sou', text: '嗯。' },
      { char: 'sou', text: '我想知道，千代的外孙会不会上山。' },
      { char: 'sou', text: '……你上来了。' },
      { char: 'narrator', text: '风吹过来。苍羽的目光越过你，落向山下小镇的方向。看了很久。' },
      { char: 'sou', text: '昨晚的事。', if: 'went_out' },
      { char: 'sou', text: '你看到的，不是你以为的那样。', if: 'went_out' },
      { char: 'sou', text: '……但也不是琥珀以为的那样。', if: 'went_out' },
      { char: 'sou', text: '昨晚，你门外的那道黑痕。', ifnot: 'went_out' },
      { char: 'sou', text: '那不是来害你的东西留下的。是赶走它的东西留下的。', ifnot: 'went_out' },
      { char: 'player', text: '你知道些什么？' },
      { char: 'sou', text: '我在天上。什么都看得见。' },
      { char: 'sou', text: '可是看得见，和能说出口，是两回事。' },
      { char: 'narrator', text: '他垂下眼睛。长长的睫毛在脸上投下一小片阴影。' },
      { char: 'sou', text: '……我有一件事，一直没有告诉琥珀。' },
      { char: 'sou', text: '等我想好怎么开口。在那之前——请你也不要问她。', flag: 'q_sou' },

      { char: 'player', text: '你的手……' },
      { char: 'genya', text: '别管这个。' },
      { char: 'genya', text: '这块石头叫「要石」。整片森林的结界，都系在它身上。' },
      { char: 'genya', text: '千代没来的那个满月，它开始往外漏。漏出来的东西，就是你在树上看到的那种黑。' },
      { char: 'player', text: '那你在树下……是在做什么？' },
      { char: 'genya', text: '我说了。吃饭。' },
      { char: 'genya', text: '吃得越多，我就越像它。' },
      { char: 'narrator', text: '你分不清他是在开玩笑，还是在说一件很可怕的事。' },
      { char: 'player', text: '守铃人……到底要做什么？琥珀不肯说。' },
      { char: 'genya', text: '满月那天夜里，站在这块石头前面，摇响那枚铃。' },
      { char: 'genya', text: '剩下的，让那只狐狸告诉你。——如果她敢的话。' },
      { char: 'narrator', text: '他从棋盒里拿出一颗黑子，放在你手心里。石子是凉的，被摸得很光滑。' },
      { char: 'genya', text: '拿着。害怕的时候握着它。' },
      { char: 'genya', text: '还有，一句忠告。' },
      { char: 'narrator', text: '他靠回巨石上，闭上了眼睛。一只手按在石头上。紫色的光，在他手掌下一明一暗。' },
      { char: 'genya', text: '满月之前，别相信任何一个说「没事」的人。' },
      { char: 'genya', text: '……包括我。' },
      { char: 'narrator', text: '你走上石阶的时候，回头看了一眼。' },
      { char: 'narrator', text: '棋盘边上，放着一个很旧的茶碗。碗里的茶，早就凉透了。碗沿上，有外婆常用的那种口红的颜色。' },
    ],

        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
