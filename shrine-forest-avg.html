      { char: 'shiro', text: '都是千代婆婆带上来的。这是「手表」，会告诉你现在几点。不过它死掉了，一直是三点十五分。' },
      { char: 'shiro', text: '这是「恐龙」。以前的人类会骑它吗？' },
      { char: 'player', text: '……不会。它们比人类早很多很多年。' },
      { char: 'shiro', text: '哇……' },
      { char: 'narrator', text: '盒子最底下，压着一张明信片。一片蓝色的海，白色的浪，远处有一座小小的灯塔。' },
      { char: 'shiro', text: '这个，是「海」。' },
      { char: 'shiro', text: '千代婆婆说，真的海比这个大一万倍。可是我想象不出来。一万倍，是比整座山还大吗？' },
      { char: 'narrator', text: '他把明信片捧在手心里，看了又看。然后，小声说——' },
      { char: 'shiro', text: '……我不想恨了。' },
      { char: 'shiro', text: '昨天晚上，我一直在想你说的话。可是如果不恨他……我就不知道娘为什么会死了。' },
      { char: 'shiro', text: '我好怕。' },
    ],
    choices: [
      { text: '在明信片背面，画下你记得的海', affection: { deer: 3 }, next: 'day4_shiro2' },
      { text: '握住他的手：「不知道的事，我陪你一起去找。」', affection: { deer: 3 }, next: 'day4_shiro2' },
    ],
  },

  'day4_shiro2': {
    scene: 'garden', particles: 'sakura', flashback: true,
    lines: [
      { char: 'narrator', text: '白露靠在你肩膀上。白樱的花瓣一片一片地落下来。' },
      { char: 'narrator', text: '你闭上眼睛。忽然——' },
      { char: 'narrator', text: '——同样的樱树下。同样的花瓣。' },
      { char: 'narrator', text: '一个翠绿头发的小男孩，笨手笨脚地编着一个花环。编散了，再编。' },
      { char: 'narrator', text: '他把花环戴在一个穿黄色雨靴的小孩头上。' },
      { char: 'narrator', text: '「好啦！你是花之王！」' },
      { char: 'narrator', text: '小孩摸着头上的花环，认真地说：「小鹿哥哥，等我长大了，带你去看海。」' },
      { char: 'narrator', text: '「……真的？」' },
      { char: 'narrator', text: '「拉钩！」', flag: 'mem_shiro' },
    ],
    next: 'day4_shiro3',
  },

  'day4_shiro3': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'player', text: '……白露。我们以前，是不是在这里拉过钩？' },
      { char: 'narrator', text: '白露猛地坐直了。眼睛瞪得圆圆的。' },
      { char: 'shiro', text: '你、你想起来了？！' },
      { char: 'shiro', text: '二十年前！你戴着我编的花环，说要带我去看海！我一直记得！可是你走了以后就再也没来过，千代婆婆说你把这里忘了……' },
      { char: 'shiro', text: '所以千代婆婆才说「我替那孩子带你去」……' },
      { char: 'narrator', text: '他的眼泪一下子涌了出来。可是这一次，他在笑。' },
      { char: 'shiro', text: '原来……约好要带我去看海的，有两个人啊。' },
      { char: 'narrator', text: '他头上的角，一口气开出了五六朵花。粉的，白的。还有一朵，是很淡很淡的蓝色。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_yukimaru': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '哟。被琥珀姐骂了？' },
      { char: 'yukimaru', text: '别在意别在意。我被银朗骂了半年，现在耳朵都长茧了。抓紧了啊——一、二——' },
      { char: 'narrator', text: '你还没来得及说「等一下」，就被他扛上了肩膀。风在耳边呼啸，几个纵跳之后，你们站在了森林最高的那棵树上。' },
      { char: 'yukimaru', text: '看，北边。那一排白的。' },
      { char: 'narrator', text: '很远很远的地方，天边有一线雪白的山脊，像是用刀切出来的。' },
      { char: 'yukimaru', text: '那就是我家。……以前是。' },
      { char: 'player', text: '你想回去吗？' },
      { char: 'yukimaru', text: '不想。那边规矩太多。不准化人形，不准靠近人类，不准离开领地，不准这不准那。' },
      { char: 'yukimaru', text: '我娘在那里憋了一辈子。她小时候可野了，据说天天跟在一只银色的哥哥屁股后面跑。' },
      { char: 'yukimaru', text: '后来那个哥哥被赶走了。她就再也没跑过。' },
      { char: 'narrator', text: '他晃着腿，尾巴垂在树枝下面，一动不动。' },
      { char: 'yukimaru', text: '族里的老家伙们都叫他「银色的叛徒」。说他为了一个人类小鬼背叛了族群。' },
      { char: 'yukimaru', text: '可我娘不是这么说的。她说，那是整个族里最温柔的一只狼。' },
      { char: 'yukimaru', text: '她临走的时候拉着我的手说：「雪丸，去找你舅舅。他会叫你的名字的。」' },
      { char: 'narrator', text: '他咧嘴一笑。虎牙露出来，眼睛却有点亮。' },
      { char: 'yukimaru', text: '结果呢。半年了。「你」「小子」「回去」。' },
      { char: 'yukimaru', text: '……喂。人类是怎么让别人叫自己名字的？' },
    ],
    choices: [
      { text: '「大概……先叫对方的名字吧。」', affection: { whitewolf: 3 }, next: 'day4_yukimaru2' },
      { text: '「我叫你。——雪丸。」', affection: { whitewolf: 4 }, flag: 'called_yuki', next: 'day4_yukimaru2' },
    ],
  },

  'day4_yukimaru2': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸整个人僵住了。然后，从耳朵尖开始，一路红到了脖子。', if: 'called_yuki' },
      { char: 'yukimaru', text: '你、你你你干嘛突然叫——！', if: 'called_yuki' },
      { char: 'yukimaru', text: '……再、再叫一次。刚才风太大，没听清。', if: 'called_yuki' },
      { char: 'player', text: '雪丸。', if: 'called_yuki' },
      { char: 'narrator', text: '他把脸埋进膝盖里，尾巴疯了一样地拍打着树枝，震下来一大片雪。', if: 'called_yuki' },
      { char: 'yukimaru', text: '……那也太丢脸了。', ifnot: 'called_yuki' },
      { char: 'narrator', text: '过了好一会儿，他才抬起头，对着北边的风，很小声地，练习了一下——' },
      { char: 'yukimaru', text: '……舅舅。' },
      { char: 'yukimaru', text: '啊啊啊不行不行！你刚才什么都没听到！' },
      { char: 'narrator', text: '他跳起来，差点从树上摔下去。你一把抓住他的尾巴。' },
      { char: 'yukimaru', text: '嗷！尾巴不行！尾巴是狼的尊严！' },
      { char: 'narrator', text: '笑闹过后，他坐下来，眯着眼睛看北边。' },
      { char: 'yukimaru', text: '……喂，你昨天晚上下去了吧。银朗闻出来的时候，我也闻到了。' },
      { char: 'yukimaru', text: '那条蛇的味道，我在北坡也闻到过。每一个烂掉的地方，都有。' },
      { char: 'yukimaru', text: '可是还有另一种味道。很淡，很怪。不是我们任何一个人的。' },
      { char: 'yukimaru', text: '像是……很久很久以前，被人忘在哪里的东西。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽从屋顶上落下来，站在你面前，看了你很久。' },
      { char: 'sou', text: '……你想看看天上吗？' },
      { char: 'player', text: '可以吗？' },
      { char: 'sou', text: '千代年轻的时候，我带她飞过一次。她尖叫了一路，落地以后说「再来一次」。' },
      { char: 'narrator', text: '他退后一步。风忽然大了起来，蓝色的羽毛在空中散开——', transform: { char: 'sou', text: '蓝鹰 · 展翼' } },
      { char: 'narrator', text: '一只巨大的蓝鹰低下头，示意你爬上它的背。' },
      { char: 'narrator', text: '然后，地面一下子远了。' },
      { char: 'narrator', text: '整片杜鹃森在脚下展开。绿色的海洋，神社是其中一粒小小的红点，溪流像银线一样穿过去。' },
      { char: 'narrator', text: '可是在森林的北边，你看到了一片一片的黑色。像墨水滴在宣纸上，正在慢慢晕开。' },
      { char: 'sou', text: '三天前，只有一片。今天，是十一片。' },
      { char: 'sou', text: '我每天都在数。' },
      { char: 'narrator', text: '他在云层边缘盘旋。风很大，他的声音却很清楚。' },
      { char: 'sou', text: '……你十二岁那年，千代让我去城里看过你一次。' },
      { char: 'player', text: '……诶？' },
      { char: 'sou', text: '你在学校的操场边上，一个人吃便当。其他孩子在跑，在笑。你一直看着他们，没有过去。' },
      { char: 'sou', text: '回来以后，千代问我：「那孩子好吗？」' },
      { char: 'sou', text: '我说：「很好。」' },
      { char: 'sou', text: '……那是我这辈子，唯一一次对她撒谎。', flag: 'mem_sou' },
      { char: 'narrator', text: '风很大。你把脸贴在他背上的羽毛里。羽毛是暖的。' },
    ],
    choices: [
      { text: '「……谢谢你替我撒谎。」', affection: { hawk: 3 }, next: 'day4_sou2' },
      { text: '「那你呢？一个人在天上，也很好吗？」', affection: { hawk: 4 }, next: 'day4_sou2' },
    ],
  },

  'day4_sou2': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '落地的时候，他变回了人形。风把他的长发吹到你的肩膀上。' },
      { char: 'sou', text: '在天上，什么都看得见。谁在哭，谁在笑，谁一个人坐在溪边，谁一个人按着石头。' },
      { char: 'sou', text: '看得见所有人，就碰不到任何人。' },
      { char: 'sou', text: '千代的饭团，是我唯一愿意落到屋檐上的理由。' },
      { char: 'narrator', text: '他抬起头，看着天上。很久很久。' },
      { char: 'sou', text: '……我决定了。' },
      { char: 'sou', text: '今天，我去跟琥珀说。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'genya', text: '白天也敢下来？千代至少还知道挑晚上。' },
      { char: 'narrator', text: '玄夜靠在要石旁边，脸色比前一晚更白了。可他看到你，还是扬了扬下巴，指了指棋盘。' },
      { char: 'genya', text: '被那只狐狸骂了吧。脸上写着呢。' },
      { char: 'genya', text: '会下棋吗？' },
      { char: 'player', text: '……只知道五子连成一线就赢。' },
      { char: 'genya', text: '那是五子棋。算了，教你。反正你外婆当年也是从这个水平开始的。' },
      { char: 'narrator', text: '黑子，白子。他下得很慢，每一步都要按着要石缓一口气。你输了三盘，第四盘，他故意让你赢了。' },
      { char: 'genya', text: '跟你外婆一样。赢了就笑得像个傻子。' },
      { char: 'player', text: '玄夜。六十年前，白露的娘……到底发生了什么？' },
      { char: 'narrator', text: '他捏着一枚白子，停在了半空中。' },
      { char: 'genya', text: '……你还真是，一点都不怕问。' },
      { char: 'genya', text: '结界破了。一只堕兽钻了进来，扑向那棵白樱底下。树洞里，藏着一只小鹿。' },
      { char: 'genya', text: '她挡在树洞前面。我赶到的时候，她已经站不住了。' },
      { char: 'genya', text: '我把堕兽绞碎了。然后，把她缠了起来。' },
      { char: 'player', text: '缠起来……' },
      { char: 'genya', text: '蛇的身体是冷的。可是缠紧了，也能挡住风。' },
      { char: 'genya', text: '她血流得太多了，冷得一直发抖。我能做的，只有这个。缠着她，等天亮。' },
      { char: 'genya', text: '她走之前，一直在说一个名字。白露，白露。', flag: 'a_mother' },
      { char: 'narrator', text: '棋子落在棋盘上。很轻的一声。' },
      { char: 'player', text: '为什么不告诉他？他恨了你六十年！' },
      { char: 'genya', text: '因为那孩子需要一个可以恨的东西。' },
      { char: 'genya', text: '恨一条蛇，比恨他娘为什么丢下他一个人，要容易得多。' },
      { char: 'genya', text: '千代知道。她劝了我很多年。我没听。' },
      { char: 'narrator', text: '他抬起眼睛看你。那双紫色的竖瞳里，第一次没有笑意。' },
      { char: 'genya', text: '现在你也知道了。要不要告诉他——那是你的事。' },
      { char: 'genya', text: '……我只是，不想让他再怕我了。怕了六十年，也该累了。' },
      { char: 'narrator', text: '他咳了起来。你伸手去扶他，碰到了他的手臂——冰得吓人。灰色的鳞片，已经爬到了手肘。' },
      { char: 'player', text: '玄夜，你的身体……' },
      { char: 'genya', text: '我说过了。吃得越多，就越像它。' },
      { char: 'genya', text: '……还有三天。撑得住的。' },
    ],
    next: 'day4_sou_confess',
  },

  'day4_sou_confess': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '午后。琥珀在前庭里给杜鹃浇水。' },
      { char: 'narrator', text: '一阵风压了下来。苍羽落在了她面前的石板上。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '水壶停在了半空中。' },
      { char: 'kohaku', text: '……苍羽？你下来了？' },
      { char: 'kohaku', text: '上一次你落到地上，是多少年前来着？' },
      { char: 'sou', text: '琥珀。我有话要说。' },
      { char: 'sou', text: '上个满月之前，我看到一辆白色的车，把千代从镇上带走了。' },
      { char: 'sou', text: '我跟着那辆车，一直飞到城里的医院。从那天起，我每天都去。停在她病房窗外的那棵树上。' },
      { char: 'sou', text: '她瘦了很多。有一天，她好像看到我了，对着窗户笑了一下。' },
      { char: 'sou', text: '那天晚上，窗帘拉上了。后来的葬礼，黑色的伞——我从很高的地方看着，看了一整个下午。' },
      { char: 'sou', text: '每天傍晚我飞回来，落在屋顶上。你在下面扫地，哼着歌，在算千代下次来要做什么点心。' },
      { char: 'sou', text: '我没有下去。二十多天，一个字都没有说。让你在鸟居下面，白白等了整整一夜。' },
      { char: 'sou', text: '……对不起。', flag: 'a_sou' },
      { char: 'narrator', text: '水壶从琥珀手里放了下来。她走到苍羽面前，抬头看着这个比她高出一头的人。' },
      { char: 'kohaku', text: '傻孩子。' },
      { char: 'kohaku', text: '你一个人在那扇窗户外面……守了多久？' },
      { char: 'sou', text: '……二十五天。' },
      { char: 'narrator', text: '琥珀伸出手，理了理苍羽被风吹乱的头发。苍羽没有躲。' },
      { char: 'kohaku', text: '下次，就下来吧。一个人在上面，太冷了。' },
      { char: 'narrator', text: '苍羽垂下眼睛。那一瞬间，他看起来不像是守望天空的鹰，只是一个很累的、终于落了地的孩子。' },
      { char: 'narrator', text: '然后，他又开口了。' },
      { char: 'sou', text: '……还有一件事。' },
      { char: 'sou', text: '千代住院的那天，我飞回来之后，第一个去告诉的——是地底下那条蛇。' },
      { char: 'narrator', text: '琥珀的手，停在了苍羽的头发上。' },
      { char: 'kohaku', text: '……为什么是他？' },
      { char: 'sou', text: '因为他问了。' },
      { char: 'sou', text: '他每天都在洞口等我。问「今天千代怎么样」。一天都没有漏过。' },
      { char: 'narrator', text: '琥珀什么都没说。可是她转过头，看向了正殿后面那扇窄门。看了很久。' },
    ],
    next: 'day4_search',
  },

  'day4_search': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '傍晚。晚饭摆好了，雪丸没有来。' },
      { char: 'narrator', text: '平时他总是第一个到，第一个抢鱼。今天，他的碗一直空着。' },
      { char: 'narrator', text: '白露从石阶下面跑上来，上气不接下气。',
        chars: [{ id: 'shiro', pos: 'center', form: 'human' }] },
      { char: 'shiro', text: '雪、雪丸！中午他说在北坡闻到一个奇怪的味道，要去看看！说天黑前一定回来！' },
      { char: 'shiro', text: '可是……可是天已经黑了！' },
      { char: 'narrator', text: '银朗放下了碗。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '他什么都没说。起身，拿刀，走下石阶。脚步很快，快到你几乎追不上。' },
      { char: 'ginro', text: '你留下。' },
      { char: 'player', text: '我跟你去。我能听结界——你教过我的。' },
      { char: 'narrator', text: '银朗看了你一眼。只有一眼。' },
      { char: 'ginro', text: '……跟紧。走我左边。' },
    ],
    next: 'day4_search2',
  },

  'day4_search2': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '北坡的林子，静得可怕。' },
      { char: 'narrator', text: '连虫鸣都没有。月光照在树干上，一棵，两棵，三棵……每一棵上面，都爬着黑色的斑。' },
      { char: 'narrator', text: '银朗的鼻子一直贴着地面。他走得越来越快，最后几乎是在跑。' },
      { char: 'narrator', text: '然后，你听到了。' },
      { char: 'narrator', text: '前面的坡下，传来一声嘶哑的狼嚎。很短，然后断了。' },
      { char: 'ginro', text: '——！' },
      { char: 'narrator', text: '银朗冲了下去。你跟在后面，滑了一跤，滚下坡，爬起来——' },
      { char: 'narrator', text: '看到了。' },
      { char: 'narrator', text: '一只白狼倒在树根下，雪白的毛上全是血。它还在拼命地想站起来，挡在一棵被黑色缠满的老树前面。' },
      { char: 'narrator', text: '它对面，站着一个东西。' },
      { char: 'narrator', text: '黑色的，像一团会动的烟。它曾经大概是一只狸猫。现在只剩下一个佝偻的、饿的形状。' },
      { char: 'narrator', text: '它的脖子上，挂着一根褪色的红绳。红绳上，系着一个很小很小的、裂开的铜铃。' },
      { char: 'narrator', text: '银朗拔出了刀。', transform: { char: 'ginro', text: '苍银狼' } },
      { char: 'narrator', text: '然后，他就不是银朗了。一头巨大的银狼从月光里扑了出去，把那团黑烟整个撕开。' },
      { char: 'narrator', text: '黑烟发出一声不像任何动物的尖叫。散掉之前，它好像——回过头，看了你一眼。' },
      { char: 'narrator', text: '那双眼睛里，没有恨。只有一种很深很深的、迷路一样的茫然。' },
      { char: 'narrator', text: '黑烟散了。地上，只剩下那根红绳，和那个裂开的小铃铛。', flag: 'q_cord' },
    ],
    next: 'day4_search3',
  },

  'day4_search3': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸变回了人形，靠在树根上，喘着粗气。胳膊上的绷带全被血浸透了。' },
      { char: 'yukimaru', text: '……嘿嘿。晚饭，是不是……已经开始了……' },
      { char: 'narrator', text: '银朗跪在他面前，手在发抖。' },
      { char: 'ginro', text: '你——' },
      { char: 'narrator', text: '他张了张嘴。那两个字就在嘴边。你看得出来。' },
      { char: 'ginro', text: '……笨蛋。' },
      { char: 'narrator', text: '他把雪丸背了起来。雪丸比他矮一个头，趴在他背上，像一只受伤的小狗。' },
      { char: 'yukimaru', text: '……那棵树，是北坡最大的结。我闻到那个怪味道……在往它那边爬……' },
      { char: 'yukimaru', text: '如果那棵树烂了……北坡就全完了……所以我……' },
      { char: 'ginro', text: '别说话。' },
      { char: 'narrator', text: '走了很久。快到神社的时候，雪丸迷迷糊糊地，在银朗背上小声说了一句。' },
      { char: 'yukimaru', text: '……喂。你刚才……是不是，差点叫我名字了。' },
      { char: 'narrator', text: '银朗没有回答。' },
      { char: 'narrator', text: '可是他背着雪丸的手，收紧了一点。' },
    ],
    next: 'day4_night',
  },

  'day4_night': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '深夜。雪丸的伤包扎好了，睡在琥珀的房间里。白露守在他旁边，也睡着了。' },
      { char: 'narrator', text: '你走到缘廊上。琥珀一个人坐在那里，手心里捧着那根红绳。' },
      { char: 'narrator', text: '她的脸色，白得吓人。' },
      { char: 'kohaku', text: '……这是阿灯的。' },
      { char: 'player', text: '阿灯？' },
      { char: 'kohaku', text: '一只狸猫。八十年前，住在神社后面的竹林里。最喜欢偷供品，被抓到了就装睡。' },
      { char: 'kohaku', text: '千代的娘，那时候还是个小姑娘。她给阿灯系了这根红绳，挂了这个铃，说「这样你偷东西的时候，我就能听见了」。' },
      { char: 'kohaku', text: '阿灯很喜欢。走到哪里都叮叮当当的。' },
      { char: 'kohaku', text: '六十年前，结界破的那一夜以后……阿灯就不见了。我以为，它是走了。' },
      { char: 'narrator', text: '她把红绳攥在手心里。攥得很紧。' },
      { char: 'player', text: '琥珀。那个黑色的东西……到底是什么？' },
      { char: 'narrator', text: '琥珀看着你。很久很久。' },
      { char: 'narrator', text: '然后，她像是终于下了什么决心，轻轻吸了一口气。' },
      { char: 'kohaku', text: '……明天早上。' },
      { char: 'kohaku', text: '明天早上，我全都告诉你。守铃人的事，堕兽的事，还有……我一直不敢说的事。' },
      { char: 'kohaku', text: '今晚，让我再想一想。想想千代如果在，会怎么说。' },
      { char: 'narrator', text: '你在她旁边坐下。你们谁都没再说话。' },
      { char: 'narrator', text: '月亮已经快圆了。北边的天上，有一小块星星，不见了。像是被什么东西，一口一口地吃掉了。' },
    ],
    next: 'day5_kohaku_truth',
  },
  // =============== DAY 5 ===============
  'day5_kohaku_truth': {
    scene: 'shrine', particles: 'spirits', day: 5,
    chapter: { num: '第五天', title: '被遗忘的' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '第五天，天阴着。' },
      { char: 'narrator', text: '雪丸的伤，一夜之间好了大半。白露守着他，用角上的花敷了一整夜。天亮的时候，白露自己累得趴在被子边上睡着了，头上一朵花都不剩。' },
      { char: 'narrator', text: '琥珀在缘廊上等你。她换了一身正式的巫女服，头发一丝不乱，像是要去参加什么仪式。' },
      { char: 'kohaku', text: '坐吧。我说过，今天全都告诉你。' },
      { char: 'kohaku', text: '先从最简单的说起。守铃人要做什么。' },
      { char: 'kohaku', text: '满月的夜里，站在要石前面，摇响那枚铃。然后，把我们每一个的名字，念出来。' },
      { char: 'player', text: '……念名字？就这样？' },
      { char: 'kohaku', text: '就这样。' },
      { char: 'kohaku', text: '我们这种东西，本来是没有形状的。山里的一阵风，林子里的一团雾。' },
      { char: 'kohaku', text: '是人类叫了我们的名字，我们才有了耳朵，有了尾巴，有了「琥珀」和「银朗」。' },
      { char: 'kohaku', text: '被记住，我们才能留在这一边。', flag: 'a_keeper' },
      { char: 'kohaku', text: '然后——是我一直不敢说的那一半。' },
      { char: 'narrator', text: '她把那根红绳放在你们中间的木板上。小小的铜铃，裂成了两半。' },
      { char: 'kohaku', text: '被所有人忘掉的兽灵，会慢慢失去形状。先忘掉自己的名字，再忘掉自己是谁。' },
      { char: 'kohaku', text: '最后，只剩下饿。饿着想被谁记住，却连自己想被记住什么，都忘了。' },
      { char: 'kohaku', text: '那就是堕兽。' },
      { char: 'kohaku', text: '堕兽是杀不死的。散掉以后，过一阵又会聚起来。因为饿还在。' },
      { char: 'kohaku', text: '昨晚那个……是阿灯。', flag: 'a_cord' },
      { char: 'narrator', text: '你想起它最后回头看你的那一眼。那种迷路一样的茫然。' },
      { char: 'kohaku', text: '六十年前，千代的娘病倒了，错过了一个满月。结界破了。' },
      { char: 'kohaku', text: '第二个月，千代接过了铃，把她认识的每一个名字都念了。可是阿灯那时候，已经不见了。千代不认识它。' },
      { char: 'kohaku', text: '没有人念它的名字。所以它……就变成了那样。' },
      { char: 'narrator', text: '琥珀转过身，背对着你。' },
      { char: 'kohaku', text: '你数过我的尾巴吗？' },
      { char: 'narrator', text: '她身后，赤红色的尾巴一条一条地展开。在阴天的光里，像一把慢慢打开的扇子。' },
      { char: 'narrator', text: '一，二，三，四，五，六，七，八。' },
      { char: 'kohaku', text: '我本来有九条。' },
      { char: 'kohaku', text: '今天早上醒来，只剩八条了。' },
      { char: 'narrator', text: '你说不出话来。' },
      { char: 'kohaku', text: '千代没来的那个满月以后，我们就开始被忘掉了。银朗最近总是想不起昨天巡了哪条路。白露的花开得越来越少。苍羽……飞得越来越高，越来越不想下来。' },
      { char: 'kohaku', text: '结界的烂，不是谁弄坏的。是我们自己，在一点一点地变淡。' },
      { char: 'kohaku', text: '如果这个满月，还是没有人念我们的名字——' },
      { char: 'narrator', text: '她没有说完。她不需要说完。' },
      { char: 'player', text: '……为什么不早告诉我？' },
      { char: 'narrator', text: '琥珀转回来。她在笑。眼睛是红的。' },
      { char: 'kohaku', text: '因为你会留下来。' },
      { char: 'kohaku', text: '你是千代的孩子。你一定会说「我来念」。然后，把一辈子绑在这座山上。' },
      { char: 'kohaku', text: '可怜我们，心疼我们，觉得不念就是害死我们——我不想要这样的守铃人。' },
      { char: 'kohaku', text: '千代当年，是因为喜欢我们，才留下来的。' },
      { char: 'kohaku', text: '如果你要念，我希望你也是因为这个。……如果不是，就下山吧。我们会想别的办法。' },
      { char: 'player', text: '有别的办法吗？' },
      { char: 'narrator', text: '琥珀没有回答。' },
      { char: 'narrator', text: '她只是伸出手，把那根红绳，放进了你的手心里。' },
      { char: 'kohaku', text: '还有两天。不急着回答。' },
      { char: 'kohaku', text: '去见你想见的人吧。' },
    ],
    next: 'day5_day',
  },

  'day5_day': {
    scene: 'shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '早上去井边打水的时候，你看到鸟居的柱脚上，多了一小块黑斑。' },
      { char: 'narrator', text: '它已经爬到神社门口了。' },
      { char: 'narrator', text: '银朗天没亮就出去巡逻，到中午都没回来。屋顶上，苍羽一圈一圈地盘旋，比平时低得多。' },
      { char: 'narrator', text: '只有溪边偶尔传来雪丸和白露打闹的声音。雪丸的胳膊还缠着绷带，笑声却比平时还大。像是想用吵闹，把什么东西推开。' },
      { char: 'player', text: '（后天就是满月了。）' },
      { char: 'player', text: '（念出名字……就这么简单的事。可是念完以后，我就是新的守铃人了。每个满月，都要回来。一辈子。）' },
      { char: 'player', text: '（外婆，你当年决定的时候，在想什么呢？）' },
    ],
    choices: [
      { text: '去溪边找白露，把六十年前那晚的真相告诉他', if: 'genya_truth', affection: { deer: 1, snake: 2 }, flag: 'told_truth', next: 'day5_truth' },
      { text: '爬上屋顶，问苍羽：六十年前那晚，你在天上看到了什么？', ifnot: 'genya_truth', affection: { hawk: 2 }, next: 'day5_ask_sou' },
      { text: '端一碗热茶，下石阶去看玄夜', affection: { snake: 2 }, next: 'day5_genya_tea' },
      { text: '去溪边看看雪丸的伤', affection: { whitewolf: 2 }, next: 'day5_yuki' },
      { text: '去鸟居下面，等银朗巡逻回来', affection: { wolf: 2 }, next: 'day5_ginro' },
      { text: '陪琥珀一起，给外婆的房间换上新的花', affection: { fox: 2 }, next: 'day5_kohaku' },
    ],
  },

  'day5_ask_sou': {

    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你顺着梯子爬上屋顶。苍羽坐在屋脊上，看着北边那片越来越大的黑。' },
      { char: 'sou', text: '……你想问六十年前。' },

      { text: '「谢谢你告诉我。这件事……让我想想怎么跟他说。」', affection: { hawk: 1 }, next: 'day5_evening' },
    ],

      { char: 'narrator', text: '你端着一碗杜鹃花茶，一级一级走下石阶。茶洒了一半。' },

  'day5_yuki': {

    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '雪丸坐在溪边的石头上，把缠着绷带的胳膊泡在水里。' },

      { char: 'narrator', text: '雪丸咧嘴一笑。可是那个笑，一点都不像他。' },

      { text: '揉了揉他那只缺了口的耳朵：「雪丸。雪丸。雪丸。——记住了。」', affection: { whitewolf: 4 }, next: 'day5_evening' },
    ],
  },

  'day5_ginro': {
    scene: 'shrine', particles: 'spirits',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '太阳偏西的时候，银朗回来了。' },
      { char: 'narrator', text: '他走得很慢。走到鸟居下面，看到你，停住了。' },
      { char: 'ginro', text: '……你在等谁。' },
      { char: 'player', text: '等你。' },
      { char: 'narrator', text: '他站在那里，像是不知道该拿这句话怎么办。' },
      { char: 'ginro', text: '……今天，北坡的路，我走了两遍。' },
      { char: 'ginro', text: '走完第一遍，我忘了自己走过。' },
      { char: 'narrator', text: '他说得很平静。像是在报告今天的天气。' },
      { char: 'ginro', text: '琥珀说了吧。我们会被忘掉的事。' },

  // =============== DAY 6: MEMORY ===============
  'memory_return': {

    lines: [
      { char: 'narrator', text: '中午，琥珀和玄夜一起，把你叫到了地底。' },
      { char: 'narrator', text: '琥珀第一次走下那道石阶。她站在洞口，看着那张棋盘，那个凉掉的茶碗，看了很久。' },
      { char: 'kohaku', text: '……原来，千代每个月，就是坐在这里。' },
      { char: 'genya', text: '坐在那里，输棋，喝太甜的茶，说你的坏话。' },
      { char: 'kohaku', text: '她说我什么？' },
      { char: 'genya', text: '「琥珀太爱操心了。」「琥珀的尾巴又掉毛了。」「琥珀做的煎蛋是歪的。」' },
      { char: 'kohaku', text: '……那个人。' },

      { char: 'kohaku', text: '二十年前那一夜的记忆，封在很深的地方。我一个人解不开。' },
      { char: 'genya', text: '因为最里面那一段，是我缠起来的。' },
      { char: 'genya', text: '那天晚上，你看到了不该看的东西。你哭着要回去找它。我怕你一辈子都放不下，就把那一段缠住，交给这只狐狸封了。' },
      { char: 'genya', text: '她连里面是什么都没看。……真是个傻狐狸，那么信千代。' },
      { char: 'kohaku', text: '……现在呢？' },
      { char: 'genya', text: '现在，这个孩子该知道了。' },
      { char: 'narrator', text: '一只温热的手，按在你的额头上。一只冰凉的手，按在你的后脑。' },
      { char: 'narrator', text: '然后——' },
    ],
    next: 'memory_return2',
  },

  'memory_return2': {
    scene: 'night-shrine', particles: 'spirits', flashback: true,
    lines: [
      { char: 'narrator', text: '——二十年前。满月。' },
      { char: 'narrator', text: '外婆牵着你的手，第一次带你上山。「下个月你就要去城里了。去之前，带你见见外婆的朋友们。」' },
      { char: 'narrator', text: '神社里好热闹。红头发的姐姐给你糖。一只银色的大狗蹲在鸟居下面，不肯过来，只是一直看着你。' },
      { char: 'narrator', text: '屋顶上坐着一只好大的鸟。一个长着小鹿角的哥哥，躲在柱子后面偷看你。' },
      { char: 'narrator', text: '外婆和姐姐说话的时候，你看到正殿后面有一扇小门，开着一条缝。' },
      { char: 'narrator', text: '你钻了进去。' },
    ],
    next: 'memory_return3',
  },

  'memory_return3': {
    scene: 'cave', particles: 'spirits', flashback: true,
    lines: [
      { char: 'narrator', text: '好长好长的楼梯。你一级一级往下爬，不害怕。' },
      { char: 'narrator', text: '下面有一块会发光的大石头。石头旁边，坐着一个黑头发的叔叔，在一个人下棋。' },
      { char: 'narrator', text: '你爬到棋盘前面，抓起三颗白色的，往嘴里塞。「是糖吗？」' },
      { char: 'narrator', text: '「……这个不能吃。喂，吐出来。」' },
      { char: 'narrator', text: '叔叔的眼睛是紫色的，竖着的。你盯着看了一会儿，说：「你是蛇先生吗？」' },
      { char: 'narrator', text: '他愣住了。然后，第一次笑了。' },
      { char: 'narrator', text: '「……嗯。我是蛇先生。」' },
      { char: 'narrator', text: '你们下了一会儿棋——其实是你把棋子一颗一颗排成小狗的形状。蛇先生没有阻止你。' },
      { char: 'narrator', text: '后来你困了，想出去。你没有走来时的楼梯，而是顺着有水声的那条小路，走了出去。' },
    ],
    next: 'memory_return4',
  },

  'memory_return4': {
    scene: 'forest', particles: 'fireflies', flashback: true,
    lines: [
      { char: 'narrator', text: '林子里好黑。你找不到外婆了。' },
      { char: 'narrator', text: '你正要哭的时候，听到了一个声音。' },
      { char: 'narrator', text: '叮。叮当。' },
      { char: 'narrator', text: '一个黑乎乎的东西，从树后面走出来。它像一团烟，身上挂着一根红绳，红绳上有一个小铃铛。' },
      { char: 'narrator', text: '它一直跟着你。你走，它也走。你停，它也停。叮当，叮当。' },
      { char: 'narrator', text: '你不害怕。你觉得它好孤单。' },
      { char: 'narrator', text: '「你叫什么名字呀？」' },
      { char: 'narrator', text: '它不说话。它好像……忘了。' },
      { char: 'narrator', text: '「那我叫你叮当好不好？」' },
      { char: 'narrator', text: '黑色的烟，轻轻地抖了一下。' },
      { char: 'narrator', text: '然后，它忽然变得好大好大，朝你扑了过来。不是要咬你。是像一个饿了很久的孩子，想扑进谁的怀里。' },
      { char: 'narrator', text: '可是它太冷了，太重了。你喘不过气来。' },
      { char: 'narrator', text: '地面裂开了。一条黑色的大蛇冲出来，把你卷进怀里，一圈一圈，护在正中间。' },
      { char: 'narrator', text: '「……别碰这个孩子。」' },
      { char: 'narrator', text: '蛇先生没有杀它。他只是一直挡着，挡着，挡到天上的大鸟尖叫起来，挡到银色的大狗冲过来。' },
      { char: 'narrator', text: '黑色的烟逃走了。叮当，叮当。越来越远。' },
      { char: 'narrator', text: '你在蛇先生的怀里睡着了。醒来的时候，他已经不在了。只有大狗狗，和哭红了眼睛的狐狸姐姐。' },
    ],
    next: 'memory_return5',
  },

  'memory_return5': {
    scene: 'shrine', particles: 'sakura', flashback: true,
    lines: [
      { char: 'narrator', text: '天快亮的时候，大家都围在你身边。' },
      { char: 'narrator', text: '小鹿哥哥给你编了一个花环。大鸟从屋顶上飞下来，落在你旁边，一句话都不说。' },

      { char: 'narrator', text: '你哭着要回林子里去。怎么哄都哄不好。' },

      { char: 'narrator', text: '「……琥珀，帮我把今晚封起来吧。这孩子要去城里了。我不想让这孩子每天晚上，都想着回来找一团黑影子。」' },
      { char: 'narrator', text: '红头发的姐姐，伸出手，指尖轻轻点在你的额头上。', flag: 'a_memory' },

    next: 'memory_return6',
  },

  'crisis_battle': {

      { char: 'narrator', text: '黑色的巨影压了下来。你把铃死死攥在胸口，闭上了眼睛。',

  'rescue_fox': {

  'rescue_wolf': {

      { char: 'ginro', text: '……受伤了吗。' },

  'rescue_deer': {

  'rescue_whitewolf': {

      { char: 'narrator', text: '纯白的狼挡在你身前，背上的毛全竖了起来，冰霜从它的脚底向四周炸开。' },

      { char: 'narrator', text: '堕兽爬起来，扑了回来。白狼迎上去，一口，两口，快得像风暴。' },
      { char: 'narrator', text: '最后一击，是一道银光从天而降。银朗落在白狼身边，刀锋上的月光把黑雾劈成两半。' },
      { char: 'narrator', text: '堕兽散了。两匹狼化回人形，并排站在石阶上，喘着粗气。',

      { char: 'narrator', text: '雪丸张着嘴，半天没合上。然后他把脸扭到一边，尾巴疯了一样地摇。' },

    next: 'crisis_aftermath',

  'rescue_hawk': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'beast' }],
    transform_immediate: { char: 'sou', text: '蓝鹰 · 觉醒' },
    lines: [

      { char: 'narrator', text: '一只巨大的蓝鹰收拢双翼，像一支箭一样俯冲而下。钢铁般的利爪，一击贯穿了堕兽的脊背。' },

  'rescue_snake': {

    chars: [{ id: 'genya', pos: 'center', form: 'beast' }],
    transform_immediate: { char: 'genya', text: '黑蛇 · 觉醒' },
    lines: [
      { char: 'narrator', text: '黑暗里，有什么东西无声地滑了出来。' },

  'crisis_aftermath': {
    scene: 'shrine', particles: 'spirits', day: 6,
    chapter: { num: '第六天', title: '余烬与晨光' },
    lines: [
      { char: 'narrator', text: '天亮了。' },
      { char: 'narrator', text: '裂缝合上了，勉勉强强。北坡烧焦了一大片，前庭的石灯笼倒了一半。' },
      { char: 'narrator', text: '每个人都带着伤。可是，每个人都在。' },
      { char: 'narrator', text: '银朗坐在石阶上包扎手臂。雪丸蹲在旁边，想帮忙又不敢伸手。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '……要帮就帮。别在那里晃。' },
      { char: 'narrator', text: '雪丸手忙脚乱地接过绷带。缠得歪歪扭扭，银朗也没说什么。' },
      { char: 'ginro', text: '雪丸。' },
      { char: 'narrator', text: '雪丸的手停住了。' },
      { char: 'ginro', text: '……昨晚，你做得很好。' },
      { char: 'ginro', text: '你娘……会骄傲的。' },
      { char: 'narrator', text: '雪丸低着头，一声不吭，把绷带缠了一圈又一圈。缠到第五圈的时候，一滴水落在了银朗的手背上。' },
      { char: 'yukimaru', text: '……嗯。舅舅。' },
      { char: 'narrator', text: '缘廊那边，琥珀端着一碗热茶，走到了靠着柱子的玄夜面前。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '杜鹃花茶。……千代说，你从来不喝。' },
      { char: 'genya', text: '她每次都放一碗在洞口。' },
      { char: 'kohaku', text: '六十年，我一直在怀疑你。对不起。' },
      { char: 'genya', text: '……你们狐狸，道歉都这么直接的吗。' },
      { char: 'narrator', text: '可他还是接过了那碗茶。' },
      { char: 'narrator', text: '一个小小的身影，从琥珀身后走了出来。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }], if: 'told_truth' },
      { char: 'narrator', text: '白露攥着衣角，站在玄夜面前。他的腿在发抖，但他没有躲。', if: 'told_truth' },
      { char: 'shiro', text: '……谢谢你。那天晚上，陪着我娘。', if: 'told_truth' },
      { char: 'narrator', text: '他从头上摘下一朵紫色的花，放在玄夜手心里，然后飞快地跑回了你身后。', if: 'told_truth' },
      { char: 'narrator', text: '玄夜低头看着那朵花，很久很久，一动不动。', if: 'told_truth' },
      { char: 'narrator', text: '白露远远地看着玄夜。没有躲，也没有靠近。只是看着。', ifnot: 'told_truth' },
      { char: 'narrator', text: '屋顶上掉下来一个饭团。然后，苍羽自己也落了下来，在缘廊的最边上，坐下了。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……今天，在这里吃。' },
      { char: 'narrator', text: '那是你第一次，看到他们六个人坐在同一张桌子边上。' },
    ],
    next: 'memory_return',
  },

  // =============== DAY 6 ===============
  'day6_talk': {
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '从地底上来以后，琥珀把你叫到了缘廊上。' },
      { char: 'kohaku', text: '明天，就是满月了。' },
      { char: 'kohaku', text: '昨晚那样的事，结界撑不住第二次了。明天夜里，要石需要那枚铃。需要守铃人，念出我们的名字。' },
      { char: 'kohaku', text: '可是，我要先跟你说清楚。' },
      { char: 'kohaku', text: '一旦念了，你就是新的守铃人。以后每一个满月，你都要回到这里。不管你在哪里，在做什么。' },
      { char: 'kohaku', text: '千代把五十年，都给了这座山。结婚那天是满月，她穿着白无垢跑上来摇完铃，又跑下去。' },
      { char: 'kohaku', text: '你母亲出生那晚，她在医院，托她娘替她上的山。' },
      { char: 'narrator', text: '琥珀笑了一下。然后，很认真地看着你。' },
      { char: 'kohaku', text: '我们不能替你决定。千代也不能。' },
      { char: 'kohaku', text: '如果你不愿意，明天满月，结界打开，你就下山。……我说过的，不会怪你。' },
      { char: 'narrator', text: '你想起城里的房间。便利店的晚饭。手机屏幕的光。' },
      { char: 'narrator', text: '想起这六天。花茶，狼嚎，溪水，屋檐上的饭团，地底下的棋盘。' },
      { char: 'player', text: '（外婆。你说要我先认识他们每一个。）' },
      { char: 'player', text: '（我认识了。可是，我还想……再多认识一点。）' },
      { char: 'kohaku', text: '今天，是最后一个完整的白天了。去吧，去见想见的人。' },
    ],
    choices: [
      { text: '「那就……陪我去鸟居下面坐一会儿吧，琥珀。」', affection: { fox: 3 }, next: 'day6_kohaku' },
      { text: '去找银朗，走一遍满月那晚的山路', affection: { wolf: 3 }, next: 'day6_ginro' },
      { text: '白露说，他还有一样东西要给你', affection: { deer: 3 }, next: 'day6_shiro' },
      { text: '雪丸在树上等你，说有话要讲', affection: { whitewolf: 3 }, next: 'day6_yukimaru' },
      { text: '晚上，爬上屋顶，带一个梅子饭团', affection: { hawk: 3 }, next: 'day6_sou' },
      { text: '再下一次石阶，把那盘没下完的棋下完', affection: { snake: 3 }, next: 'day6_genya' },
    ],
  },

  'day6_kohaku': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '黄昏。你和琥珀并排坐在鸟居下面的石阶上。' },
      { char: 'kohaku', text: '上个满月，我就是坐在这里等千代的。从太阳落山，等到太阳出来。' },
      { char: 'kohaku', text: '天亮的时候我跟自己说，下个月吧。下个月她就来了。' },
      { char: 'narrator', text: '她的尾巴绕过来，搭在你们俩中间的石阶上。尾尖轻轻地、一下一下地拍着。' },
      { char: 'kohaku', text: '……我有点怕。' },
      { char: 'player', text: '怕什么？' },
      { char: 'kohaku', text: '怕又开始等一个人类。' },
      { char: 'kohaku', text: '等你从小不点变成大人，从大人变成老人，然后有一天，又不来了。' },
      { char: 'kohaku', text: '千代走了以后，我跟自己说，再也不要了。狐狸的心，没有那么多地方可以放。' },
      { char: 'narrator', text: '她转过头来看你。夕阳把她的眼睛染成了真正的琥珀色。' },
      { char: 'kohaku', text: '所以，答应我一件事。' },
      { char: 'kohaku', text: '不要为了千代，也不要为了我们，去当什么守铃人。' },
      { char: 'kohaku', text: '如果你来——是因为你自己想来。' },
      { char: 'player', text: '……我想来。' },
      { char: 'player', text: '二十年前我就说过了。长大了，要来找你玩。' },
      { char: 'narrator', text: '琥珀愣住了。然后，她笑了。这一次，尾巴也在笑。' },
      { char: 'kohaku', text: '……真是的。你们这一家人，都这么会说话。' },
    ],
    next: 'day7_ceremony',
  },

  'day6_ginro': {
    scene: 'moonlit', particles: 'fireflies',

    lines: [
      { char: 'ginro', text: '满月那晚，结界从鸟居往下开。走这条路。' },
      { char: 'narrator', text: '他带着你，从鸟居一直走到山脚。走得很慢，每一个转弯，每一块会松动的石头，都指给你看。' },
      { char: 'ginro', text: '这块会滑。下雨天踩左边。' },
      { char: 'ginro', text: '这里有蛇。不是那条，是普通的。' },
      { char: 'narrator', text: '走到那棵裂开的老杉树下，他停住了。山脚下的小镇，灯一盏一盏亮起来。' },
      { char: 'ginro', text: '……千代每次都是在这里跟我说「下个月见」。' },
      { char: 'ginro', text: '五十年。六百次。' },
      { char: 'narrator', text: '他看着山下，不看你。' },
      { char: 'ginro', text: '如果你来。' },

  'day6_shiro': {
    scene: 'garden', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '花谷的白樱被烧焦了一半。可是焦黑的树枝上，已经冒出了新芽。' },
      { char: 'shiro', text: '我昨天晚上，一整夜都在跟它说话。它说它还想开花。' },
      { char: 'narrator', text: '白露蹲在树下，双手合拢，像是捧着什么东西。' },
      { char: 'shiro', text: '给你。' },
      { char: 'narrator', text: '他张开手心。里面是一朵很小的花。花瓣是蓝色的，边缘有一圈淡淡的光。' },
      { char: 'shiro', text: '这是我角上开的，第一朵蓝色的花。' },
      { char: 'shiro', text: '千代婆婆的饼干盒子里，有五十多朵花。粉的、白的。一朵蓝的都没有。' },
      { char: 'shiro', text: '因为蓝色……是想念的颜色。以前，我没有想念过谁。' },
      { char: 'narrator', text: '他把花放进你手心，用两只手，把你的手合上。' },
      { char: 'shiro', text: '这朵花不会谢的。只要我还想着你，它就一直开着。' },
      { char: 'shiro', text: '所以——它会一直开着的！' },
      { char: 'shiro', text: '然后等你带我去看海的那天，你就把它扔进海里。我想知道，它在咸咸的水里，还会不会开。' },
      { char: 'narrator', text: '他笑着说。眼睛亮晶晶的。' },
    ],
    next: 'day7_ceremony',
  },

  'day6_yukimaru': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '还是那棵最高的树。雪丸坐在树枝上，这次没有看北边。' },
      { char: 'yukimaru', text: '喂。我决定了。' },
      { char: 'yukimaru', text: '我不回北边了。' },
      { char: 'yukimaru', text: '舅舅说，北坡以后归我巡。他说「你跑得快，适合那边」。' },
      { char: 'narrator', text: '他说「舅舅」的时候，声音有点抖。然后自己先笑了起来。' },
      { char: 'yukimaru', text: '哈哈……叫出来了。叫出来以后，好像也没那么难。' },
      { char: 'yukimaru', text: '你是第一个听我练习的人。你知道吗，这件事，我连白露都没说。' },
      { char: 'narrator', text: '风吹过树顶。他那只缺了口的耳朵，竖得高高的。' },
      { char: 'yukimaru', text: '所以啊，你也要回来。' },
      { char: 'yukimaru', text: '每个满月，我在北坡的最高处等你。我会让你看到——杜鹃森最快的守卫，是什么样子。' },
      { char: 'yukimaru', text: '……还有。' },
      { char: 'yukimaru', text: '我以前到处跑，每离开一个地方，都不会回头。' },
      { char: 'yukimaru', text: '可是你下山那天，我可能会一直看着。一直看到你拐过那棵老杉树为止。' },
      { char: 'yukimaru', text: '你不许笑啊！' },
    ],
    next: 'day7_ceremony',
  },

  'day6_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '夜里，你抱着一个梅子饭团，顺着梯子爬上了屋顶。' },
      { char: 'narrator', text: '苍羽坐在屋脊上。受伤的肩膀缠着绷带。看到你，他往旁边让了让。' },
      { char: 'narrator', text: '你们并排坐着，分着吃了那个饭团。' },
      { char: 'sou', text: '……今天，我没有飞。' },
      { char: 'sou', text: '一整天，都在地上。跟他们一起吃饭。被白露拉去看樱树。被雪丸追着要比赛。' },
      { char: 'sou', text: '很吵。' },
      { char: 'player', text: '讨厌吗？' },
      { char: 'sou', text: '……不讨厌。' },
      { char: 'narrator', text: '他抬起头。天上的月亮，差一点点就圆了。' },
      { char: 'sou', text: '你下山以后，我会去城里看你。' },
      { char: 'sou', text: '不是像看千代那样。我不会只停在窗外的树上。' },
      { char: 'sou', text: '我会……敲窗户。' },
      { char: 'narrator', text: '他说得很认真。认真到你忍不住笑了出来。' },
      { char: 'sou', text: '……有什么好笑的。' },
      { char: 'sou', text: '以后起风的时候，看一眼天上。那是我在看你。' },
      { char: 'sou', text: '满月那天，你上山的时候——我会第一个看见你。' },
    ],
    next: 'day7_ceremony',
  },

  'day6_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '要石的光比前几天弱了很多。琥珀在洞口留了一碗花茶，已经凉了。' },
      { char: 'narrator', text: '玄夜靠在石头旁边，手边摆着那盘下到一半的棋。' },
      { char: 'genya', text: '来了？坐。轮到你了。' },
      { char: 'narrator', text: '你们安静地下着棋。黑子，白子。石壁上的苔藓，一明一暗。' },
      { char: 'genya', text: '白露那孩子，今天给我送了一朵花。', if: 'told_truth' },
      { char: 'genya', text: '我把它放在棋盘边上了。你看，还开着。', if: 'told_truth' },
      { char: 'player', text: '玄夜，你怕吗？明天。' },
      { char: 'genya', text: '怕什么？怕死？' },
      { char: 'genya', text: '……蛇活得太久了。死没什么好怕的。' },
      { char: 'narrator', text: '他落下一枚黑子。' },
      { char: 'genya', text: '我怕的是被忘掉。' },
      { char: 'genya', text: '千代记得我。每个满月，她念到我的名字的时候，都会停一下，笑一下。好像在说「又输给你了」。' },
      { char: 'genya', text: '她走了以后，我躺在这块石头旁边，一遍一遍地想——这世上，还有谁会停下来，念我的名字。' },
      { char: 'narrator', text: '他抬起头，看着你。紫色的眼睛，在昏暗里亮着。' },
      { char: 'genya', text: '……你呢？' },
      { char: 'player', text: '玄夜。' },
      { char: 'narrator', text: '你念了他的名字。没有铃，没有满月。只是念了一声。' },
      { char: 'narrator', text: '他怔住了。然后，很慢很慢地，笑了。不是那种危险的、看不透的笑。' },
      { char: 'genya', text: '……这盘，算你赢。' },
    ],
    next: 'day7_ceremony',
  },

  // =============== DAY 7 ===============
  'day7_ceremony': {
    scene: 'cave', particles: 'spirits', day: 7,
    chapter: { num: '终章', title: '满月' },
    lines: [
      { char: 'narrator', text: '第七天。满月。' },
      { char: 'narrator', text: '入夜以后，所有人都来到了地底的洞窟。要石的光，微弱得像快要熄灭的炭火。' },
      { char: 'narrator', text: '玄夜靠在石头旁边，灰色的鳞片已经爬上了他的半边脸。他还在笑，还在说「没事」。' },
      { char: 'narrator', text: '你想起他说过的话。——满月之前，别相信任何一个说「没事」的人。' },
      { char: 'narrator', text: '你站在要石前面。身后，是六个人。' },
      { char: 'narrator', text: '你从怀里拿出那封用蜡封住的信。「满月之夜，在要石前打开。」' },
      { char: 'narrator', text: '你拆开了它。' },
      { char: 'narrator', text: '「小不点：外婆说过，不许偷看。你没有偷看吧？外婆会知道的。」' },
      { char: 'narrator', text: '「如果你读到这里，说明你站在了那块石头前面。那么，替外婆跟大家说几句话吧。」' },
      { char: 'narrator', text: '「琥珀：谢谢你五十年来的每一碗茶。以后不要再一个人在鸟居下面等了。你等的人，会自己走上来的。」' },
      { char: 'narrator', text: '「银朗：伞的事，谢谢。以后换你打伞吧。还有——你每次送我下山，都在念叨那只躲在树上的小白狼的名字，外婆都听见了哦。」' },
      { char: 'narrator', text: '「雪丸：你是叫雪丸吧？每次我来，你都躲在树上偷看。外婆看见你了。下次，下来吃饭吧。」' },
      { char: 'narrator', text: '「白露：海的约定，交给小不点了。你们两个，一起去。」' },
      { char: 'narrator', text: '「苍羽：外婆知道你不喜欢梅子。可你每次都吃完，外婆好开心。以后，换你请大家吃饭吧。」' },
      { char: 'narrator', text: '「玄夜：外婆其实一盘都没有输过你，是你一直在让。这个秘密，外婆知道。——还有，别再逞强了。」' },
      { char: 'narrator', text: '洞窟里，谁都没有出声。只有很轻很轻的，吸鼻子的声音。' },
      { char: 'narrator', text: '「最后。外婆还有一个名字，一直没能念出来。」' },
      { char: 'narrator', text: '「我娘走的时候说，竹林里有一只狸猫，叫阿灯。要是它还在，替我念一念。」' },
      { char: 'narrator', text: '「外婆找了五十年，没有找到。可是你六岁那年，哭着说林子里有一个叮叮当当的黑影子，好孤单。」' },
      { char: 'narrator', text: '「小不点。如果你想起来了——就替我们，念一念它吧。」' },
      { char: 'narrator', text: '「念完以后，这枚铃留不留，你自己决定。留下，外婆很高兴。下山，外婆也很高兴。」' },
      { char: 'narrator', text: '「你只要记得：你是被很多很多人喜欢着的孩子。——外婆」', flag: 'a_letter' },
      { char: 'narrator', text: '你把信折好，放回怀里。深吸一口气。摇响了铃。' },
      { char: 'narrator', text: '叮——' },
      { char: 'narrator', text: '铃声在洞窟里回荡，越来越响，像是有很多很多只铃，在同时回应。' },
      { char: 'player', text: '琥珀。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '……在。' },
      { char: 'player', text: '银朗。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '在。' },
      { char: 'player', text: '白露。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '在、在这里！' },
      { char: 'player', text: '雪丸。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '……在！' },
      { char: 'narrator', text: '雪丸的声音在发抖。他一直以为，这里不会有他的名字。' },
      { char: 'player', text: '苍羽。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'sou', text: '……在。' },
      { char: 'player', text: '玄夜。',
        chars: [{ id: 'sou', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'genya', text: '……在。一直都在。' },
      { char: 'narrator', text: '要石亮了一点。可是还不够。光在石头深处挣扎，像是还在等什么。',
        chars: [] },
      { char: 'narrator', text: '你握紧了那根红绳。那个裂开的小铃铛，被你的手捂得温温的。' },
      { char: 'player', text: '……阿灯。' },
      { char: 'narrator', text: '洞窟里安静了。' },
      { char: 'player', text: '叮当。' },
      { char: 'player', text: '对不起，让你一个人找了那么久。' },
      { char: 'narrator', text: '很远很远的地方，从洞窟最深处的黑暗里，传来一声。' },
      { char: 'narrator', text: '叮。' },
      { char: 'narrator', text: '然后，一个小小的、圆滚滚的影子，从黑暗里慢慢走了出来。' },
      { char: 'narrator', text: '那是一只狸猫。毛是褐色的，肚子是圆的，眼睛是亮的。一点都不黑了。' },
      { char: 'narrator', text: '它走到你脚边，抬头看着你。看了很久。' },
      { char: 'narrator', text: '然后，它低下头，用脑袋蹭了蹭你手里的红绳。' },
      { char: 'narrator', text: '要石亮了。' },
      { char: 'narrator', text: '紫色的光从石头深处涌出来，顺着地面，顺着石壁，顺着每一条老树的根，向整片森林流去。' },
      { char: 'narrator', text: '你知道——北坡的焦土上，正在长出新草。白樱的枯枝上，正在开花。鸟居柱脚的黑斑，正在一点一点褪去。' },
      { char: 'narrator', text: '玄夜脸上的灰色鳞片，像旧皮一样一片一片剥落下来。底下，是新的、泛着紫光的黑。' },
      { char: 'narrator', text: '琥珀身后，第九条尾巴，轻轻地展开了。她自己都没发现，还在擦眼泪。' },
      { char: 'narrator', text: '狸猫阿灯打了个哈欠，一溜烟跑上了石阶。' },
      { char: 'narrator', text: '过了一会儿，上面传来琥珀的尖叫——「供台上的饭团！！」' },
      { char: 'narrator', text: '洞窟里，所有人都笑了。连玄夜都笑出了声，笑到咳嗽。' },
      { char: 'narrator', text: '铃声停下来的时候，你手里的铜铃，轻轻地、温暖地，跳了一下。' },
      { char: 'narrator', text: '像是有谁，在很远很远的地方，笑着说：「做得好，小不点。」' },
      { char: 'narrator', text: '走出洞窟时，满月已经升到了天顶。鸟居下方，结界像一道银色的帘子，向山下缓缓打开。' },
      { char: 'narrator', text: '该下山了。七天的丧假，明天就结束了。' },
      { char: 'narrator', text: '你回过头。' },
    ],
    next_by_affection_ending: true,
  },

const music = { on: true, cur: null, el: null, unlocked: false };
try { music.on = localStorage.getItem('dujuansen-music') !== 'off'; } catch (e) {}

function fadeTo(el, target, ms, done) {
  const token = el._fade = {}; // a newer fade on the same element cancels this one
  const start = el.volume, t0 = performance.now();
  (function step(t) {
    if (el._fade !== token) return;
    const k = Math.min(1, Math.max(0, (t - t0) / ms));
    el.volume = Math.min(1, Math.max(0, start + (target - start) * k));
    if (k < 1) requestAnimationFrame(step); else if (done) done();
  })(t0);
}

function playBgm(track) {
  const src = BGM[track] || BGM.title;
  if (music.el && music.el.dataset.src === src) return;
  const old = music.el;
  if (old) fadeTo(old, 0, 1200, () => { old.pause(); old.src = ''; });
  music.el = null; music.cur = track;
  if (!src) return;
  const el = new Audio(src);
  el.dataset.src = src; el.loop = true; el.volume = 0;
  music.el = el;
  if (music.on) el.play().then(() => fadeTo(el, 0.55, 1500)).catch(() => {});
}

const bellSrc = 'assets/sfx-bell.wav';
new Audio(bellSrc).preload = 'auto';
function playBell() {
  if (!music.on) return;
  const el = new Audio(bellSrc);
  el.volume = 0.8;
  el.play().catch(() => {});
}

function setMusicOn(on) {
  music.on = on;
  try { localStorage.setItem('dujuansen-music', on ? 'on' : 'off'); } catch (e) {}
  $('#music-btn').classList.toggle('off', !on);
  if (!music.el) return;
  if (on) music.el.play().then(() => fadeTo(music.el, 0.55, 800)).catch(() => {});
  else fadeTo(music.el, 0, 400, () => music.el && music.el.pause());
}

$('#music-btn').addEventListener('click', e => { e.stopPropagation(); setMusicOn(!music.on); });
$('#music-btn').classList.toggle('off', !music.on);
// Browsers block audio until the first tap; start the current track then.
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  if (music.unlocked) return; music.unlocked = true;
  if (music.on && music.el && music.el.paused) music.el.play().then(() => fadeTo(music.el, 0.55, 1500)).catch(() => {});
}, { once: false }));

function initTitle() {
  const c = $('#title-particles');
  for (let i = 0; i < 20; i++) {
    const f = document.createElement('div');
    f.className = 'title-firefly';
    f.style.left = Math.random() * 100 + '%';
    f.style.top = Math.random() * 100 + '%';
    f.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--dy', (Math.random() * 60 - 30) + 'px');
    f.style.animationDuration = (6 + Math.random() * 8) + 's';
    f.style.animationDelay = Math.random() * 6 + 's';
    c.appendChild(f);
  }
  $('#start-btn').addEventListener('click', () => {
    const go = () => {
      resetGame();
      const gen = state.gen;
      hideTitle(() => { if (gen === state.gen) playNode('start'); });
    };
    if (hasAnySave()) confirmBox('开始新的物语？\n已有的存档不会被删除。', go); else go();
  });
  $('#continue-btn').addEventListener('click', () => {
    const latest = latestSave();
    if (latest) applySave(latest);
  });
  $('#title-load-btn').addEventListener('click', () => openSlots('load'));
  refreshTitleButtons();
  playBgm('title');
}

function hideTitle(cb) {
  const t = $('#title-screen');
  t.classList.add('hidden');
  const gen = state.gen;
  setTimeout(() => { if (gen === state.gen) t.style.display = 'none'; if (cb) cb(); }, 1500);
}

function playNode(id) {
  const node = S[id];
  if (!node) return;
  const gen = ++state.gen;
  state.currentNode = id;
  state.line = 0;
  if (node.day) { state.day = node.day; updateDay(); }
  if (node.scene) { state.scene = node.scene; setScene(node.scene); }
  if ('particles' in node) { state.particles = node.particles; setParticles(node.particles); }
  state.chars = (node.chars || []).map(c => ({ ...c }));
  if (node.chars) setChars(node.chars); else clearChars();
  if (node.transform_immediate) showTransform(node.transform_immediate.char, node.transform_immediate.text);
  if (node.chapter) state.chapter = node.chapter;
  (node.flags || []).forEach(setFlag);
  playBgm(bgmFor(id));
  setFlashback(!!node.flashback);
  autoSave();

  if (node.chapter) {
    showChapter(node.chapter.num, node.chapter.title, () => { if (gen === state.gen) startLines(node, 0); });
  } else {
    startLines(node, 0);
  }
}

function startLines(node, i) {
  state.line = i;
  if (!node.lines || i >= node.lines.length) { afterLines(node); return; }
  const line = node.lines[i];
  if ((line.if && !state.flags[line.if]) || (line.ifnot && state.flags[line.ifnot])) { startLines(node, i + 1); return; }
  if (line.chars) { state.chars = line.chars.map(c => ({ ...c })); setChars(state.chars); }
  if (line.transform) showTransform(line.transform.char, line.transform.text);
  if (line.flag) setFlag(line.flag);
  if (line.text.startsWith('叮')) playBell();
  showDialogue(line, () => startLines(node, i + 1));
}

function setFlashback(on) { $('#game').classList.toggle('flashback', on); }

function setFlag(f) {
  if (state.flags[f]) return;
  state.flags[f] = true;
  const m = MYSTERIES.find(x => x.q === f || x.a === f);
  if (m) toast(m.a === f ? '记事本：谜团解开了' : '记事本：新的谜团');
}

function markSpeaker(id) {
  const sprites = [...$$('.character-sprite')];
  const me = sprites.find(s => s.dataset.id === id);
  if (!me) return;
  sprites.forEach(s => {
    const role = s === me ? 'speaking' : 'listening';
    s.classList.toggle('speaking', s === me);
    s.classList.toggle('listening', s !== me);
    const img = s.querySelector('img');
    if (img && sprites.length > 1) img.style.cssText = portraitStyle(CHARS[s.dataset.id][s.dataset.form], s.dataset.pos, role);
  });
}

function afterLines(node) {
  if (node.choices) showChoices(node.choices);
  else if (node.next_by_affection) routeByAff();
  else if (node.next_by_affection_ending) routeToEnding();
  else if (node.ending) showEnding(node.ending);
  else if (node.next) playNode(node.next);
}

function showDialogue(line, cb) {
  const ch = CHARS[line.char];
  const nameEl = $('#speaker-name');
  const textEl = $('#dialogue-text');
  const ind = $('#text-indicator');

  nameEl.textContent = ch.name;
  nameEl.style.color = ch.color;
  if (ch.affKey) state.flags['met_' + line.char] = true;
  markSpeaker(line.char);
  textEl.innerHTML = '';
  ind.classList.remove('show');
  state.textComplete = false;
  state.charTimers.forEach(t => clearTimeout(t));
  state.charTimers = [];

  const chars = line.text.split('');
  const spans = chars.map(c => {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = c;
    textEl.appendChild(s);
    return s;
  });

  let r = 0;
  const speed = 38;
  function reveal() {
    if (r < spans.length) { spans[r].classList.add('visible'); r++; state.charTimers.push(setTimeout(reveal, speed)); }
    else { state.textComplete = true; ind.classList.add('show'); }
  }
  reveal();

  detachDialogue();
  function advance(e) {
    e.preventDefault(); e.stopPropagation();
    if (!state.textComplete) {
      state.charTimers.forEach(t => clearTimeout(t)); state.charTimers = [];
      spans.forEach(s => s.classList.add('visible'));
      state.textComplete = true; ind.classList.add('show');
    } else {
      detachDialogue();
      cb();
    }
  }
  function keyAdv(e) { if (overlayOpen()) return; if (e.key === ' ' || e.key === 'Enter') advance(e); }
  state.dlg = { advance, keyAdv };
  $('#dialogue-box').addEventListener('click', advance);
  document.addEventListener('keydown', keyAdv);
}

function detachDialogue() {
  if (!state.dlg) return;
  $('#dialogue-box').removeEventListener('click', state.dlg.advance);
  document.removeEventListener('keydown', state.dlg.keyAdv);
  state.dlg = null;
}

function showChoices(choices) {
  const layer = $('#choice-layer');
  const c = $('#choice-container');
  c.innerHTML = '';
  choices.filter(ch => !(ch.if && !state.flags[ch.if]) && !(ch.ifnot && state.flags[ch.ifnot])).forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice-btn'; b.textContent = ch.text;
    b.addEventListener('click', () => {
      layer.classList.remove('active');
      if (ch.affection) for (const [k, v] of Object.entries(ch.affection)) addAff(k, v);
      if (ch.flag) state.flags[ch.flag] = true;
      playNode(ch.next);
    });
    c.appendChild(b);
  });
  layer.classList.add('active');
}

// Most points each character can earn on one playthrough; scales every route so a devoted run ends near 95.
const AFF_MAX = { fox: 25, wolf: 25, deer: 18, whitewolf: 25, hawk: 17, snake: 17 };

function addAff(who, amt) {
  state.affection[who] = Math.min(100, state.affection[who] + amt * 95 / AFF_MAX[who]);
  showAffChange(who, amt);
}

function showAffChange(who, amt) {
  const colors = { fox:'#ff6b4a', wolf:'#7eb8da', deer:'#8fd4a0', whitewolf:'#e8e0d0', hawk:'#4a7eb8', snake:'#9a5abf' };
  const names = { fox:'琥珀', wolf:'银朗', deer:'白露', whitewolf:'雪丸', hawk:'苍羽', snake:'玄夜' };
  const el = document.createElement('div');
  el.className = 'aff-change';
  el.textContent = `${names[who]} +${amt}`;
  el.style.color = colors[who];
  el.style.top = '50%'; el.style.left = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function getMaxAff() {
  const a = state.affection;
  const entries = Object.entries(a);
  entries.sort((x, y) => y[1] - x[1]);
  return entries[0][0];
}

function routeByAff() {
  const map = { fox:'rescue_fox', wolf:'rescue_wolf', deer:'rescue_deer', whitewolf:'rescue_whitewolf', hawk:'rescue_hawk', snake:'rescue_snake' };
  playNode(map[getMaxAff()]);
}

function routeToEnding() {
  const map = { fox:'ending_fox', wolf:'ending_wolf', deer:'ending_deer', whitewolf:'ending_whitewolf', hawk:'ending_hawk', snake:'ending_snake' };
  playNode(map[getMaxAff()]);
}

function setScene(name) {
  const bg = $('#scene-bg');
  const l = document.createElement('div');
  const img = BACKGROUNDS[name];
  l.className = img ? 'scene-layer scene-img' : `scene-layer bg-${name}`;
  if (img) l.style.backgroundImage = `url("${img}")`;
  l.style.opacity = '0';
  bg.appendChild(l);
  requestAnimationFrame(() => requestAnimationFrame(() => { l.style.opacity = '1'; }));
  const old = [...bg.children].filter(c => c !== l);
  setTimeout(() => old.forEach(c => c.remove()), 900);
}

function setParticles(type) {
  const c = $('#particles'); c.innerHTML = '';
  if (state.particleInterval) clearInterval(state.particleInterval);
  const cfg = { fireflies:{cls:'firefly',n:12,iv:3000}, sakura:{cls:'sakura-petal',n:10,iv:2000}, spirits:{cls:'spirit-orb',n:8,iv:4000}, snowflakes:{cls:'snowflake',n:15,iv:1500}, feathers:{cls:'feather',n:6,iv:4000} };
  const cf = cfg[type]; if (!cf) return;
  function spawn() {
    const p = document.createElement('div');
    p.className = `particle ${cf.cls}`;
    p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*80+'%';
    p.style.animationDuration = (5+Math.random()*8)+'s';
    p.style.animationDelay = Math.random()*2+'s';
    c.appendChild(p);
    setTimeout(() => p.remove(), 15000);
  }
  for (let i=0;i<cf.n;i++) setTimeout(spawn, Math.random()*3000);
  state.particleInterval = setInterval(spawn, cf.iv);
}

// Keeps characters already on screen in place (sliding them if their slot changes)
// so a line-level cast change doesn't make everyone flash back in.
function setChars(chars) {
  const l = $('#character-layer');
  const want = new Map(chars.map(c => [c.id, c]));
  [...l.children].forEach(el => {
    const c = want.get(el.dataset.id);
    if (!c || el.dataset.form !== c.form) { el.remove(); return; }
    if (el.dataset.pos !== c.pos) {
      el.dataset.pos = c.pos;
      const img = el.querySelector('img');
      if (img) img.style.cssText = portraitStyle(CHARS[c.id][c.form], c.pos);
    }
  });
  chars.forEach(c => {
    if (l.querySelector(`[data-id="${c.id}"]`)) return;
    const w = document.createElement('div');
    w.className = 'character-sprite entering';
    w.id = `char-${c.id}`;
    Object.assign(w.dataset, { id: c.id, pos: c.pos, form: c.form });
    w.innerHTML = getPortrait(c.id, CHARS[c.id][c.form], c.pos);
    l.appendChild(w);
    requestAnimationFrame(() => requestAnimationFrame(() => { w.classList.remove('entering'); w.classList.add('visible'); }));
  });
  if (chars.length < 2) l.querySelectorAll('.character-sprite').forEach(s => s.classList.remove('listening'));
}

function clearChars() { $('#character-layer').innerHTML = ''; }

function showTransform(charId, text) {
  const o = $('#transform-overlay');
  $('#transform-text').textContent = text;
  o.classList.add('active');
  const sc = state.chars.find(c => c.id === charId);
  if (sc) sc.form = 'beast';
  const charEl = $(`#char-${charId}`);
  if (charEl) {
    charEl.classList.add('beast-transform');
    charEl.dataset.form = 'beast';
    setTimeout(() => {
      charEl.innerHTML = getPortrait(charId, CHARS[charId].beast, charEl.dataset.pos);
      charEl.classList.remove('beast-transform');
    }, 1200);
  }
  setTimeout(() => o.classList.remove('active'), 2600);
}

function showChapter(num, title, cb) {

function showEnding(e) {

function updateDay() {

  d.textContent = state.day > 0 ? `第 ${state.day} 天 / 7` : '';
  d.classList.toggle('show', state.day > 0);
}

// ============================================================
//  SAVE / LOAD
// ============================================================
const SAVE_KEY = 'dujuansen-saves-v1';
const STORY_VERSION = 3; // bump when node ids or line order change, so old saves can't resume mid-scene in the wrong place
const MANUAL_SLOTS = ['1','2','3','4','5','6','7','8'];
const storageOK = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; }
})();
let memSaves = {};

function readSaves() {
  if (!storageOK) return memSaves;
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function writeSaves(all) {
  memSaves = all;
  if (!storageOK) return true;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(all)); return true; } catch (e) { return false; }
}
function hasAnySave() { return !!latestSave(); }
function latestSave() {
  return Object.values(readSaves()).filter(d => d.sv === STORY_VERSION).sort((a, b) => b.time - a.time)[0] || null;
}

function snapshot() {
  const node = S[state.currentNode];
  const lines = node.lines || [];
  const atChoice = state.line >= lines.length && !!node.choices;
  const ln = lines[Math.min(state.line, lines.length - 1)];
  return {
    v: 1, sv: STORY_VERSION, time: Date.now(),
    node: state.currentNode, line: state.line,
    aff: { ...state.affection }, flags: { ...state.flags }, day: state.day,
    scene: state.scene, particles: state.particles,
    chars: state.chars.map(c => ({ ...c })), chapter: state.chapter,
    preview: ln ? { char: ln.char, text: ln.text, atChoice } : null,
  };
}

function autoSave() {
  const node = S[state.currentNode];
  if (!node || node.ending) return;
  const all = readSaves();
  all.auto = snapshot();
  writeSaves(all);
}

function saveToSlot(slot) {
  const all = readSaves();
  all[slot] = snapshot();
  if (writeSaves(all)) toast(`已保存到 存档 ${slot}`);
  else toast('保存失败：浏览器存储空间不可用');
  renderSlots('save');
}

function deleteSlot(slot, mode) {
  const all = readSaves();
  delete all[slot];
  writeSaves(all);
  renderSlots(mode);
  refreshTitleButtons();
}

function inGame() {
  return state.currentNode && $('#title-screen').style.display === 'none';
}

function applySave(d) {
  if (!d || d.sv !== STORY_VERSION || !S[d.node]) { toast('这是旧版剧情的存档，无法读取'); return; }
  closeSys();
  resetGame();
  const t = $('#title-screen');
  if (t.style.display !== 'none') { t.classList.add('hidden'); t.style.display = 'none'; }

  state.affection = { fox: 0, wolf: 0, deer: 0, whitewolf: 0, hawk: 0, snake: 0, ...d.aff };
  state.flags = { ...d.flags };
  state.day = d.day || 0;
  state.scene = d.scene; state.particles = d.particles;
  state.chars = (d.chars || []).map(c => ({ ...c }));
  state.chapter = d.chapter || null;
  state.currentNode = d.node;

  updateDay();
  if (state.scene) setScene(state.scene);
  setParticles(state.particles);
  setChars(state.chars);
  setFlashback(!!S[d.node].flashback);
  playBgm(bgmFor(d.node));

  const node = S[d.node], lines = node.lines || [], i = d.line || 0;
  if (i >= lines.length && lines.length) {
    const last = lines[lines.length - 1], ch = CHARS[last.char];
    $('#speaker-name').textContent = ch.name; $('#speaker-name').style.color = ch.color;
    $('#dialogue-text').innerHTML = '';
    last.text.split('').forEach(c => { const s = document.createElement('span'); s.className = 'char visible'; s.textContent = c; $('#dialogue-text').appendChild(s); });
  }
  startLines(node, i);
}

function resetGame() {
  state.gen++;
  detachDialogue();
  state.charTimers.forEach(t => clearTimeout(t)); state.charTimers = [];
  state.affection = { fox: 0, wolf: 0, deer: 0, whitewolf: 0, hawk: 0, snake: 0 };
  state.flags = {}; state.currentNode = null; state.day = 0; state.line = 0;
  state.scene = null; state.particles = null; state.chars = []; state.chapter = null;
  updateDay();
  setParticles(null); clearChars();
  $('#scene-bg').innerHTML = '';
  $('#speaker-name').textContent = ''; $('#dialogue-text').innerHTML = '';
  $('#text-indicator').classList.remove('show');
  ['#chapter-overlay', '#choice-layer', '#ending-screen', '#transform-overlay'].forEach(s => $(s).classList.remove('active'));
  $('#dialogue-layer').style.display = '';
  setFlashback(false);
}

function backToTitle() {
  closeSys();
  resetGame();
  const t = $('#title-screen');
  t.style.display = '';
  t.classList.remove('hidden');
  refreshTitleButtons();
  playBgm('title');
}

function refreshTitleButtons() {
  const any = hasAnySave();
  $('#continue-btn').hidden = !any;
  $('#title-load-btn').hidden = !any;
}

// ---- UI ----
function overlayOpen() {
  return $('#sys-layer').classList.contains('active') || $('#confirm-layer').classList.contains('active');
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'save-toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2100);
}

function confirmBox(text, onYes) {
  $('#confirm-text').textContent = text;
  const layer = $('#confirm-layer');
  layer.classList.add('active');
  const close = () => { layer.classList.remove('active'); $('#confirm-yes').onclick = null; $('#confirm-no').onclick = null; };
  $('#confirm-yes').onclick = () => { close(); onYes(); };
  $('#confirm-no').onclick = close;
}

function closeSys() { $('#sys-layer').classList.remove('active'); }

function openMenu() {
  const card = $('#sys-card');
  card.innerHTML = `
    <div class="sys-head"><div class="sys-title">菜 单</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    <div class="menu-list">
      <button class="menu-item" data-act="bonds">羁绊<small>查看你和大家的关系</small></button>
      <button class="menu-item" data-act="notes">记事<small>这座山里，还没有解开的事</small></button>
      <button class="menu-item" data-act="save">保存进度<small>存到 8 个存档栏中的任意一个</small></button>
      <button class="menu-item" data-act="load">读取进度<small>回到之前保存的某一刻</small></button>
      <button class="menu-item" data-act="title">回到标题<small>自动存档会记住当前场景的开头</small></button>
      <button class="menu-item" data-act="close">继续游戏</button>
    </div>`;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') closeSys();
    else if (act === 'bonds') openBonds();
    else if (act === 'notes') openNotes();
    else if (act === 'save') openSlots('save');
    else if (act === 'load') openSlots('load');
    else if (act === 'title') confirmBox('回到标题画面？', backToTitle);
  };
  $('#sys-layer').classList.add('active');
}

const MYSTERIES = [
  { q: 'q_letter', a: 'a_letter', title: '外婆的第二封信', hint: '封蜡上写着：「满月之夜，在要石前打开。」', answer: '信里是外婆留给每个人的话，和她一直没能念出的最后一个名字——阿灯。' },
  { q: 'q_keeper', a: 'a_keeper', title: '守铃人要做什么？', hint: '每次问起，琥珀的耳朵都会往后压。', answer: '满月夜在要石前摇铃，念出每一个兽灵的名字。被人类记住，他们才能留在这一边。' },
  { q: 'q_memory', a: 'a_memory', title: '被遗忘的童年', hint: '琥珀说，你小时候来过这里。可你什么都不记得。', answer: '六岁的满月夜，你遇见了蛇先生和孤单的「叮当」，给每个人都起了名字。是琥珀封住了那一夜。' },
  { q: 'q_door', a: 'a_door', title: '正殿深处的窄门', hint: '琥珀求你不要去。门缝里透出一丝凉气。', answer: '门后是通往地底的石阶。要石，和一个人下棋的玄夜，都在下面。' },
  { q: 'q_voice', a: 'a_voice', title: '「……是你。」', hint: '银朗第一次见到你时，低声说的话。', answer: '二十年前，是他在蕨草坡找到了哭着的你。狼不会忘记气味。' },
  { q: 'q_eyes', a: 'a_eyes', title: '门缝外的紫色眼睛', hint: '「……长这么大了啊。」那个声音，你好像在梦里听过。', answer: '是玄夜。他一直记得六岁的你。' },
  { q: 'q_rot', a: 'a_rot', title: '玄夜在对那些树做什么？', hint: '每一个烂掉的结界旁边，都有蛇爬过的痕迹。', answer: '他在把漏出来的黑色吃进自己的身体里，一个人按住要石，撑了二十六天。' },
  { q: 'q_sou', a: 'a_sou', title: '苍羽的秘密', hint: '他有一件事，一直没敢告诉琥珀。', answer: '外婆住院的二十五天里，他每天都守在病房窗外的树上。' },
  { q: 'q_mother', a: 'a_mother', title: '白露的娘', hint: '六十年前，一条黑蛇缠住了她。天亮的时候，她死了。', answer: '玄夜是在用身体替她挡风，陪她走完了最后一夜。她一直在叫白露的名字。' },
  { q: 'q_cord', a: 'a_cord', title: '堕兽脖子上的红铃绳', hint: '那个黑色的东西最后回头看你，眼神像是迷了路。', answer: '堕兽是被所有人遗忘的兽灵。它曾经是一只叫阿灯的狸猫。' },
];

const BOND_STAGES = [[80, '倾心'], [60, '心动'], [40, '亲近'], [20, '相识'], [0, '初识']];

function openBonds() {
  const rows = Object.entries(CHARS).filter(([, c]) => c.affKey).map(([id, c]) => {
    if (!state.flags['met_' + id]) {
      return `<div class="bond unknown"><div class="slot-thumb">？</div>
        <div class="bond-body"><div class="bond-top"><span class="bond-name">？？？</span></div><div class="bond-desc">尚未相遇</div></div></div>`;
    }
    const v = Math.round(state.affection[c.affKey] || 0);
    const stage = BOND_STAGES.find(([min]) => v >= min)[1];
    return `<div class="bond"><div class="slot-thumb">${slotThumb({ chars: [{ id, form: 'human' }] })}</div>
      <div class="bond-body">
        <div class="bond-top"><span class="bond-name" style="color:${c.color}">${c.name}</span><span class="bond-stage">${stage}</span></div>
        <div class="bond-desc">${c.desc}</div>
        <div class="bond-meter"><div class="bond-fill" style="width:${v}%;background:${c.color}"></div></div>
      </div></div>`;
  }).join('');
  const card = $('#sys-card');
  card.innerHTML = `
    <div class="sys-head"><button class="sys-close" data-act="back" aria-label="返回">‹</button><div class="sys-title">羁 绊</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    <div class="bond-list">${rows}</div>`;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') closeSys(); else if (act === 'back') openMenu();
  };
  $('#sys-layer').classList.add('active');
}

function openNotes() {
  const found = MYSTERIES.filter(m => state.flags[m.q]);
  const rows = found.length ? found.map(m => {
    const done = state.flags[m.a];
    return `<div class="note${done ? ' solved' : ''}">
      <div class="note-q">${done ? '✓ ' : '？ '}${m.title}</div>
      <div class="note-a">${done ? m.answer : m.hint}</div></div>`;
  }).join('') : '<div class="slot-note" style="padding:20px 4px">还没有发现什么。……暂时。</div>';
  const card = $('#sys-card');
  card.innerHTML = `
    <div class="sys-head"><button class="sys-close" data-act="back" aria-label="返回">‹</button><div class="sys-title">记 事</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    <div class="bond-list">${rows}</div>`;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') closeSys(); else if (act === 'back') openMenu();
  };
  $('#sys-layer').classList.add('active');
}

function openSlots(mode) {
  renderSlots(mode);
  $('#sys-layer').classList.add('active');
}

function fmtTime(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function slotThumb(d) {
  const c = (d.chars || [])[0];
  if (c && CHARS[c.id]) {
    const key = CHARS[c.id][c.form] || CHARS[c.id].human;
    const { ex = 50, ey = 12, h = 100 } = PORTRAIT_POS[key] || {};
    const H = h * 2.6; // as if the thumbnail were a crop of a 260px-tall screen around the eyes
    if (PORTRAITS[key]) return `<img src="${PORTRAITS[key]}" alt="" style="position:absolute;width:auto;height:${H}px;top:${28 - ey / 100 * H}px;left:50%;transform:translateX(-${ex}%)">`;
    return CHARS[c.id].icon;
  }
  return '⛩️';
}

function slotHTML(slot, d, mode) {
  const label = slot === 'auto' ? '自动存档' : `存档 ${slot}`;
  if (!d) {
    return `<button class="slot${mode === 'load' ? ' disabled' : ''}" data-slot="${slot}">
      <div class="slot-thumb" style="opacity:.35">＋</div>
      <div class="slot-body"><div class="slot-name">${label}</div><div class="slot-empty">— 空 —</div></div></button>`;
  }
  if (d.sv !== STORY_VERSION) {
    return `<button class="slot disabled" data-slot="${slot}" data-old="1">
      <div class="slot-thumb" style="opacity:.35">⛩️</div>
      <div class="slot-body"><div class="slot-top"><span class="slot-name">${label}</span><span class="slot-time">${fmtTime(d.time)}</span></div>
      <div class="slot-line">旧版剧情的存档，已无法读取</div></div>${slot !== 'auto' ? `<span class="slot-del" data-del="${slot}" role="button" aria-label="删除">×</span>` : ''}</button>`;
  }
  const chap = d.chapter ? `${d.chapter.num} · ${d.chapter.title}` : '';
  const who = d.preview ? (CHARS[d.preview.char]?.name || '') : '';
  const line = d.preview ? (d.preview.atChoice ? '（正在做出选择）' : `${who ? who + '：' : ''}${d.preview.text}`) : '';
  const del = slot !== 'auto' ? `<span class="slot-del" data-del="${slot}" role="button" aria-label="删除">×</span>` : '';
  return `<button class="slot" data-slot="${slot}">
    <div class="slot-thumb">${slotThumb(d)}</div>
    <div class="slot-body">
      <div class="slot-top"><span class="slot-name">${label}</span><span class="slot-time">${fmtTime(d.time)}</span></div>
      <div class="slot-chap">${escapeHTML(chap)}</div>
      <div class="slot-line">${escapeHTML(line)}</div>
    </div>${del}</button>`;
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function renderSlots(mode) {
  const all = readSaves();
  const card = $('#sys-card');
  const slots = mode === 'load' ? ['auto', ...MANUAL_SLOTS] : MANUAL_SLOTS;
  const back = inGame() ? `<button class="sys-close" data-act="back" aria-label="返回">‹</button>` : '<span></span>';
  const note = storageOK ? '' : '<div class="slot-note">当前浏览器不允许保存数据，存档只在这次打开期间有效，关掉页面就会消失。</div>';
  card.innerHTML = `
    <div class="sys-head">${back}<div class="sys-title">${mode === 'save' ? '保存进度' : '读取进度'}</div><button class="sys-close" data-act="close" aria-label="关闭">×</button></div>
    ${note}
    <div class="slot-list">${slots.map(s => slotHTML(s, all[s], mode)).join('')}</div>`;
  card.onclick = e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') return closeSys();
    if (act === 'back') return openMenu();
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      e.stopPropagation();
      const s = delBtn.dataset.del;
      return confirmBox(`删除 存档 ${s}？\n删除后无法恢复。`, () => deleteSlot(s, mode));
    }
    const slotEl = e.target.closest('[data-slot]');
    if (!slotEl) return;
    const s = slotEl.dataset.slot, d = readSaves()[s];
    if (mode === 'save') {
      if (d) confirmBox(`覆盖 存档 ${s}？\n原来的进度会被替换。`, () => saveToSlot(s));
      else saveToSlot(s);
    } else if (d && d.sv === STORY_VERSION) {
      if (inGame()) confirmBox('读取这份存档？\n当前没有手动保存的进度会丢失。', () => applySave(d));
      else applySave(d);
    }
  };
}

$('#menu-btn').addEventListener('click', e => { e.stopPropagation(); openMenu(); });
$('#sys-layer').addEventListener('click', e => { if (e.target.id === 'sys-layer') closeSys(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#confirm-layer').classList.contains('active')) $('#confirm-no').click();
  else if ($('#sys-layer').classList.contains('active')) closeSys();
  else if (inGame()) openMenu();
});

$('#ending-restart').addEventListener('click', backToTitle);

initTitle();
</script>
