<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杜鹃森 — 神社与森林的恋爱物语</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

:root {
  --bg: #1a1a2e;
  --bg-overlay: rgba(10, 10, 20, 0.7);
  --text: #e8e0d4;
  --text-dim: #9a8e7e;
  --text-name: #f0c674;
  --accent-fox: #ff6b4a;
  --accent-fox-glow: rgba(255, 107, 74, 0.3);
  --accent-wolf: #7eb8da;
  --accent-wolf-glow: rgba(126, 184, 218, 0.3);
  --accent-deer: #8fd4a0;
  --accent-deer-glow: rgba(143, 212, 160, 0.3);
  --accent-whitewolf: #e8e0d0;
  --accent-whitewolf-glow: rgba(232, 224, 208, 0.3);
  --accent-hawk: #4a7eb8;
  --accent-hawk-glow: rgba(74, 126, 184, 0.3);
  --accent-snake: #9a5abf;
  --accent-snake-glow: rgba(154, 90, 191, 0.3);
  --accent-gold: #d4a854;
  --accent-sakura: #e8a0b4;
  --ui-bg: rgba(20, 16, 30, 0.92);
  --ui-border: rgba(212, 168, 84, 0.3);
  --font: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-ui: -apple-system, 'PingFang SC', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

/* === Background Scenes === */
#scene-bg {
  position: absolute; inset: 0;
  transition: opacity 1.2s ease;
}

.scene-layer {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: opacity 0.8s ease;
}
.scene-img { background-color: #0a0a14; background-repeat: no-repeat; }
.scene-img::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 25%, transparent 60%, rgba(0,0,0,0.35) 100%);
}

.bg-forest {
  background: linear-gradient(180deg, #0a1628 0%, #0f2418 15%, #0a3012 30%, #1a4a20 50%, #2a5a30 70%, #1a3a18 100%);
}
.bg-forest::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 3px 80px at 15% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 90px at 25% 55%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 85px at 40% 58%, #1a4020 0%, transparent 100%),
    radial-gradient(ellipse 5px 95px at 55% 52%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 80px at 70% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 88px at 85% 56%, #1a4020 0%, transparent 100%);
}
.bg-forest::after {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(80,180,100,0.08) 0%, transparent 40%),
    radial-gradient(circle at 70% 20%, rgba(60,160,80,0.06) 0%, transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(40,80,40,0.15) 0%, transparent 50%);
}

.bg-shrine {
  background: linear-gradient(180deg, #1a0a2e 0%, #2a1040 20%, #3a1848 35%, #2a1838 50%, #1a1028 70%, #0a0818 100%);
}
.bg-shrine::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 120px 8px at 50% 72%, rgba(180,80,60,0.15) 0%, transparent 100%),
    radial-gradient(circle at 50% 40%, rgba(255,160,80,0.06) 0%, transparent 50%);
}

.bg-night-shrine {
  background: linear-gradient(180deg, #050510 0%, #0a0a20 20%, #101030 40%, #0a0a20 60%, #050510 100%);
}
.bg-night-shrine::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 15%, rgba(200,220,255,0.8) 0%, rgba(200,220,255,0.1) 2%, transparent 4%),
    radial-gradient(circle at 30% 10%, rgba(255,255,200,0.3) 0%, transparent 1%),
    radial-gradient(circle at 60% 8%, rgba(255,255,200,0.2) 0%, transparent 0.5%),
    radial-gradient(circle at 45% 12%, rgba(255,255,200,0.25) 0%, transparent 0.8%);
}
.bg-night-shrine::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 70%, rgba(255,140,60,0.08) 0%, transparent 30%);
}

.bg-spring {
  background: linear-gradient(180deg, #f0d0d8 0%, #e8c0c8 15%, #d4a0b0 30%, #98c088 50%, #78a868 70%, #5a8a48 100%);
}
.bg-spring::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,180,200,0.4) 0%, transparent 30%),
    radial-gradient(circle at 80% 15%, rgba(255,200,210,0.3) 0%, transparent 25%);
}

.bg-moonlit {
  background: linear-gradient(180deg, #0a0e1e 0%, #101830 20%, #182040 35%, #1a3030 55%, #0a2018 80%, #081810 100%);
}
.bg-moonlit::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 200px 200px at 65% 20%, rgba(200,220,255,0.15) 0%, transparent 70%),
    radial-gradient(circle at 65% 20%, rgba(220,240,255,0.3) 0%, rgba(200,220,255,0.05) 15%, transparent 30%);
}

.bg-sky {
  background: linear-gradient(180deg, #0a1840 0%, #1a3060 15%, #2a5090 35%, #4a80c0 55%, #3a6090 75%, #1a3040 100%);
}
.bg-sky::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 40% 25%, rgba(255,255,255,0.05) 0%, transparent 30%),
    radial-gradient(circle at 70% 40%, rgba(200,220,255,0.08) 0%, transparent 25%);
}

.bg-cave {
  background: linear-gradient(180deg, #0a0510 0%, #100818 20%, #180a20 40%, #100818 60%, #0a0510 100%);
}
.bg-cave::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 50%, rgba(120,60,180,0.06) 0%, transparent 40%),
    radial-gradient(circle at 30% 70%, rgba(100,40,150,0.04) 0%, transparent 30%);
}

.bg-snowfield {
  background: linear-gradient(180deg, #c8d8e8 0%, #d8e4f0 20%, #e0e8f0 40%, #e8f0f4 60%, #d0dce8 80%, #b8c8d8 100%);
}
.bg-snowfield::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 60% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
    radial-gradient(circle at 30% 50%, rgba(200,220,240,0.2) 0%, transparent 30%);
}

.bg-town {
  background: linear-gradient(180deg, #2a1a3a 0%, #5a2a48 18%, #b8584a 38%, #e8a060 52%, #4a3040 62%, #20182a 80%, #120c18 100%);
}
.bg-town::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 18% at 30% 62%, #1a1222 0%, transparent 70%),
    radial-gradient(ellipse 70% 22% at 75% 60%, #221830 0%, transparent 70%),
    radial-gradient(circle at 20% 72%, rgba(255,190,110,0.35) 0%, transparent 1.2%),
    radial-gradient(circle at 42% 75%, rgba(255,190,110,0.3) 0%, transparent 1%),
    radial-gradient(circle at 68% 73%, rgba(255,190,110,0.3) 0%, transparent 1.1%);
}

.bg-room {
  background: linear-gradient(180deg, #1a120c 0%, #2a1c12 30%, #3a2818 55%, #2a1c10 75%, #18100a 100%);
}
.bg-room::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,190,120,0.22) 0%, transparent 38%),
    repeating-linear-gradient(90deg, transparent 0 18%, rgba(0,0,0,0.18) 18% 18.6%);
}

/* === Particles === */
#particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

.particle { position: absolute; border-radius: 50%; pointer-events: none; animation-timing-function: linear; animation-iteration-count: infinite; }

.firefly { width: 4px; height: 4px; background: rgba(255, 220, 100, 0.8); box-shadow: 0 0 6px rgba(255, 220, 100, 0.6), 0 0 12px rgba(255, 200, 60, 0.3); animation: firefly-float 8s ease-in-out infinite; }
@keyframes firefly-float { 0%, 100% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.9; } 50% { opacity: 0.4; transform: translate(30px, -40px); } 80% { opacity: 0.8; } }

.sakura-petal { width: 8px; height: 6px; background: rgba(255, 180, 200, 0.7); border-radius: 50% 0 50% 0; animation: sakura-fall linear infinite; }
@keyframes sakura-fall { 0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translate(-80px, calc(100vh + 20px)) rotate(720deg); opacity: 0; } }

.spirit-orb { width: 6px; height: 6px; background: rgba(100, 200, 255, 0.6); box-shadow: 0 0 8px rgba(100, 200, 255, 0.4); animation: spirit-drift 10s ease-in-out infinite; }
@keyframes spirit-drift { 0%, 100% { opacity: 0; transform: translate(0, 0) scale(1); } 30% { opacity: 0.7; transform: translate(20px, -30px) scale(1.3); } 70% { opacity: 0.5; transform: translate(-10px, -60px) scale(0.8); } }

.snowflake { width: 5px; height: 5px; background: rgba(255, 255, 255, 0.8); animation: snow-fall linear infinite; }
@keyframes snow-fall { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.5; } 100% { transform: translate(-30px, calc(100vh + 10px)) rotate(360deg); opacity: 0; } }

.feather { width: 10px; height: 4px; background: rgba(100, 150, 220, 0.5); border-radius: 50% 0; animation: feather-drift linear infinite; }
@keyframes feather-drift { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 15% { opacity: 0.6; } 85% { opacity: 0.4; } 100% { transform: translate(-60px, calc(100vh + 10px)) rotate(540deg); opacity: 0; } }

/* === Character Layer === */
#character-layer {
  position: absolute; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}

.character-sprite {
  position: absolute; inset: 0; z-index: 1;
  transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1), transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
}
.character-sprite.speaking { z-index: 2; }
.character-sprite img { transition: filter 0.4s ease, left 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
.character-sprite.listening img { filter: brightness(0.55) saturate(0.75); }

.character-sprite.entering { opacity: 0; transform: translateY(20px); }
.character-sprite.visible { opacity: 1; }

.character-sprite.beast-transform { animation: beast-glow 2s ease-in-out; }
@keyframes beast-glow {
  0% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
  30% { filter: drop-shadow(0 0 40px rgba(255,180,80,0.8)) brightness(1.5); }
  60% { filter: drop-shadow(0 0 60px rgba(255,200,100,0.9)) brightness(2); }
  80% { filter: drop-shadow(0 0 30px rgba(255,180,80,0.5)) brightness(1.2); }
  100% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
}

/* Placeholder portrait when no image */
.char-placeholder {
  width: 100%; height: 100%;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; font-family: var(--font);
  overflow: hidden; position: relative;
}
.char-placeholder::before {
  content: ''; position: absolute; inset: 0;
  opacity: 0.5; border-radius: 12px;
}
.char-placeholder .placeholder-icon { font-size: 64px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); z-index: 1; }
.char-placeholder .placeholder-name {
  font-size: 14px; color: rgba(255,255,255,0.9); z-index: 1;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5); letter-spacing: 2px;
}

.char-portrait-img {
  position: absolute; width: auto; max-width: none;
}

/* === Dialogue === */
#dialogue-layer { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 16px env(safe-area-inset-bottom, 16px); }

#dialogue-box {
  position: relative; max-width: 800px; margin: 0 auto 16px;
  background: var(--ui-bg); border: 1px solid var(--ui-border);
  border-radius: 12px; padding: 16px 20px 20px;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 30px rgba(0,0,0,0.3); cursor: pointer; min-height: 120px;
}

#speaker-name { font-size: 14px; font-weight: 600; color: var(--text-name); margin-bottom: 8px; letter-spacing: 1px; font-family: var(--font); }
#dialogue-text { font-size: 16px; line-height: 1.8; color: var(--text); font-family: var(--font); min-height: 60px; }
#dialogue-text .char { opacity: 0; display: inline; transition: opacity 0.05s; }
#dialogue-text .char.visible { opacity: 1; }

#text-indicator { position: absolute; bottom: 12px; right: 16px; width: 12px; height: 12px; opacity: 0; transition: opacity 0.3s; }
#text-indicator.show { opacity: 0.6; animation: indicator-bounce 1s ease-in-out infinite; }
@keyframes indicator-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* === Choices === */
#choice-layer {
  position: absolute; inset: 0; display: none;
  justify-content: center; align-items: center;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 20;
}
#choice-layer.active { display: flex; }

#choice-container { display: flex; flex-direction: column; gap: 12px; max-width: 500px; width: 90%; }

.choice-btn {
  background: var(--ui-bg); border: 1px solid var(--ui-border);
  border-radius: 8px; padding: 14px 20px; color: var(--text);
  font-family: var(--font); font-size: 15px; cursor: pointer;
  transition: all 0.3s ease; text-align: left; line-height: 1.5;
}
.choice-btn:hover { background: rgba(212, 168, 84, 0.15); border-color: var(--accent-gold); transform: translateX(4px); }
.choice-btn:active { transform: translateX(2px); background: rgba(212, 168, 84, 0.25); }

/* === Affection === */
.aff-change {
  position: fixed; font-size: 18px; font-weight: 700; pointer-events: none;
  animation: aff-popup 1.5s ease-out forwards; z-index: 100;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
@keyframes aff-popup { 0% { opacity: 1; transform: translateY(0) scale(1); } 50% { opacity: 1; transform: translateY(-30px) scale(1.2); } 100% { opacity: 0; transform: translateY(-60px) scale(0.8); } }

/* === Title Screen === */
#title-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  background: linear-gradient(180deg, #0a0e1e 0%, #101828 20%, #0a2018 40%, #1a3020 60%, #0a1810 80%, #050a08 100%);
  z-index: 50; transition: opacity 1.5s ease;
}
#title-screen.hidden { opacity: 0; pointer-events: none; }

#title-particles { position: absolute; inset: 0; overflow: hidden; }
.title-firefly {
  position: absolute; width: 3px; height: 3px; background: rgba(255, 220, 100, 0.7);
  border-radius: 50%; box-shadow: 0 0 6px rgba(255, 220, 100, 0.5);
  animation: title-fly linear infinite;
}
@keyframes title-fly { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.8; } 80% { opacity: 0.6; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }

#title-content { position: relative; text-align: center; z-index: 1; }
#title-jp { font-size: 14px; color: var(--accent-gold); letter-spacing: 8px; margin-bottom: 12px; opacity: 0; animation: title-fade 2s ease 0.5s forwards; font-family: var(--font); }
#title-main { font-size: clamp(36px, 8vw, 64px); font-weight: 700; color: var(--text); text-shadow: 0 0 40px rgba(212, 168, 84, 0.3); margin-bottom: 8px; opacity: 0; animation: title-fade 2s ease 1s forwards; font-family: var(--font); }
#title-sub { font-size: 14px; color: var(--text-dim); letter-spacing: 4px; margin-bottom: 48px; opacity: 0; animation: title-fade 2s ease 1.5s forwards; font-family: var(--font); }
@keyframes title-fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

#title-buttons { display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; animation: title-fade 2s ease 2s forwards; }
.title-btn {
  background: transparent; border: 1px solid var(--accent-gold);
  color: var(--accent-gold); font-family: var(--font); font-size: 16px;
  width: 200px; padding: 12px 0; border-radius: 4px; cursor: pointer; letter-spacing: 4px;
  transition: all 0.4s ease;
}
.title-btn.secondary { border-color: rgba(212,168,84,0.4); color: var(--text-dim); font-size: 14px; padding: 10px 0; }
.title-btn:hover { background: rgba(212, 168, 84, 0.15); box-shadow: 0 0 20px rgba(212, 168, 84, 0.2); color: var(--accent-gold); }
.title-btn[hidden] { display: none; }

/* === Transform Overlay === */
#transform-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; z-index: 30; pointer-events: none; }
#transform-overlay.active { display: flex; animation: transform-flash 2.5s ease-in-out forwards; }
@keyframes transform-flash { 0% { background: transparent; } 20% { background: rgba(255, 220, 140, 0.6); } 40% { background: rgba(255, 200, 100, 0.3); } 60% { background: rgba(255, 180, 80, 0.1); } 100% { background: transparent; } }
#transform-text { font-size: clamp(24px, 5vw, 40px); font-weight: 700; color: var(--accent-gold); text-shadow: 0 0 30px rgba(212, 168, 84, 0.8); font-family: var(--font); opacity: 0; animation: transform-text-show 2.5s ease-in-out forwards; }
@keyframes transform-text-show { 0% { opacity: 0; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.05); } }

/* === Chapter overlay === */
#chapter-overlay { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; flex-direction: column; background: rgba(0,0,0,0.85); z-index: 25; pointer-events: none; }
#chapter-overlay.active { display: flex; }
#chapter-num { font-size: 13px; color: var(--accent-gold); letter-spacing: 6px; margin-bottom: 12px; opacity: 0; animation: chap-in 1.5s ease 0.3s forwards; }
#chapter-title { font-size: clamp(24px, 5vw, 36px); font-weight: 700; color: var(--text); font-family: var(--font); opacity: 0; animation: chap-in 1.5s ease 0.6s forwards; }
@keyframes chap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === Ending === */
#ending-screen { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 40; background: rgba(0,0,0,0.95); }
#ending-screen.active { display: flex; }
#ending-title { font-size: clamp(28px, 6vw, 48px); font-weight: 700; color: var(--accent-gold); font-family: var(--font); margin-bottom: 16px; text-shadow: 0 0 30px rgba(212,168,84,0.4); }
#ending-subtitle { font-size: 16px; color: var(--text-dim); font-family: var(--font); margin-bottom: 40px; text-align: center; line-height: 1.8; padding: 0 20px; white-space: pre-line; }
#ending-restart { background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); font-family: var(--font); font-size: 15px; padding: 10px 32px; border-radius: 4px; cursor: pointer; letter-spacing: 2px; transition: all 0.3s; }
#ending-restart:hover { background: rgba(212,168,84,0.15); }

/* === Menu === */
#menu-btn { position: absolute; top: 16px; left: 16px; z-index: 22; width: 36px; height: 36px; background: rgba(10,10,20,0.7); border: 1px solid rgba(212,168,84,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-dim); font-size: 14px; backdrop-filter: blur(8px); transition: all 0.3s; }
#menu-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

.save-toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(10,10,20,0.9); border: 1px solid var(--accent-gold); border-radius: 6px; padding: 8px 20px; font-family: var(--font-ui); font-size: 13px; color: var(--accent-gold); z-index: 100; opacity: 0; animation: toast-show 2s ease forwards; }
@keyframes toast-show { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; } }

/* === System menu / save & load === */
#sys-layer, #confirm-layer {
  position: absolute; inset: 0; display: none; z-index: 60;
  background: rgba(4,4,10,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  justify-content: center; align-items: center; font-family: var(--font-ui);
}
#sys-layer.active, #confirm-layer.active { display: flex; }
#confirm-layer { z-index: 70; }

.sys-card {
  width: min(92vw, 420px); max-height: 88vh; display: flex; flex-direction: column;
  background: var(--ui-bg); border: 1px solid var(--ui-border); border-radius: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow: hidden;
}
.sys-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(212,168,84,0.15); }
.sys-title { font-family: var(--font); font-size: 16px; color: var(--accent-gold); letter-spacing: 3px; }
.sys-close { background: none; border: none; color: var(--text-dim); font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.sys-close:hover { color: var(--accent-gold); }

.menu-list { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.menu-item {
  background: rgba(255,255,255,0.03); border: 1px solid var(--ui-border); border-radius: 8px;
  color: var(--text); font-family: var(--font); font-size: 15px; letter-spacing: 2px;
  padding: 13px 16px; cursor: pointer; text-align: left; transition: all 0.2s;
}

  'kohaku_news': {

    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'player', text: '外婆前几天……在医院走了。上个满月之前，她就住院了。走的时候很安静，没有受苦。' },
      { char: 'narrator', text: '琥珀没有说话。' },
      { char: 'narrator', text: '风吹过前庭，石灯笼里的青火一齐摇晃了一下。' },
      { char: 'narrator', text: '你把信递给她。她接过去，读得很慢很慢。读到某一行时，手指停住了。' },
      { char: 'kohaku', text: '「请你在满月前七天上山」……' },

      { char: 'kohaku', text: '上个满月，她没有来。我在鸟居下面等了一整夜。' },
      { char: 'kohaku', text: '我跟自己说，大概是感冒了，大概是腿又疼了。下个月就会来的。' },
      { char: 'kohaku', text: '……我其实知道的。人类的五十年，已经很长很长了。' },
      { char: 'narrator', text: '一滴眼泪落在信纸上，晕开了外婆的字。' },
      { char: 'narrator', text: '琥珀飞快地擦掉，把信仔细折好，还给你。' },
      { char: 'kohaku', text: '对不起，让客人看到这副样子。' },
      { char: 'kohaku', text: '我叫琥珀。是这座神社的巫女，也是——千代的朋友。' },
      { char: 'kohaku', text: '欢迎回来。……我是说，欢迎来到杜鹃森。' },

    next: 'kohaku_explain',

  'kohaku_explain': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '正殿的缘廊上，琥珀给你端来一碗热茶。茶汤里浮着一小朵金色的花。' },
      { char: 'kohaku', text: '杜鹃花茶。千代每次上山，第一件事就是要喝这个。' },
      { char: 'player', text: '琥珀……你到底是……' },
      { char: 'kohaku', text: '狐狸。活了很久很久的狐狸。' },
      { char: 'narrator', text: '她身后，一条蓬松的赤红色尾巴轻轻晃了出来，尾尖是奶白色的。' },
      { char: 'kohaku', text: '这片森林叫杜鹃森，夹在人的世界和灵的世界中间。住在这里的，都是像我这样的兽灵。' },
      { char: 'kohaku', text: '森林外面有一道结界。它挡住灵界那边的浊气，也挡住误闯进来的人类。' },
      { char: 'player', text: '可是我进来了。' },
      { char: 'kohaku', text: '因为你带着那枚铃。' },
      { char: 'narrator', text: '她看着你口袋的方向，眼神变得很柔和。' },
      { char: 'kohaku', text: '那是「守铃人」的铃。千代是守铃人，她的母亲也是。所以结界认得它，也认得你的血。' },
      { char: 'player', text: '守铃人……要做什么？' },
      { char: 'kohaku', text: '……这个嘛。' },
      { char: 'narrator', text: '她的耳朵微微动了一下，像是在斟酌。' },
      { char: 'kohaku', text: '这些事，等你在这里住几天再说吧。千代说了，要你先认识我们。' },
      { char: 'kohaku', text: '还有一件事，要先告诉你。结界只在满月的夜里向外打开。在那之前，你没办法下山。' },
      { char: 'player', text: '所以……七天。' },
      { char: 'kohaku', text: '嗯，七天。千代算得刚刚好。' },
      { char: 'kohaku', text: '这七天里，你就住在神社吧。千代的房间，我每个月都会打扫的。' },
      { char: 'kohaku', text: '……而且，你小时候，是来过这里的哦。' },
      { char: 'player', text: '诶？' },
      { char: 'kohaku', text: '呵呵。这个也以后再说。' },
    ],
    next: 'meet_ginro',
  },

  'meet_ginro': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '话音刚落，前庭里响起了脚步声。沉稳，很重，不像是人的脚步。' },
      { char: 'ginro', text: '琥珀。刚才结界动了一下——' },

        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'narrator', text: '深蓝色的和服，腰间佩着一把黑鞘长刀。头顶是一对竖起的、银灰色的狼耳。' },
      { char: 'narrator', text: '冰蓝色的眼睛扫过你，在你口袋的位置停住了。' },
      { char: 'ginro', text: '……那是千代的铃。' },
      { char: 'ginro', text: '千代呢。' },
      { char: 'narrator', text: '琥珀没有回答，只是看着他，轻轻摇了一下头。' },
      { char: 'narrator', text: '青年站在原地，一动不动。很久很久。' },
      { char: 'ginro', text: '…………是吗。' },
      { char: 'narrator', text: '他向你走过来。你下意识地往后缩了一下。' },
      { char: 'narrator', text: '他在你面前停下，微微低头——鼻翼动了动，像是在确认什么气味。' },
      { char: 'ginro', text: '……是你。' },
      { char: 'player', text: '什么？' },
      { char: 'ginro', text: '没什么。' },
      { char: 'ginro', text: '我叫银朗，守着这片森林的结界。七天后，满月一到，你就下山。这几天别乱跑，别给琥珀添麻烦。' },
      { char: 'narrator', text: '说完他就转身走了。走进黑暗之前，你看到一条银色的大尾巴，低低地垂着。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '别往心里去。' },
      { char: 'kohaku', text: '五十年来，每个满月，都是他去山脚接千代上山，再把她送下去。千代右耳不好，他就一直走在她的左边。' },
      { char: 'kohaku', text: '他比谁都难过。只是，他不会说。' },
    ],
    choices: [
      { text: '「他刚才说『是你』……那是什么意思？」', affection: { wolf: 2 }, next: 'day1_room' },
      { text: '「……我能理解。我也还没哭出来。」', affection: { fox: 2 }, next: 'day1_room' },
    ],
  },

  'day1_room': {

      { char: 'narrator', text: '一个头上长着小鹿角的孩子。「白露。又长高了一点。答应要带他去看海——要是他能下山就好了。」' },

      { char: 'narrator', text: '夜很深的时候，远处传来一声狼嚎。很长，很低，一直没有停。' },
      { char: 'narrator', text: '你终于在那声狼嚎里，为外婆哭了出来。' },
    ],
    next: 'day2_morning',
  },

    choices: [
      { text: '「外婆信里说，答应过要带你去看海。……这个约定，我可以替她记着吗？」', affection: { deer: 3 }, next: 'yukimaru_walk' },
      { text: '对雪丸说：「谢谢你一直陪着他。」', affection: { whitewolf: 3 }, next: 'yukimaru_walk' },
    ],
  },

  'yukimaru_walk': {
    scene: 'forest', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '白露哭累了，蜷在溪边的草地上睡着了。雪丸说他会看着，让你先回去。' },
      { char: 'narrator', text: '走出没几步，他又追了上来。' },
      { char: 'yukimaru', text: '算了，我送你。天快黑了，琥珀姐会担心的。你认路的本事我昨天见识过了。' },
      { char: 'narrator', text: '林间的小路上，萤火虫一点一点亮了起来。雪丸走在你前面半步，尾巴有一下没一下地甩着。' },
      { char: 'player', text: '你说你是从北边来的？' },
      { char: 'yukimaru', text: '嗯。半年前。一路跑过来的，脚底板都磨破了。' },
      { char: 'player', text: '为什么来这里？' },
      { char: 'yukimaru', text: '……来找人。' },
      { char: 'narrator', text: '他踢飞了一颗石子。' },
      { char: 'yukimaru', text: '我娘去年冬天死了。她走之前跟我说：「去南边的杜鹃森，找你舅舅。他会照顾你的。」' },
      { char: 'yukimaru', text: '然后我就来了。找到了。' },
      { char: 'player', text: '你舅舅是……' },
      { char: 'yukimaru', text: '银朗。' },
      { char: 'yukimaru', text: '哈，想不到吧？那张冰块脸是我舅舅。' },
      { char: 'yukimaru', text: '可是他不认我。我第一天到的时候，他就说：「我没有外甥。回北边去。」' },
      { char: 'yukimaru', text: '半年了。每天都是这句。「回去。」「回你的窝去。」连我的名字都没叫过一次。' },
      { char: 'narrator', text: '他笑着说的，可那只缺了口的耳朵，一直耷拉着。' },
    ],
    choices: [
      { text: '「他一定有他的理由。昨晚他为外婆嚎了一整夜，不是冷血的人。」', affection: { wolf: 1 }, next: 'ginro_yukimaru_clash' },
      { text: '「……那你还留下来了。你很厉害。」', affection: { whitewolf: 2 }, next: 'ginro_yukimaru_clash' },
    ],
  },

  'ginro_yukimaru_clash': {
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '走到鸟居下的时候，天已经全黑了。石阶上站着一个人。' },
      { char: 'ginro', text: '太阳落山前回来。这里不是城里。' },
      { char: 'narrator', text: '银朗从阴影里走出来。他的目光越过你，落在雪丸身上。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '我陪着呢，怕什么。' },
      { char: 'ginro', text: '就是因为你陪着。' },
      { char: 'yukimaru', text: '……哈？什么意思，我还能把人弄丢不成？' },
      { char: 'ginro', text: '你连自己都弄丢了。一个人从北边跑出来，半年了还不回去。' },
      { char: 'yukimaru', text: '那边已经没有我的窝了！娘死了，族里那帮老家伙——' },
      { char: 'ginro', text: '族里会收留你。只要你回去，低头，守规矩。' },
      { char: 'yukimaru', text: '像你一样？你当年守规矩了吗？！' },
      { char: 'narrator', text: '空气一下子冷了下来。银朗的耳朵往后压平了。' },
      { char: 'yukimaru', text: '……你到底什么时候，才肯叫我一次名字？' },
      { char: 'narrator', text: '银朗没有回答。' },
      { char: 'ginro', text: '……回你的窝去。' },
      { char: 'yukimaru', text: '我的窝就在这儿！！' },
      { char: 'narrator', text: '雪丸转身冲进了树林。一道白影，几个起落就不见了。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'narrator', text: '银朗站在原地，看着他消失的方向。' },
      { char: 'ginro', text: '……他娘，叫雪音。是我妹妹。' },
      { char: 'ginro', text: '小时候也是这样。吵得要命，跑得比谁都快，摔了跤从来不哭。' },
      { char: 'player', text: '那你为什么——' },
      { char: 'ginro', text: '进去吧。夜里凉。' },
      { char: 'narrator', text: '他把自己的外褂脱下来，扔到你怀里，头也不回地走了。' },
      { char: 'narrator', text: '外褂上有雨水和松针的味道。你愣住了。' },
      { char: 'player', text: '（……这个味道。梦里那只银色的大狗……）' },
    ],
    next: 'day3_morning',
  },

  // =============== DAY 3 ===============
  'day3_morning': {
    scene: 'sky', particles: 'feathers', day: 3,
    chapter: { num: '第三天', title: '天空与深渊' },
    lines: [
      { char: 'narrator', text: '第三天早上，窗台上多了一根羽毛。' },
      { char: 'narrator', text: '蓝灰色的，很长，边缘在晨光里泛着一层银。' },
      { char: 'player', text: '（外婆的速写本里……那根羽毛。）' },
      { char: 'narrator', text: '你拿着羽毛走出房间，抬起头。' },
      { char: 'narrator', text: '神社最高的屋脊上，坐着一个人。长长的蓝黑色头发被风吹起来，像一面旗。' },
    ],
    next: 'meet_sou',
  },

  'meet_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '那人从屋脊上一跃而下——不，不是跳。是滑翔。' },
      { char: 'narrator', text: '宽大的袖子在空中展开，袖底隐约透出翅膀的轮廓。落地的时候，连一片落叶都没有惊动。' },
      { char: 'sou', text: '……千代的外孙。' },
      { char: 'sou', text: '你的眼睛像她。看东西的时候，总是先看最小的那个。' },
      { char: 'player', text: '你是……苍羽？外婆说你从来不下来吃饭。' },
      { char: 'narrator', text: '对方的嘴角几乎看不出地动了一下。' },
      { char: 'sou', text: '她把饭团放在屋檐上。五十年。每个月一个。梅子的。' },
      { char: 'sou', text: '我不喜欢梅子。……但每个都吃完了。' },
      { char: 'narrator', text: '风吹过来。苍羽的目光越过你，落向山下小镇的方向。' },
      { char: 'sou', text: '我要跟你说一件事。只跟你说。' },
      { char: 'sou', text: '上个满月之前，我看到一辆白色的车，把她从镇上带走了。' },
      { char: 'player', text: '……！' },
      { char: 'sou', text: '我跟着那辆车，一直飞到城里的医院。从那天起，我每天都去。停在她病房窗外的那棵树上。' },
      { char: 'sou', text: '她瘦了很多。有一天，她好像看到我了，对着窗户笑了一下。' },
      { char: 'sou', text: '四天前，窗帘拉上了。前天的葬礼，黑色的伞，还有你——我从很高的地方看着，看了一整个下午。' },
      { char: 'sou', text: '每天傍晚我飞回来，落在屋顶上。琥珀在下面扫地，哼着歌，在算千代下次来要做什么点心。' },
      { char: 'sou', text: '我没有下去。二十多天，一个字都没有说。让她在鸟居下面，白白等了整整一夜。' },
      { char: 'narrator', text: '苍羽的声音很平。平得像结了冰的湖面。可是你看到，那双垂在袖子里的手，攥得指节发白。' },
    ],
    choices: [
      { text: '「你应该亲口告诉她。现在还来得及——我陪你去。」', affection: { hawk: 3 }, flag: 'urged_sou', next: 'sou_kohaku' },
      { text: '「那不是你的错。换成谁，都说不出口的。」', affection: { hawk: 2, fox: 1 }, next: 'sou_kohaku' },
    ],
  },

  'sou_kohaku': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽沉默了很久。然后，他点了一下头。', if: 'urged_sou' },
      { char: 'narrator', text: '苍羽看着你，像是没料到你会这么说。然后他转过身，朝前庭走去。', ifnot: 'urged_sou' },
      { char: 'narrator', text: '琥珀正在前庭里给杜鹃浇水。看到苍羽走过来，水壶停在了半空中。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '……苍羽？你下来了？' },
      { char: 'kohaku', text: '上一次你落到地上，是多少年前来着？' },
      { char: 'sou', text: '琥珀。千代住院的那天，我就知道了。她走的那天，我也在窗外。' },
      { char: 'sou', text: '我一直没有告诉你。对不起。' },
      { char: 'narrator', text: '水壶从琥珀手里放了下来。她走到苍羽面前，抬头看着这个比她高出一头的人。' },
      { char: 'kohaku', text: '傻孩子。' },
      { char: 'kohaku', text: '你一个人在那扇窗户外面……守了多久？' },
      { char: 'sou', text: '……二十五天。' },
      { char: 'narrator', text: '琥珀伸出手，理了理苍羽被风吹乱的头发。苍羽没有躲。' },
      { char: 'kohaku', text: '下次，就下来吧。一个人在上面，太冷了。' },
      { char: 'narrator', text: '苍羽垂下眼睛。那一瞬间，他看起来不像是守望天空的鹰，只是一个很累的、终于落了地的孩子。' },
      { char: 'kohaku', text: '好了。' },
      { char: 'narrator', text: '琥珀转向你，擦了擦眼角，又恢复了平常的样子。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '下午，让银朗带你去看看结界吧。有些东西，你差不多该知道了。' },
    ],
    next: 'patrol',
  },

  'patrol': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'ginro', text: '琥珀让你跟着，你就跟着。别踩到结界的根。' },
      { char: 'narrator', text: '银朗走在前面，步子很大，却一直没把你甩开。你后来才发现，他是故意放慢的。' },
      { char: 'narrator', text: '他每走一段就停下来，把手掌贴在某棵老树的树干上，闭上眼睛。' },
      { char: 'player', text: '你在听什么？' },
      { char: 'ginro', text: '结界。它不是一堵墙，是一张网。每一棵老树都是一个结。' },
      { char: 'ginro', text: '结是好的，树皮底下就是温的。像有心跳。' },
      { char: 'narrator', text: '他走到一棵巨大的榉树前，手掌贴上去——然后猛地缩了回来。' },
      { char: 'narrator', text: '树皮上有一片黑色的斑。像是烧焦的痕迹，却在慢慢地、一点一点地往外渗。' },
      { char: 'ginro', text: '……比我想的还快。' },
      { char: 'player', text: '这是什么？' },
      { char: 'ginro', text: '结界在烂。' },
      { char: 'ginro', text: '每个满月，千代会在神社底下摇那枚铃。铃一响，结界就会重新长好。五十年，一次都没有断过。' },
      { char: 'ginro', text: '上个月，她没有来。' },
      { char: 'narrator', text: '他转过头，看了一眼你的口袋。然后又移开了视线，像是不想让那个念头说出口。' },
      { char: 'narrator', text: '回去的路上，天色暗了下来。经过一段长满蕨草的缓坡时，银朗忽然停住了。' },
      { char: 'ginro', text: '二十年前。就是这里。' },
      { char: 'ginro', text: '一个六岁的小鬼，趁千代跟琥珀说话，自己跑进了林子里。天黑了，坐在这块石头上哭。' },
      { char: 'player', text: '……' },
      { char: 'ginro', text: '我找到它的时候，它一把抱住我的脖子，鼻涕全蹭在我毛上。一路哭着喊「大狗狗」。' },
      { char: 'ginro', text: '我是狼。' },
      { char: 'narrator', text: '他说这句话的时候，表情很严肃。可是你分明看到——他的尾巴尖动了一下。' },
    ],
    choices: [
      { text: '「……那只大狗，真的是你。谢谢你那天找到我。」', affection: { wolf: 2 }, next: 'night_bell' },
      { text: '「所以昨天你说『是你』。你一直记得。」', affection: { wolf: 1 }, next: 'night_bell' },
    ],
  },

  'night_bell': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '那天深夜，你被铃声吵醒了。' },
      { char: 'narrator', text: '叮。叮。叮。' },
      { char: 'narrator', text: '放在枕边的铜铃，自己在响。一声接一声，很急，像是在叫你。' },
      { char: 'narrator', text: '你拿着铃走出房间。铃声停了——然后，从正殿的背后，又响了一声。' },
      { char: 'narrator', text: '正殿后面，有一道你从没注意过的石阶，一直往地底下延伸。石壁上爬满了发着微光的苔藓。' },
      { char: 'player', text: '（外婆的速写本……「别告诉琥珀我去地下了」。）' },
      { char: 'narrator', text: '你握紧铃，走了下去。' },
    ],
    next: 'meet_genya',
  },

  'meet_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '石阶的尽头，是一个很大的洞窟。洞窟正中央，立着一块半人高的巨石，表面流淌着淡紫色的光。' },
      { char: 'narrator', text: '巨石旁边摆着一张旧棋盘。棋盘前，坐着一个黑发的男人。' },
      { char: 'narrator', text: '他的头发又长又直，一直垂到地上。皮肤苍白得像瓷，脖颈上隐约有细密的鳞纹。' },
      { char: 'genya', text: '终于来了。' },
      { char: 'genya', text: '我还以为那枚铃要把我耳朵摇聋了，你才肯醒。千代的外孙，睡得比她还死。' },
      { char: 'player', text: '……你是玄夜。外婆的棋友。' },
      { char: 'narrator', text: '他挑了挑眉。紫色的竖瞳眯了起来，像是觉得很有趣。' },
      { char: 'genya', text: '她是这么写我的？棋友？' },
      { char: 'genya', text: '也对。每个满月，她摇完铃，就坐在那里，输一盘棋给我。输了五十年。' },
      { char: 'genya', text: '……最后那几年，其实是我在让她。她眼睛不好了，老是把白子当黑子下。' },
      { char: 'player', text: '你知道外婆已经……' },
      { char: 'genya', text: '知道。那只鸟告诉我的。' },
      { char: 'genya', text: '稀奇吧？苍羽宁可落到我这个天敌的洞口，也不敢落到琥珀面前。' },
      { char: 'narrator', text: '他说着，笑了一下。然后咳嗽起来，咳得很厉害。' },
      { char: 'narrator', text: '你这才发现——他靠着巨石的那只手，手背上的鳞片是灰色的，裂开了好几道口子。' },
      { char: 'player', text: '你受伤了？' },
      { char: 'genya', text: '这块石头叫「要石」。整片森林的结界，都系在它身上。' },
      { char: 'genya', text: '千代没来的那个满月，它开始往外漏。我一个人，勉强按着。' },
      { char: 'genya', text: '按了二十多天。差不多，快按不住了。' },
    ],
    choices: [
      { text: '「为什么不告诉琥珀和银朗？让他们来帮你！」', affection: { snake: 2 }, next: 'genya_talk' },
      { text: '「……你一个人撑了二十多天。」在他身边坐下来', affection: { snake: 3 }, next: 'genya_talk' },
    ],
  },

  'genya_talk': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'genya', text: '告诉他们？' },
      { char: 'genya', text: '琥珀会说「那条蛇又在打什么主意」。银朗会拔刀。白露会躲到雪丸身后发抖。' },
      { char: 'genya', text: '在这片森林里，我是那个「不太好相处的」。六十年前就是了。' },
      { char: 'player', text: '六十年前发生了什么？' },
      { char: 'genya', text: '……这个故事不好听。以后再说。' },
      { char: 'narrator', text: '他伸出手，细长的手指轻轻敲了敲你手里的铃。' },
      { char: 'genya', text: '说点有用的。守铃人要做的事，其实很简单。' },
      { char: 'genya', text: '满月那天夜里，站在要石前面，摇响这枚铃。然后，把我们每一个的名字，念出来。' },
      { char: 'player', text: '……念名字？就这样？' },
      { char: 'genya', text: '就这样。' },
      { char: 'genya', text: '我们这种东西，是靠「被记住」才能留在这一边的。被人类记住名字，就有了落脚的地方。' },
      { char: 'genya', text: '被忘掉的兽灵，会慢慢失去形状，变成只剩下饿的东西。我们管那个叫「堕兽」。' },
      { char: 'genya', text: '千代记了我们五十年。现在她不在了，这片森林，就没有人记得了。' },
      { char: 'narrator', text: '洞窟里很安静。只有要石发出的、低低的嗡鸣。' },
      { char: 'genya', text: '别急着回答。千代说过，要让你先认识我们每一个。' },
      { char: 'genya', text: '还有，别告诉他们你来过这里。——就当是，帮你外婆保守她的秘密。' },
      { char: 'narrator', text: '你走上石阶的时候，回头看了一眼。' },
      { char: 'narrator', text: '他又闭上了眼睛，一只手按在要石上。紫色的光，在他手掌下一明一暗，像是很微弱的心跳。' },
    ],
    next: 'day4_breakfast',
  },
  // =============== DAY 4 ===============
  'day4_breakfast': {
    scene: 'shrine', particles: 'sakura', day: 4,
    chapter: { num: '第四天', title: '一张桌子' },
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '第四天的早饭，缘廊上第一次这么热闹。' },
      { char: 'kohaku', text: '难得大家都在。今天多做了一锅。' },
      { char: 'narrator', text: '白露坐在你旁边，眼睛还有点红，但头上已经开了两朵小花。他一直在问你城里的事。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '所以海是咸的？整个都是咸的？那鱼不会渴吗？' },
      { char: 'kohaku', text: '白露，先把饭吃了。' },
      { char: 'narrator', text: '屋檐上倒挂下来一个白色的脑袋。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '海嘛，我知道！北边的海会结冰，可以在上面跑——' },
      { char: 'ginro', text: '下来。吃饭不许倒挂。' },
      { char: 'narrator', text: '银朗坐在缘廊最边上，端着碗，头也没抬。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '哟，你管我？你又不是我舅舅——哦，你是。可你不承认嘛。' },
      { char: 'ginro', text: '……' },
      { char: 'narrator', text: '银朗把一碟煎鱼往雪丸的方向推了推，一个字也没说。雪丸愣了一下，别扭地翻身下来，坐到了离他两个位置远的地方。' },
      { char: 'narrator', text: '啪嗒。一条还在蹦的溪鱼从天而降，正好落在饭桌中间。' },
      { char: 'narrator', text: '屋顶上，苍羽的衣角一闪而过。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '……他在请客。五十年了，他请客的方式一直是这样。' },
      { char: 'shiro', text: '那、那个……' },
      { char: 'narrator', text: '白露小声开口，攥着筷子。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '玄夜……也会来吗？' },
      { char: 'kohaku', text: '他从来不来的。别担心。' },
      { char: 'narrator', text: '琥珀的声音很温柔，但你注意到，提到那个名字的时候，她的耳朵往后压了一下。' },
      { char: 'narrator', text: '白露明显松了一口气，往雪丸那边缩了缩。' },
      { char: 'player', text: '（他们都不知道……那个人在地底下，一个人撑着整片森林。）' },
      { char: 'player', text: '（外婆，你让我认识他们每一个。可是他们彼此之间，好像还有很多不认识的地方。）' },
      { char: 'narrator', text: '早饭过后，大家各自散去。今天是难得的、什么事都没有的一天。' },
    ],
    choices: [
      { text: '留在神社，帮琥珀整理外婆的房间', affection: { fox: 3 }, next: 'day4_kohaku' },
      { text: '跟银朗去学怎么「听」结界', affection: { wolf: 3 }, next: 'day4_ginro' },
      { text: '白露说想带你去一个地方', affection: { deer: 3 }, flag: 'saw_garden', next: 'day4_shiro' },
      { text: '雪丸在树上冲你招手', affection: { whitewolf: 3 }, next: 'day4_yukimaru' },
      { text: '抬头，对屋顶上的苍羽挥了挥手', affection: { hawk: 3 }, next: 'day4_sou' },
      { text: '趁没人注意，溜去正殿后面的石阶', affection: { snake: 3 }, flag: 'genya_truth', next: 'day4_genya' },
    ],
  },

  'day4_kohaku': {
    scene: 'room', particles: null,
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '外婆的房间里，琥珀跪坐着，把一件件旧东西拿出来，晒一晒，再叠好放回去。' },
      { char: 'kohaku', text: '这件羽织，是她四十岁那年我给她缝的。袖口破了三次，她都舍不得扔。' },
      { char: 'player', text: '琥珀。外婆八岁的时候，也是迷路进来的吗？' },
      { char: 'kohaku', text: '嗯。跟着她娘上山，自己跑丢了。坐在鸟居下面哭，哭得比你还大声。' },
      { char: 'kohaku', text: '我给了她一颗糖。她不哭了，抬头看着我说：「姐姐，你有耳朵。」' },
      { char: 'kohaku', text: '后来她叫了我三十年「琥珀姐姐」。再后来，她长得比我老了，就改口叫「琥珀」了。' },
      { char: 'kohaku', text: '最后那几年，她有时候会摸着我的头说：「小琥珀，要好好吃饭。」' },
      { char: 'narrator', text: '她笑出了声。笑着笑着，停住了。' },
      { char: 'kohaku', text: '……活得太久，就是这样。一个人从小不点，变成朋友，变成长辈，然后变成一张照片。' },
      { char: 'kohaku', text: '我送走过很多人。千代是最后一个我以为，会一直在的。' },
      { char: 'narrator', text: '她从柜子最深处，拿出一个小纸包。里面是几颗星星形状的糖。' },
      { char: 'kohaku', text: '二十年前，你迷路那天。是我抹掉了你的记忆。' },
      { char: 'kohaku', text: '千代求我的。她说你是城里的孩子，要过普通的日子，不要被山里的事牵住。' },
      { char: 'kohaku', text: '对不起。那是你的东西，我不该替你拿走。' },
      { char: 'kohaku', text: '……你想要回来吗？' },
      { char: 'player', text: '想。' },
      { char: 'narrator', text: '琥珀伸出手，指尖轻轻点在你的额头上。温热的，带着一点点花香。' },
      { char: 'narrator', text: '——一颗金平糖在嘴里化开的甜味。红头发的姐姐蹲在你面前，尾巴扫过你的膝盖。' },
      { char: 'narrator', text: '「姐姐，我长大了还可以来找你玩吗？」「可以哦。我等你。」' },
      { char: 'player', text: '……我说过，长大了要来找你。' },
      { char: 'kohaku', text: '嗯。' },
      { char: 'kohaku', text: '你来了。晚了二十年。' },
      { char: 'narrator', text: '她把一颗金平糖放进你手心，和二十年前一模一样。' },
    ],
    next: 'day5_day',
  },

  'day4_ginro': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'ginro', text: '手掌贴上去。不要用力。闭眼。' },
      { char: 'narrator', text: '你照他说的，把手贴在一棵老杉树上。' },
      { char: 'ginro', text: '别想别的。想你外婆的铃。' },
      { char: 'narrator', text: '过了很久——掌心底下，有什么东西轻轻跳了一下。温的。像是隔着很厚的毯子，摸到了一只小动物的心跳。' },
      { char: 'player', text: '……我听到了。' },
      { char: 'ginro', text: '嗯。千代学了三个月。你一个上午。' },
      { char: 'narrator', text: '他说得很淡，可是你觉得那是夸奖。' },
      { char: 'player', text: '银朗，你为什么会来杜鹃森？' },
      { char: 'narrator', text: '他沉默了很久。久到你以为他不会回答。' },
      { char: 'ginro', text: '六百年前，北边的狼群有一条规矩：人类进了领地，就要咬死。' },
      { char: 'ginro', text: '有一年冬天，一个人类的孩子掉进了雪沟。族长让我去。' },
      { char: 'ginro', text: '我把那个孩子叼了出来，送到了山下的村子口。' },
      { char: 'ginro', text: '回去以后，我就被赶出来了。「银色的叛徒」。走了三个月，倒在这片森林外面。琥珀捡到了我。' },
      { char: 'player', text: '……那雪丸呢？你为什么一直赶他走？' },
      { char: 'ginro', text: '北边还有一条规矩。收留叛徒的狼，也是叛徒。' },
      { char: 'ginro', text: '他留在我身边一天，就一天回不去。他娘拼了命才让他在族里长大，我不能让他跟我一样。' },
      { char: 'ginro', text: '而且——我什么都给不了他。一片不是我的森林，一把刀，一条巡逻的路。' },
      { char: 'player', text: '他不想回去。他想要的，是有人叫他的名字。' },
      { char: 'narrator', text: '银朗的手按在树干上，指节慢慢收紧了。' },
      { char: 'ginro', text: '……' },
      { char: 'ginro', text: '那小子。今天早上，鱼吃完了吗。' },
      { char: 'player', text: '吃完了。连骨头都啃了。' },
      { char: 'ginro', text: '……是吗。' },
      { char: 'narrator', text: '回去的路上，他一直走在你的左边。你想起外婆的速写本，偷偷笑了。' },
    ],
    next: 'day5_day',
  },

  'day4_shiro': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'shiro', text: '这边这边！小心那根藤，会绊脚！' },
      { char: 'narrator', text: '白露拉着你的手，钻过一条只有他知道的小路。眼前忽然开阔起来——' },
      { char: 'narrator', text: '一整片山谷，开满了花。粉的，白的，淡紫的，在风里一层一层地翻动。' },
      { char: 'shiro', text: '都是我种的哦！一棵一棵，用角上的灵力催出来的。种了六十年。' },
      { char: 'narrator', text: '山谷正中央，有一棵很大的白樱。樱树底下，花开得最密。' },
      { char: 'shiro', text: '……这里，是我娘睡觉的地方。' },
      { char: 'narrator', text: '他蹲下来，摸了摸树根旁边一块平平的石头。' },
      { char: 'shiro', text: '六十年前，结界破了一次。那时候还是千代婆婆的娘在摇铃，她生病了，没来得及。' },
      { char: 'shiro', text: '有东西从裂缝里钻进来。黑色的，很大。娘让我躲在树洞里，不许出声。' },
      { char: 'shiro', text: '我听到了好多声音。后来安静了。我偷偷往外看——' },
      { char: 'narrator', text: '他的手指抠进了泥土里。' },
      { char: 'shiro', text: '我看到一条好大的黑蛇，盘在我娘身上。一圈一圈，把她缠得紧紧的。' },
      { char: 'shiro', text: '天亮的时候，蛇走了。娘没有再醒过来。' },
      { char: 'player', text: '……那条蛇是……' },
      { char: 'shiro', text: '玄夜。' },
      { char: 'shiro', text: '琥珀姐说，也许不是那样的。可是那天晚上，我是亲眼看到的。' },
      { char: 'narrator', text: '风吹过来。白樱的花瓣落在他的头发上，落在那块石头上。' },
      { char: 'shiro', text: '……对不起，带你来这么难过的地方。' },
      { char: 'shiro', text: '可是我想让你认识我娘。千代婆婆每次来，都会在这里坐一会儿，跟她说说话。' },
      { char: 'narrator', text: '你在石头前面坐下。白露靠在你肩膀上，小声地，跟他娘介绍你。' },
      { char: 'shiro', text: '娘，这是千代婆婆的外孙。人很好。答应了要带我去看海。' },
      { char: 'shiro', text: '……所以你不用担心我了。我现在，有人记着了。' },
    ],
    next: 'day5_day',
  },

  'day4_yukimaru': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'yukimaru', text: '抓紧了啊——一、二——' },
      { char: 'narrator', text: '你还没来得及说「等一下」，就被他扛上了肩膀。风在耳边呼啸，几个纵跳之后，你们站在了森林最高的那棵树上。' },
      { char: 'yukimaru', text: '看，北边。那一排白的。' },
      { char: 'narrator', text: '很远很远的地方，天边有一线雪白的山脊，像是用刀切出来的。' },
      { char: 'yukimaru', text: '那就是我家。……以前是。' },
      { char: 'player', text: '你想回去吗？' },
      { char: 'yukimaru', text: '不想。那边规矩太多。不准化人形，不准靠近人类，不准离开领地，不准这不准那。' },
      { char: 'yukimaru', text: '我娘在那里憋了一辈子。她小时候可野了，据说天天跟在一只银色的哥哥屁股后面跑。' },
      { char: 'yukimaru', text: '后来那个哥哥被赶走了。她就再也没跑过。' },
      { char: 'narrator', text: '他晃着腿，尾巴垂在树枝下面，一动不动。' },
      { char: 'yukimaru', text: '族里的老家伙们都叫他「银色的叛徒」。说他为了一个人类小鬼背叛了族群。' },
      { char: 'yukimaru', text: '可我娘不是这么说的。她说，那是整个族里最温柔的一只狼。' },
      { char: 'yukimaru', text: '她临走的时候拉着我的手说：「雪丸，去找你舅舅。他会叫你的名字的。」' },
      { char: 'narrator', text: '他咧嘴一笑。虎牙露出来，眼睛却有点亮。' },
      { char: 'yukimaru', text: '结果呢。半年了。「你」「小子」「回去」。' },
      { char: 'yukimaru', text: '……喂。人类是怎么让别人叫自己名字的？' },
      { char: 'player', text: '大概……先叫对方的名字吧。' },
      { char: 'yukimaru', text: '……' },
      { char: 'yukimaru', text: '那也太丢脸了。' },
      { char: 'narrator', text: '他把脸扭过去。过了一会儿，你听到他很小声地，对着北边的风，练习了一下——' },
      { char: 'yukimaru', text: '……舅舅。' },
      { char: 'yukimaru', text: '啊啊啊不行不行！你刚才什么都没听到！' },
    ],
    next: 'day5_day',
  },

  'day4_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '苍羽从屋顶上落下来，站在你面前，看了你很久。' },
      { char: 'sou', text: '……你想看看天上吗？' },
      { char: 'player', text: '可以吗？' },
      { char: 'sou', text: '千代年轻的时候，我带她飞过一次。她尖叫了一路，落地以后说「再来一次」。' },
      { char: 'narrator', text: '他退后一步。风忽然大了起来，蓝色的羽毛在空中散开——', transform: { char: 'sou', text: '蓝鹰 · 展翼' } },
      { char: 'narrator', text: '一只巨大的蓝鹰低下头，示意你爬上它的背。' },
      { char: 'narrator', text: '然后，地面一下子远了。' },
      { char: 'narrator', text: '整片杜鹃森在脚下展开。绿色的海洋，神社是其中一粒小小的红点，溪流像银线一样穿过去。' },
      { char: 'narrator', text: '可是在森林的北边，你看到了一片一片的黑色。像墨水滴在宣纸上，正在慢慢晕开。' },
      { char: 'sou', text: '三天前，只有一片。今天，是十一片。' },
      { char: 'sou', text: '我每天都在数。' },
      { char: 'narrator', text: '他在云层边缘盘旋。风很大，他的声音却很清楚。' },
      { char: 'sou', text: '在天上，什么都看得见。谁在哭，谁在笑，谁一个人坐在溪边，谁一个人按着石头。' },
      { char: 'sou', text: '看得见所有人，就碰不到任何人。' },
      { char: 'sou', text: '千代的饭团，是我唯一愿意落到屋檐上的理由。' },
      { char: 'narrator', text: '落地的时候，他变回了人形。风把他的长发吹到你的肩膀上。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……明天早上，屋檐上，会放饭团吗？' },
      { char: 'player', text: '梅子的？' },
      { char: 'sou', text: '……' },
      { char: 'sou', text: '梅子的。' },
    ],
    next: 'day5_day',
  },

  'day4_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'genya', text: '白天也敢下来？千代至少还知道挑晚上。' },
      { char: 'narrator', text: '玄夜靠在要石旁边，脸色比前一晚更白了。可他看到你，还是扬了扬下巴，指了指棋盘。' },
      { char: 'genya', text: '会下棋吗？' },
      { char: 'player', text: '……只知道五子连成一线就赢。' },
      { char: 'genya', text: '那是五子棋。算了，教你。反正你外婆当年也是从这个水平开始的。' },
      { char: 'narrator', text: '黑子，白子。他下得很慢，每一步都要按着要石缓一口气。你输了三盘，第四盘，他故意让你赢了。' },
      { char: 'genya', text: '跟你外婆一样。赢了就笑得像个傻子。' },
      { char: 'player', text: '玄夜。六十年前，白露的娘……到底发生了什么？' },
      { char: 'narrator', text: '他捏着一枚白子，停在了半空中。' },
      { char: 'genya', text: '结界破了。一只堕兽钻了进来，扑向那棵白樱底下。树洞里，藏着一只小鹿。' },
      { char: 'genya', text: '她挡在树洞前面。我赶到的时候，她已经站不住了。' },
      { char: 'genya', text: '我把堕兽绞碎了。然后，把她缠了起来。' },
      { char: 'player', text: '缠起来……' },
      { char: 'genya', text: '蛇的身体是冷的。可是缠紧了，也能挡住风。' },
      { char: 'genya', text: '她血流得太多了，冷得一直发抖。我能做的，只有这个。缠着她，等天亮。' },
      { char: 'genya', text: '她走之前，一直在说一个名字。白露，白露。' },
      { char: 'narrator', text: '棋子落在棋盘上。很轻的一声。' },
      { char: 'player', text: '为什么不告诉他？他恨了你六十年！' },
      { char: 'genya', text: '因为那孩子需要一个可以恨的东西。' },
      { char: 'genya', text: '恨一条蛇，比恨他娘为什么丢下他一个人，要容易得多。' },
      { char: 'genya', text: '千代知道。她劝了我六十年。我没听。' },
      { char: 'narrator', text: '他抬起眼睛看你。那双紫色的竖瞳里，第一次没有笑意。' },
      { char: 'genya', text: '现在你也知道了。要不要告诉他——那是你的事。' },
      { char: 'genya', text: '……我只是，不想让他再怕我了。怕了六十年，也该累了。' },
    ],
    next: 'day5_day',
  },
  // =============== DAY 5 ===============
  'day5_day': {
    scene: 'shrine', particles: 'spirits', day: 5,
    chapter: { num: '第五天', title: '裂隙' },
    lines: [
      { char: 'narrator', text: '第五天，天阴着。' },
      { char: 'narrator', text: '早上去井边打水的时候，你看到鸟居的柱脚上，多了一小块黑斑。' },
      { char: 'narrator', text: '它已经爬到神社门口了。' },
      { char: 'narrator', text: '琥珀一整天都很安静。银朗天没亮就出去巡逻，到中午都没回来。屋顶上，苍羽一圈一圈地盘旋，比平时低得多。' },
      { char: 'narrator', text: '只有溪边偶尔传来雪丸和白露打闹的声音。像是想用吵闹，把什么东西推开。' },
      { char: 'player', text: '（后天就是满月了。）' },
      { char: 'player', text: '（念出名字……就这么简单的事。可是念完以后，我就是新的守铃人了。每个满月，都要回来。一辈子。）' },
      { char: 'player', text: '（外婆，你当年决定的时候，在想什么呢？）' },
    ],
    choices: [
      { text: '去溪边找白露，把六十年前那晚的真相告诉他', if: 'genya_truth', affection: { deer: 1, snake: 2 }, flag: 'told_truth', next: 'day5_truth' },
      { text: '在屋檐上放一个梅子饭团', affection: { hawk: 1 }, next: 'day5_evening' },
      { text: '去鸟居下面，等银朗巡逻回来', affection: { wolf: 1 }, next: 'day5_evening' },
      { text: '陪琥珀一起，给外婆的房间换上新的花', affection: { fox: 1 }, next: 'day5_evening' },
    ],
  },

  'day5_truth': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'narrator', text: '你把玄夜说的话，一句一句，都告诉了白露。' },
      { char: 'narrator', text: '白樱底下的树洞。挡在树洞前面的白鹿。冰冷的、缠紧了用来挡风的蛇身。' },
      { char: 'narrator', text: '还有那个，被念了一整夜的名字。' },
      { char: 'shiro', text: '……骗人。' },
      { char: 'narrator', text: '可是这一次，他没有跑。' },
      { char: 'shiro', text: '那……那他为什么不说？为什么让我恨他？我……我朝他扔过石头。好多次。' },
      { char: 'yukimaru', text: '……白露。' },
      { char: 'narrator', text: '雪丸蹲下来，把白露的脑袋按在自己肩膀上。' },
      { char: 'yukimaru', text: '那条蛇是个笨蛋。跟我舅舅一样的笨蛋。' },
      { char: 'yukimaru', text: '这种笨蛋，就喜欢一个人扛着。扛到最后，自己都忘了怎么放下来。' },
      { char: 'shiro', text: '我……我想去找他。' },
      { char: 'shiro', text: '可是我好怕。不是怕他。是怕我……不知道该说什么。' },
      { char: 'player', text: '满月以后，我陪你一起去。' },
      { char: 'narrator', text: '白露点了点头。他头上的角，开出了一朵花。' },
      { char: 'narrator', text: '是紫色的。他从来没开过紫色的花。' },
    ],
    next: 'day5_evening',
  },

  'day5_evening': {
    scene: 'night-shrine', particles: 'spirits',
    lines: [
      { char: 'narrator', text: '入夜以后，风停了。' },
      { char: 'narrator', text: '连虫鸣都没有了。整片森林安静得不正常，像是屏住了呼吸。' },
      { char: 'narrator', text: '你躺在外婆的房间里，睁着眼睛。枕边的铃，一下，一下，很轻地颤着。' },
      { char: 'narrator', text: '然后——' },
      { char: 'narrator', text: '轰。' },
      { char: 'narrator', text: '整座神社猛地一震。纸拉门哗啦啦地响，房梁上的灰簌簌往下掉。' },
      { char: 'narrator', text: '你抓起铃冲出房间。北边的天空，裂开了一道黑色的口子。' },
    ],
    next: 'crisis_gather',
  },

  'crisis_gather': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }],
    lines: [
      { char: 'kohaku', text: '结界北坡……裂开了！' },
      { char: 'ginro', text: '不止北坡。东边和西边的结，刚才同时断了。' },
      { char: 'narrator', text: '一阵风压下来。苍羽落在了前庭正中央，衣摆上沾着黑色的灰。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'sou', text: '十一片黑斑，现在连成了一片。有东西从裂缝里爬出来了。' },
      { char: 'sou', text: '不是一只两只。它们……在往神社这边来。' },
      { char: 'narrator', text: '石阶上一阵急促的脚步声。雪丸背着白露，三步并作两步冲了上来。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '溪那边全是黑雾！白露的花谷——' },
      { char: 'shiro', text: '娘的樱树……樱树在变黑……' },
      { char: 'narrator', text: '就在这时，正殿后面传来一声闷响。' },
      { char: 'narrator', text: '一个人扶着墙，踉踉跄跄地走了出来。黑色的长发拖在地上，半边身子的鳞片都裂开了。',
        chars: [{ id: 'genya', pos: 'center', form: 'human' }] },
      { char: 'genya', text: '……别吵了。' },
      { char: 'genya', text: '要石，撑不住了。' },
      { char: 'narrator', text: '所有人都僵住了。银朗的手按上了刀柄。白露躲到了雪丸身后。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }], ifnot: 'told_truth' },
      { char: 'narrator', text: '所有人都僵住了。银朗的手按上了刀柄。只有白露，从雪丸身后探出头来，死死地看着那个人。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }], if: 'told_truth' },
      { char: 'ginro', text: '你从要石那里过来？你在底下做什么？' },
      { char: 'genya', text: '按着它。' },
      { char: 'genya', text: '千代没来的那天起，我就一直按着。二十六天。' },
      { char: 'narrator', text: '琥珀的脸一下子白了。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '二十六天……你一个人？为什么不说？！' },
      { char: 'genya', text: '说了，你会信吗？' },
      { char: 'narrator', text: '一片死寂。只有北边传来的、越来越近的低吼。' },
      { char: 'kohaku', text: '……我信。' },
      { char: 'kohaku', text: '玄夜，现在我信。' },
      { char: 'narrator', text: '玄夜看着她，像是第一次认识她一样。然后他扯了扯嘴角。' },
      { char: 'genya', text: '……那就别光站着。' },
      { char: 'ginro', text: '——都听着。',
        chars: [{ id: 'ginro', pos: 'center', form: 'human' }] },
      { char: 'ginro', text: '苍羽，天上，给我报它们的方向。琥珀，去要石，跟玄夜一起按住它。' },
      { char: 'ginro', text: '白露，守着那个人类。一步都别离开。' },
      { char: 'ginro', text: '你——' },
      { char: 'narrator', text: '他看向雪丸，顿了一下。' },
      { char: 'ginro', text: '……跟我来。北坡。' },
      { char: 'narrator', text: '雪丸愣了半秒，然后咧开嘴笑了。露出那颗虎牙。',
        chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }] },
      { char: 'yukimaru', text: '早说嘛！' },
      { char: 'narrator', text: '玄夜被琥珀扶着往回走。经过你身边时，他压低了声音。',
        chars: [{ id: 'genya', pos: 'center', form: 'human' }] },
      { char: 'genya', text: '把铃藏好。它们是闻着铃的味道来的。' },
      { char: 'genya', text: '……守铃人，是它们最想吃掉的东西。' },
    ],
    next: 'crisis_battle',
  },

  'crisis_battle': {
    scene: 'night-shrine', particles: 'spirits',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '所有人都散开了。' },
      { char: 'narrator', text: '远处传来狼嚎，鹰啸，还有某种说不清的、湿漉漉的嘶吼声。北边的天空一闪一闪，像是有人在云里打雷。' },
      { char: 'narrator', text: '你和白露守在正殿门前。他张开双臂挡在你前面，腿在发抖。' },
      { char: 'shiro', text: '没、没事的。我也是森林的一员。我会保护你的。' },
      { char: 'narrator', text: '石灯笼里的青火，一盏一盏地灭了。' },
      { char: 'narrator', text: '黑雾从石阶底下涌上来。雾里有眼睛。很多很多双，饿得发红的眼睛。' },
      { char: 'narrator', text: '其中最大的一只，从雾里慢慢站了起来。它曾经大概是一只熊，或者一头野猪。现在只剩下一个黑色的、饿的形状。' },
      { char: 'narrator', text: '它嗅了嗅。然后，笔直地朝你冲了过来。' },
      { char: 'shiro', text: '——不许过来！！' },
      { char: 'narrator', text: '白露化作白鹿冲了上去，被一爪子掀飞，重重撞在石灯笼上。', transform: { char: 'shiro', text: '白玉鹿' } },
      { char: 'narrator', text: '黑色的巨影压了下来。你把铃死死攥在胸口，闭上了眼睛。',
        chars: [] },
      { char: 'narrator', text: '——然后，一道光挡在了你面前。' },
    ],
    next_by_affection: true,
  },

      { char: 'narrator', text: '天快亮的时候，它松开了你们，化回人形，靠在正殿的柱子上，几乎站不稳。',
        chars: [{ id: 'genya', pos: 'center', form: 'human' }] },

      { char: 'genya', text: '我只是……不想再晚到一次了。' },

      { char: 'genya', text: '琥珀在底下按着要石。……她说，「去吧，这里我替你」。六十年了，第一次有人替我。' },

  },

  // =============== DAY 6 ===============
  'crisis_aftermath': {
    scene: 'shrine', particles: 'spirits', day: 6,
    chapter: { num: '第六天', title: '余烬与晨光' },
    lines: [
      { char: 'narrator', text: '天亮了。' },
      { char: 'narrator', text: '裂缝合上了，勉勉强强。北坡烧焦了一大片，前庭的石灯笼倒了一半。' },
      { char: 'narrator', text: '每个人都带着伤。可是，每个人都在。' },
      { char: 'narrator', text: '银朗坐在石阶上包扎手臂。雪丸蹲在旁边，想帮忙又不敢伸手。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'ginro', pos: 'right', form: 'human' }] },
      { char: 'ginro', text: '……要帮就帮。别在那里晃。' },
      { char: 'narrator', text: '雪丸手忙脚乱地接过绷带。缠得歪歪扭扭，银朗也没说什么。' },
      { char: 'ginro', text: '雪丸。' },
      { char: 'narrator', text: '雪丸的手停住了。' },
      { char: 'ginro', text: '……昨晚，你做得很好。' },
      { char: 'ginro', text: '你娘……会骄傲的。' },
      { char: 'narrator', text: '雪丸低着头，一声不吭，把绷带缠了一圈又一圈。缠到第五圈的时候，一滴水落在了银朗的手背上。' },
      { char: 'yukimaru', text: '……嗯。舅舅。' },
      { char: 'narrator', text: '缘廊那边，琥珀端着一碗热茶，走到了靠着柱子的玄夜面前。',
        chars: [{ id: 'kohaku', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'kohaku', text: '杜鹃花茶。……千代说，你从来不喝。' },
      { char: 'genya', text: '她每次都放一碗在洞口。' },
      { char: 'kohaku', text: '六十年，我一直在怀疑你。对不起。' },
      { char: 'genya', text: '……你们狐狸，道歉都这么直接的吗。' },
      { char: 'narrator', text: '可他还是接过了那碗茶。' },
      { char: 'narrator', text: '一个小小的身影，从琥珀身后走了出来。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }], if: 'told_truth' },
      { char: 'narrator', text: '白露攥着衣角，站在玄夜面前。他的腿在发抖，但他没有躲。', if: 'told_truth' },
      { char: 'shiro', text: '……谢谢你。那天晚上，陪着我娘。', if: 'told_truth' },
      { char: 'narrator', text: '他从头上摘下一朵紫色的花，放在玄夜手心里，然后飞快地跑回了你身后。', if: 'told_truth' },
      { char: 'narrator', text: '玄夜低头看着那朵花，很久很久，一动不动。', if: 'told_truth' },
      { char: 'narrator', text: '白露远远地看着玄夜。没有躲，也没有靠近。只是看着。', ifnot: 'told_truth' },
      { char: 'narrator', text: '屋顶上掉下来一个饭团。然后，苍羽自己也落了下来，在缘廊的最边上，坐下了。',
        chars: [{ id: 'sou', pos: 'center', form: 'human' }] },
      { char: 'sou', text: '……今天，在这里吃。' },
      { char: 'narrator', text: '那是你第一次，看到他们六个人坐在同一张桌子边上。' },
    ],
    next: 'day6_talk',
  },

  'day6_talk': {
    scene: 'night-shrine', particles: 'fireflies',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '饭后，琥珀把你叫到了缘廊上。' },
      { char: 'kohaku', text: '明天，就是满月了。' },
      { char: 'kohaku', text: '昨晚那样的事，结界撑不住第二次了。明天夜里，要石需要那枚铃。需要守铃人，念出我们的名字。' },
      { char: 'kohaku', text: '可是，我要先跟你说清楚。' },
      { char: 'kohaku', text: '一旦念了，你就是新的守铃人。以后每一个满月，你都要回到这里。不管你在哪里，在做什么。' },
      { char: 'kohaku', text: '千代把五十年，都给了这座山。结婚那天是满月，她穿着白无垢跑上来摇完铃，又跑下去。' },
      { char: 'kohaku', text: '你母亲出生那晚，她在医院，托她娘替她上的山。' },
      { char: 'narrator', text: '琥珀笑了一下。然后，很认真地看着你。' },
      { char: 'kohaku', text: '我们不能替你决定。千代也不能。' },
      { char: 'kohaku', text: '如果你不愿意，明天满月，结界打开，你就下山。我们会想别的办法。……总会有办法的。' },
      { char: 'narrator', text: '你想起城里的房间。便利店的晚饭。手机屏幕的光。' },
      { char: 'narrator', text: '想起这六天。花茶，狼嚎，溪水，屋檐上的饭团，地底下的棋盘。' },
      { char: 'player', text: '（外婆。你说要我先认识他们每一个。）' },
      { char: 'player', text: '（我认识了。可是，我还想……再多认识一点。）' },
      { char: 'kohaku', text: '今天，是最后一个完整的白天了。去吧，去见想见的人。' },
    ],
    choices: [
      { text: '「那就……陪我去鸟居下面坐一会儿吧，琥珀。」', affection: { fox: 3 }, next: 'day6_kohaku' },
      { text: '去找银朗，走一遍满月那晚的山路', affection: { wolf: 3 }, next: 'day6_ginro' },
      { text: '白露说，他还有一样东西要给你', affection: { deer: 3 }, next: 'day6_shiro' },
      { text: '雪丸在树上等你，说有话要讲', affection: { whitewolf: 3 }, next: 'day6_yukimaru' },
      { text: '晚上，爬上屋顶，带一个梅子饭团', affection: { hawk: 3 }, next: 'day6_sou' },
      { text: '再下一次石阶，把那盘没下完的棋下完', affection: { snake: 3 }, next: 'day6_genya' },
    ],
  },
  'day6_kohaku': {
    scene: 'shrine', particles: 'sakura',
    chars: [{ id: 'kohaku', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '黄昏。你和琥珀并排坐在鸟居下面的石阶上。' },
      { char: 'kohaku', text: '上个满月，我就是坐在这里等千代的。从太阳落山，等到太阳出来。' },
      { char: 'kohaku', text: '天亮的时候我跟自己说，下个月吧。下个月她就来了。' },
      { char: 'narrator', text: '她的尾巴绕过来，搭在你们俩中间的石阶上。尾尖轻轻地、一下一下地拍着。' },
      { char: 'kohaku', text: '……我有点怕。' },
      { char: 'player', text: '怕什么？' },
      { char: 'kohaku', text: '怕又开始等一个人类。' },
      { char: 'kohaku', text: '等你从小不点变成大人，从大人变成老人，然后有一天，又不来了。' },
      { char: 'kohaku', text: '千代走了以后，我跟自己说，再也不要了。狐狸的心，没有那么多地方可以放。' },
      { char: 'narrator', text: '她转过头来看你。夕阳把她的眼睛染成了真正的琥珀色。' },
      { char: 'kohaku', text: '所以，答应我一件事。' },
      { char: 'kohaku', text: '不要为了千代，也不要为了我们，去当什么守铃人。' },
      { char: 'kohaku', text: '如果你来——是因为你自己想来。' },
      { char: 'player', text: '……我想来。' },
      { char: 'player', text: '二十年前我就说过了。长大了，要来找你玩。' },
      { char: 'narrator', text: '琥珀愣住了。然后，她笑了。这一次，尾巴也在笑。' },
      { char: 'kohaku', text: '……真是的。你们这一家人，都这么会说话。' },
    ],
    next: 'day7_ceremony',
  },

  'day6_ginro': {
    scene: 'moonlit', particles: 'fireflies',
    chars: [{ id: 'ginro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'ginro', text: '满月那晚，结界从鸟居往下开。走这条路。' },
      { char: 'narrator', text: '他带着你，从鸟居一直走到山脚。走得很慢，每一个转弯，每一块会松动的石头，都指给你看。' },
      { char: 'ginro', text: '这块会滑。下雨天踩左边。' },
      { char: 'ginro', text: '这里有蛇。不是那条，是普通的。' },
      { char: 'narrator', text: '走到那棵裂开的老杉树下，他停住了。山脚下的小镇，灯一盏一盏亮起来。' },
      { char: 'ginro', text: '……千代每次都是在这里跟我说「下个月见」。' },
      { char: 'ginro', text: '五十年。六百次。' },
      { char: 'narrator', text: '他看着山下，不看你。' },
      { char: 'ginro', text: '如果你来。' },
      { char: 'ginro', text: '……每个满月，我在这里等你。' },
      { char: 'ginro', text: '你右耳不是不好吗——不对，那是千代。你……你想走哪边都行。' },
      { char: 'narrator', text: '你第一次看到他乱了阵脚。耳朵红到了根。' },
      { char: 'player', text: '那我走你左边。' },
      { char: 'ginro', text: '……嗯。' },
      { char: 'ginro', text: '狼不会忘记气味。二十年前没忘，以后也不会。' },
    ],
    next: 'day7_ceremony',
  },

  'day6_shiro': {
    scene: 'spring', particles: 'sakura',
    chars: [{ id: 'shiro', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '花谷的白樱被烧焦了一半。可是焦黑的树枝上，已经冒出了新芽。' },
      { char: 'shiro', text: '我昨天晚上，一整夜都在跟它说话。它说它还想开花。' },
      { char: 'narrator', text: '白露蹲在树下，双手合拢，像是捧着什么东西。' },
      { char: 'shiro', text: '给你。' },
      { char: 'narrator', text: '他张开手心。里面是一朵很小的花。花瓣是蓝色的，边缘有一圈淡淡的光。' },
      { char: 'shiro', text: '这是我角上开的，第一朵蓝色的花。' },
      { char: 'shiro', text: '千代婆婆的饼干盒子里，有五十多朵花。粉的、白的。一朵蓝的都没有。' },

      { char: 'shiro', text: '这朵花不会谢的。只要我还想着你，它就一直开着。' },
      { char: 'shiro', text: '所以——它会一直开着的！' },
      { char: 'shiro', text: '然后等你带我去看海的那天，你就把它扔进海里。我想知道，它在咸咸的水里，还会不会开。' },
      { char: 'narrator', text: '他笑着说。眼睛亮晶晶的。' },
    ],
    next: 'day7_ceremony',
  },

  'day6_yukimaru': {
    scene: 'snowfield', particles: 'snowflakes',
    chars: [{ id: 'yukimaru', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '还是那棵最高的树。雪丸坐在树枝上，这次没有看北边。' },
      { char: 'yukimaru', text: '喂。我决定了。' },
      { char: 'yukimaru', text: '我不回北边了。' },

      { char: 'yukimaru', text: '你不许笑啊！' },

    next: 'day7_ceremony',

  'day6_sou': {
    scene: 'sky', particles: 'feathers',
    chars: [{ id: 'sou', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '夜里，你抱着一个梅子饭团，顺着梯子爬上了屋顶。' },
      { char: 'narrator', text: '苍羽坐在屋脊上。受伤的肩膀缠着绷带。看到你，他往旁边让了让。' },

      { char: 'sou', text: '以后起风的时候，看一眼天上。那是我在看你。' },

  'day6_genya': {
    scene: 'cave', particles: 'spirits',
    chars: [{ id: 'genya', pos: 'center', form: 'human' }],
    lines: [
      { char: 'narrator', text: '要石的光比前几天弱了很多。琥珀在洞口留了一碗花茶，已经凉了。' },
      { char: 'narrator', text: '玄夜靠在石头旁边，手边摆着那盘下到一半的棋。' },
      { char: 'genya', text: '来了？坐。轮到你了。' },

      { char: 'genya', text: '我把它放在棋盘边上了。你看，还开着。', if: 'told_truth' },

      { char: 'narrator', text: '他落下一枚黑子。' },
      { char: 'genya', text: '我怕的是被忘掉。' },
      { char: 'genya', text: '千代记得我。每个满月，她念到我的名字的时候，都会停一下，笑一下。好像在说「又输给你了」。' },
      { char: 'genya', text: '她走了以后，我躺在这块石头旁边，一遍一遍地想——这世上，还有谁会停下来，念我的名字。' },

      { char: 'narrator', text: '他怔住了。然后，很慢很慢地，笑了。不是那种危险的、看不透的笑。' },

    ],
    next: 'day7_ceremony',
  },

  // =============== DAY 7 ===============
  'day7_ceremony': {
    scene: 'cave', particles: 'spirits', day: 7,
    chapter: { num: '终章', title: '满月' },
    lines: [

      { char: 'player', text: '琥珀。',
        chars: [{ id: 'kohaku', pos: 'center', form: 'human' }] },
      { char: 'kohaku', text: '……在。' },

      { char: 'ginro', text: '在。' },
      { char: 'player', text: '白露。',
        chars: [{ id: 'ginro', pos: 'left', form: 'human' }, { id: 'shiro', pos: 'right', form: 'human' }] },
      { char: 'shiro', text: '在、在这里！' },
      { char: 'player', text: '雪丸。',
        chars: [{ id: 'shiro', pos: 'left', form: 'human' }, { id: 'yukimaru', pos: 'right', form: 'human' }] },
      { char: 'yukimaru', text: '在！' },
      { char: 'player', text: '苍羽。',
        chars: [{ id: 'yukimaru', pos: 'left', form: 'human' }, { id: 'sou', pos: 'right', form: 'human' }] },
      { char: 'sou', text: '……在。' },
      { char: 'player', text: '玄夜。',
        chars: [{ id: 'sou', pos: 'left', form: 'human' }, { id: 'genya', pos: 'right', form: 'human' }] },
      { char: 'genya', text: '……在。一直都在。' },
      { char: 'narrator', text: '要石亮了。',
        chars: [] },

function initTitle() {
  const c = $('#title-particles');
  for (let i = 0; i < 20; i++) {
    const f = document.createElement('div');
    f.className = 'title-firefly';
    f.style.left = Math.random() * 100 + '%';
    f.style.top = Math.random() * 100 + '%';
    f.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    f.style.setProperty('--dy', (Math.random() * 60 - 30) + 'px');
    f.style.animationDuration = (6 + Math.random() * 8) + 's';
    f.style.animationDelay = Math.random() * 6 + 's';
    c.appendChild(f);
  }
  $('#start-btn').addEventListener('click', () => {
    const go = () => {
      resetGame();
      const gen = state.gen;
      hideTitle(() => { if (gen === state.gen) playNode('start'); });
    };
    if (hasAnySave()) confirmBox('开始新的物语？\n已有的存档不会被删除。', go); else go();
  });
  $('#continue-btn').addEventListener('click', () => {
    const latest = latestSave();
    if (latest) applySave(latest);
  });
  $('#title-load-btn').addEventListener('click', () => openSlots('load'));
  refreshTitleButtons();
}

function hideTitle(cb) {
  const t = $('#title-screen');
  t.classList.add('hidden');
  const gen = state.gen;
  setTimeout(() => { if (gen === state.gen) t.style.display = 'none'; if (cb) cb(); }, 1500);
}

function playNode(id) {
  const node = S[id];
  if (!node) return;
  const gen = ++state.gen;
  state.currentNode = id;
  state.line = 0;
  if (node.day) { state.day = node.day; updateDay(); }
  if (node.scene) { state.scene = node.scene; setScene(node.scene); }
  if ('particles' in node) { state.particles = node.particles; setParticles(node.particles); }
  state.chars = (node.chars || []).map(c => ({ ...c }));
  if (node.chars) setChars(node.chars); else clearChars();
  if (node.transform_immediate) showTransform(node.transform_immediate.char, node.transform_immediate.text);
  if (node.chapter) state.chapter = node.chapter;
  autoSave();

  if (node.chapter) {
    showChapter(node.chapter.num, node.chapter.title, () => { if (gen === state.gen) startLines(node, 0); });
  } else {
    startLines(node, 0);
  }
}

function startLines(node, i) {
  state.line = i;
  if (!node.lines || i >= node.lines.length) { afterLines(node); return; }
  const line = node.lines[i];
  if ((line.if && !state.flags[line.if]) || (line.ifnot && state.flags[line.ifnot])) { startLines(node, i + 1); return; }
  if (line.chars) { state.chars = line.chars.map(c => ({ ...c })); setChars(state.chars); }
  if (line.transform) showTransform(line.transform.char, line.transform.text);
  showDialogue(line, () => startLines(node, i + 1));
}

function markSpeaker(id) {
  const sprites = [...$$('.character-sprite')];
  const me = sprites.find(s => s.dataset.id === id);
  if (!me) return;
  sprites.forEach(s => {
    const role = s === me ? 'speaking' : 'listening';
    s.classList.toggle('speaking', s === me);
    s.classList.toggle('listening', s !== me);
    const img = s.querySelector('img');
    if (img && sprites.length > 1) img.style.cssText = portraitStyle(CHARS[s.dataset.id][s.dataset.form], s.dataset.pos, role);
  });
}

function afterLines(node) {
  if (node.choices) showChoices(node.choices);
  else if (node.next_by_affection) routeByAff();
  else if (node.next_by_affection_ending) routeToEnding();
  else if (node.ending) showEnding(node.ending);
  else if (node.next) playNode(node.next);
}

function showDialogue(line, cb) {
  const ch = CHARS[line.char];
  const nameEl = $('#speaker-name');
  const textEl = $('#dialogue-text');
  const ind = $('#text-indicator');

  nameEl.textContent = ch.name;
  nameEl.style.color = ch.color;
  if (ch.affKey) state.flags['met_' + line.char] = true;
  markSpeaker(line.char);
  textEl.innerHTML = '';
  ind.classList.remove('show');
  state.textComplete = false;
  state.charTimers.forEach(t => clearTimeout(t));
  state.charTimers = [];

  const chars = line.text.split('');
  const spans = chars.map(c => {
    const s = document.createElement('span');
    s.className = 'char';
    s.textContent = c;
    textEl.appendChild(s);
    return s;
  });

  let r = 0;
  const speed = 38;
  function reveal() {
    if (r < spans.length) { spans[r].classList.add('visible'); r++; state.charTimers.push(setTimeout(reveal, speed)); }
    else { state.textComplete = true; ind.classList.add('show'); }
  }
  reveal();

  detachDialogue();
  function advance(e) {
    e.preventDefault(); e.stopPropagation();
    if (!state.textComplete) {
      state.charTimers.forEach(t => clearTimeout(t)); state.charTimers = [];
      spans.forEach(s => s.classList.add('visible'));
      state.textComplete = true; ind.classList.add('show');
    } else {
      detachDialogue();
      cb();
    }
  }
  function keyAdv(e) { if (overlayOpen()) return; if (e.key === ' ' || e.key === 'Enter') advance(e); }
  state.dlg = { advance, keyAdv };
  $('#dialogue-box').addEventListener('click', advance);
  document.addEventListener('keydown', keyAdv);
}

function detachDialogue() {
  if (!state.dlg) return;
  $('#dialogue-box').removeEventListener('click', state.dlg.advance);
  document.removeEventListener('keydown', state.dlg.keyAdv);
  state.dlg = null;
}

function showChoices(choices) {
  const layer = $('#choice-layer');
  const c = $('#choice-container');
  c.innerHTML = '';
  choices.filter(ch => !(ch.if && !state.flags[ch.if]) && !(ch.ifnot && state.flags[ch.ifnot])).forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice-btn'; b.textContent = ch.text;
    b.addEventListener('click', () => {
      layer.classList.remove('active');
      if (ch.affection) for (const [k, v] of Object.entries(ch.affection)) addAff(k, v);
      if (ch.flag) state.flags[ch.flag] = true;
      playNode(ch.next);
    });
    c.appendChild(b);
  });
  layer.classList.add('active');
}

function addAff(who, amt) {
  state.affection[who] = Math.min(100, state.affection[who] + amt * 7);
  showAffChange(who, amt);
}

function showAffChange(who, amt) {
  const colors = { fox:'#ff6b4a', wolf:'#7eb8da', deer:'#8fd4a0', whitewolf:'#e8e0d0', hawk:'#4a7eb8', snake:'#9a5abf' };
  const names = { fox:'琥珀', wolf:'银朗', deer:'白露', whitewolf:'雪丸', hawk:'苍羽', snake:'玄夜' };
  const el = document.createElement('div');
  el.className = 'aff-change';
  el.textContent = `${names[who]} +${amt}`;
  el.style.color = colors[who];
  el.style.top = '50%'; el.style.left = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function getMaxAff() {
  const a = state.affection;
  const entries = Object.entries(a);
  entries.sort((x, y) => y[1] - x[1]);
  return entries[0][0];
}

function routeByAff() {
  const map = { fox:'rescue_fox', wolf:'rescue_wolf', deer:'rescue_deer', whitewolf:'rescue_whitewolf', hawk:'rescue_hawk', snake:'rescue_snake' };
  playNode(map[getMaxAff()]);
}

function routeToEnding() {
  const map = { fox:'ending_fox', wolf:'ending_wolf', deer:'ending_deer', whitewolf:'ending_whitewolf', hawk:'ending_hawk', snake:'ending_snake' };
  playNode(map[getMaxAff()]);
}

function setScene(name) {
  const bg = $('#scene-bg');
  const l = document.createElement('div');
  const img = BACKGROUNDS[name];
  l.className = img ? 'scene-layer scene-img' : `scene-layer bg-${name}`;
  if (img) l.style.backgroundImage = `url("${img}")`;
  l.style.opacity = '0';
  bg.appendChild(l);
  requestAnimationFrame(() => requestAnimationFrame(() => { l.style.opacity = '1'; }));
  const old = [...bg.children].filter(c => c !== l);
  setTimeout(() => old.forEach(c => c.remove()), 900);
}

function setParticles(type) {
  const c = $('#particles'); c.innerHTML = '';
  if (state.particleInterval) clearInterval(state.particleInterval);
  const cfg = { fireflies:{cls:'firefly',n:12,iv:3000}, sakura:{cls:'sakura-petal',n:10,iv:2000}, spirits:{cls:'spirit-orb',n:8,iv:4000}, snowflakes:{cls:'snowflake',n:15,iv:1500}, feathers:{cls:'feather',n:6,iv:4000} };
  const cf = cfg[type]; if (!cf) return;
  function spawn() {
    const p = document.createElement('div');
    p.className = `particle ${cf.cls}`;
    p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*80+'%';
    p.style.animationDuration = (5+Math.random()*8)+'s';
    p.style.animationDelay = Math.random()*2+'s';
    c.appendChild(p);
    setTimeout(() => p.remove(), 15000);
  }
  for (let i=0;i<cf.n;i++) setTimeout(spawn, Math.random()*3000);
  state.particleInterval = setInterval(spawn, cf.iv);
}

// Keeps characters already on screen in place (sliding them if their slot changes)
// so a line-level cast change doesn't make everyone flash back in.
function setChars(chars) {
  const l = $('#character-layer');
  const want = new Map(chars.map(c => [c.id, c]));
  [...l.children].forEach(el => {
    const c = want.get(el.dataset.id);
    if (!c || el.dataset.form !== c.form) { el.remove(); return; }
    if (el.dataset.pos !== c.pos) {
      el.dataset.pos = c.pos;
      const img = el.querySelector('img');
      if (img) img.style.cssText = portraitStyle(CHARS[c.id][c.form], c.pos);
    }
  });
  chars.forEach(c => {
    if (l.querySelector(`[data-id="${c.id}"]`)) return;
    const w = document.createElement('div');
    w.className = 'character-sprite entering';
    w.id = `char-${c.id}`;
    Object.assign(w.dataset, { id: c.id, pos: c.pos, form: c.form });
    w.innerHTML = getPortrait(c.id, CHARS[c.id][c.form], c.pos);
    l.appendChild(w);
    requestAnimationFrame(() => requestAnimationFrame(() => { w.classList.remove('entering'); w.classList.add('visible'); }));
  });
  if (chars.length < 2) l.querySelectorAll('.character-sprite').forEach(s => s.classList.remove('listening'));
}

function clearChars() { $('#character-layer').innerHTML = ''; }

function showTransform(charId, text) {
  const o = $('#transform-overlay');
  $('#transform-text').textContent = text;
  o.classList.add('active');
  const sc = state.chars.find(c => c.id === charId);
  if (sc) sc.form = 'beast';
  const charEl = $(`#char-${charId}`);
  if (charEl) {
    charEl.classList.add('beast-transform');
    charEl.dataset.form = 'beast';
    setTimeout(() => {
      charEl.innerHTML = getPortrait(charId, CHARS[charId].beast, charEl.dataset.pos);
      charEl.classList.remove('beast-transform');
    }, 1200);
  }
  setTimeout(() => o.classList.remove('active'), 2600);
}

function showChapter(num, title, cb) {
  const o = $('#chapter-overlay');
  $('#chapter-num').textContent = num;
  $('#chapter-title').textContent = title;
  o.classList.add('active');
  setTimeout(() => { o.classList.remove('active'); if (cb) cb(); }, 3000);
}

function showEnding(e) {
  $('#ending-screen').classList.add('active');
  $('#ending-title').textContent = e.title;
  $('#ending-subtitle').textContent = e.subtitle;
  $('#dialogue-layer').style.display = 'none';
}

function updateDay() {
  const d = $('#day-indicator');
  d.textContent = state.day > 0 ? `第 ${state.day} 天 / 7` : '';
  d.classList.toggle('show', state.day > 0);
}
