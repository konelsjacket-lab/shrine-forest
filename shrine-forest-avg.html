<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>杜鹃森 — 神社与森林的恋爱物语</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

:root {
  --bg: #1a1a2e;
  --bg-overlay: rgba(10, 10, 20, 0.7);
  --text: #e8e0d4;
  --text-dim: #9a8e7e;
  --text-name: #f0c674;
  --accent-fox: #ff6b4a;
  --accent-fox-glow: rgba(255, 107, 74, 0.3);
  --accent-wolf: #7eb8da;
  --accent-wolf-glow: rgba(126, 184, 218, 0.3);
  --accent-deer: #8fd4a0;
  --accent-deer-glow: rgba(143, 212, 160, 0.3);
  --accent-gold: #d4a854;
  --accent-sakura: #e8a0b4;
  --ui-bg: rgba(20, 16, 30, 0.92);
  --ui-border: rgba(212, 168, 84, 0.3);
  --font: 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-ui: -apple-system, 'PingFang SC', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

#game {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
}

/* === Background Scene === */
#scene-bg {
  position: absolute; inset: 0;
  transition: opacity 1.2s ease;
}

.scene-layer {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  transition: all 1.5s ease;
}

/* Scene: Forest */
.bg-forest {
  background: linear-gradient(180deg,
    #0a1628 0%, #0f2418 15%, #0a3012 30%,
    #1a4a20 50%, #2a5a30 70%, #1a3a18 100%);
}
.bg-forest::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 3px 80px at 15% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 90px at 25% 55%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 85px at 40% 58%, #1a4020 0%, transparent 100%),
    radial-gradient(ellipse 5px 95px at 55% 52%, #0f2a10 0%, transparent 100%),
    radial-gradient(ellipse 3px 80px at 70% 60%, #1a3a18 0%, transparent 100%),
    radial-gradient(ellipse 4px 88px at 85% 56%, #1a4020 0%, transparent 100%);
}
.bg-forest::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(80,180,100,0.08) 0%, transparent 40%),
    radial-gradient(circle at 70% 20%, rgba(60,160,80,0.06) 0%, transparent 35%),
    radial-gradient(circle at 50% 80%, rgba(40,80,40,0.15) 0%, transparent 50%);
}

/* Scene: Shrine */
.bg-shrine {
  background: linear-gradient(180deg,
    #1a0a2e 0%, #2a1040 20%, #3a1848 35%,
    #2a1838 50%, #1a1028 70%, #0a0818 100%);
}
.bg-shrine::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 120px 8px at 50% 72%, rgba(180,80,60,0.15) 0%, transparent 100%),
    radial-gradient(circle at 50% 40%, rgba(255,160,80,0.06) 0%, transparent 50%),
    linear-gradient(0deg, rgba(180,80,40,0.08) 0%, transparent 30%);
}
.bg-shrine::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,200,100,0.04) 0%, transparent 20%),
    radial-gradient(circle at 70% 25%, rgba(255,200,100,0.04) 0%, transparent 20%),
    radial-gradient(circle at 50% 60%, rgba(200,100,60,0.08) 0%, transparent 40%);
}

/* Scene: Night shrine */
.bg-night-shrine {
  background: linear-gradient(180deg,
    #050510 0%, #0a0a20 20%, #101030 40%,
    #0a0a20 60%, #050510 100%);
}
.bg-night-shrine::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 80% 15%, rgba(200,220,255,0.8) 0%, rgba(200,220,255,0.1) 2%, transparent 4%),
    radial-gradient(circle at 30% 10%, rgba(255,255,200,0.3) 0%, transparent 1%),
    radial-gradient(circle at 60% 8%, rgba(255,255,200,0.2) 0%, transparent 0.5%),
    radial-gradient(circle at 45% 12%, rgba(255,255,200,0.25) 0%, transparent 0.8%),
    radial-gradient(circle at 15% 18%, rgba(255,255,200,0.15) 0%, transparent 0.5%),
    radial-gradient(circle at 90% 5%, rgba(255,255,200,0.2) 0%, transparent 0.6%);
}
.bg-night-shrine::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 70%, rgba(255,140,60,0.08) 0%, transparent 30%),
    radial-gradient(circle at 35% 65%, rgba(255,140,60,0.05) 0%, transparent 20%),
    radial-gradient(circle at 65% 65%, rgba(255,140,60,0.05) 0%, transparent 20%);
}

/* Scene: Spring */
.bg-spring {
  background: linear-gradient(180deg,
    #f0d0d8 0%, #e8c0c8 15%, #d4a0b0 30%,
    #98c088 50%, #78a868 70%, #5a8a48 100%);
}
.bg-spring::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,180,200,0.4) 0%, transparent 30%),
    radial-gradient(circle at 80% 15%, rgba(255,200,210,0.3) 0%, transparent 25%),
    radial-gradient(circle at 50% 25%, rgba(255,190,200,0.2) 0%, transparent 35%);
}

/* Scene: Moonlit clearing */
.bg-moonlit {
  background: linear-gradient(180deg,
    #0a0e1e 0%, #101830 20%, #182040 35%,
    #1a3030 55%, #0a2018 80%, #081810 100%);
}
.bg-moonlit::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 200px 200px at 65% 20%, rgba(200,220,255,0.15) 0%, transparent 70%),
    radial-gradient(circle at 65% 20%, rgba(220,240,255,0.3) 0%, rgba(200,220,255,0.05) 15%, transparent 30%);
}

/* === Particle Systems === */
#particles {
  position: absolute; inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.firefly {
  width: 4px; height: 4px;
  background: rgba(255, 220, 100, 0.8);
  box-shadow: 0 0 6px rgba(255, 220, 100, 0.6), 0 0 12px rgba(255, 200, 60, 0.3);
  animation: firefly-float 8s ease-in-out infinite;
}

@keyframes firefly-float {
  0%, 100% { opacity: 0; transform: translate(0, 0); }
  20% { opacity: 0.9; }
  50% { opacity: 0.4; transform: translate(30px, -40px); }
  80% { opacity: 0.8; }
}

.sakura-petal {
  width: 8px; height: 6px;
  background: rgba(255, 180, 200, 0.7);
  border-radius: 50% 0 50% 0;
  animation: sakura-fall linear infinite;
}

@keyframes sakura-fall {
  0% { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.6; }
  100% { transform: translate(-80px, calc(100vh + 20px)) rotate(720deg); opacity: 0; }
}

.spirit-orb {
  width: 6px; height: 6px;
  background: rgba(100, 200, 255, 0.6);
  box-shadow: 0 0 8px rgba(100, 200, 255, 0.4);
  animation: spirit-drift 10s ease-in-out infinite;
}

@keyframes spirit-drift {
  0%, 100% { opacity: 0; transform: translate(0, 0) scale(1); }
  30% { opacity: 0.7; transform: translate(20px, -30px) scale(1.3); }
  70% { opacity: 0.5; transform: translate(-10px, -60px) scale(0.8); }
}

/* === Character Sprites === */
#character-layer {
  position: absolute; inset: 0;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 28%;
  pointer-events: none;
}

.character-sprite {
  position: absolute;
  bottom: 22%;
  width: 260px;
  height: 400px;
  transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4));
}

.char-center { left: 50%; transform: translateX(-50%); }
.char-left { left: 15%; }
.char-right { right: 15%; left: auto; }

.character-sprite.entering {
  opacity: 0;
  transform: translateX(-50%) translateY(20px);
}

.character-sprite.visible {
  opacity: 1;
}

.character-sprite.beast-transform {
  animation: beast-glow 2s ease-in-out;
}

@keyframes beast-glow {
  0% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
  30% { filter: drop-shadow(0 0 40px rgba(255,180,80,0.8)) brightness(1.5); }
  60% { filter: drop-shadow(0 0 60px rgba(255,200,100,0.9)) brightness(2); }
  80% { filter: drop-shadow(0 0 30px rgba(255,180,80,0.5)) brightness(1.2); }
  100% { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.4)) brightness(1); }
}

/* Character SVG portraits */
.char-portrait {
  width: 100%; height: 100%;
}

/* === Dialogue Box === */
#dialogue-layer {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 0 16px env(safe-area-inset-bottom, 16px);
}

#dialogue-box {
  position: relative;
  max-width: 800px;
  margin: 0 auto 16px;
  background: var(--ui-bg);
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  padding: 16px 20px 20px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 30px rgba(0,0,0,0.3);
  cursor: pointer;
  min-height: 120px;
}

#speaker-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-name);
  margin-bottom: 8px;
  letter-spacing: 1px;
  font-family: var(--font);
}

#dialogue-text {
  font-size: 16px;
  line-height: 1.8;
  color: var(--text);
  font-family: var(--font);
  min-height: 60px;
}

#dialogue-text .char {
  opacity: 0;
  display: inline;
  transition: opacity 0.05s;
}
#dialogue-text .char.visible {
  opacity: 1;
}

#text-indicator {
  position: absolute;
  bottom: 12px; right: 16px;
  width: 12px; height: 12px;
  opacity: 0;
  transition: opacity 0.3s;
}
#text-indicator.show {
  opacity: 0.6;
  animation: indicator-bounce 1s ease-in-out infinite;
}

@keyframes indicator-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(4px); }
}

/* === Choice Menu === */
#choice-layer {
  position: absolute;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 20;
}

#choice-layer.active { display: flex; }

#choice-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 500px;
  width: 90%;
}

.choice-btn {
  background: var(--ui-bg);
  border: 1px solid var(--ui-border);
  border-radius: 8px;
  padding: 14px 20px;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: left;
  line-height: 1.5;
}

.choice-btn:hover {
  background: rgba(212, 168, 84, 0.15);
  border-color: var(--accent-gold);
  transform: translateX(4px);
}

.choice-btn:active {
  transform: translateX(2px);
  background: rgba(212, 168, 84, 0.25);
}

/* === Affection Display === */
#affection-display {
  position: absolute;
  top: 16px; right: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.5s;
}
#affection-display.show { opacity: 1; }

.affection-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(10,10,20,0.8);
  border-radius: 20px;
  padding: 4px 12px 4px 6px;
  backdrop-filter: blur(8px);
  font-family: var(--font-ui);
  font-size: 12px;
}

.aff-icon {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

.aff-fox .aff-icon { background: var(--accent-fox-glow); }
.aff-wolf .aff-icon { background: var(--accent-wolf-glow); }
.aff-deer .aff-icon { background: var(--accent-deer-glow); }

.aff-meter {
  width: 60px; height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
}

.aff-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.8s cubic-bezier(0.23, 1, 0.32, 1);
}

.aff-fox .aff-fill { background: var(--accent-fox); }
.aff-wolf .aff-fill { background: var(--accent-wolf); }
.aff-deer .aff-fill { background: var(--accent-deer); }

.aff-change {
  position: fixed;
  font-size: 18px;
  font-weight: 700;
  pointer-events: none;
  animation: aff-popup 1.5s ease-out forwards;
  z-index: 100;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

@keyframes aff-popup {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  50% { opacity: 1; transform: translateY(-30px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
}

/* === Title Screen === */
#title-screen {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg,
    #0a0e1e 0%, #101828 20%, #0a2018 40%,
    #1a3020 60%, #0a1810 80%, #050a08 100%);
  z-index: 50;
  transition: opacity 1.5s ease;
}

#title-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

#title-particles {
  position: absolute; inset: 0;
  overflow: hidden;
}

.title-firefly {
  position: absolute;
  width: 3px; height: 3px;
  background: rgba(255, 220, 100, 0.7);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(255, 220, 100, 0.5);
  animation: title-fly linear infinite;
}

@keyframes title-fly {
  0% { opacity: 0; transform: translate(0, 0); }
  20% { opacity: 0.8; }
  80% { opacity: 0.6; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
}

#title-content {
  position: relative;
  text-align: center;
  z-index: 1;
}

#title-jp {
  font-size: 14px;
  color: var(--accent-gold);
  letter-spacing: 8px;
  margin-bottom: 12px;
  opacity: 0;
  animation: title-fade-in 2s ease 0.5s forwards;
  font-family: var(--font);
}

#title-main {
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 700;
  color: var(--text);
  text-shadow: 0 0 40px rgba(212, 168, 84, 0.3);
  margin-bottom: 8px;
  opacity: 0;
  animation: title-fade-in 2s ease 1s forwards;
  font-family: var(--font);
}

#title-sub {
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 4px;
  margin-bottom: 48px;
  opacity: 0;
  animation: title-fade-in 2s ease 1.5s forwards;
  font-family: var(--font);
}

@keyframes title-fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

#start-btn {
  background: transparent;
  border: 1px solid var(--accent-gold);
  color: var(--accent-gold);
  font-family: var(--font);
  font-size: 16px;
  padding: 12px 40px;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 4px;
  transition: all 0.4s ease;
  opacity: 0;
  animation: title-fade-in 2s ease 2s forwards;
}

#start-btn:hover {
  background: rgba(212, 168, 84, 0.15);
  box-shadow: 0 0 20px rgba(212, 168, 84, 0.2);
}

/* === CG / Full screen image overlay === */
#cg-layer {
  position: absolute; inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.9);
  z-index: 15;
  cursor: pointer;
}
#cg-layer.active { display: flex; }

.cg-scene {
  width: 90%; max-width: 700px;
  aspect-ratio: 16/9;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

/* === Beast Transform Overlay === */
#transform-overlay {
  position: absolute; inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 30;
  background: transparent;
  pointer-events: none;
}

#transform-overlay.active {
  display: flex;
  animation: transform-flash 2.5s ease-in-out forwards;
}

@keyframes transform-flash {
  0% { background: transparent; }
  20% { background: rgba(255, 220, 140, 0.6); }
  40% { background: rgba(255, 200, 100, 0.3); }
  60% { background: rgba(255, 180, 80, 0.1); }
  100% { background: transparent; }
}

#transform-text {
  font-size: clamp(24px, 5vw, 40px);
  font-weight: 700;
  color: var(--accent-gold);
  text-shadow: 0 0 30px rgba(212, 168, 84, 0.8);
  font-family: var(--font);
  opacity: 0;
  animation: transform-text-show 2.5s ease-in-out forwards;
}

@keyframes transform-text-show {
  0% { opacity: 0; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1.1); }
  70% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}

/* === Menu Button === */
#menu-btn {
  position: absolute;
  top: 16px; left: 16px;
  z-index: 10;
  width: 36px; height: 36px;
  background: rgba(10,10,20,0.7);
  border: 1px solid rgba(212,168,84,0.2);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 14px;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
#menu-btn:hover {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
}

/* === Save indicator === */
.save-toast {
  position: fixed;
  top: 60px; left: 50%;
  transform: translateX(-50%);
  background: rgba(10,10,20,0.9);
  border: 1px solid var(--accent-gold);
  border-radius: 6px;
  padding: 8px 20px;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--accent-gold);
  z-index: 100;
  opacity: 0;
  animation: toast-show 2s ease forwards;
}

@keyframes toast-show {
  0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

/* === Mobile adjustments === */
@media (max-width: 600px) {
  #dialogue-box { margin: 0 8px 8px; padding: 12px 16px 16px; min-height: 100px; }
  #dialogue-text { font-size: 14px; line-height: 1.7; }
  .character-sprite { width: 200px; height: 320px; }
  .choice-btn { font-size: 14px; padding: 12px 16px; }
  .affection-bar { padding: 3px 8px 3px 4px; }
  .aff-meter { width: 40px; }
}

/* === Ending screen === */
#ending-screen {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 40;
  background: rgba(0,0,0,0.95);
}
#ending-screen.active { display: flex; }

#ending-title {
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 700;
  color: var(--accent-gold);
  font-family: var(--font);
  margin-bottom: 16px;
  text-shadow: 0 0 30px rgba(212,168,84,0.4);
}

#ending-subtitle {
  font-size: 16px;
  color: var(--text-dim);
  font-family: var(--font);
  margin-bottom: 40px;
  text-align: center;
  line-height: 1.8;
  padding: 0 20px;
}

#ending-restart {
  background: transparent;
  border: 1px solid var(--accent-gold);
  color: var(--accent-gold);
  font-family: var(--font);
  font-size: 15px;
  padding: 10px 32px;
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 2px;
  transition: all 0.3s;
}
#ending-restart:hover {
  background: rgba(212,168,84,0.15);
}

/* === Chapter title overlay === */
#chapter-overlay {
  position: absolute; inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: rgba(0,0,0,0.85);
  z-index: 25;
  pointer-events: none;
}
#chapter-overlay.active { display: flex; }

#chapter-num {
  font-size: 13px;
  color: var(--accent-gold);
  letter-spacing: 6px;
  margin-bottom: 12px;
  opacity: 0;
  animation: chap-in 1.5s ease 0.3s forwards;
}

#chapter-title {
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 700;
  color: var(--text);
  font-family: var(--font);
  opacity: 0;
  animation: chap-in 1.5s ease 0.6s forwards;
}

@keyframes chap-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div id="game">
  <!-- Title Screen -->
  <div id="title-screen">
    <div id="title-particles"></div>
    <div id="title-content">
      <div id="title-jp">社と森のものがたり</div>
      <div id="title-main">杜鹃森</div>
      <div id="title-sub">神社与森林的恋爱物语</div>

// === ENGINE FUNCTIONS ===

function initTitleScreen() {
  const container = $('#title-particles');
  for (let i = 0; i < 20; i++) {
    const fly = document.createElement('div');
    fly.className = 'title-firefly';
    fly.style.left = Math.random() * 100 + '%';
    fly.style.top = Math.random() * 100 + '%';
    fly.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    fly.style.setProperty('--dy', (Math.random() * 60 - 30) + 'px');
    fly.style.animationDuration = (6 + Math.random() * 8) + 's';
    fly.style.animationDelay = Math.random() * 6 + 's';
    container.appendChild(fly);
  }

  $('#start-btn').addEventListener('click', startGame);
}

function startGame() {
  $('#title-screen').classList.add('hidden');
  setTimeout(() => {
    $('#title-screen').style.display = 'none';
    playNode('start');
  }, 1500);
}

function playNode(nodeId) {
  const node = SCRIPT[nodeId];
  if (!node) return;
  state.currentNode = nodeId;

  if (node.scene) setScene(node.scene);
  if (node.particles) setParticles(node.particles);
  if (node.chars) setCharacters(node.chars);
  else clearCharacters();

  if (node.transform_immediate) {
    showTransform(node.transform_immediate.char, node.transform_immediate.text);
  }

  if (node.chapter) {
    showChapter(node.chapter.num, node.chapter.title, () => {
      if (node.lines && node.lines.length > 0) {
        playLines(node, 0);
      }
    });
  } else {
    if (node.lines && node.lines.length > 0) {
      playLines(node, 0);
    }
  }

  $('#affection-display').classList.add('show');
}

let currentLineCallback = null;

function playLines(node, index) {
  if (index >= node.lines.length) {
    if (node.transform) {
      doTransform(node, () => afterLines(node));
    } else {
      afterLines(node);
    }
    return;
  }

  const line = node.lines[index];
  showDialogue(line, () => {
    playLines(node, index + 1);
  });
}

function afterLines(node) {
  if (node.choices) {
    showChoices(node.choices);
  } else if (node.next_by_affection) {
    routeByAffection();
  } else if (node.next_by_affection_ending) {
    routeToEnding();
  } else if (node.ending) {
    showEnding(node.ending);
  } else if (node.next) {
    playNode(node.next);
  }
}

function showDialogue(line, callback) {
  const charDef = CHARS[line.char];
  const nameEl = $('#speaker-name');
  const textEl = $('#dialogue-text');
  const indicator = $('#text-indicator');

  nameEl.textContent = charDef.name;
  nameEl.style.color = charDef.color;

  textEl.innerHTML = '';
  indicator.classList.remove('show');
  state.textComplete = false;

  state.charTimers.forEach(t => clearTimeout(t));
  state.charTimers = [];

  const chars = line.text.split('');
  const spans = chars.map((c, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = c;
    textEl.appendChild(span);
    return span;
  });

  let revealed = 0;
  const speed = 40;

  function revealNext() {
    if (revealed < spans.length) {
      spans[revealed].classList.add('visible');
      revealed++;
      state.charTimers.push(setTimeout(revealNext, speed));
    } else {
      state.textComplete = true;
      indicator.classList.add('show');
    }
  }

  revealNext();

  currentLineCallback = callback;

  function onAdvance(e) {
    e.preventDefault();
    e.stopPropagation();

    if (!state.textComplete) {
      state.charTimers.forEach(t => clearTimeout(t));
      state.charTimers = [];
      spans.forEach(s => s.classList.add('visible'));
      state.textComplete = true;
      indicator.classList.add('show');
    } else {
      $('#dialogue-box').removeEventListener('click', onAdvance);
      document.removeEventListener('keydown', onKeyAdvance);
      currentLineCallback = null;
      callback();
    }
  }

  function onKeyAdvance(e) {
    if (e.key === ' ' || e.key === 'Enter') {
      onAdvance(e);
    }
  }

  $('#dialogue-box').addEventListener('click', onAdvance);
  document.addEventListener('keydown', onKeyAdvance);
}

function showChoices(choices) {
  const layer = $('#choice-layer');
  const container = $('#choice-container');
  container.innerHTML = '';

  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice.text;
    btn.addEventListener('click', () => {
      layer.classList.remove('active');
      if (choice.affection) {
        for (const [key, val] of Object.entries(choice.affection)) {
          addAffection(key, val);
        }
      }
      if (choice.flag) {
        state.flags[choice.flag] = true;
      }
      playNode(choice.next);
    });
    container.appendChild(btn);
  });

  layer.classList.add('active');
}

function addAffection(who, amount) {
  state.affection[who] = Math.min(100, state.affection[who] + amount * 5);
  updateAffectionBars();
  showAffectionChange(who, amount);
}

function updateAffectionBars() {
  $('#fox-fill').style.width = state.affection.fox + '%';
  $('#wolf-fill').style.width = state.affection.wolf + '%';
  $('#deer-fill').style.width = state.affection.deer + '%';
}

function showAffectionChange(who, amount) {
  const colors = { fox: '#ff6b4a', wolf: '#7eb8da', deer: '#8fd4a0' };
  const names = { fox: '琥珀', wolf: '银朗', deer: '白露' };
  const el = document.createElement('div');
  el.className = 'aff-change';
  el.textContent = `${names[who]} +${amount}`;
  el.style.color = colors[who];
  el.style.top = '50%';
  el.style.left = '50%';
  el.style.transform = 'translate(-50%, -50%)';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function routeByAffection() {
  const { fox, wolf, deer } = state.affection;
  if (fox >= wolf && fox >= deer) playNode('rescue_fox');
  else if (wolf >= fox && wolf >= deer) playNode('rescue_wolf');
  else playNode('rescue_deer');
}

function routeToEnding() {
  const { fox, wolf, deer } = state.affection;
  if (fox >= wolf && fox >= deer) playNode('ending_fox');
  else if (wolf >= fox && wolf >= deer) playNode('ending_wolf');
  else playNode('ending_deer');
}

// === SCENE MANAGEMENT ===

function setScene(sceneName) {
  const bg = $('#scene-bg');
  bg.innerHTML = '';
  const layer = document.createElement('div');
  layer.className = `scene-layer bg-${sceneName}`;
  bg.appendChild(layer);
}

function setParticles(type) {
  const container = $('#particles');
  container.innerHTML = '';
  if (state.particleInterval) clearInterval(state.particleInterval);

  const configs = {
    fireflies: { class: 'firefly', count: 15, interval: 3000 },
    sakura: { class: 'sakura-petal', count: 12, interval: 2000 },
    spirits: { class: 'spirit-orb', count: 10, interval: 4000 },
  };

  const cfg = configs[type];
  if (!cfg) return;

  function spawnParticle() {
    const p = document.createElement('div');
    p.className = `particle ${cfg.class}`;
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 80 + '%';
    p.style.animationDuration = (5 + Math.random() * 8) + 's';
    p.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 15000);
  }

  for (let i = 0; i < cfg.count; i++) {
    setTimeout(() => spawnParticle(), Math.random() * 3000);
  }

  state.particleInterval = setInterval(spawnParticle, cfg.interval);
}

function setCharacters(chars) {
  const layer = $('#character-layer');
  layer.innerHTML = '';

  chars.forEach(c => {
    const wrapper = document.createElement('div');
    wrapper.className = `character-sprite char-${c.pos} entering`;
    wrapper.id = `char-${c.id}`;
    wrapper.innerHTML = getCharSVG(c.id, CHARS[c.id][c.form]);
    layer.appendChild(wrapper);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        wrapper.classList.remove('entering');
        wrapper.classList.add('visible');
      });
    });
  });
}

function clearCharacters() {
  $('#character-layer').innerHTML = '';
}

function doTransform(node, callback) {
  const t = node.transform;
  const charEl = $(`#char-${t.char}`);
  if (charEl) charEl.classList.add('beast-transform');

  showTransform(t.char, t.text);

  setTimeout(() => {
    if (charEl) {
      charEl.innerHTML = getCharSVG(t.char, CHARS[t.char].beast);
      charEl.classList.remove('beast-transform');
    }
    callback();
  }, 2500);
}

function showTransform(charId, text) {
  const overlay = $('#transform-overlay');
  const textEl = $('#transform-text');
  textEl.textContent = text;
  overlay.classList.add('active');
  setTimeout(() => overlay.classList.remove('active'), 2600);
}

function showChapter(num, title, callback) {
  const overlay = $('#chapter-overlay');
  $('#chapter-num').textContent = num;
  $('#chapter-title').textContent = title;
  overlay.classList.add('active');
  setTimeout(() => {
    overlay.classList.remove('active');
    if (callback) callback();
  }, 3000);
}

function showEnding(ending) {
  const screen = $('#ending-screen');
  $('#ending-title').textContent = ending.title;
  $('#ending-subtitle').textContent = ending.subtitle;
  screen.classList.add('active');
  $('#dialogue-layer').style.display = 'none';
}

// === MENU ===
$('#menu-btn').addEventListener('click', () => {
  try {
    localStorage.setItem('shrine-forest-save', JSON.stringify({
      affection: state.affection,
      flags: state.flags,
      node: state.currentNode,
    }));
  } catch(e) {}
  const toast = document.createElement('div');
  toast.className = 'save-toast';
  toast.textContent = '已保存进度';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2100);
});

// === RESTART ===
$('#ending-restart').addEventListener('click', () => {
  state.affection = { fox: 0, wolf: 0, deer: 0 };
  state.flags = {};
  state.currentNode = null;
  updateAffectionBars();
  $('#ending-screen').classList.remove('active');
  $('#dialogue-layer').style.display = '';
  $('#affection-display').classList.remove('show');
  $('#title-screen').style.display = '';
  $('#title-screen').classList.remove('hidden');
});

// === INIT ===
initTitleScreen();
</script>
